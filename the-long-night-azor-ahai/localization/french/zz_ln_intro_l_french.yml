l_french:

 ln_intro.1.t:0 "Ce qu'on dit dans votre salle"

 # Every branch below is what the PLAYER'S COURT believes, not what is true. None of them names the Long Night.

 ln_intro.1.desc.watch:0 "#e Je fixe les livres de comptes. Nous avons moins d'hommes que personne au sud du Mur ne saurait le concevoir.\n\nDes patrouilles sortent, et une fraction plus petite revient à chaque décennie. Des frères rentrent en titubant des bois hantés, lèvres scellées sur ce qui les a fait rebrousser chemin — ou bien ils bafouillent des contradictions si folles que le lord Commandant a cessé de les consigner.\n\nLa Citadelle soutient que le Nord est simplement froid, et que les hommes y meurent. Ils n'ont pas tort, mais cela n'explique pas pourquoi les corps de ceux qui tombent ne peuvent jamais être récupérés.\n\nLa Garde ne compte que quelques centaines d'hommes. Ce Mur a été bâti pour vingt mille.#!"

 ln_intro.1.desc.free_folk:0 "#e Mon peuple n'a pas besoin qu'on le lui dise.\n\nNous avons déplacé nos camps trois fois en une génération — toujours vers le sud. Les anciens murmurent leurs raisons avec prudence et laissent des offrandes discrètes pour ne pas fâcher les morts, tandis que les jeunes y voient sottement un simple caprice du temps. Mais il y a des vallées où nous n'hivernons plus. Il y a des noms que ma grand-mère n'aurait pas osé prononcer après la tombée du jour, et elle ne craignait rien.\n\nLes agenouillés qui se tapissent derrière leur muraille de glace nous prennent pour de simples pillards. Je leur dirais la vérité, s'ils se donnaient la peine de demander.#!"

 ln_intro.1.desc.north:0 "#e Les nourrices adorent raconter les vieux contes, et les racontent mal exprès pour effrayer un enfant et le rendre obéissant avant le coucher.\n\nElles parlent d'un hiver qui a duré une génération. D'une obscurité glacée qui cachait des cadavres en marche, et d'un dernier héros s'aventurant dans les terres mortes avec une épée brisée.\n\nOn nous apprend à n'y voir que des fables. Et pourtant, je sais aussi que chaque maison du Nord qui a tenu son siège pendant huit mille ans a bâti ses murs les plus épais du côté nord. Personne n'a jamais été capable de me dire pourquoi.#!"

 ln_intro.1.desc.dragon:0 "#e Il y a un secret dans le sang de l'ancienne Valyria, bien que je ne sois plus certain que nous le saisissions encore.\n\nAegon le Conquérant a laissé un rêve, transmis du souverain à l'héritier. Si celui qui siège aujourd'hui sur le Trône de Fer l'a entendu, ou y croit, je ne saurais le dire.\n\nCeux d'entre nous qui partagent le sang du dragon n'en connaissent que la forme : des ténèbres montant du Nord le plus lointain. Un chant de glace et de feu. Quelque chose que les chevaucheurs de dragons sont censés affronter dans un siècle que personne ne s'est soucié de préciser.\n\nJe me demande souvent si nos ancêtres ont cessé d'en parler parce que le devoir avait été accompli — ou parce que le cauchemar n'a pas encore commencé.#!"

 ln_intro.1.desc.red:0 "#e Mon prêtre rouge en est absolument certain, et c'est précisément là le problème.\n\nLa nuit est sombre et pleine de terreurs, disent-ils. Le Roi de la Nuit s'agite dans le froid mordant, et une prophétie ancienne annonce qu'un champion renaîtra parmi le sel et la fumée. Mon prêtre sait réciter les versets sacrés sans une faute, et va jusqu'à prédire l'heure exacte de notre délivrance.\n\nBien sûr, il a aussi prédit trois heures exactes précédentes, nommé deux champions précédents, et je les ai enterrés tous les deux.\n\nLes flammes ne mentent pas, mais elles montrent énormément, et les prêtres ne sont que des hommes mortels qui choisissent ce qu'ils veulent voir. Quelque chose approche. Mais tout ce que ma foi affirme de sa forme sonne comme la supposition désespérée de quelqu'un qui veut terriblement avoir raison.#!"

 ln_intro.1.desc.lord:0 "#e Mon mestre l'a mentionné une fois, de cette manière fastidieuse qu'ont les mestres — enfoui dans une proposition subordonnée à la fin d'un long parchemin aride comparant nos rendements actuels en grain à des anomalies historiques.\n\nIl citait « la Longue Nuit » comme exemple ultime de mauvaises récoltes. Il y a huit, six ou douze mille ans ; la Citadelle n'arrive pas à s'accorder et trouve la querelle savante bien plus intéressante que l'événement lui-même. Une génération d'hiver. Des morts au-delà de tout décompte. Des sottises sur les morts qui se relèvent, dont les doctes de Villevieille m'assurent avec aplomb qu'il ne s'agit que d'une métaphore historique grossière de la famine.\n\nJe n'ai pas lu le parchemin jusqu'au bout. Il y avait alors des affaires plus pressantes, comme il y en a aujourd'hui. Les étendues gelées du Nord n'ont jamais été mon problème.#!"

 ln_intro.1.desc.nobody:0 "#e Personne ne m'a averti de rien, parce qu'il n'y a rien à dire.\n\nLes étés sont délicieusement longs, les récoltes débordent des greniers, et les routes sont assez sûres pour que les marchands se plaignent des péages plutôt que des coupe-jarrets. Les hommes de mon âge n'ont jamais vu de véritable hiver. Les barbes grises décrivent le froid comme les marins décrivent les tempêtes légendaires — comme une chose dont on a survécu, et fort exagérée dans le récit.\n\nQuelque part loin au nord, on me dit qu'il y a un mur de glace gigantesque. Je n'ai jamais eu de raison de me demander pourquoi.#!"

 ln_intro.1.a:0 "Envoyer un corbeau à la Citadelle et demander ce que disent les archives."
 ln_intro.1.b:0 "Le monde est plein de mythes anciens, et celui-ci peut attendre."