l_french:

 # AGOT: The Long Night & Azor Ahai -- trigger_localization sentences (1.1.0, §8.1).
 # These render where a requirement is shown passing or failing. Wildlings call the Watch "crows";
 # nobody below does, because none of these lines is spoken by a wildling (crowcheck).

 ln_trigloc_can_take_the_black:0 "Le Mur prendrait celui-ci"
 ln_trigloc_cannot_take_the_black:0 "Le Mur ne prendra pas celui-ci"
 ln_trigloc_can_take_the_black_first:0 "Je peux prendre le noir"
 ln_trigloc_cannot_take_the_black_first:0 "Je ne peux pas prendre le noir"
 ln_trigloc_can_take_the_black_third:0 "[CHARACTER.GetTitledFirstName] peut prendre le noir"
 ln_trigloc_cannot_take_the_black_third:0 "[CHARACTER.GetTitledFirstName] ne peut pas prendre le noir"

 ln_trigloc_bears_the_bane:0 "Porte quelque chose qui peut les blesser"
 ln_trigloc_bears_no_bane:0 "Ne porte rien qui puisse leur nuire — verredragon, acier valyrien, ou pire encore pour eux"
 ln_trigloc_bears_the_bane_first:0 "Je porte quelque chose qui peut les blesser"
 ln_trigloc_bears_no_bane_first:0 "Je ne porte rien qui puisse leur nuire"
 ln_trigloc_bears_the_bane_third:0 "[CHARACTER.GetTitledFirstName] porte quelque chose qui peut les blesser"
 ln_trigloc_bears_no_bane_third:0 "[CHARACTER.GetTitledFirstName] ne porte rien qui puisse leur nuire"

 ln_trigloc_watch_stands:0 "Une Garde de Nuit tient encore pour les recevoir"
 ln_trigloc_watch_fallen:0 "Il ne reste aucune Garde de Nuit pour les recevoir"

 ln_trigloc_has_a_forge:0 "Dispose d'une forge digne du travail"
 ln_trigloc_no_forge:0 "La forge n'est pas prête pour ce travail"
 ln_trigloc_has_a_forge_first:0 "Ma forge est digne du travail"
 ln_trigloc_no_forge_first:0 "Ma forge n'est pas prête pour ce travail"
 ln_trigloc_has_a_forge_third:0 "La forge de [CHARACTER.GetTitledFirstName] est digne du travail"
 ln_trigloc_no_forge_third:0 "La forge de [CHARACTER.GetTitledFirstName] n'est pas prête pour ce travail"

 ln_trigloc_can_stand:0 "Peut se tenir à la Dernière Heure"
 ln_trigloc_cannot_stand:0 "Ne peut pas se tenir à la Dernière Heure — la ligne prend les vivants, les adultes, les valides, et jamais un dragon"
 ln_trigloc_can_stand_first:0 "Je peux me tenir à la Dernière Heure"
 ln_trigloc_cannot_stand_first:0 "Je ne peux pas me tenir à la Dernière Heure"
 ln_trigloc_can_stand_third:0 "[CHARACTER.GetTitledFirstName] peut se tenir à la Dernière Heure"
 ln_trigloc_cannot_stand_third:0 "[CHARACTER.GetTitledFirstName] ne peut pas se tenir à la Dernière Heure"

 # AGOT's send_to_nightswatch_interaction shows the literal string "release_banish_invalid_send_to_nw"
 # when both send options are somehow on at once -- their trigger_localization entry exists but the key
 # still renders raw in the wild (1.0.16a audit). A same-named LOC key is the additive belt: if the engine
 # falls back to key-as-text, this is what the player reads.
 release_banish_invalid_send_to_nw:0 "Vous ne pouvez pas bannir un homme et l'envoyer à la Garde de Nuit en même temps."

 # 1 Sep: shown only when the character being weighed for a knight's place, a court position, a
 # council seat or a command really is one of the dead. Living candidates never see this line.
 ln_may_serve_trigger_tt:0 "Les morts ne servent pas les vivants"
 # 1.1.0 (A2.1): the mirror -- shown only when a LIVING candidate is weighed for a place under one of the dead.
 ln_may_not_serve_the_dead_tt:0 "Les vivants ne servent pas les morts"
