l_french:

 ln_reveal.1.t:0 "L'Aube"

 # 1. NAMED, AND RIGHT. The least interesting of the four, and deliberately not the most common.
 ln_reveal.1.desc.vindicated:0 "#BER Les morts reposent immobiles.\n\n C'est [ln_slayer.GetTitledFirstName] qui l'a fait, et [ln_slayer.GetHerHis] nom se disait à voix haute dans les temples d'Asshai à Oldtown des années avant que le coup ne tombe.\n\n Les prêtres avaient donc raison. Cela mérite qu'on s'y arrête, car cela arrive si rarement que personne n'a de rituel pour l'occasion. Ils ont lu les flammes, les flammes ne mentaient pas, et l'homme qu'ils désignaient est monté vers le nord et en a fini — huit mille ans en retard et parfaitement à l'heure.\n\n Dans cent ans les mestres auront trouvé des raisons d'en douter, car c'est à cela que servent les mestres. Ils auront tort, et cela n'aura pas d'importance.\n\n #bold C'était la prophétie. Cela allait toujours être la prophétie.#!#!"
 # 2. NAMED, AND IT HAD NOTHING TO DO WITH IT.
 ln_reveal.1.desc.named_but_hollow:0 "#BER Les morts reposent immobiles.\n\n C'est [ln_slayer.GetTitledFirstName] qui l'a fait. Les temples le disaient depuis des années, et voilà que les temples disent qu'ils le disaient, et ces deux choses sont vraies.\n\n Voici ce qui est vrai aussi, et que personne en robe rouge ne dira jamais à voix haute : il n'y avait pas de prince. Il n'y avait pas de promesse. Il y avait une vie portant les bonnes marques, des prêtres qui voulaient terriblement que ces marques signifient quelque chose, et une guerre que quelqu'un devait gagner.\n\n Elle a été gagnée : c'est [ln_slayer.GetHerHim] qui l'a fait, avec une épée, dans le froid, et qui l'aurait fait tout pareil si personne n'avait jamais lu une flamme.\n\n #bold La foi se souviendra de cette nuit comme de celle où on lui a donné raison. Ce ne fut pas le cas.#!#!"
 # 3. THERE WAS A PRINCE, AND EVERY PRIEST NAMED THE WRONG MEN. The one worth playing for.
 ln_reveal.1.desc.wrong_men:0 "#BER Les morts reposent immobiles.\n\n C'était [ln_slayer.GetTitledFirstName], et personne n'avait jamais prononcé [ln_slayer.GetHerHis] nom.\n\n Pas une fois. Pas dans un temple, pas dans un bois sacré, pas dans la bouche d'une femme lisant un feu au pied d'une haie. Tous les prêtres du monde ont passé un siècle à compter les marques sur la vie des autres et à en être certains, et à enterrer ceux dont ils avaient été certains — et pendant tout ce temps la réponse se tenait là où aucun d'eux ne regardait.\n\n Il y avait un prince. Voilà ce qui les brisera. La prophétie était réelle, la promesse a été tenue, et tout l'appareil bâti pour trouver l'homme s'est trompé si complètement qu'il aurait aussi bien pu ne pas exister.\n\n #bold Les flammes n'ont jamais menti. Personne n'a jamais appris à les lire.#!#!"
 # 4. NOTHING. A man with a sword.
 ln_reveal.1.desc.just_a_man:0 "#BER Les morts reposent immobiles.\n\n C'était [ln_slayer.GetTitledFirstName]. Il n'y a rien d'autre à en dire, et c'est tout.\n\n Aucune prophétie. Aucun prince promis, aucun champion né parmi le sel et la fumée, aucune épée en feu : il n'y en a jamais eu, à aucun moment, dans rien de tout cela. Huit mille ans de temples, de comptes, de noms et de certitudes, bâtis sur une histoire que quelqu'un a racontée une fois à propos d'un hiver qui s'était achevé.\n\n L'hiver s'est achevé cette fois encore. Quelqu'un est monté vers le nord et a fait ce qu'il fallait faire, et la raison pour laquelle [ln_slayer.GetSheHe] l'a fait n'était pas que [ln_slayer.GetSheHe] était l'élu. C'était que [ln_slayer.GetSheHe] était là.\n\n #bold Il faudra que cela suffise. En vérité, c'est davantage.#!#!"

 # 5. NOBODY KNOWS WHO DID IT.
 ln_reveal.1.desc.nameless:0 "#BER Les morts reposent immobiles.\n\n Personne ne peut dire qui l'a fait.\n\n Ce n'est pas un trou dans le registre : le registre est le trou. Il y a eu une bataille dans le noir, dans un hiver qui durait depuis si longtemps que plus personne ne comptait les saisons, et à un moment quelconque la chose qui les menait s'est arrêtée, et tous les cadavres du champ sont tombés d'un coup et n'ont plus bougé.\n\n Quelqu'un se tenait au plus près. Quelqu'un a frappé. Les mestres passeront quatre cents ans à construire une réponse et la réponse sera fausse, car les hommes qui auraient pu la donner étaient au premier rang, et le premier rang, c'est là qu'est passé le compte.\n\n #bold Cela a pris fin. C'est la seule part que quiconque puisse prouver.#!#!"

 ln_reveal.1.a:0 "Alors que le soleil se lève."

 ln_reveal.10.t:0 "Les hommes qui étaient là"
 ln_reveal.10.desc_open:0 "Les chanteurs se tromperont avant la fin de l'année. Ils mettront au premier rang des rois qui étaient à quatre cents lieues au sud, et un lever de soleil là où il n'y avait que la neige qui grisonnait, et avec le temps leur version sera celle que tout le monde connaît.\n\nQue cela soit donc écrit une fois, simplement, tant que les hommes qui l'ont vu peuvent encore protester :\n\nC'était [ln_slayer.GetTitledFirstName].\n\n"
 ln_reveal.10.desc_knight_1:0 "Et [ln_slayer.GetSheHe] ne s'est pas tenu là seul. [ln_dawn_knight_1.GetTitledFirstName] a tenu le terrain sur [ln_slayer.GetHerHis] flanc."
 ln_reveal.10.desc_knight_2:0 " [ln_dawn_knight_2.GetTitledFirstName] a empêché la ligne de céder quand elle voulait céder."
 ln_reveal.10.desc_knight_3:0 " [ln_dawn_knight_3.GetTitledFirstName] était là dans le noir et le froid, les morts avançant et sans la moindre raison de croire que l'heure suivante viendrait jamais.\n\nAucun d'eux ne sera dans les chansons. Tous étaient dans la neige."
 ln_reveal.10.desc_alone:0 "Les hommes qui devraient être nommés à côté de [ln_slayer.GetHerHim] ne peuvent pas l'être, car la neige les a gardés. Qui que ce soit qui tenait le flanc, qui que ce soit qui empêchait la ligne de céder dans le noir : le premier rang, c'est là qu'est passé le compte, et le registre porte un silence là où leurs noms devraient se tenir."
 ln_reveal.10.desc_close:0 "\n\nSouvenez-vous-en simplement, comme cela s'est passé. Quelqu'un a frappé, et quelqu'un se tenait à ses côtés, et le soleil s'est levé."
 ln_reveal.10.a:0 "Écrivez leurs noms. Tous."

 ln_stood_at_the_dawn_memory_desc:0 "s'est tenu au premier rang la nuit où le Roi de la Nuit est tombé"
