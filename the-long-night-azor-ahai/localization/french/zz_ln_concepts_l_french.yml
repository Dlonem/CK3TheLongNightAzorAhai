l_french:

 # AGOT: The Long Night & Azor Ahai -- lore concepts and struggle phase parameters.
 # Concept loc keys are game_concept_<key> and game_concept_<key>_desc. Aliases do NOT need their own keys.

 # ── LORE CONCEPTS ───────────────────────────────────────────────────────────────────────────────────────────
 game_concept_wall:0 "le Mur"
 game_concept_wall_desc:0 "Sept cents pieds de glace courant sur cent lieues depuis la baie des Phoques jusqu'à la Gorge, dressés il y a huit mille ans contre quelque chose dont les histoires ont cessé de préciser la nature.\n\nIl est tenu par la [nights_watch|E], et chaque siècle ils sont moins nombreux à le tenir. Dix-neuf forts furent bâtis le long de sa ligne. La plupart sont vides depuis avant la naissance de quiconque vit aujourd'hui."

 game_concept_the_others:0 "les Autres"
 game_concept_the_others_desc:0 "Des êtres pâles qui sortent du froid, tuent avec des lames qui brisent le fer, et relèvent ce qu'ils ont tué.\n\nLes mestres de la Citadelle ont passé des siècles à établir qu'ils sont un conte pour effrayer les enfants. Le [free_folk|E], qui vit là où ils vivent, ne semble pas avoir été consulté."

 game_concept_wight:0 "spectre"
 game_concept_wight_desc:0 "Un cadavre relevé par [the_others|E] et remis en marche.\n\nUn $game_concept_wight$ ne sent rien, ne se fatigue jamais, et combat mal — tout son danger est dans l'arithmétique. Chaque homme qui tombe contre eux se relève de l'autre côté : une bataille perdue te coûte deux fois, et une bataille gagnée te coûte encore une.\n\nLe feu les arrête. Presque rien d'autre."

 game_concept_nights_watch:0 "la Garde de Nuit"
 game_concept_nights_watch_desc:0 "L'ordre qui a juré de tenir [wall|E]. Ses frères ne prennent pas femme, ne tiennent pas de terre, n'engendrent pas d'enfants et ne portent pas de couronne — et servent jusqu'à la mort.\n\nIls furent vingt mille autrefois. Ils ne le sont plus. Le royaume lui envoie ses voleurs, ses violeurs et ses fils cadets, puis cesse d'y penser : l'arrangement dure depuis très longtemps et n'a encore jamais été mis à l'épreuve."

 game_concept_free_folk:0 "le peuple libre"
 game_concept_free_folk_desc:0 "Les peuples qui vivent au nord [wall|E] — Thenns et clansmen, habitants des cavernes, gens des rivières, les cent noms que les cartes ne prennent pas la peine d'inscrire. Au sud du Mur on les appelle sauvageons, ce qui n'est pas le nom qu'ils se donnent.\n\nIls ne s'agenouillent devant personne, ce que les Sept Couronnes trouvent offensant, et ils descendent vers le sud en nombre croissant, ce que les Sept Couronnes trouvent gênant. Personne dans le sud n'a encore demandé ce qu'ils fuient."

 game_concept_dragonglass:0 "verredragon"
 game_concept_dragonglass_desc:0 "Du verre volcanique. De l'obsidienne, pour un mestre. Les enfants de la forêt l'appelaient feu gelé.\n\nIl est cassant, il est peu pratique, il ne garde pas son fil face à l'acier — et il tue [the_others|E], ce que rien d'autre de commun ne fait. Il y en a une grande quantité sous Peyredragon, et presque personne n'a jamais eu de raison de l'en extraire."

 game_concept_valyrian_steel:0 "acier valyrien"
 game_concept_valyrian_steel_desc:0 "Des lames forgées par sortilège dans un Fief franc mort depuis quatre cents ans. Plus légères que l'acier, plus tranchantes que l'acier, et impossibles à forger maintenant que les hommes qui savaient le faire sont cendres.\n\nIl reste peut-être deux cents lames de cette sorte dans le monde, pour la plupart reliques de grandes [houses|E] qui s'en servent pour la cérémonie. Il se trouve aussi qu'elles tuent [the_others|E]."

 # ── STRUGGLE PHASE PARAMETERS ───────────────────────────────────────────────────────────────────────────────
 # These are the bullet lines in each phase's effects tooltip. Struggle parameters are script-read only -- they
 # have no engine behaviour of their own -- so these describe what the phase's MODIFIERS do, plus the few that
 # our own code branches on. Nothing here promises an effect that is not actually applied somewhere.

 # The Long Summer
 ln_the_dark_is_distant:0 "Les ténèbres sont encore loin, et elles approchent"
 ln_the_dark_is_a_story:0 "Au-delà du détroit, c'est un conte pour enfants, et pas des meilleurs"
 ln_summer_peace:0 "De longues années de calme : le Nord cherche moins querelle et les pillards avancent lentement"
 ln_insular_in_good_times:0 "Les gens à leur aise se referment — chaleur pour les siens, froideur pour tous les autres"
 ln_the_gods_are_quiet:0 "Personne ne prie beaucoup quand la récolte est bonne"

 # The Cold Winds Rise
 ln_the_dark_is_coming:0 "Les ténèbres viennent, et tout le monde au nord du Neck le sait"
 ln_the_muster_begins:0 "Tout homme capable de tenir une lance est recensé, et l'on garnit les murs"
 ln_southern_disbelief:0 "Les royaumes du sud continuent de se chamailler, et auront lieu de le regretter"
 ln_old_enemies_talk:0 "Agenouillés et [free_folk|E] ont commencé à se parler"
 ln_prayers_multiply:0 "Chaque septuaire, bosquet et temple est plein, et les fidèles viennent en armes"

 # The Long Night
 ln_the_dark_is_here:0 "Les ténèbres sont là"
 ln_wars_of_the_living:0 "Toute guerre menée désormais se mène dans le froid, et les morts prennent les restes"
 ln_every_spear_counts:0 "Ceux qui vivent avec le froid sont devenus très bons à une chose et pires à toutes les autres"
 ln_the_living_stand_together:0 "Les vieilles rancunes cessent de compter quand l'ennemi ne se soucie pas de qui tu étais"
 ln_the_red_god_rises:0 "La nuit est sombre et pleine de terreurs, et l'on ne rit plus de celui qui le dit"
 ln_essos_profits:0 "Quelque part au-delà de l'eau, quelqu'un vend grain et acier aux désespérés"

 # The Dawn
 ln_the_dark_has_passed:0 "Les ténèbres sont passées"
 ln_no_stomach_for_war:0 "Aucun de ceux qui y étaient ne veut d'une autre guerre"
 ln_bled_together:0 "Ils ont saigné côte à côte, et pour un temps cela vaut plus que n'importe quel traité"
 ln_reckoning_of_faiths:0 "Chaque foi dispute de laquelle avait raison, et toutes recrutent"

