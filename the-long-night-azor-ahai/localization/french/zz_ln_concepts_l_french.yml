 game_concept_white_walkers:0 "Marcheurs Blancs"
 game_concept_white_walkers_desc:0 "$game_concept_the_others_desc$"
 game_concept_wights:0 "spectres"
 game_concept_wights_desc:0 "$game_concept_wight_desc$"
 game_concept_the_nights_watch:0 "la Garde de Nuit"
 game_concept_the_nights_watch_desc:0 "$game_concept_nights_watch_desc$"
 game_concept_black_brothers:0 "frères noirs"
 game_concept_black_brothers_desc:0 "$game_concept_nights_watch_desc$"
 game_concept_wildlings:0 "sauvageons"
 game_concept_wildlings_desc:0 "$game_concept_free_folk_desc$"
 game_concept_beyond_the_wall:0 "au-delà du Mur"
 game_concept_beyond_the_wall_desc:0 "$game_concept_free_folk_desc$"
 game_concept_obsidian:0 "obsidienne"
 game_concept_obsidian_desc:0 "$game_concept_dragonglass_desc$"
 game_concept_the_dead:0 "les morts"
