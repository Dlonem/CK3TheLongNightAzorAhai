 game_concept_risen_dead:0 "morts relevés"
 game_concept_risen_dead_desc:0 "$game_concept_ln_others_infantry_desc$"
 game_concept_undead_infantry:0 "infanterie morte-vivante"
 game_concept_undead_infantry_desc:0 "$game_concept_ln_others_infantry_desc$"
 game_concept_long_night:0 "Longue Nuit"
 game_concept_long_night_desc:0 "$game_concept_ln_long_night_struggle_concept_desc$"
 game_concept_the_long_night:0 "la Longue Nuit"
 game_concept_the_long_night_desc:0 "$game_concept_ln_long_night_struggle_concept_desc$"

