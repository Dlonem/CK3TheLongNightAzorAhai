l_french:

 # ── THE NAMING ──────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.1.t:0 "Une épée tirée du feu"

 ln_prophecy.1.desc.priest:0 "[ln_priest.GetTitledFirstName] a demandé à me parler seul à seul, ce que [ln_priest.GetSheHe] n'avait jamais fait.\n\nC'est à [ln_priest.GetHerHim] que les flammes montrent les mêmes visions depuis le printemps, dit [ln_priest.GetSheHe], et [ln_priest.GetSheHe] les a depuis rangées l'une à côté de l'autre. Le sel et la fumée. Une étoile qui saigne au-dessus de la mer. Une épée tirée brûlante d'un feu et que le feu ne consume pas. Et au bout de chaque lecture, mon visage.\n\n\"Vous êtes Azor Ahai réincarné\", me dit [ln_priest.GetSheHe], et il y a dans [ln_priest.GetHerHis] regard une certitude qui dérange. \"Le prince qui fut promis. Né de nouveau quand le monde se refroidit, pour tenir face à ce qui vient avec lui.\"\n\n[ln_priest.GetFirstName] entend le déclarer publiquement, et me demande d'abord mon congé. Si [ln_priest.GetSheHe] a raison, le royaume a son champion. Si [ln_priest.GetSheHe] se trompe, je ne suis qu'un sot de plus qui a laissé un prêtre le désigner élu d'un dieu — et l'on a brûlé pour moins que cela."

 ln_prophecy.1.desc.self:0 "Je ne l'ai dit à personne, car il n'y a personne à qui je le confierais.\n\nLes rêves ne viennent pas comme des prophéties. Ils viennent comme des souvenirs. Une épée qui brûle dans ma main. Une étoile qui saigne au-dessus d'une eau noire. La neige qui tombe sur un champ de bataille que je n'ai jamais foulé. Je m'éveille certain que ces choses ont déjà eu lieu, et pourtant je sais qu'elles n'ont pas même commencé.\n\nChaque enfant des Sept Couronnes connaît le titre réservé à qui porte ces signes. Azor Ahai réincarné. Le prince qui fut promis.\n\nJ'ai recompté mes propres marques cent fois dans le noir, en espérant qu'il en manque une. Il n'en manque jamais."

 ln_prophecy.1.desc.greenseer:0 "[ln_greenseer.GetTitledFirstName] m'a trouvé au crépuscule et ne s'est pas embarrassé de courtoisies.\n\nLes barrals portent le même visage depuis bien avant que j'aie pris mon premier souffle, dit [ln_greenseer.GetSheHe]. À côté de lui, la même poignée de signes : de la fumée au-dessus d'un lit d'accouchée, une étoile qui a saigné dans le ciel, une lame qui brûle sans être mangée par son propre feu. Le visage dans les arbres est le mien.\n\n\"C'est vous que l'on a promis\", dit [ln_greenseer.GetSheHe], la voix froissée comme des feuilles mortes. \"Les arbres attendaient seulement de voir à qui ce visage appartiendrait.\"\n\n[ln_greenseer.GetSheHe] veut que le Nord le sache avant que l'hiver ne frappe pour de bon. On ne me demande rien en retour, ce qui, je ne sais comment, pèse plus lourd qu'un prix exigé."

 ln_prophecy.1.desc.witch:0 "La vieille femme se tenait parmi mes gens avant que quiconque l'ait annoncée, et personne n'a pu dire ensuite comment elle était passée devant les gardes.\n\nElle marche depuis longtemps, me dit-elle, et elle comptait en marchant. De la fumée le jour d'une naissance. Une étoile qui a saigné au-dessus de l'eau. Des rêves qui arrivent comme des souvenirs et non comme des prophéties. Elle rassemble ces signes depuis des années, de campement en grand-salle, et chacun d'eux l'a menée ici.\n\n\"C'est vous\", croasse-t-elle en pointant un doigt noueux. \"Celui qui fut promis, né de nouveau quand le monde se refroidit.\" Elle refuse d'employer le nom dont se servent les prêtres rouges. Elle en prononce un plus ancien, et mon mestre pâlit en le traduisant.\n\nPuis elle se retourne et sort, laissant la moitié de ma maisonnée me fixer dans un silence absolu."

 ln_prophecy.1.a:0 "Si le royaume a besoin d'un champion, qu'on m'appelle Azor Ahai."
 ln_prophecy.1.b:0 "Baissez la voix. N'en parlez à personne d'autre pour l'instant."
 ln_prophecy.1.c:0 "Vous avez mal lu les signes. Je ne suis le sauveur de personne."

 # ── CHOSEN ──────────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.2.t:0 "Le prince qui fut promis"

 ln_prophecy.2.desc.first:0 "Ce n'est plus une seule voix qui le dit.\n\nCe que [ln_speaker.GetTitledFirstName] a dit de moi a voyagé comme la parole voyage entre les temples—ce qui est bien plus rapide qu'entre les rois. Elle est revenue en s'accordant avec elle-même, et cela n'arrive presque jamais. Des prêtres qui n'ont jamais vu mon visage ont compté les mêmes marques et sont arrivés exactement au même total.\n\nOn m'appelle le prince qui fut promis. Les plus hardis emploient le nom ancien, Azor Ahai réincarné, et les plus hardis ne sont pas d'ordinaire ceux qui finissent par avoir raison.\n\nCela ne fait pas de moi un champion. Cela fait de moi une prétention. Il y a des hommes qui prendront les armes pour elle, et des hommes qui prendront les armes contre elle.\n\n#N Personne dans tout cela ne sait si c'est vrai. Moi moins que quiconque.#!"

 ln_prophecy.2.desc.rival:0 "Ce n'est plus une seule voix qui le dit et, pire, je ne suis pas le seul dont on le dise.\n\nUn autre porte déjà le titre, avec un temple derrière lui et une armée de fidèles par-dessus. Ils ont une version de la prophétie où leurs marques sont les vraies, et les miennes seulement [ln_speaker.GetTitledFirstName] lisant un espoir désespéré dans un feu.\n\nEt voilà que l'on dit maintenant exactement la même chose de moi, par des prêtres tout aussi certains.\n\nNous ne pouvons pas être tous les deux le prince qui fut promis. La foi est parfaitement capable de tenir cette idée et de nous financer l'un et l'autre malgré tout—car une foi qui a attendu huit mille ans a appris à couvrir ses paris.\n\n#N L'un de nous restera dans les mémoires comme le sot qui n'a fait qu'y croire.#!"

 ln_prophecy.2.a:0 "Alors que le monde sache que je suis l'élu."
 ln_prophecy.2.b:0 "Faites taire ces rumeurs. Ils se trompent de prétendant."

 # ── THE DOUBT ───────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.3.t:0 "Une flamme qui vacille"

 ln_prophecy.3.desc:0 "[ln_speaker.GetFirstName] ne le dit pas franchement. [ln_speaker.GetFirstName] n'est pas sot, et je ne suis pas précisément connu pour ma patience.\n\nLe doute arrive donc de biais. Ai-je encore ce que j'avais ? L'étoile compte-t-elle toujours, et la fumée, et les rêves ? Il y a une pause lourde et traînante à chaque marque qui ne tient plus, et ces pauses sont tout le message.\n\nLa prophétie n'a jamais été qu'un décompte, et le mien est allé à reculons.\n\n\"Je ne dis pas que vous n'êtes pas l'élu\", dit enfin [ln_speaker.GetSheHe], en détournant les yeux. Voilà le pire. [ln_speaker.GetSheHe] ne sait plus si, un jour, [ln_speaker.GetSheHe] a été certain, ou seulement désireux de l'être."

 ln_prophecy.3.a:0 "Si vos feux ont menti, dites-le-moi en face."
 ln_prophecy.3.b:0 "Nous sommes allés trop loin. Vous ne pouvez pas me reprendre ce nom maintenant."

 # ── THE CAPSTONE TRAIT ──────────────────────────────────────────────────────────────────────────────────
 trait_azor_ahai_reborn:0 "Azor Ahai Réincarné"
 trait_azor_ahai_reborn_desc:0 "A tué le Roi de la Nuit.\n\nPas nommé par un prêtre. Pas acclamé par un temple. Est allé au-devant des ténèbres l'acier en main et les a brisées. Occupe le seul barreau de cette échelle que personne ne peut contester, gagné par l'acte lui-même et non par la lecture pleine d'espoir que quelqu'un aurait faite d'un feu.\n\nSavoir si cela suffit vraiment à faire le prince qui fut promis est une autre question, mais un très grand nombre de gens vont y répondre avec beaucoup d'assurance dans les deux sens."