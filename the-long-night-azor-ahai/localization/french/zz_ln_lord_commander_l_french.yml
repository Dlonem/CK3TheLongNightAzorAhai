l_french:

 # AGOT: The Long Night & Azor Ahai -- the Lord Commander's war.

 ln_call_the_great_ranging_decision:0 "Convoquer la Grande Patrouille"
 ln_call_the_great_ranging_decision_desc:0 "Les rapports posés sur votre table ne concordent pas entre eux, et les hommes qui les ont écrits ne sont pas là pour les accorder.\n\nLa Garde n'a jamais eu qu'un moyen d'établir ce qui se trouve vraiment dans le nord, et il a toujours coûté la même monnaie : des frères, en nombre, chevauchant au-delà du dernier endroit d'où l'on fait demi-tour, avec l'ordre de regarder la chose elle-même et de rentrer.\n\nLe dernier lord Commandant à en avoir convoqué une est resté dans les mémoires pour cela. Ce n'est pas la même chose que de dire qu'elle s'est bien passée."
 ln_call_the_great_ranging_decision_tt:0 "Envoyez une grande patrouille au-delà du Mur pour apprendre ce qui vient.\n\n#weak Elle revient avec des nouvelles, ou elle ne revient pas, ou — pire — elle revient silencieuse. Ce qu'elle apprend, la Garde le garde.#!"
 ln_call_the_great_ranging_decision_confirm:0 "Sonnez une fois du cor"

 ln_lc.1.t:0 "La Grande Patrouille part"
 ln_lc.1.desc:0 "Ils franchissent la porte avant les premières lueurs, parce que vous l'avez ordonné et parce qu'aucun d'eux ne voulait le faire sous les yeux de tout le château.\n\nDeux cents frères, approvisionnés pour une saison, sur les meilleurs chevaux qui restent à la Garde. Le plus vieux d'entre eux a traversé onze fois et n'a rien dit du tout ce matin, ce que vous avez remarqué. Le plus jeune a dix-neuf ans et n'arrivait pas à se taire, ce que vous avez remarqué aussi.\n\nLa porte retombe derrière eux avec un bruit de verdict. Maintenant la Garde fait ce que la Garde a toujours fait plus que combattre.\n\nElle attend."
 ln_lc.1.a:0 "Rapportez-moi des nouvelles. Quelles qu'elles soient."
 ln_lc.1.b:0 "Vous la mènerez en personne. La Garde suit un manteau, pas un corbeau."

 ln_lc.2.t:0 "Des nouvelles du Nord"
 ln_lc.2.desc:0 "Ils sont revenus plus maigres et plus silencieux, avec quatre chevaux de moins, et le plus ancien des patrouilleurs survivants s'est tenu dans votre solarium pour faire son rapport comme un homme qui pose des pierres une à une.\n\nDes distances. Des noms de vallées où plus personne ne vit. Ce que fuit le peuple libre, dans les mots du peuple libre qui l'a dit. Où le froid se tient de travers, et jusqu'où vers le sud cette anomalie est descendue depuis la dernière fois que le plus vieux de la troupe l'a vue.\n\nC'est le premier document en huit mille ans d'archives de la Garde qui traite l'ennemi comme une affaire de logistique. Vous l'avez lu quatre fois.\n\nLa Citadelle peut discuter avec des histoires. Elle ne peut pas discuter avec des distances."
 ln_lc.2.desc.led:0 "Il n'y a pas de rapport à recevoir. Vous y étiez, à chaque lieue, et la seule chose qui attend dans votre solarium est une carte aux coins lestés et le plus ancien des patrouilleurs survivants, qui écrit depuis Fort-Levant et n'a pas dormi depuis le Milkwater.\n\nDes distances. Des noms de vallées où plus personne ne vit. Ce que fuit le peuple libre, dans les mots du peuple libre qui l'a dit — et vous étiez assez près pour sentir la fumée sur eux quand ils l'ont dit.\n\nVous avez mis votre propre nom en bas, sous le sien. C'est la part que la Citadelle ne pourra pas contourner. C'est le premier document en huit mille ans d'archives de la Garde qui traite l'ennemi comme une affaire de logistique, et celui qui l'a signé est allé compter les lieues lui-même.\n\nLa Citadelle peut discuter avec des histoires. Elle ne peut pas discuter avec un lord Commandant qui y était."
 ln_lc.2.a:0 "Recopiez-le. Chaque fort en reçoit un. Winterfell aussi."

 ln_lc.3.t:0 "La patrouille est perdue"
 ln_lc.3.desc:0 "Ce sont les chevaux qui tranchent la question.\n\nDes frères peuvent être retardés. Des frères peuvent hiverner, perdre la piste, se terrer dans un village de sauvageons et rentrer au printemps avec une histoire. Mais onze des chevaux sont revenus seuls, au fil des semaines, par un et par deux : sans cavalier, à demi morts de faim, et refusant d'être mis à l'écurie face au nord.\n\nDeux cents hommes. Vous avez signé l'ordre et vous les avez comptés à la sortie de la porte.\n\nLe clerc a laissé le registre ouvert sur votre table, parce qu'il faut bien que quelqu'un écrive la ligne et que la coutume de la Garde dit que c'est vous."
 ln_lc.3.desc.led:0 "Vous en avez ramené dix-neuf.\n\nVous ne vous souvenez pas d'avoir donné l'ordre de faire demi-tour. Vous vous souvenez de la lumière qui a mal tourné le quatrième jour après le Milkwater, d'un cheval qui hurlait quelque part derrière vous dans une obscurité arrivée quatre heures trop tôt, puis d'une longue course que l'on appellera un repli en combattant le temps que l'histoire atteigne Winterfell.\n\nOnze autres chevaux sont rentrés seuls au fil des semaines suivantes, par un et par deux : sans cavalier, à demi morts de faim, et refusant d'être mis à l'écurie face au nord. Pas un n'a ramené d'homme avec lui.\n\nVous avez signé l'ordre. Vous les avez comptés à la sortie de la porte. Vous avez chevauché à leur tête, ce qui est, avez-vous dit à tout le château, la raison d'être d'un lord Commandant.\n\nLe clerc a laissé le registre ouvert sur votre table, parce qu'il faut bien que quelqu'un écrive la ligne et que la coutume de la Garde dit que c'est vous. La coutume ne dit pas quoi écrire quand le nom en tête de liste respire encore."
 ln_lc.3.a:0 "Deux cents noms. Je les écrirai tous."
 ln_lc.3.a.led:0 "Cent quatre-vingt-un noms. Je les écrirai tous de ma propre main."

 ln_lc.4.t:0 "Ils sont revenus silencieux"
 ln_lc.4.desc:0 "Le guetteur de la porte les a vus au crépuscule : trente frères, à pied, en bon ordre, et il était au milieu de son cri de joie quand il a compris ce qui clochait.\n\nPas de souffle. Trente hommes marchant dans le froid, et pas un panache de buée au-dessus d'eux.\n\nLa porte est restée fermée. Les flèches enflammées ont fait ce que fait le feu. Et au matin le sol devant le Mur était jonché d'hommes que vous connaissiez — des hommes que vous avez ENVOYÉS — avec des manteaux noirs raidis par le gel et des yeux de la couleur d'une étoile vue à travers la glace.\n\nL'un des garçons de cuisine n'est pas resté derrière le mur de boucliers, et la Garde a enterré à midi ce qui restait de lui. Le reste de ce qui s'est passé cette nuit ne peut pas être enterré, parce que ça s'est relevé."
 ln_lc.4.desc.led:0 "Vous les avez devancés de trois jours, et vous avez passé chaque heure depuis à essayer de décider ce que vous avez réellement vu sur la glace.\n\nPuis le guetteur de la porte crie au crépuscule : trente frères, à pied, en bon ordre. Vous vous élancez déjà vers l'escalier avant qu'il ait fini, parce que vous avez laissé trente hommes sur cette glace et que vous savez exactement comment ils étaient couchés quand vous les avez laissés.\n\nPas de souffle. Trente hommes marchant dans le froid, et pas un panache de buée au-dessus d'eux.\n\nLa porte est restée fermée. Les flèches enflammées ont fait ce que fait le feu. Et au matin le sol devant le Mur était jonché d'hommes que vous connaissiez — des hommes que vous avez MENÉS — avec des manteaux noirs raidis par le gel et des yeux de la couleur d'une étoile vue à travers la glace.\n\nL'un des garçons de cuisine n'est pas resté derrière le mur de boucliers. La Garde a enterré à midi ce qui restait de lui. Le reste de ce qui s'est passé cette nuit ne peut pas être enterré, parce que ça s'est relevé."
 ln_lc.4.a:0 "Brûlez les manteaux. Brûlez tout."

 ln_opening.10.t:0 "Vous avez déjà vu cela"
 ln_opening.10.desc:0 "Les cavaliers apportent les mêmes mots que la dernière fois, et autour de vous la salle se défait dans le même ordre que la dernière fois : d'abord ceux qui crient, puis ceux qui prient, puis ceux qui s'assoient simplement.\n\nEt vous remarquez que vous n'avez pas bougé d'un pouce.\n\nVous y étiez. Vous vous teniez dans la neige, au premier rang du monde, les morts en marche, et vous avez vu l'obscurité se briser — pas dans une chanson, pas dans l'histoire d'un mestre où votre nom est mal orthographié, mais devant vous, par-dessus l'épaule d'hommes dont vous connaissez encore les visages.\n\nChaque homme dans cette salle le sait. C'est pourquoi, un par un, ils cessent leur bruit et se tournent vers vous."
 ln_opening.10.a:0 "Je sais comment cela finit. Apportez-moi mon épée."

 ln_ranging_still_out:0 "La dernière patrouille n'est pas encore rentrée. Je n'enverrai pas d'autres hommes derrière eux avant de savoir."
 ln_ranging_men_need_rest:0 "La patrouille est rentrée, et les hommes qui en sont revenus ont besoin de repos. La Garde ne peut pas encore en monter une autre."
 ln_send_out_the_crows_decision:0 "Envoyer un frère recruter"
 ln_send_out_the_crows_decision_desc:0 "La Garde a une méthode de recrutement qui marche depuis huit mille ans, et ce ne sont pas les lettres.\n\nC'est un homme. Un frère dont les meilleures années de patrouille sont passées, avec un bon cheval, un manteau noir et aucune hâte, chevauchant de Last Hearth jusqu'à the Reach — et à chaque château il pose au seigneur la même question : à quel point vos geôles sont-elles pleines, et qu'aviez-vous l'intention de faire de ces hommes ?\n\nPersonne n'aime un manteau noir à sa porte. Tout le monde le nourrit. Et le compte du Mur augmente de tout ce que le royaume s'apprêtait à pendre."
 ln_send_out_the_crows_decision_tt:0 "Envoyez un frère jureté de votre cour chevaucher vers le sud à travers le royaume.\n\n#weak Chaque grand seigneur dont les geôles sont pleines sera prié de les vider dans la Garde. Certains le feront. Les visites arrivent au fil des mois, selon ce que permettent les routes.#!"
 ln_send_out_the_crows_decision_confirm:0 "Donnez-lui un cheval et une liste"
 ln_crows_need_a_brother_to_send:0 "Il vous faut à votre cour un frère jureté en état de chevaucher vers le sud"
 ln_crows_are_still_on_the_road:0 "Le dernier frère que j'ai envoyé est encore sur les routes. La Garde n'a pas tant d'hommes à consacrer à la mendicité."
 ln_send_out_the_crows_effect_tt:0 "Un frère de votre cour part vers le sud. Tout duc ou plus puissant des Sept Couronnes comptant #V 3#! prisonniers ou plus le recevra dans les mois à venir."

 ln_lc.10.t:0 "Un frère noir à la porte"
 ln_lc.10.desc:0 "[ln_wandering_crow.GetTitledFirstName] est sur les routes depuis assez longtemps pour que le noir ait tourné au gris à l'ourlet, et il ne s'embarrasse pas de cérémonie.\n\nIl mange ce que votre salle lui sert, remercie le serviteur par son nom, puis vous pose la question qu'il a posée à chaque porte entre ici et le Mur : à quel point vos geôles sont-elles pleines, messire, et qu'aviez-vous l'intention de faire des hommes qui y sont ?\n\n« La corde est rapide, dit-il, du ton d'un homme qui concède un argument que vous n'avez pas encore avancé. Le Mur ne l'est pas. Mais le Mur, ce sont dix-neuf forts tenus par huit cents hommes, et l'hiver ne s'éloigne pas. Un homme qui mourrait ici pour rien peut geler là-bas pour quelque chose. »\n\nIl ne mendie pas. Il fait cela depuis trop longtemps pour mendier. Il attend, simplement, et il peut attendre plus longtemps que vous."
 ln_lc.10.desc.north:0 "Le frère errant n'a pas à se justifier dans cette salle. Votre grand-père a donné des hommes à la Garde, et le sien aussi, et tout seigneur lié aux Stark aussi loin qu'on puisse compter. Les cellules contiennent ce qu'elles contiennent ; le Mur a besoin de ce dont il a toujours eu besoin ; l'arithmétique est plus vieille que votre nom.\n\nIl demande à voix basse, comme le font les hommes du nord, et il attend. Vous savez tous les deux ce qu'un seigneur du Nord répond à la demande de la Garde."
 ln_lc.10.a:0 "Prenez-les. Tous les hommes sans terre de mes cellules."
 ln_lc.10.b:0 "De l'argent pour le Mur. Mes prisonniers sont mon affaire."
 ln_lc.10.c:0 "Le Mur n'aura rien de moi. Bonne route."
