l_french:

 # AGOT: The Long Night & Azor Ahai -- the long defeat, and meeting your own dead.

 ln_defeat.1.t:0 "#e La Longue Défaite#!"
 ln_defeat.1.desc:0 "#e Personne ne la déclare. Il n'y a pas de corbeau, et pas de dernier carré qui mérite le nom — seulement une saison qui ne tourne pas, puis une autre, puis une génération d'entre elles.\n\n Les mestres ont cessé de publier le compte de l'hiver il y a quelques années. Cela non plus n'a pas été annoncé. Le dernier homme qui se souvenait d'une récolte est mort au printemps qui n'était pas un printemps, et les enfants qui naissent aujourd'hui grandiront en croyant que le gris au-dessus de leurs têtes est simplement ce qu'est le ciel.\n\n Quelque part au nord de tout, dans une salle de glace qui fut un château, un roi qui ne mange ni ne dort ni ne vieillit tient un royaume plus vaste qu'aucun Targaryen n'en obtint jamais, et il n'est pas pressé, parce qu'il a déjà gagné et que seuls les vivants sont encore à le découvrir.\n\n #bold La Longue Nuit ne s'est pas terminée. Elle est devenue le monde.#!#!"
 ln_defeat.1.desc.watch:0 "#e Tu es la Garde de Nuit. Tu étais le bouclier qui protège les royaumes des hommes.\n\n Il n'y a plus de royaume à protéger et plus d'hommes dont il vaille la peine de parler, et le serment — celui qu'ils t'ont fait dire dans la neige, les mains froides sur une épée que tu n'avais pas encore méritée — se révèle avoir été la description d'une tâche qui pouvait être perdue.\n\n Dix-neuf forts. Tu n'as pas pu en tenir un. Ce qui reste de l'ordre, c'est quelques dizaines d'hommes dans un castel brisé qui entretiennent les feux par habitude, et qui ne prennent plus la peine d'envoyer des patrouilleurs au nord, parce que le nord est partout maintenant.\n\n #bold La nuit qui est venue était celle des récits. Personne n'était prêt, et elle n'a pas attendu.#!#!"
 ln_defeat.1.desc.named:0 "#e Les prêtres t'ont nommé. Ils se trompaient, ou tu te trompais, ou le feu se trompait — et la distinction a cessé d'importer à quiconque sauf toi.\n\n Il ne reste plus de prophétie à discuter. Il y a un continent gelé tenu par un roi auquel rien ne fut jamais promis et qui n'en avait pas besoin, et il y a toi, vivant, ce que les chansons n'ont jamais prévu.\n\n Quelque part dans un temple rouge qui n'est plus qu'une ruine, un prêtre qui a passé sa vie à te désigner est mort encore certain. Tu voudrais lui en vouloir. Surtout, tu te souviens qu'il y croyait plus que toi.\n\n #bold Tu étais le prince qui fut promis. Voilà ce que cela valait.#!#!"
 ln_defeat.1.a:0 "Alors nous y vivons."

 ln_defeat.2.t:0 "Quelqu'un que tu connaissais"
 ln_defeat.2.desc.child:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nTu sais avant d'arriver. Tu as su à la façon dont il se tenait.\n\nC'est ton enfant. Gris maintenant, et faux autour des yeux, et malgré tout — indubitablement, injustement — reconnaissable. Ce qu'on lui a fait n'a pas pris la peine de changer le visage. Peut-être ne pouvait-il pas. Peut-être n'en a-t-il pas vu l'intérêt.\n\n#bold Il est à terre et il ne bouge pas, et tu dois décider quoi faire de cela.#!"
 ln_defeat.2.desc.parent:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nC'est le visage de ton père. De ta mère. Quel qu'il soit, c'est le visage qui t'a appris ce qu'était un visage, gris maintenant et fendu par le froid, gisant dans la boue au milieu des autres.\n\nIls sont morts il y a des années. Tu étais à l'enterrement. Tu te souviens avoir pensé, à l'époque, qu'au moins cette partie était finie.\n\n#bold Elle n'était pas finie.#!"
 ln_defeat.2.desc.sibling:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nTon frère. Ta sœur. La personne avec qui tu t'es disputé pour rien pendant vingt ans et pour qui tu serais mort n'importe lequel de ces jours-là, gisant dans le givre la bouche ouverte, le froid montant encore d'elle.\n\nQuelqu'un lui a passé une lance au travers aujourd'hui. C'était peut-être l'un des tiens. C'était peut-être toi.\n\n#bold Il va falloir regarder cela comme il faut, et puis décider.#!"
 ln_defeat.2.desc.spouse:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nC'est ta femme. Ton mari. La personne au souffle de laquelle tu as appris à t'endormir, gisant dans le givre avec du givre dans les cheveux, et ce qui se tenait derrière ces yeux est parti depuis longtemps.\n\nTu l'as imaginé. Tout le monde dans cette guerre l'a imaginé. Il se trouve que l'imaginer n'était pas la même chose.\n\n#bold Personne d'autre ne le fera pour toi.#!"
 ln_defeat.2.desc.friend:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nC'est ton ami — le vrai, celui à qui tu n'avais pas besoin de t'expliquer. [ln_known_dead.GetSheHe] a disparu dans une débâcle il y a deux hivers et tu as dit à [ln_known_dead.GetHerHis] maisonnée que [ln_known_dead.GetSheHe] avait probablement été pris, parce que c'était plus doux que l'autre possibilité et que tu ne savais pas alors qu'il y en avait une troisième.\n\nMais [ln_known_dead.GetSheHe] est ici. Non, [ln_known_dead.GetSheHe] n'a pas été pris, et [ln_known_dead.GetSheHe] n'est pas mort d'une façon qui aurait aidé.\n\n#bold Tu dois mieux que cela à [ln_known_dead.GetHerHim], et mieux que cela, ce n'est pas grand-chose.#!"
 ln_defeat.2.desc.lover:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nTu reconnais la silhouette avant le visage. C'est la part dont tu te souviendras ensuite — que tu l'as reconnue à quarante pas, dans le noir, à la façon dont elle se tenait.\n\nElle ne se tient plus.\n\n#bold Ce qui reste là-dedans n'est pas elle, et tu n'arrives toujours pas à te hâter.#!"
 ln_defeat.2.desc.sworn:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nC'est l'un des tiens. Quelqu'un qui s'est agenouillé devant toi, dans le castel de qui tu as mangé, dont tu pourrais réciter le nom des enfants si tu avais un instant. [ln_known_dead.GetSheHe] s'est perdu quelque part dans la longue retraite et personne ne l'a consigné, parce qu'à ce moment-là personne ne consignait plus rien.\n\nEt [ln_known_dead.GetSheHe] est revenu au sud avec eux. Depuis tout ce temps, [ln_known_dead.GetSheHe] descend vers le sud avec eux.\n\n#bold Devant toi, [ln_known_dead.GetSheHe] a juré. Cela ne s'est pas arrêté quand [ln_known_dead.GetSheHe] est mort.#!"
 ln_defeat.2.a:0 "Dressez le bûcher ; [ln_known_dead.GetSheHe] partira dans les règles."
 ln_defeat.2.b:0 "Pour [ln_known_dead.GetHerHim], nous ne pouvons plus rien. Nous repasserons par ici."

 # -- WHAT THE DEAD REMEMBER ----------------------------------------------------------------------------------
 ln_defeat.2.desc.again:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nC'est lui. Celui que tu as laissé.\n\nTu savais que ce serait lui, de la façon dont on sait une chose qu'on a refusé de dire à voix haute. Il y avait une colonne à faire avancer, un feu à préparer et cent bonnes raisons, et chacune d'elles était vraie, et pas une seule n'est ici debout.\n\nIl marche depuis. Il a fait un très long chemin pour se trouver dans ce champ précis, et il n'existe aucune version de cela où c'est une coïncidence."
 ln_defeat.2.desc.long_after:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nIl est jeune. Il s'est arrêté parce qu'il n'en a jamais vu un de près, et parce que personne ne lui a dit qu'ils gardent les visages.\n\nToi, si. Depuis plus longtemps qu'il n'est en vie. Il y eut une année, il y a bien longtemps, où c'était la pire chose qui pouvait arriver à un homme en un après-midi — et il y a dans ta salle des enfants qui n'ont pas une seule fois vu le soleil monter assez haut pour jeter une ombre courte, et qui ne voient dans rien de tout cela quelque chose qui aurait mal tourné.\n\nQuelqu'un doit dire ce qu'on fait du corps. C'est toi depuis cinquante ans."
 ln_defeat.2.desc.sworn_burned:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nC'est l'un des tiens. Un homme qui s'est agenouillé devant toi, perdu quelque part dans une retraite que personne n'a consignée comme il faut, debout dans le givre à présent, la mauvaise couleur derrière les yeux.\n\nTu as déjà fait cela. C'est la part dont personne ne te prévient — pas le premier, mais la découverte que tu connais déjà l'ordre des gestes. Le temps que prend le feu. Où se placer pour que le vent ne te le rabatte pas dessus. Ce qu'il faut dire aux hommes ensuite, qui est presque rien.\n\nQuelqu'un te tend la torche sans qu'on la demande. Ils ont commencé à présumer."
 ln_defeat.2.desc.sworn_left:0 "On parcourt le champ, comme on parcourt les champs après, et l'un de tes hommes s'est arrêté et n'ira pas plus loin.\n\nC'est l'un des tiens. Un homme qui s'est agenouillé devant toi, dans le castel de qui tu as mangé, debout dans le givre, la mauvaise couleur derrière les yeux.\n\nIl y en a eu un autre, avant celui-ci. Tu l'as laissé où il gisait et tu avais tes raisons, et tu n'es pas repassé par là depuis, et tu as remarqué que tu ne prends plus la route du nord s'il existe une route qui n'est pas la route du nord.\n\nTes hommes ne regardent pas le corps. Ils te regardent, et attendent d'apprendre quelle sorte de seigneur tu es cette fois."
 ln_the_dark_won_modifier:0 "Les ténèbres ont gagné"
 ln_the_dark_won_modifier_desc:0 "Il y eut une guerre pour l'aube et elle fut perdue. Ce qui reste règne sur ce qui reste, et l'on y obéit par quelque chose de plus proche de la terreur que de la loyauté."
