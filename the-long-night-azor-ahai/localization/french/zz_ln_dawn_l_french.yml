l_french:


 # AGOT: The Long Night & Azor Ahai -- the killing blow.

 ln_dawn.2.t:0 "Le champ, après"
 ln_dawn.2.a:0 "Finissons-en."
 ln_dawn.2.b:0 "Sonnez la retraite. Pas aujourd'hui, et pas avec ça."

 ln_dawn.2.desc.lightbringer:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde comme un homme regarde le temps, et le froid qui sort de lui fait à l'air quelque chose qui rend difficile de le regarder en face.\n\nL'épée à votre hanche est chaude. Elle l'est depuis la nuit où vous l'avez achevée, et elle ne s'est jamais réchauffée à un moment commode : elle est chaude maintenant, dans un champ où tout ce qui vit s'est tu, et vous comprenez que, quel qu'ait été le prix, c'est pour cette heure-ci que vous l'avez payé.\n\n#bold Il n'y en aura pas de meilleure.#!"
 ln_dawn.2.desc.dragon:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et il regarde en l'air. Pas vous : la chose au-dessus de vous, la chaleur qui en descend par vagues et qui change le givre en brouillard sur cent pas dans toutes les directions.\n\nOn vous a dit toute votre vie que des dragons ont mis fin à la dernière. Personne n'a jamais dit si le dragon y a survécu.\n\n#bold Il regarde en l'air. Il n'a pas détourné les yeux.#!"
 ln_dawn.2.desc.valyrian:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde avec une expression qui n'est pas tout à fait de la curiosité. Derrière lui le champ est blanc et parfaitement immobile.\n\nLa lame à votre hanche a été repliée dans une cité qui n'est plus que cendre depuis quatre cents ans, par des hommes qui savaient des choses que personne n'a sues depuis. Elle a tranché des mailles, des os et une bonne quantité d'acier ordinaire, et vous n'avez jamais eu besoin qu'elle soit plus qu'une très bonne épée.\n\n#bold Aujourd'hui est le jour où elle l'est, ou ne l'est pas.#!"
 ln_dawn.2.desc.glass:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde, et chaque homme encore debout derrière vous tient un couteau noir et ébréché dont les mestres ont dit qu'il était du bon or gâché.\n\nIl se brise contre les mailles. Il ne garde pas le fil. Les enfants de la forêt s'en sont servis pendant huit mille ans contre une chose dont la Citadelle est convaincue qu'elle n'a jamais existé, et vous avez cru les enfants.\n\n#bold Vous allez apprendre ce que cela valait.#!"
 ln_dawn.2.desc.named:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde. Les prêtres disent votre nom depuis des années — dans les temples, sur les places de marché, à quiconque voulait bien s'arrêter — et la chose devant vous ne semble rien en avoir entendu.\n\nVous n'avez aucune épée que les chansons reconnaîtraient. Vous avez ce que les chansons ont dit que vous étiez.\n\n#bold Ce sera l'un ou l'autre, et vous êtes sur le point de savoir lequel.#!"
 ln_dawn.2.desc.dragon_refused:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\n[ln_dawn_dragon.GetTitledFirstName] n'est pas là. [ln_dawn_dragon.GetSheHe|U] a volé jusqu'au Mur et n'a pas voulu aller plus loin. Des sifflements, un écart, rien n'a pu l'y pousser — trois fois, puis plus rien du tout — et à la fin vous avez laissé le Mur entre [ln_dawn_dragon.GetHerHim] et vous, et fait le reste de la route vers le nord à pied, comme tout le monde.\n\nTout ce que vous comptiez faire à la chose qui se tient au milieu de ce champ, vous comptiez le faire depuis quatre cents pieds de haut.\n\n#bold Vous êtes à pied. C'est vous qu'il regarde.#!"
 ln_dawn.2.desc.nothing:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde, et vous portez une bonne épée qui ne servira à rien du tout.\n\nVous le savez. Chaque homme derrière vous le sait. L'acier est fait pour les gens. Ce qui se tient au milieu de ce champ n'est plus une personne depuis très longtemps, et la seule chose honnête qu'on puisse dire sur le fait d'aller à sa rencontre, c'est qu'il faut bien que quelqu'un soit le premier.\n\n#bold Il faut bien que quelqu'un soit le premier.#!"

 ln_dawn.3.t:0 "#e L'Aube#!"
 ln_dawn.3.desc:0 "#e Il ne tombe pas comme un homme tombe.\n\n Il y a un bruit de lac qui se rompt au printemps, et puis la forme devant vous se défait : pas en morceaux, en intempéries, en un froid qui traverse le champ, sort de l'autre côté et n'est tout simplement plus.\n\n Et derrière elle, partout sur la glace, les morts s'arrêtent.\n\n Dix mille, en pleine enjambée, et puis tous d'un coup s'effondrant dans ce qu'ils ont toujours été : le frère de quelqu'un, le père de quelqu'un, un garçon d'un village que personne ne sait plus trouver sur une carte depuis des années. Le champ devient soudain très bruyant, parce que les vivants respirent encore et que rien d'autre ne fait le moindre bruit.\n\n Quelqu'un crie votre nom. Un autre s'est mis à rire et ne peut plus s'arrêter.\n\n #bold La Longue Nuit est terminée, et c'est vous qui y avez mis fin.#!#!"
 ln_dawn.3.a:0 "Amenez-moi tous les hommes encore debout. Je veux leurs noms."

 ln_dawn.4.t:0 "Pas assez"
 ln_dawn.4.desc.shield:0 "Vous faites trois pas.\n\nLe froid vous coupe le souffle avant le coup — et le coup ne vient pas, parce que [ln_dawn_shield.GetTitledFirstName|E] s'est mis devant vous.\n\n[ln_dawn_shield.GetSheHe|U] ne dit rien de spirituel. [ln_dawn_shield.GetSheHe|U] lève [ln_dawn_shield.GetHerHis] bouclier, et tient, et tient encore quand la chose passe à travers, et à travers [ln_dawn_shield.GetHerHim], et que des hommes vous tirent en arrière en criant des mots que vous n'entendez pas.\n\nVous n'étiez pas prêt. [ln_dawn_shield.GetSheHe|U] le savait avant vous, et l'a fait quand même, et c'est là toute la différence entre vous deux en cet instant.\n\n#bold Vous êtes vivant. Qu'on l'écrive : [ln_dawn_shield.GetSheHe] a tenu.#!"
 ln_dawn.4.desc.alone:0 "Vous faites trois pas.\n\nLe froid vous coupe le souffle avant le coup, et après cela le champ n'est plus que du bruit et un sol qui n'est jamais au bon endroit. Quelqu'un vous tient le bras d'épée. Quelqu'un hurle aux cors.\n\nVous revenez à vous sur un traîneau, votre propre sang gelé sur un côté du visage et beaucoup d'autre sang qui n'est pas le vôtre, et la première chose que vous comprenez, c'est qu'il vous a laissé partir.\n\nPas épargné. Relâché — comme un homme pose ce qu'il a fini de regarder.\n\n#bold Vous êtes vivant, et vous savez exactement ce que coûte de se tromper là-dessus.#!"
 ln_dawn.4.a:0 "Alors nous le refaisons, et mieux."

 # -- THE MAN WHO HAS BEEN HERE BEFORE ------------------------------------------------------------------------
 # Both keep the opening line every other ln_dawn.2 branch opens with, on purpose: it is the same field.
 ln_dawn.2.desc.again:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde, et vous avez déjà été exactement aussi près de lui, une fois. Vous n'avez pas quitté ce champ : on vous en a sorti, et ce qu'il a fallu payer pour obtenir même cela n'est pas une chose que vous avez jamais dite à voix haute.\n\nIl n'a pas vieilli. Il n'a pas guéri. Il ne semble pas se souvenir de vous le moins du monde : de vous deux, vous êtes le seul à compter les coups.\n\nVous n'avez rien dans les mains qui mérite ce nom. Mais vous savez comment il bouge, et personne d'autre en vie ne le sait."
 ln_dawn.2.desc.twice:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde. La dernière fois que vous vous êtes tenu dans un champ avec cette chose à l'autre bout, vous avez donné l'ordre de rompre — et votre maison est rentrée vivante, et vous avez passé chaque année depuis à entendre des hommes qui n'y étaient pas vous dire que c'était le bon choix.\n\nVous portez une bonne épée qui ne servira à rien du tout. Vous en portiez une la dernière fois aussi.\n\nLa différence, c'est que chaque homme derrière vous sait déjà ce que vous avez fait, et attend de voir si vous le ferez deux fois."

 # ── 1.0.13: WHAT ELSE THE FIELD KNOWS ABOUT YOU ────────────────────────────────
 ln_dawn.2.desc.spear:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde, et quelque part au nord d'ici il y a une silhouette que vous reconnaîtriez à n'importe quelle distance et sous n'importe quelle lumière, qui vole vers lui.\n\nVous avez été plus près de cette chose que quiconque encore en vie. Vous étiez en train de tomber. Vous vous souvenez du bras qui se lève, et du cri qu'a poussé [ln_spear_dragon.GetFirstName], et du sol qui arrive.\n\nIl vous connaît. Cela se voit à son immobilité."
 ln_dawn.2.desc.spear_unnamed:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde, et quelque part au nord d'ici il y a une silhouette que vous reconnaîtriez à n'importe quelle distance et sous n'importe quelle lumière, qui vole vers lui.\n\nVous avez été plus près de cette chose que quiconque encore en vie. Vous étiez en train de tomber. Vous vous souvenez du bras qui se lève, et du cri qu'a poussé votre dragon, et du sol qui arrive.\n\nIl vous connaît. Cela se voit à son immobilité."
 ln_dawn.2.desc.dawn:0 "Son armée est brisée et éparpillée sur la glace, et lui n'a pas bougé.\n\nIl se tient là où était la ligne, et vous regarde, et l'épée dans vos mains a la couleur du lait et de la lumière des étoiles, et n'appartient pas à ce siècle.\n\nAube a été trempée dans une étoile tombée avant qu'il y eût des mestres pour l'écrire. Elle ne vous a rien demandé, mais elle a tout demandé à quelqu'un, une fois, et elle attend depuis tout ce temps un matin exactement comme celui-ci.\n\nElle n'est pas chaude. Elle ne l'a jamais été. Elle ne va simplement pas se briser."
 ln_dawn.2.c:0 "J'ai déjà vu comment cela se termine."
 ln_dawn.2.c_tt:0 "Vous avez rêvé ce champ. Vous savez de quel côté il bouge en premier.\n\n#weak De meilleures chances que la version aveugle du même combat — et savoir n'est pas être prêt. Vous le porterez dans les deux cas.#!"


 # ── 1.0.15 -- the ending funnel ─────────────────────────────────────────────────────────────────────────

 ln_dawn.11.t:0 "La Dernière Heure"
 ln_dawn.11.desc.field_lb:0 "La guerre est jouée. Les armées des morts sont brisées, dispersées, brûlées en longues rangées le long de la glace — et leur roi se tient seul dans leurs ruines, et ne regarde rien d'autre que vous.\n\nDes hommes sont morts en nombres qu'aucun mestre ne comptera jamais juste pour que cette heure advienne, et tout se ramène, à la fin, à un petit cercle de neige piétinée et à une épée qui est chaude à votre hanche depuis le jour où vous l'avez achevée.\n\nLes autres hommes restent en arrière. Personne ne leur en a donné l'ordre. Ils le sentent comme le bétail sent le temps : que ce qui va se passer dans la minute qui vient n'est pas pour eux.\n\n#bold La guerre est gagnée. Voici la part qui n'a jamais eu de rapport avec la guerre.#!"
 ln_dawn.11.desc.field_plain:0 "La guerre est jouée. Les armées des morts sont brisées, dispersées, brûlées en longues rangées le long de la glace — et leur roi se tient seul dans leurs ruines, et ne regarde rien d'autre que vous.\n\nDe toutes les mains qui ont tenu une épée dans cette guerre — les nommés, les oints, ceux dont les prêtres étaient si sûrs —, l'heure a choisi la vôtre. Aucune chanson ne vous y a préparé. Peut-être est-ce à cela que les chansons ont toujours servi : à l'homme qu'elles ne mentionnent jamais.\n\nLes autres hommes restent en arrière. Personne ne leur en a donné l'ordre.\n\n#bold La guerre est gagnée. Voici la part qui n'a jamais eu de rapport avec la guerre.#!"
 ln_dawn.11.desc.chains_lb:0 "On l'a amené enchaîné dans du vieux fer et du verredragon, et le froid est entré avec lui.\n\nTrois jours qu'il se tient debout dans vos cellules, et rien chez lui n'a fait ce que fait un prisonnier. Il ne mange pas. Il ne dort pas. Les gardes ont cessé de tirer au sort pour lui porter de l'eau, parce que l'eau est glace avant d'atteindre la porte.\n\nIl y a une seule chose dans ce château qui ait une réponse à lui opposer, et elle est chaude dans son fourreau depuis l'heure où on l'a traîné par vos portes.\n\n#bold Une cellule ne retient pas l'hiver. Finissez-en tant qu'il vous appartient d'en finir.#!"
 ln_dawn.11.desc.chains_plain:0 "On l'a amené enchaîné dans du vieux fer et du verredragon, et le froid est entré avec lui.\n\nTrois jours qu'il se tient debout dans vos cellules, et rien chez lui n'a fait ce que fait un prisonnier. Il ne mange pas. Il ne dort pas. Il regarde la porte — pas comme un homme qui attend d'être secouru, mais comme la mer regarde la digue d'un port.\n\nChaque heure qu'il passe là, le givre monte d'une pierre, et chaque homme de votre donjon sait d'où il vient.\n\n#bold Une cellule ne retient pas l'hiver. Finissez-en tant qu'il vous appartient d'en finir.#!"
 # 1.0.16 -- WAS "End the Long Night." Thomas: "I don't like that one text for the one event about end it.
 # If anything, it should read more attempt to end it or like go in for the kill." The old text PROMISED an
 # outcome, and the old option delivered one with no roll -- which is exactly what MPREG reported as a
 # missing duel. ln_dawn.11.a is a duel now, so the button promises an attempt and nothing more.
 ln_dawn.11.a:0 "Allez le tuer."
 # The two duel outcome labels, matching ln_dawn.2.duel.win / .lose in voice: bare, present tense, no drama
 # in the label itself because the card around it is already carrying all of it.
 ln_dawn.11.duel.win:0 "L'achever"
 ln_dawn.11.duel.lose:0 "Il est plus rapide que vous"
 ln_dawn.11.b:0 "Cette heure appartient à un autre. Qu'on l'envoie chercher."

 ln_dawn.20.t:0 "La chose dans vos cellules"
 ln_dawn.20.desc.other:0 "Votre geôlier sert ce donjon depuis trente ans, et ce matin il n'a pas voulu descendre l'escalier seul.\n\nLa chose que vous avez prise vivante se tient au milieu de sa cellule — s'y tient, depuis qu'on a fermé la porte, au milieu exact, aussi loin de chaque mur qu'une chose peut l'être. Le givre a monté sur les pierres autour d'elle en dessins que personne n'a voulu regarder longtemps. Elle n'a pas demandé de rançon. Elle n'a pas demandé de procès. Elle n'a pas fait un bruit.\n\nElle attend, et tout le monde dans votre donjon sent ce qu'elle attend.\n\n#bold Le froid ne se rend pas. Il attend, c'est tout.#!"
 ln_dawn.20.desc.wight:0 "Elle est morte depuis un certain temps. C'est là le problème.\n\nLa chose que vos hommes ont traînée ici ne s'arrête pas de bouger. Elle a travaillé les chaînes jusqu'à ce que la chair quitte l'os, puis elle a continué, et le bruit — patient, infatigable, toute la nuit — a vidé les cellules des deux côtés. Le geôlier demande, respectueusement, si messire entend la garder, et si oui, si messire voudrait d'abord l'écouter pendant une heure.\n\n#bold La viande ne s'arrête pas. Le feu l'arrête.#!"
 # ── and whether you knew it. Appended under either base card; see the note in ln_dawn.20. ──
 ln_dawn.20.desc.knew_spouse:0 "\n\n#EMP Vous étiez marié à cela.#!\n\nDeux personnes de votre maison le savent. Aucune n'a pu vous regarder depuis que la charrette a passé la porte, et vous n'êtes pas descendu aux cellules, et chaque homme de ce donjon sait exactement pourquoi l'ordre n'a pas encore été donné.\n\nPersonne n'a jamais fait de veillée pour [ln_captured_other.GetHerHim]. [ln_captured_other.GetSheHe|U] porte encore ce que vous avez vu sur [ln_captured_other.GetHerHim] la dernière fois."
 ln_dawn.20.desc.knew_lover:0 "\n\n#EMP Vous la connaissiez, et pas comme on connaît ses bannerets.#!\n\nIl existait une version de tout ceci où vous n'auriez jamais eu à apprendre ce qui vient après. Cette version s'est terminée quand vos hommes ont fait entrer la charrette et que quelqu'un a dit un nom à voix haute dans la cour, puis l'a dit encore, plus bas, parce que la première fois cela n'avait pas sonné comme une question.\n\nElle ne vous connaît pas. C'est la part que vous garderez."
 ln_dawn.20.desc.knew_blood:0 "\n\n#EMP C'est votre sang.#!\n\nVotre maison a une crypte, un maçon et huit cents ans de pratique à enterrer les siens, et rien de tout cela ne sert ici, parce que la chose dans la cellule se relève. On a consulté le septon, et le septon est allé en consulter un autre.\n\nQuoi que vous décidiez, ce sera écrit avec votre nom à côté, et vos petits-enfants le liront."
 ln_dawn.20.desc.knew_friend:0 "\n\n#EMP Vous la connaissiez. Vous l'avez bien connue, autrefois.#!\n\nElle a bu dans votre salle. Elle avait sur votre intendant une opinion que vous répétez encore. Quelqu'un, à la caserne, racontait cette histoire le mois dernier, et maintenant plus personne ne la raconte, et le silence a une forme.\n\nVous en avez abattu une douzaine sans y penser. C'était tout l'intérêt de la douzaine."
 ln_dawn.20.desc.knew_nobody:0 ""
 ln_dawn.20.a:0 "Passez-la par l'épée. Tout de suite."
 ln_dawn.20.b:0 "Gardez-la en bas. Que le royaume sache ce que je détiens."

 # ── 1.0.15b -- the bane rule ────────────────────────────────────────────────────────────────────────────
 ln_dawn.11.c:0 "Nous n'avons rien qui puisse l'achever. Rompez."
 ln_dawn.11.c_tt:0 "Seuls le #bold verredragon#!, l'#bold acier valyrien#! ou le #bold feu de dragon#! peuvent le détruire. Vous n'en portez aucun des trois.\n\nLa guerre est gagnée dans tous les cas — mais la Longue Nuit ne s'achève pas avant lui."

 # ── 1.0.15 -- the duel, on the engine's own duelling mechanic ───────────────────────────────────────────
 ln_dawn.2.duel.win:0 "Porter le coup"
 ln_dawn.2.duel.lose:0 "Manquer son coup"
 ln_dawn.2.d:0 "Sortez quand même. Il faut bien que quelqu'un soit le premier."
 ln_dawn.2.d_tt:0 "Vous ne portez rien qui puisse lui faire du mal : ni #bold verredragon#!, ni #bold acier valyrien#!, et aucun dragon au-dessus de vous.\n\nVous ne le tuerez pas aujourd'hui. Les hommes se souviendront que vous êtes sorti là-bas."
 # ── 1.1.3 -- la carte de la chute : il n'est pas détruit ────────────────────────────────────────────
 ln_dawn.30.t:0 "Il n'est pas détruit"
 ln_dawn.30.desc.dragon:0 "Le Roi de la Nuit est tombé sous le feu de [ln_dawn30_killer.GetFirstName] dans la mêlée d'une bataille, et les morts ne se sont pas arrêtés. En quelques jours il se tenait de nouveau parmi eux, le même visage, le même froid.\n\nUn dragon dans la mêlée ne suffit pas. Il faut l'affronter.\n\n"
 ln_dawn.30.desc.bane:0 "[ln_dawn30_killer.GetTitledFirstName] a abattu le Roi de la Nuit avec quelque chose qui aurait pu l'achever, au mauvais endroit et à la mauvaise heure, et les morts ne se sont pas arrêtés. En quelques jours il se tenait de nouveau parmi eux, le même visage, le même froid.\n\nLa bonne arme ne suffit pas. Il faut l'affronter.\n\n"
 ln_dawn.30.desc.nokiller:0 "Le Roi de la Nuit est mort, et aucune main ne le revendique. Les morts ne se sont pas arrêtés. En quelques jours il se tenait de nouveau parmi eux, le même visage, le même froid.\n\nCe qui a mis fin au corps n'a pas mis fin à ce qui le portait.\n\n"
 ln_dawn.30.desc:0 "Le Roi de la Nuit est tombé, et les morts ne se sont pas arrêtés. En quelques jours il se tenait de nouveau parmi eux, le même visage, le même froid.\n\nL'acier met fin au corps. Il ne met pas fin à ce qui le porte.\n\n"
 ln_dawn.30.desc.rule.death:0 "Il n'est détruit que lorsqu'on l'affronte — sur le champ après que son armée a été brisée, acculé après une Guerre pour l'Aube perdue, ou enchaîné — par une main portant du verredragon, de l'acier valyrien ou Illumination, ou avec un dragon dans le ciel. Toute autre mort ne fait que l'abattre."
 ln_dawn.30.desc.rule.war:0 "Dans ce monde, les ténèbres ne se lèvent que lorsque la Guerre pour l'Aube est gagnée et qu'on l'affronte au bout, par une main portant du verredragon, de l'acier valyrien ou Illumination, ou avec un dragon dans le ciel. Toute mort avant cela ne fait que l'abattre."
 ln_dawn.30.desc.beaten:0 "\n\nLa Guerre pour l'Aube peut désormais être proclamée."
 ln_dawn.30.desc.notbeaten:0 ""
 ln_dawn.30.a:0 "Alors ce n'est pas fini."
