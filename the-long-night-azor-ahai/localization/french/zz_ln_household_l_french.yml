l_french:

 # AGOT: The Long Night & Azor Ahai -- household administration.
 # Deliberately dull where it can be. Nothing here should read as remarkable to a player who is not
 # looking for it -- an estate in order, a house writing itself down, a ship coming home late.

 ln_household_ledger_decision:0 "Reprendre le livre de comptes de la maison"
 ln_household_ledger_decision_desc:0 "Les comptes sont restés illisibles pendant des années. Loyers non perçus, dettes non poursuivies, serviteurs sans un merci.\n\nUn après-midi avec le registre et l'intendant, et la maison est à nouveau en ordre — la monnaie qui vous était due retrouvée, et les hommes qui ont gardé la foi durant les années maigres inscrits comme des hommes qui ont gardé la foi. Certains auront besoin qu'on leur rappelle ce qu'ils valent. Un ou deux, ce qu'ils ne valent pas."
 ln_household_ledger_decision_tt:0 "Remettre la maison en ordre."
 ln_household_ledger_decision_confirm:0 "Faire venir l'intendant"

 ln_household_charter_decision:0 "Consigner la charte de la maison"
 ln_household_charter_decision_desc:0 "Toute maison qui dure se met par écrit un jour ou l'autre — ce à quoi elle sert, ce qu'elle ne fera pas, et ce qu'elle attend de ceux qui viendront après.\n\nLa plupart ne s'en soucient jamais, et la plupart sont oubliées en trois générations. La vôtre ne le sera pas."
 ln_household_charter_decision_tt:0 "Engager la maison par écrit."
 ln_household_charter_decision_confirm:0 "Le mettre par écrit"

 ln_household_valyria_decision:0 "Une voile sortie de la mer Fumante"
 ln_household_valyria_decision_desc:0 "On l'avait rayée des registres depuis des années — une coque de louage partie de Volantis avec un capitaine assez fou pour accepter une charte du Fief Franc et un équipage assez fou pour la signer. Personne ne navigue à l'est de la mer Fumante et n'en revient. Ce n'est pas de la superstition ; c'est de l'arithmétique.\n\nElle est revenue.\n\nCe qui reste de son équipage ne dira pas ce qu'ils ont vu au-delà des bancs de cendre, et le capitaine refuse carrément de descendre à terre. Mais la cale a été ouverte sur le quai devant témoins : un coffre de vieille monnaie, encore brillante ; une lame d'acier moiré qu'aucun forgeron vivant n'aurait pu plier ; et au fond, emballés dans du sable, dans un nid de toile huilée, deux œufs — lourds comme la pierre, tièdes comme des choses endormies.\n\nLe capitaine ne demande aucun paiement. Il demande seulement que vous emportiez tout cela de son navire cette nuit, et que son nom soit rayé de la charte. Quelque chose dans la cale l'empêche de dormir, et il a décidé que cela cherchait une famille, non une fortune."
 ln_household_valyria_decision_tt:0 "Recevoir ce que le navire a rapporté."
 ln_household_valyria_decision_confirm:0 "Qu'on le débarque"

 # Retained for saves that still carry it. No decision applies or reads this any more.
 ln_household_ledger_cooldown_modifier:0 "Comptes réglés"
 ln_household_ledger_cooldown_modifier_desc:0 "Les livres de la maison ont été équilibrés récemment. Il n'y a plus rien à y trouver pour un temps."

 # ── THE SHIP'S MANIFEST, IN PLAIN WORDS (1.0.12b) ──────────────────────────────
 ln_valyria_sword_tt:0 "Une #bold lame d'acier valyrien#! de facture incertaine sort du navire et passe dans votre coffre — la lame que vous avez en main reste en main."
 ln_valyria_eggs_tt:0 "#bold Deux œufs de dragon#!, de couleurs inconnues jusqu'à ce qu'on les déballe."
 ln_valyria_dragon_tt:0 "Si un dragon vivant vous est lié, il est nourri et mené au vol : il grandit, s'éveille, et sa constitution gagne un degré — et le sang du dragon est confirmé dans votre lignée."

 # ── THE FOURTH DOOR (1.0.12b) ───────────────────────────────────────────────────
 ln_household_mend_decision:0 "Faire venir le médecin de la maison"
 ln_household_mend_decision_desc:0 "La maison entretient son propre médecin, et il ne pose aucune question à laquelle le registre n'a pas déjà répondu. Les plaies se ferment, les fièvres tombent, et l'on rend au corps les années que l'histoire lui a prises.\n\nCe qu'il ne peut pas réparer, c'est un nom. Ce qu'on dit de vous, vous le gardez."
 ln_household_mend_decision_tt:0 "Réparer le corps — plaies, cicatrices, maladie et le poids sur l'esprit."
 ln_household_mend_decision_confirm:0 "Laissez-le travailler."
 ln_household_mend_effect_tt:0 "Chaque plaie, cicatrice, maladie et infirmité est guérie, et #V 100#! de stress sont levés. Surnoms, réputation et prophétie demeurent intacts."

