l_french:

 # 1.0.16 -- these six were all the placeholder string "Winter". That was harmless while the traditions were
 # assigned to nothing; as of 1.0.16 frostborn carries all three (common/culture/cultures/00_other_culture.txt),
 # so they are on the culture screen, in tooltips, and in the culture window for anyone who inspects the
 # Others -- which is exactly what Zobertus was doing when he found the innovation gap.
 tradition_others_name:0 "Le Long Froid"
 tradition_others_desc:0 "Ils ne sont pas un peuple. Ils ne se marient pas au-dehors, ne prennent pas conseil et ne changent pas d'avis, et rien de vivant n'en a jamais persuadé un seul de quoi que ce soit. Ce qu'ils ont en guise de culture est une direction, et c'est le sud."

 tradition_others2_name:0 "Aucune condition"
 tradition_others2_desc:0 "Il n'y a pas d'ambassade à envoyer ni de prix à payer. Ils prennent ce qu'ils foulent, ils continuent d'avancer à travers un hiver qui achèverait une armée, et la seule conversation que quiconque ait jamais eue avec eux s'est tenue à longueur d'épée."

 tradition_others3_name:0 "Les morts ne se fatiguent pas"
 tradition_others3_desc:0 "Chaque place qu'ils prennent se relève et marche derrière eux. Les pertes n'affaiblissent pas cette armée comme les pertes affaiblissent la vôtre : elles sont le mécanisme par lequel elle grandit."

 # `other_parameter` is a culture PARAMETER, and CK3 renders those as culture_parameter_<name> -- the same
 # bare-in-script / prefixed-in-loc convention as struggle parameters (see
 # zz_ln_struggle_parameters_l_english.yml). The prefixed key already exists in
 # culture/other_maa_innovations_l_english.yml. The bare one below is KEPT, not deleted, per the standing
 # rule now written into common/genes/zz_long_night_genes.txt: deprecate, never delete.
 other_parameter:0 "On ne peut ni les raisonner, ni marchander avec eux, ni les épuiser par l'attente"
