l_french:

 # ── The Long Night begins again ─────────────────────────────────────────────────────────────────────────────
 # Only ever seen with the "The Cycle" game rule on. Wave 1 uses the original others.2.desc.

 ln_others.2.desc.wave_again:0 "#e Les corbeaux partent avant les cavaliers, et les mestres ne discutent pas du sens des rapports. Il ne reste plus rien à discuter.\n\n C'est déjà arrivé. Pas de mémoire d'homme — le dernier à l'avoir vu est mort avant la naissance de quiconque respire aujourd'hui — mais la Citadelle tient ses registres, et le Nord garde ses récits, et pour une fois les deux s'accordent.\n\n Les sauvageons descendent déjà vers le sud. Ils n'ont pas attendu d'en être sûrs.\n\n #bold Les Autres sont de retour. La Longue Nuit est revenue.#!#!"

 ln_others.2.desc.wave_late:0 "#e Il y a désormais un mot pour cela, dans toutes les langues d'Oldtown à Asshai, et les enfants l'apprennent avant de savoir compter.\n\n Le Nord garde ses ruines comme d'autres terres gardent leurs monuments. La moitié des grands sièges de Westeros ne sont plus qu'un nom sur une carte et un tas de pierres, et chacun d'eux a été perdu dans un hiver dont les hommes juraient qu'il serait le dernier.\n\n Personne n'envoie de corbeaux demander si c'est vrai. On en envoie demander combien de temps il reste.\n\n #bold Les Autres sont de retour. Ils ne sont jamais vraiment partis.#!#!"

 ln_others.2.desc.wave_last:0 "#e Il ne reste plus grand-chose à prendre.\n\n Les cartes de la Citadelle sont presque vierges à présent, et les mestres ont cessé de les redessiner. Ce qui subsiste du royaume ne subsiste que parce que les morts ne s'en sont pas encore souciés.\n\n Personne ne demande plus qui était Azor Ahai. On demande s'il a jamais été quelqu'un, et si la prophétie n'a jamais été qu'une histoire que les vivants se racontaient pour pouvoir dormir.\n\n #bold Les Autres sont de retour. Ce sera très probablement la dernière fois que cela aura de l'importance.#!#!"

 # ── The dawn, under the cycle ───────────────────────────────────────────────────────────────────────────────
 ln_others.3.desc.cycle:0 "#BER Les morts reposent immobiles. Le froid se brise. Quelque part au sud du Neck le premier vert perce, et des hommes qui n'ont pas dormi correctement depuis des années dorment enfin.\n\n Ce n'est pas fini. Ce n'a jamais été fini, pas une seule fois.\n\n Les mestres consigneront l'année, comme ils ont consigné la précédente, et quelqu'un, dans un siècle, la lira en songeant que c'était il y a très longtemps. Le royaume a peut-être trois générations pour devenir quelque chose qui sache faire mieux que survivre.\n\n #bold Le printemps est venu. Qu'il serve à quelque chose.#!#!"

 # ── DAWN CARD, BRANCHED ON HOW THE DARK ARRIVED (global_var:ln_invasion_opening) ─────────────────────────────
 ln_others.3.desc.wall:0 "#BER Les morts reposent immobiles. Le froid se brise. Quelque part au sud du Neck le premier vert perce, et des hommes qui n'ont pas dormi correctement depuis des années dorment enfin.\n\nIl y a à Castle Black une brèche de sept cents pieds de profondeur et de cent yards de large, et le vent y passe exactement comme le jour où elle s'est ouverte. Personne n'a la moindre idée de la façon de la refermer. La réponse honnête, que nul ne dira à un roi, c'est que ceux qui l'ont bâti sont morts depuis huit mille ans et n'ont rien écrit.\n\nLe printemps est venu dans un royaume percé d'un trou dans son mur du nord.\n\n#bold C'est fini. Ce n'est pas réparé.#!#!"

 ln_others.3.desc.inside:0 "#BER Les morts reposent immobiles. Le froid se brise. Le premier vert perce, et des hommes qui n'ont pas dormi correctement depuis des années dorment enfin.\n\nPlus personne dans ce royaume ne pourra regarder un inconnu de la même façon. Cela n'est pas passé par-dessus le Mur : c'était déjà là, dans une salle, portant un visage en qui l'on avait confiance, et depuis plus longtemps que nul n'est parvenu à l'établir.\n\nLes mestres aimeraient déterminer combien de temps. Les seigneurs préféreraient qu'ils s'abstiennent, car chacun d'eux refait en silence le compte de sa propre maisonnée et n'aime pas le résultat.\n\n#bold Le printemps est venu. Plus personne ne dormira la porte ouverte.#!#!"

 ln_others.3.desc.exodus:0 "#BER Les morts reposent immobiles. Le froid se brise. Le premier vert perce, et des hommes qui n'ont pas dormi correctement depuis des années dorment enfin.\n\n Le peuple libre est toujours là. Des dizaines de milliers, au sud d'un Mur qu'ils ont franchi en fuyant, dans un royaume qui a passé huit mille ans à bâtir ce Mur précisément pour les tenir dehors — et qui a ensuite passé cette guerre à découvrir qu'ils étaient les seules gens au monde à avoir dit la vérité sur ce qui les suivait.\n\n Personne n'a trouvé ce qui vient ensuite. Il n'existe à la Citadelle aucun précédent pour rien de tout cela.\n\n #bold Le printemps est venu, et il va falloir redessiner la carte.#!#!"

 ln_others.3.desc.ranging:0 "#BER Les morts reposent immobiles. Le froid se brise. Le premier vert perce, et des hommes qui n'ont pas dormi correctement depuis des années dorment enfin.\n\n Cela a commencé par une patrouille qui est revenue de travers, et il y a des hommes encore vivants qui étaient à Castle Black la nuit où la chose est entrée, et aucun d'eux n'a jamais su la décrire d'une manière qui satisfasse ceux qui n'y étaient pas.\n\n La Garde a le registre. Six noms, une date, et quatre mots de la main d'un greffier que le lord Commandant a depuis fait recopier dans chaque fort du Mur, car c'est le seul avertissement qui ait été donné et nul n'en a tenu compte.\n\n #bold Le printemps est venu. La prochaine fois, lisez les registres.#!#!"

 # ── WHAT THE WORLD REMEMBERS OF THE LAST DAWN ───────────────────────────────────────────────────────────────
 # Written against design-backlog-additions.md LN-021: "ship three excellent branches, not ten serviceable
 # ones." [ln_last_dawn_dragon.GetName] resolves generations later because the dragon is locked unpruneable at
 # the moment of the dawn. The champion's name comes back the same way.
 ln_others.2.desc.dragon_lives:0 "#e Ils sont revenus, et [ln_last_dawn_dragon.GetSheHe] aussi.\n\n [ln_last_dawn_dragon.GetName|E] était là la dernière fois. Des vieillards qui n'étaient alors que des garçons décrivent encore l'ombre qui passait, et le bruit que faisaient les morts quand le feu les atteignait — un bruit qui, disent-ils, n'était pas un cri, car crier est l'affaire des vivants.\n\n [ln_last_dawn_dragon.GetSheHe|U] est toujours de ce monde. Plus d'années, moins de vitesse, et la seule créature sous le ciel à l'avoir déjà fait.\n\n #bold Les Autres sont de retour. Le dragon qui y a mis fin aussi.#!#!"
 ln_others.2.desc.dragon_dead:0 "#e Ils sont revenus. [ln_last_dawn_dragon.GetName|E] non.\n\n La dernière Longue Nuit s'est achevée du dos d'un dragon, et tous les récits s'accordent sur la même image : la glace qui noircit sous le feu, et la chose au milieu qui s'arrête enfin. Ce dragon n'est plus que des os, dans une salle, dans un tumulus ou au fond d'une baie, selon le mestre à qui l'on demande.\n\n Il y a encore des dragons dans le monde. Nul vivant ne sait si c'est la même chose.\n\n #bold Les Autres sont de retour, et celui qui les a vaincus la dernière fois ne viendra pas.#!#!"
 ln_others.2.desc.dragon_gone:0 "#e Ils sont revenus. Il n'y a rien dans le ciel.\n\n [ln_last_dawn_dragon.GetName|E] a mis fin à la précédente. Il n'y a plus de [ln_last_dawn_dragon.GetName|E] aujourd'hui, et aucun autre non plus : le monde a laissé partir le dernier comme il laisse partir toute chose, lentement et sans l'avoir décidé.\n\n Les hommes qui livreront celle-ci ont lu des choses sur le feu. Voilà toute leur préparation.\n\n #bold Les Autres sont de retour, et cette fois le ciel est vide.#!#!"
 ln_others.2.desc.champion_lives:0 "#e Ils sont revenus, et qui les a arrêtés la dernière fois vit encore pour l'entendre.\n\n [ln_last_dawn_champion.GetTitledFirstName|E] l'a fait une fois. Le royaume a passé les années qui ont suivi à décider ce que cela valait — un salut, un coup de chance, une histoire qui a échappé à tout le monde — et chacune de ces querelles s'achève aujourd'hui.\n\n [ln_last_dawn_champion.GetSheHe|U] sait une chose que personne d'autre au monde ne sait : ce que cela coûte, et si [ln_last_dawn_champion.GetSheHe] l'a deux fois.\n\n #bold Les Autres sont de retour. [ln_last_dawn_champion.GetSheHe] aussi.#!#!"

 # -- HOW LONG AGO, AND WHETHER THE PROPHECY WORKED -----------------------------------------------------------
 # Trigger-driven, no interpolation: see the note on the desc block in others_events.txt.
 ln_others.2.desc.living_memory:0 "#e Ils sont revenus, et cette fois il y a dans la salle des hommes qui se souviennent de la dernière.\n\n Pas par un livre. Pas par une chanson. Ils étaient des garçons quand les ténèbres se sont rompues, et ils ont passé chaque année depuis à s'entendre demander ce que c'était par des gens incapables de comprendre la réponse — et les voilà les seuls dans la pièce dont les mains ne tremblent pas, parce qu'ils sont aussi les seuls à savoir déjà comment cela finit.\n\n Ils savent une autre chose, qu'aucun d'eux n'a dite : cela n'était pas censé pouvoir se produire deux fois dans une même vie.\n\n #bold Les Autres sont de retour, dans une seule vie d'homme.#!#!"
 ln_others.2.desc.named_true:0 "#e Ils sont revenus, et les prêtres parlent déjà.\n\n La dernière fois, ils avaient raison. C'est ce dont la Citadelle n'a jamais pu discuter à son aise : les temples rouges ont nommé un homme, l'homme est parti vers le nord, et les ténèbres ont pris fin. Quoi que l'on pense de R'hllor, le registre est le registre.\n\n Aussi, quand un prêtre se lèvera cet hiver sur une place de marché et prononcera un nom, personne ne rira. On l'écrira, on trouvera l'homme, et on attendra très vite énormément de lui.\n\n #bold Les Autres sont de retour. La dernière fois, la prophétie était vraie.#!#!"
 ln_others.2.desc.named_false:0 "#e Ils sont revenus, et personne n'écoute les prêtres.\n\n La dernière fois, les temples rouges ont nommé une douzaine d'hommes. Ils ont nommé des princes, des bâtards et une fille à Volantis, et ils étaient certains de chacun d'eux ; et les ténèbres ont été achevées par quelqu'un qu'ils n'avaient jamais cité une seule fois, un homme sans la moindre prophétie sur lui, qui se trouvait simplement là.\n\n Les prêtres ont des explications. Ils ont eu tout le temps de les travailler.\n\n #bold Les Autres sont de retour. La dernière fois, ce ne fut personne que les chansons avaient choisi.#!#!"

 ln_others.3.desc.proof:0 "#BER Les morts reposent immobiles. Le froid se brise. Quelque part au sud du Neck le premier vert perce, et des hommes qui n'ont pas dormi correctement depuis des années dorment enfin.\n\nCe fut la guerre dont nul ne pouvait prétendre qu'elle n'était qu'une rumeur. Elle a commencé dans une salle du trône, avec un cadavre qui refusait de mourir et une cour qui l'a regardé brûler : le royaume a cru dès le premier jour, et cela a bien failli ne pas suffire.\n\nLes mestres consigneront l'année. Le royaume a peut-être trois générations pour devenir quelque chose qui sache faire mieux que croire à temps.\n\nLe printemps est venu. Qu'il serve à quelque chose.#!"
