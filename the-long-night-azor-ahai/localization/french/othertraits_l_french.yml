#Traits and modifiers
 trait_other_trait:0 "Autre"
 trait_other_trait_desc:0 "Les Autres sont grands et décharnés, la chair pâle comme le lait. Ils ont des yeux bleus et froids que l'on a décrits comme brûlant tel de la glace, ou aussi brillants que des étoiles bleues. Les Autres ont un sang bleu pâle et des os luisants comme du verre laiteux"
 trait_other_trait_character_desc:0 "Les Autres sont grands et décharnés, la chair pâle comme le lait. Ils ont des yeux bleus et froids que l'on a décrits comme brûlant tel de la glace, ou aussi brillants que des étoiles bleues. Les Autres ont un sang bleu pâle et des os luisants comme du verre laiteux"
 trait_wight_trait:0 "Spectre"
 trait_wight_trait_desc:0 "Un cadavre relevé par la magie froide des Autres pour servir dans leur armée sans fin. Infatigable et insensible, il ne connaît ni douleur ni peur, les yeux brûlant d'un bleu funeste. Quand les Autres seront enfin vaincus et que la Longue Nuit s'achèvera, le pouvoir obscur qui l'animait faiblira, et il s'effondrera de nouveau en chair sans vie."
 trait_wight_trait_character_desc:0 "Un cadavre relevé par la magie froide des Autres pour servir dans leur armée sans fin. Infatigable et insensible, il ne connaît ni douleur ni peur, les yeux brûlant d'un bleu funeste. Quand les Autres seront enfin vaincus et que la Longue Nuit s'achèvera, le pouvoir obscur qui l'animait faiblira, et il s'effondrera de nouveau en chair sans vie."



