 other_emergency_modifier:0 "Mesures d'urgence"
 other_emergency_modifier_desc:0 "Ce dirigeant est soumis à un état d'urgence."
 other_retaking_modifier:0 "Reconquête pour l'humanité"
 other_retaking_modifier_desc:0 "Ce dirigeant cherche à reprendre du territoire pour l'humanité."
 other_vassal_retaking_modifier:0 "Ce dirigeant combat aux côtés de son suzerain pour reprendre du territoire pour l'humanité."
 other_chill_modifier:0 "Au frais"
 other_noconvert_modifier:0 "Conversion de terres récente"
 other_offensive_modifier:0 "Déferlement"
 other_offensive_modifier_desc:0 "L'armée des morts déferle pour prendre un lieu."
