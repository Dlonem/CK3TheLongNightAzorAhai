l_french:
 # The Long Night+ — AFTERMATH (resettling) localization.

 # The renamed Wall kingdom if the wildling path is taken (set_title_name on k_the_wall).
 ln_giftlands:0 "les Terres du Don"
 ln_giftlands_adj:0 "du Don"

 # --- THE QUESTION OF THE NORTH (ln_aftermath.1) ---
 ln_aftermath.1.t:0 "La question du Nord"
 ln_aftermath.1.desc:0 "La Longue Nuit est terminée. Les morts gisent enfin immobiles, et au-delà du Mur brisé les survivants du peuple libre regardent vers le sud une terre vidée de ses vivants.\n\nLe royaume se tourne vers [ROOT.Char.GetTitledFirstName] pour une réponse qui ne peut attendre : la Garde de Nuit doit-elle se relever pour tenir garnison sur la ruine du Mur et garder les sauvageons dehors — ou le peuple libre doit-il être accueilli au sud, pour peupler les terres mortes en sujets de la Couronne ?\n\nQuelle que soit la route choisie, il n'y aura pas de retour."
 ln_aftermath.1.a:0 "La Garde se relèvera."
 ln_aftermath.1.a.tt:0 "La #bold Garde de Nuit#! est refondée sur la ruine du Mur. Le peuple libre ne sera #bold jamais#! accueilli au sud."
 ln_aftermath.1.b:0 "Que le peuple libre vienne au sud."
 ln_aftermath.1.b.tt:0 "Le peuple libre s'installe sur le Mur et sur les terres qui s'étendent dessous, clan par clan, en vassaux de la Couronne. La #bold Garde de Nuit#! ne se relèvera #bold jamais#!."

 # --- Notification: the free folk pour south (ln_aftermath.3) ---
 ln_aftermath.3.t:0 "Le peuple libre descend au sud"
 ln_aftermath.3.desc:0 "Le Mur est une ruine et aucun manteau noir ne tient ce qu'il en reste. Par la brèche passent les survivants du peuple libre — non plus en pillards cette fois, mais en colons, poussant leurs troupeaux dans le Nord vidé. La Garde de Nuit ne se relèvera jamais."
 ln_aftermath.3.a:0 "Le monde a changé."

 ln_aftermath.4.t:0 "La Garde se relève"
 ln_aftermath.4.desc:0 "Des manteaux noirs se meuvent de nouveau sur le Mur brisé. Là où la Garde de Nuit avait été réduite à des os et du silence, la Couronne l'a relevée — une garnison sur la ruine, jurée de tenir la brèche contre tout ce que le Nord cache encore. De l'autre côté, on dit au peuple libre de rester de son côté d'un mur qui n'est plus là."
 ln_aftermath.4.a:0 "Le monde a changé."

 # --- Player refugee arrival (ln_aftermath.21) ---
 ln_aftermath.21.t:0 "La route du retour"
 ln_aftermath.21.desc:0 "La caravane s'arrête. Devant [ROOT.Char.GetFirstName] s'étend une terre vide — âtres froids, champs en friche, et nulle âme vivante pour les revendiquer. Les colons se tournent vers leur chef : est-ce ici que l'errance s'achève ?"
 ln_aftermath.21.a:0 "C'est ici que nous rebâtissons."
 ln_aftermath.21.a.tt:0 "Colonise ce comté maintenant : il devient tien, dans ta culture et ta foi. Tes colons fondent la nouvelle communauté, et tes jours de réfugié sont terminés."
 ln_aftermath.21.b:0 "Pas encore. Nous poursuivons."

 # --- Player notification: the road ends (ln_aftermath.25) ---
 ln_aftermath.25.t:0 "Plus une terre"
 ln_aftermath.25.desc:0 "Chaque comté qui valait d'être peuplé a été pris par un autre — seigneurs de retour, clans sauvageons, chartes essosiennes. La route du retour ne mène plus nulle part. Le camp demeure, et avec lui la vie d'aventurier errant."
 ln_aftermath.25.a:0 "Qu'il en soit ainsi."

 # --- Sell Colonization Rights to Essos (decision) ---
 ln_sell_colonization_rights_decision_title:0 "Vendre les droits de colonisation à Essos"
 ln_sell_colonization_rights_decision_desc:0 "Les côtes ravagées du Nord sont vides, et les Cités libres ont de l'or et des colons en trop. Accorde la charte de l'un des comtés côtiers morts à un seigneur essosien — de l'or pour la Couronne maintenant, une enclave étrangère sur le sol nordien pour toujours."
 ln_sell_colonization_rights_decision_confirm:0 "Signer la charte"
 ln_sell_colonization_rights_decision_tooltip:0 "Vendre un comté côtier dévasté du Nord à un seigneur des Cités libres."
 ln_sell_colonization_rights_effect_tt:0 "Un #bold comté côtier sauvage#! du Nord pris au hasard est colonisé par un #bold seigneur essosien#! généré (braavien, le plus souvent), lié à toi en vassal. Tes #bold vassaux nordiens#! t'en tiendront rigueur."

 # --- Return North (decision) ---
 ln_return_north_decision_title:0 "Retourner dans le Nord"
 ln_return_north_decision_desc:0 "La Longue Nuit est terminée, et le bruit court au sud que les terres mortes sont vides. Quelque part là-haut se trouve un âtre qui était tien — ou qui pourrait l'être. Rassemble le camp, charge les chariots, et prends la route du retour."
 ln_return_north_decision_confirm:0 "Prendre la route du retour"
 ln_return_north_decision_tooltip:0 "Équiper une caravane de colons et remonter vers le nord pour repeupler ton siège perdu — ou la terre vide la plus proche."
 ln_return_north_effect_tt:0 "Ton camp est équipé pour le retour : #bold matériel de colonisation#!, #bold réserve de vivres pleine#! et #bold or#! pour fonder la nouvelle communauté. La caravane prend la #bold route Royale#! jusqu'à ton #bold ancien siège#! s'il est vide, ou jusqu'au comté libre le plus proche — en se réapprovisionnant en chemin à #bold Port-Réal#!, à l'#bold auberge du Carrefour#! et à #bold Moat Cailin#!, selon ce qu'exige la route. À l'arrivée, des #bold colons#! en nombre proportionné à ton ancien rang se rassemblent sous ta bannière — survivants du Nord accourant vers un seigneur revenu — et tu peux peupler la terre, en devenir le seigneur, et n'être plus un réfugié."

 # --- Modifiers / opinions ---
 ln_restored_ancestral_seat_modifier:0 "Siège ancestral restauré"
 ln_restored_ancestral_seat_modifier_desc:0 "Il a fui devant les morts, survécu à la Longue Nuit, et il est rentré relever le siège ancestral de ses cendres. Les chansons s'en souviendront."
 ln_sold_the_north_opinion:0 "A vendu le sol nordien à des étrangers"

 # ── 1.0.12a: THE WALL HELD ─────────────────────────────────────────────────────
 ln_aftermath.1.desc.watch_held:0 "La Longue Nuit est terminée. Les morts gisent enfin immobiles — et le Mur est toujours là, et il y a toujours des manteaux noirs dessus.\n\nIls sont moins nombreux qu'avant. La moitié des forts sont cendres et les rôles de montre du lord Commandant se lisent comme une liste de pertes, mais ils ont tenu la brèche et ils la tiennent encore, ce qu'aucun roi de Westeros n'a réussi dans les mêmes années.\n\nDe l'autre côté, les survivants du peuple libre attendent, et ils ne pillent pas. Ils demandent. Le royaume se tourne vers [ROOT.Char.GetTitledFirstName] pour une réponse qui ne peut attendre : renforcer la Garde et garder cette porte fermée — ou l'ouvrir, et installer le peuple libre dans un Nord où il ne reste personne pour le cultiver.\n\nQuelle que soit la route choisie, il n'y aura pas de retour."
 ln_aftermath.1.desc.not_the_crown:0 "\n\nLa Couronne t'a laissé le Nord. Quoi que tu décides ici, tu le décides pour elle."
 ln_aftermath.1.desc.the_crown:0 ""
 ln_aftermath.1.a.held:0 "La Garde a tenu. Renforcez-la, et gardez la porte fermée."

