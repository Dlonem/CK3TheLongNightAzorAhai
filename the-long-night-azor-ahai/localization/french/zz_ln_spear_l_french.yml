l_french:

 # AGOT: The Long Night & Azor Ahai -- the spear.
 # TOKEN FORM: bare saved-scope names, the form the rest of this mod uses and the one proven live.
 # A dragon is an ordinary character in AGOT, so the person promotes work on it normally.

 ln_spear.1.t:0 "Arraché au ciel"

 ln_spear.1.desc.lived_champion:0 "La bataille est jouée. D'ici là-haut je ne peux pas dire de quel côté elle est tombée, et pour un instant cela m'importe peu.\n\nPuis [ln_spear_dragon.GetFirstName] s'incline pour un nouveau passage, et en bas, sur la glace, quelque chose lève le bras.\n\nJe ne vois jamais la lance. Ce que je vois, c'est l'aile gauche de [ln_spear_dragon.GetFirstName] cesser de fonctionner—elle bat, puis elle n'est simplement plus là—et j'entends sortir de [ln_spear_dragon.GetHerHim] un son que j'entendrai pour le reste de mes jours.\n\nNous tombons ensemble. Je me souviens que le sol arrivait très vite et qu'il était très blanc, et je me souviens d'avoir pensé, avec une clarté qui m'effraie plus que la chute, que ce n'est pas ainsi que cela finit.\n\nJe suis brisé en un très grand nombre d'endroits et je suis debout avant la fin de l'heure, et les hommes qui m'ont tiré de l'épave de [ln_spear_dragon.GetHerHim] ne me regardent pas en face. L'un d'eux s'est mis à prier dans une langue que je ne possède pas. Quoi que le dieu rouge attende de moi, il est clair qu'il n'a pas fini de demander.\n\n#bold Il se tient sur la glace à un mille de là et il me regarde en retour, et je ne crois pas que l'un ou l'autre de nous soit surpris.#!"

 ln_spear.1.desc.lived:0 "La bataille est jouée. D'ici là-haut je ne peux pas dire de quel côté elle est tombée, et pour un instant cela m'importe peu.\n\nPuis [ln_spear_dragon.GetFirstName] s'incline pour un nouveau passage, et en bas, sur la glace, quelque chose lève le bras.\n\nJe ne vois jamais la lance. Je ne crois pas que quiconque voie la lance. Ce que je vois, c'est l'aile gauche de [ln_spear_dragon.GetFirstName] cesser de fonctionner—elle bat, puis elle n'est simplement plus là—et j'entends sortir de [ln_spear_dragon.GetHerHim] un son que j'entendrai pour le reste de mes jours.\n\nNous tombons ensemble. Je me souviens que le sol arrivait très vite et qu'il était très blanc. Je ne me souviens pas de l'impact.\n\nIl y a maintenant des hommes penchés au-dessus de moi, qui crient quelque chose dont je n'entends rien. Mon flanc gauche ne répond pas quand je le lui demande, et il y a énormément de sang dont je suis assez sûr qu'il est le mien. [ln_spear_dragon.GetFirstName] est à deux cents verges de là, de la vapeur montant de [ln_spear_dragon.GetHerHis] mufle, et rien d'autre chez [ln_spear_dragon.GetHerHim] ne bouge.\n\n#bold Ils n'ont jamais pu nous atteindre là-haut. C'était tout. C'était la seule chose que nous avions.#!"

 ln_spear.1.desc.died:0 "La bataille est jouée. D'ici là-haut je ne peux pas dire de quel côté elle est tombée, et pour un instant cela m'importe peu.\n\nPuis [ln_spear_dragon.GetFirstName] s'incline pour un nouveau passage, et en bas, sur la glace, quelque chose lève le bras.\n\nJe ne vois jamais la lance. Ce que je vois, c'est l'aile gauche de [ln_spear_dragon.GetFirstName] cesser de fonctionner—elle bat, puis elle n'est simplement plus là—et l'horizon bascule vers un endroit où les horizons ne vont pas.\n\nNous tombons ensemble. Il y a un moment qui dure plus longtemps qu'il n'en a le droit, où le sol est encore très loin et où il n'y a absolument rien à quoi se retenir, et j'ai le temps de penser une pensée claire.\n\n#bold Ils n'ont jamais pu nous atteindre là-haut.#!"

 ln_spear.1.a:0 "Relevez-moi. Je veux voir ce qu'il a fait à [ln_spear_dragon.GetFirstName]."
 ln_spear.1.a.champion:0 "Relevez-moi. Il a vu mon visage à présent, et je veux qu'il m'ait vu debout."
 ln_spear.1.b:0 "Voilà donc comment cela se passe."

 # ── THE TAKEN DRAGON'S RECORD (1.0.12b) ─────────────────────────────────────────
 ln_dragon_taken_memory:0 "pris par la lance du Roi de la Nuit"
 ln_dragon_taken_memory_desc:0 "Abattu du ciel par la lance du Roi de la Nuit, et relevé avant que le corps ne soit froid. Les ailes volent encore. Rien derrière les yeux n'est ce que c'était."
 ln_dragon_taken_memory_desc_second_perspective:0 "Votre dragon a été abattu du ciel par la lance du Roi de la Nuit, et relevé avant que le corps ne soit froid. Il vole encore. Il n'est pas à vous, et il n'est pas lui."
 ln_dragon_taken_memory_desc_third_perspective:0 "Ce dragon a été abattu du ciel par la lance du Roi de la Nuit, et relevé avant que le corps ne soit froid. Il vole désormais pour les morts."

 # ── THE EMPTY SKY (1.0.12b) ─────────────────────────────────────────────────────
 ln_spear.2.t:0 "Le ciel vide"
 ln_spear.2.desc:0 "Les attelles quitteront mon bras dans un mois, me dit-on. Personne ne me dit ce qui quittera le reste.\n\nJe continue de faire cette chose où je tends l'oreille pour [ln_spear_dragon.GetHerHim]. Dix ans à savoir où [ln_spear_dragon.GetSheHe] se trouvait comme on sait où est sa propre main, et ce savoir est toujours là — il a seulement pris la mauvaise couleur. [ln_spear_dragon.GetSheHe|U] est au nord de moi. [ln_spear_dragon.GetSheHe|U] est toujours au nord de moi désormais.\n\nUn berger est arrivé hier en jurant qu'il avait vu [ln_spear_dragon.GetFirstName] au-dessus de la crête, et la salle s'est tue, parce que tout le monde sait à qui [ln_spear_dragon.GetSheHe] appartenait. Pâle, a-t-il dit. Comme du givre avec des ailes. Toujours [ln_spear_dragon.GetHerHim]. C'est la part que mon esprit n'arrive pas à tenir : c'est toujours [ln_spear_dragon.GetHerHis] profil, toujours [ln_spear_dragon.GetHerHis] battement d'ailes, toujours la manière dont [ln_spear_dragon.GetSheHe] s'incline à gauche avant que [ln_spear_dragon.GetSheHe] ne se pose.\n\nC'est seulement que [ln_spear_dragon.GetSheHe] ne se posera pas pour moi."
 ln_spear.2.desc.gone:0 "On me dit que [ln_spear_dragon.GetFirstName] est mort — vraiment mort cette fois, abattu quelque part au nord du Mur, et cette fois rien ne s'est relevé.\n\nJe croyais que ce serait pire que la première fois. Ce ne l'est pas. La première fois, les morts ont pris [ln_spear_dragon.GetHerHis] profil et l'ont fait voler comme un manteau volé, et chaque rapport d'ailes pâles au-dessus des arbres était un croc planté en moi.\n\nMaintenant le ciel est seulement vide. Un cavalier peut pleurer un ciel vide."
 ln_spear.2.a:0 "[ln_spear_dragon.GetSheHe|U] est à moi. Je reprendrai [ln_spear_dragon.GetHerHim], ou j'abattrai [ln_spear_dragon.GetHerHim] moi-même."
 ln_spear.2.b:0 "Laissez-moi rester seul avec cela. [ln_spear_dragon.GetSheHe|U] a bien mérité cela."
 ln_spear.2.c:0 "Le feu a pris [ln_spear_dragon.GetHerHim] et m'a laissé. Le feu n'a pas fini avec moi."

