 ln_lightbringer_lesser_modifier:0 "Illumination"
 ln_would_not_pay_the_price_modifier:0 "N'a pas voulu payer le prix"
 ln_the_forge_is_cold_modifier:0 "La forge est froide"
 ln_hole_in_his_chest_modifier:0 "Un trou qui ne se ferme pas"