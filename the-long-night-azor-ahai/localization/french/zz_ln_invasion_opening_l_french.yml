l_french:

 # ══════════════════════════════════════════════════════════════════════════════════════════════════
 # THE LONG NIGHT -- opening cards. 
 # ══════════════════════════════════════════════════════════════════════════════════════════════════

 # ── THE WARNING -- Winter Is Coming (fires from ln_struggle_cold_winds_reached_effect) 
 ln_opening.6.t:0 "#e L'Hiver Est Là#!"
 ln_opening.6.desc:0 "#e Ce n'est pas un seul événement. C'est ce qui rend la chose si difficile à contester.\n\nLes corbeaux du Nord parlent de patrouilles qui ont cessé de revenir — ni perdues, ni en retard, mais entièrement disparues. Les sauvageons se pressent contre le Mur en nombres qu'aucune saison de pillage ne saurait expliquer, et les mestres ont commencé à débattre à voix basse du temps qu'il reste.\n\nIl y a encore l'été dans le sud lointain. Il y a encore le temps d'en faire quelque chose.\n\n#bold Ce que le royaume bâtit maintenant est ce que le royaume aura.#!#!"
 ln_opening.6.desc.watch:0 "#e Je n'ai pas besoin des mestres pour me le dire. J'ai les registres.\n\nTrois patrouilles sont parties depuis le dégel. Une est revenue, et il lui manquait les six hommes envoyés en avant pour éclairer la route. Les sauvageons ont cessé de piller le Mur et se sont mis à mendier à son pied. Tout frère qui a passé sa vie à les combattre connaît l'effroi au creux du ventre lorsqu'il les voit fuir.\n\nDix-neuf forts furent bâtis pour cette heure. Nous pouvons à peine en tenir trois.\n\n#bold Huit mille ans de serments ont été écrits pour ce qui vient. Nous sommes ce qui reste de la Garde, et la Garde est ce qui reste de l'avertissement.#!#!"
 ln_opening.6.desc.free_folk:0 "#e Les agenouillés au sud du Mur se demandent encore si c'est réel. Nous avons cessé de nous le demander depuis longtemps.\n\nCe n'est pas devant nous, là où une chose peut être combattue. C'est derrière nous, là où une chose ne peut qu'être fuie. Les Thenn bougent. Les Hornfoot bougent. Des clans qui ont versé le sang l'un de l'autre pendant des siècles marchent exactement dans la même direction, et personne n'a eu à leur dire où aller.\n\nLes vieux chants disent que le Mur fut dressé pour garder quelque chose dehors. Nos ancêtres sont restés du mauvais côté.\n\n#bold L'hiver ne vient pas pour le sud d'abord.#!#!"
 ln_opening.6.desc.north:0 "#e Tout enfant du Nord entend les récits de la Longue Nuit. Les Autres viennent, le froid vient avec eux, et les ténèbres durent une génération. Tout seigneur du Nord a souri devant l'exagération des nourrices.\n\nOn ne sourit plus. Les patrouilles ne reviennent pas. Les sauvageons fuient, terrifiés, et les mestres ont commencé à compter tout bas ce que contiennent les greniers face au nombre d'années qu'il leur faudra peut-être tenir.\n\nLe Nord se souvient. C'est toujours la partie de la devise de notre maison que personne n'achevait : c'est de CELA que nous devons nous souvenir.\n\n#bold Il y a encore l'été dans le sud. Nous devons le dépenser en hommes du Nord.#!#!"
 ln_opening.6.desc.dragon:0 "#e Le sang de la Vieille Valyria porte des prophéties comme d'autres maisons portent des épées qu'elles ont oublié de tirer.\n\nLe rêve qui chassa Aenar de Valyria ; la chanson de la glace et du feu ; le prince qui fut promis. Pendant des siècles, ce fut un héritage de famille : cérémoniel, parfois gênant, mais conservé.\n\nVoici que nous apprenons que des patrouilles ont disparu, que les sauvageons fuient quelque chose qu'ils refusent de nommer, et que les vieux rêves se mettent à arriver à l'heure dite.\n\n#bold Le sang du dragon fut mis au monde pour une seule heure. Il commence à sembler que cette heure est venue.#!#!"
 ln_opening.6.desc.red:0 "#e Nous avons prêché le retour du Grand Autre dans des salles qui riaient de nous. Les salles ont cessé de rire.\n\nLes flammes montrent la même vision depuis un an : un mur de glace, et quelque chose de patient qui attend dans le noir glacé. Voici que les corbeaux du Nord confirment à l'encre ce que le Maître de la Lumière dit dans le feu depuis le début.\n\nC'est la guerre pour laquelle notre foi existe. Chaque sermon, chaque feu nocturne préparait exactement cela — et quelque part dans le monde, le Maître de la Lumière choisit une main pour tenir l'épée.\n\n#bold La vraie nuit est à notre porte. C'est ce que nous leur avons promis depuis toujours.#!#!"
 ln_opening.6.desc.lord:0 "#e Mon mestre m'apporte des rapports transmis par la Citadelle. Ils sont profondément troublants.\n\nTout est enseveli sous une langue sèche parlant de patrouilles disparues de la Garde de Nuit et de migrations inhabituelles de sauvageons, mais les implications sont claires. Les rivières du Nord gèlent plus vite qu'elles ne devraient, et la Citadelle accumule discrètement du grain.\n\nLa plupart des seigneurs appelleront cela un hiver rude. Mais un hiver rude ne terrifie pas les mestres jusqu'au silence.\n\n#bold Je ne sais pas ce qui se passe dans le Nord profond, mais cela descend vers le sud.#!#!"
 ln_opening.6.desc.nobody:0 "#e L'air porte une morsure plus froide, contre nature, que je n'ai jamais sentie.\n\nLes barbes grises des camps et des tavernes parlent de mauvaises années et de gelées dures, mais cela paraît différent. Les voyageurs rapportent d'étranges rumeurs du Nord : des frères noirs disparus, des sauvageons qui abandonnent leurs terres, et un froid qui tue un homme dans son sommeil. Personne ne veut le dire à voix haute, mais les étés que nous connaissions sont finis.\n\n#bold Quelque chose de terrible chevauche les vents du nord.#!#!"
 ln_opening.6.desc.dance:0 "#e Le royaume a passé une génération à se disputer une chaise.\n\nIl y a des prétendants rivaux, des cours rivales, et l'on a demandé à chaque seigneur de quel côté il sauterait. La moitié des lettres de mon cabinet traitent de la succession. Celle du Mur est au fond de la pile, non lue, car le Mur n'a jamais compté pour savoir qui siège sur le trône.\n\nMais c'est un rapport de patrouille. Trois envoyées au nord, aucune revenue, et une ligne désespérée à la fin que le mestre a soulignée deux fois. Il y a en ce moment plus de dragons dans le ciel du royaume qu'à aucun moment depuis l'incendie de Valyria, et pourtant nous sommes occupés à nous battre entre nous.\n\n#bold Les ténèbres se moquent de savoir lequel de nous devait régner.#!#!"
 ln_opening.6.desc.dragons:0 "#e Le Nord annonce que les patrouilles ont cessé de revenir — et pour une fois, le royaume croit détenir la réponse.\n\nIl y a des dragons au-dessus du Blackwater. Les enfants les montrent du doigt comme d'autres siècles montraient les nuages. Quoi qu'il y ait derrière le Mur, la chose a choisi le seul âge en huit mille ans où les vivants peuvent mettre du feu dans le ciel par douzaines.\n\nLes mestres conseillent que les vieux récits effraient moins quand on a le feu fait chair. Mais les mestres n'ont jamais vu une chose capable d'arracher un dragon au ciel.\n\n#bold Il y a encore l'été dans le sud, et le ciel est plein de feu. Nous devons dépenser les deux.#!#!"
 ln_opening.6.desc.close:0 "\n\n#EMP Personne ne peut te dire combien de temps cela durera — ni les mestres, ni les prêtres, ni le plus vieil homme de ta salle.#! Ce qui est certain, c'est que cet hiver n'est pas comme les autres."
 ln_opening.6.a:0 "Alors préparons-nous au froid. Le temps presse."
 ln_opening.6.b:0 "Que le Nord gèle. Nous avons nos propres problèmes."
 ln_opening.6.c:0 "Il y a encore l'été dans le sud."

 # ── 1. THE SUN FORGETS TO RISE ───────────────
 ln_opening.1.t:0 "#e Le Soleil Oublie de Se Lever#!"
 ln_opening.1.desc:0 "#e Trois jours ont passé, et l'aube n'est jamais venue.\n\nLe ciel est un noir implacable et suffocant, entièrement dépourvu d'étoiles. Ce n'est pas une tempête ; c'est une ombre physique qui a englouti le monde. L'air sent la poussière ancienne et la glace brisée, et porte un froid si profond que les pins géants éclatent sous leur sève gelée.\n\nDes cavaliers terrifiés crèvent leurs chevaux pour apporter l'avertissement d'une marée de morts qui marchent dans le noir absolu. La Longue Nuit n'est plus un mythe.\n\n#bold Les Autres sont revenus. La Longue Nuit a commencé.#!#!"
 ln_opening.1.desc.watch:0 "#e Je me tiens au sommet du Mur, tourné vers le nord, et il n'y a pas d'horizon. Rien qu'une obscurité absolue, contre nature.\n\nLe soleil ne s'est pas levé depuis des jours. Le vent ne porte pas de neige, seulement un froid surnaturel qui fend la pierre et gèle les frères à leurs postes. On nous avait prévenus que le véritable ennemi amène la tempête, mais ceci est pire. Ils amènent la nuit elle-même.\n\n#bold La Longue Nuit est sur nous. Le bouclier des hommes est tout ce qui reste.#!#!"
 ln_opening.1.desc.free_folk:0 "#e Nous levons les yeux au ciel, et il n'y a que du noir. Le vrai froid est là.\n\nLe soleil ne se lève plus. Les anciens se sont tout à fait tus, et les jeunes comprennent enfin pourquoi nous fuyons. Il ne reste nulle part où se cacher dans le noir.\n\n#bold La Longue Nuit a commencé. Les morts arrivent.#!#!"
 ln_opening.1.desc.north:0 "#e Les feux des âtres peinent à percer la pénombre. Midi ressemble exactement à minuit.\n\nLe ciel au-dessus du Nord est devenu tout noir. Un froid s'est installé qui tue un homme dans son propre lit si son feu faiblit. La Longue Nuit n'est plus une histoire faite pour effrayer les enfants. Elle se dresse juste devant nos portes.\n\n#bold Les Autres sont revenus. Le Nord doit être le bouclier de nouveau.#!#!"
 ln_opening.1.desc.dragon:0 "#e Les parchemins valyriens parlaient d'une obscurité qui balaierait le monde. Je regarde le ciel noir, et je comprends que le fléau n'est pas mort à l'est.\n\nIl fait nuit depuis des jours. Un froid magique s'est posé sur le royaume, qu'aucun feu ordinaire ne peut chasser. L'heure si longtemps promise de la glace et du feu est littéralement sur nous.\n\n#bold La Longue Nuit a commencé. Il est temps de réveiller le dragon.#!#!"
 ln_opening.1.desc.red:0 "#e Le Grand Autre a jeté son ombre physique sur le monde. La nuit littérale qui ne finit jamais est là.\n\nNos prêtres ont crié la prophétie d'Azor Ahai dans les rues pendant des siècles, et voici que le soleil disparu prouve la vérité des avertissements du Maître de la Lumière. La nuit est sombre et pleine de terreurs.\n\n#bold L'ennemi de la lumière est revenu. Seul le feu peut repousser ces ténèbres.#!#!"
 ln_opening.1.desc.lord:0 "#e Même aussi loin au sud, midi est aussi noir que minuit.\n\nLes rivières gèlent jusqu'au fond en une nuit, et les récoltes tournent à la pourriture noire dans les champs. Les mestres n'ont aucune explication pour un ciel sans soleil, ni pour un froid aussi contre nature. Les mythes terrifiants du Nord paraissent soudain très réels.\n\n#bold La Longue Nuit a commencé. Le royaume est complètement aveugle.#!#!"
 ln_opening.1.desc.nobody:0 "#e Il n'y a pas eu de lever de soleil depuis près d'une semaine. Les rivières se changent en glace massive.\n\nLes gens se serrent autour du moindre feu qu'ils peuvent faire, terrifiés par le vent glacé et le ciel d'encre. Personne ne sait ce qui se passe, seulement que le monde paraît entièrement brisé.\n\n#bold La Longue Nuit est venue. Je prie pour que nous y survivions.#!#!"
 ln_opening.1.a:0 "Faites de grands feux. Nous attendrons dans le noir."
 ln_opening.1.b:0 "Gardez votre acier à portée. La vraie guerre commence."

 # ── 2. A RANGING RETURNED ───────────────────────────────────────────────────────
 ln_opening.2.t:0 "#e Une Patrouille Est Revenue#!"
 ln_opening.2.desc:0 "#e L'histoire effroyable se répand depuis le Nord. Une immense patrouille est partie dans les bois profonds, mais onze hommes seulement sont revenus.\n\nIls sont rentrés tout à fait muets, à demi fous de gelures. Ils ne sont pas tombés devant des sauvageons. Ils rapportent une embuscade dans le noir glacé, où ils furent forcés de voir leurs propres frères tombés ouvrir des yeux d'un bleu perçant et se relever de la neige pour les massacrer.\n\nLe mythe est réel, et il fait une arme de nos propres morts.\n\n#bold Les Autres sont revenus, et la Longue Nuit a commencé.#!#!"
 ln_opening.2.desc.watch:0 "#e Nous avons envoyé nos meilleurs hommes au fond des bois hantés. Onze seulement se sont traînés jusqu'aux portes.\n\nIls étaient à demi fous de terreur, pleurant en confessant au lord Commandant ce qu'ils avaient vu. On les a pris en embuscade dans le noir glacé, et ils ont dû abattre leurs propres frères — des frères qui venaient de mourir, pour se relever de la neige, les yeux d'un bleu pâle, et égorger les vivants.\n\nLe Mur tient encore, mais nous savons enfin exactement ce qui nous attend.\n\n#bold Les Autres sont revenus. La Longue Nuit est là.#!#!"
 ln_opening.2.desc.free_folk:0 "#e Nous avons vu quarante corbeaux s'enfoncer dans les bois. Onze seulement en sont ressortis en boitant. Nous les avons comptés à l'aller et au retour.\n\nLes morts se moquent des manteaux noirs. Les agenouillés apprennent enfin l'affreuse vérité de ce qui se passe dans la neige.\n\n#bold Les Autres sont revenus. Il n'y a pas de sûreté derrière leur glace.#!#!"
 ln_opening.2.desc.north:0 "#e Le corbeau de Castle Black est effroyablement bref. Les mestres brodent sur les rumeurs ; personne ne brode sur un massacre.\n\nUne grande patrouille a été massacrée au-delà du Mur. La Garde rapporte que les morts ne sont pas restés morts, qu'ils se sont relevés de la neige pour combattre les vivants. Chaque seigneur du Nord a envoyé des fils à ce Mur. Certains des hommes qui sont tombés et se sont relevés sont des hommes que je connais.\n\n#bold La Longue Nuit a commencé. Elle commence sous un visage familier.#!#!"
 ln_opening.2.desc.dragon:0 "#e On rapporte qu'une immense patrouille a été massacrée au-delà du Mur, les survivants affirmant que les morts se sont relevés de la neige pour les égorger.\n\nCertains seigneurs appelleront cela un tour du froid, mais mes ancêtres ont conquis ce continent pour l'unir contre exactement cette magie ancienne. \n\n#bold La Longue Nuit est là. Nous devons opposer le feu à leur glace.#!#!"
 ln_opening.2.desc.red:0 "#e Mes prêtres répandent l'effroyable nouvelle venue du Nord. La vraie guerre a officiellement commencé.\n\nUne patrouille a été massacrée dans les bois profonds, et les survivants rapportent que les tués se sont relevés en serviteurs des ténèbres. Le Maître de la Lumière nous ordonne de brûler la pourriture avant qu'elle ne gagne le reste du monde.\n\n#bold La Longue Nuit a commencé. Le feu est la seule réponse.#!#!"
 ln_opening.2.desc.lord:0 "#e La Citadelle a transmis un rapport formel et glaçant du lord Commandant de la Garde de Nuit.\n\nUne grande patrouille a été décimée au fond des bois hantés. Les survivants ont juré sur leur vie qu'ils avaient été pris en embuscade dans le noir, et que leurs frères tombés s'étaient relevés de la neige, les yeux d'un bleu contre nature, pour les attaquer. La plupart des seigneurs écarteraient cela comme de la folie ou une traîtrise de sauvageons, mais la Citadelle ne transmet pas des divagations sans raison.\n\n#bold Si les morts marchent vraiment, qu'est-ce qui protège le sud ?#!#!"
 ln_opening.2.desc.nobody:0 "#e J'entends dans les tavernes des murmures terrifiés : une immense patrouille a été taillée en pièces dans le Nord profond.\n\nOn dit que les frères noirs n'ont pas combattu des sauvageons, mais des cadavres relevés de la neige pour les tuer. Même sans terres ni titres, je connais l'odeur d'un royaume condamné.\n\n#bold La Longue Nuit a commencé. Nulle part n'est sûr.#!#!"
 ln_opening.2.a:0 "Si les morts marchent, il faut les brûler."
 ln_opening.2.b:0 "Ne faites confiance à personne. Surveillez les ombres de près."

 # ── 3. THE HORROR BEYOND THE WALL (Hardhome) ──────────────────────────────────────────────────
 ln_opening.3.t:0 "#e L'Horreur au-delà du Mur#!"
 ln_opening.3.desc:0 "#e Les corbeaux et les rumeurs portent la même histoire impossible. Les sauvageons sont arrivés au Mur comme un fleuve frappe un barrage qui cède.\n\nIls ne viennent pas piller. Ils supplient qu'on leur ouvre une porte qu'ils ont passé des siècles à vouloir briser. Ils parlent d'un massacre sur une péninsule nommée Durlieu, où ils furent acculés contre la mer glacée sans nulle part où fuir. Les morts les ont massacrés sur les plages, et les tués ont ouvert des yeux d'un bleu perçant.\n\nLa dispute sur l'opportunité de les laisser entrer s'est achevée quand la chose qu'ils fuyaient est arrivée derrière eux.\n\n#bold Les Autres sont revenus, et la Longue Nuit a commencé.#!#!"
 ln_opening.3.desc.watch:0 "#e Je regarde du haut du Mur des milliers de sauvageons qui mendient à nos portes. Ils sont entièrement brisés.\n\nDes hommes que j'ai combattus moi-même ont le blanc de l'œil de la peur. Ils parlent d'avoir été acculés sur une péninsule gelée, à Durlieu, pris entre une immense horde de morts et la mer glacée. Les tués se sont relevés pour massacrer les vivants sur les plages.\n\nNotre serment dit que nous sommes le bouclier qui protège les royaumes des hommes. Il ne précise pas quels hommes.\n\n#bold Les morts prennent tout le monde. Ce soir, la Garde décide ce que nos mots veulent vraiment dire.#!#!"
 ln_opening.3.desc.free_folk:0 "#e Durlieu est un cimetière. Nous pensions pouvoir nous y rassembler, trouver des navires, trouver n'importe quoi. Au lieu de cela, nous avons été acculés sur la péninsule, sans nulle part où fuir.\n\nTon peuple, tes rivaux, des clans contre qui ton grand-père a mené une vendetta — massacrés ensemble contre la mer glacée. Nous voici maintenant au Mur, à mendier la pitié des agenouillés, car nous avons enfin rencontré la seule chose pire que s'agenouiller.\n\n#bold Les morts prennent tout le monde. Cela fait de tout le monde les tiens.#!#!"
 ln_opening.3.desc.north:0 "#e Le nombre de sauvageons qui mendient au Mur est sans précédent. Ils parlent d'avoir été acculés et massacrés contre la mer en un lieu nommé Durlieu.\n\nLes sauvageons ne fuient pas devant des hommes. Chaque seigneur du Nord fait désormais le même calcul sordide : chaque sauvageon qu'on renvoie geler n'est qu'une lance de plus qui redescendra le kingsroad avec des yeux bleus.\n\n#bold Les Autres sont revenus. Toute âme au nord de nous est soit une lance vivante, soit un spectre.#!#!"
 ln_opening.3.desc.dragon:0 "#e Des murmures me parviennent : des milliers de sauvageons descendent vers le sud, fuyant un massacre sur la côte de Durlieu. Personne au sang du dragon ne les a jamais entendus fuir ainsi.\n\nIls parlent d'avoir été pris au piège contre la mer par un ennemi qui ne se fatigue pas et avec qui l'on ne peut pas raisonner. La pensée est terrifiante.\n\n#bold Les Autres sont revenus. Nous verrons s'ils brûlent.#!#!"
 ln_opening.3.desc.red:0 "#e Les sauvageons courent vers le sud, fuyant une tuerie effroyable où ils furent acculés contre la mer à Durlieu. L'armée du Grand Autre grossit de chaque âme tombée.\n\nIls courent vers un royaume qui les méprise, en mendiant le salut. Mes prêtres appellent cela la conversion ultime.\n\n#bold Les morts prennent tout le monde. Nous devons rassembler les vivants.#!#!"
 ln_opening.3.desc.lord:0 "#e Les corbeaux du Nord rapportent une crise sans précédent au Mur. Des milliers de réfugiés sauvageons supplient qu'on leur ouvre les portes.\n\nLes rapports les disent terrifiés, affirmant qu'ils ont été acculés sur une péninsule gelée nommée Durlieu et massacrés contre la mer glacée. La plus grande part du royaume ignorera des sauvageons qui meurent au-delà du Mur, mais c'est la panique pure qui se répand sur le continent qui m'inquiète.\n\n#bold Quelque chose de terrible s'est éveillé dans le nord profond.#!#!"
 ln_opening.3.desc.nobody:0 "#e J'entends des histoires folles de marchands et de septons errants. On dit que des milliers de sauvageons mendient au Mur, fuyant une tuerie effroyable au fin fond du nord gelé.\n\nLes gens n'abandonnent pas leurs maisons et ne marchent pas si loin pour une histoire de fantômes. Si les sauvageons sont assez terrifiés pour mendier la pitié des agenouillés, nous sommes tous condamnés.\n\n#bold La Longue Nuit a commencé.#!#!"
 ln_opening.3.a:0 "Chaque âme sauvée est un soldat de moins pour les morts."
 ln_opening.3.b:0 "Nous ne pouvons sauver que nous-mêmes."

 # ── 4. THE TRUE ENEMY REVEALED (Deep Beyond the Wall) ───────────────
 ln_opening.4.t:0 "#e Le Véritable Ennemi Révélé#!"
 ln_opening.4.desc:0 "#e Un corbeau général et frénétique arrive du mestre de Castle Black, portant un avertissement qui résonnera mille ans.\n\nUne grande patrouille fut envoyée au fond des landes glacées des Frostfangs pour découvrir ce qui poussait les sauvageons vers le sud. Ce qu'ils ont trouvé, c'est une tuerie. Une armée de morts, s'étendant aussi loin que porte le regard, marchant à travers les bois hantés dans un silence total.\n\nLe mythe a été trouvé, tapi dans le nord profond, et il sait maintenant que nous le regardons.\n\n#bold Les Autres sont revenus. La Longue Nuit a commencé.#!#!"
 ln_opening.4.desc.watch:0 "#e Nous avons envoyé nos meilleurs hommes au fond des Frostfangs. Il nous fallait savoir ce qui poussait les sauvageons vers le sud.\n\nUne poignée de cavaliers seulement est revenue au Mur. Ils étaient à demi fous de gelures et de terreur, bredouillant à propos d'un océan de cadavres marchant dans les bois profonds. Cent mille morts, parfaitement immobiles, avançant comme un seul.\n\nNous avons envoyé des corbeaux à chaque coin du royaume, les suppliant de comprendre l'ampleur de ce qui vient.\n\n#bold L'armée des morts est en marche. Le bouclier des hommes doit tenir.#!#!"
 ln_opening.4.desc.free_folk:0 "#e Les corbeaux se sont enfin enfoncés assez loin dans les bois pour voir ce que nous fuyons.\n\nLeur grande patrouille a été avalée par le froid dans les Frostfangs. Les agenouillés ont enfin vu la taille de la horde, et ils savent maintenant que leur mur de glace ne suffira pas.\n\n#bold Les morts sont en marche. Personne n'est à l'abri.#!#!"
 ln_opening.4.desc.north:0 "#e Un corbeau au sceau noir arrive du Mur. La grande patrouille de la Garde a été massacrée au fond des Frostfangs.\n\nLes survivants affirment avoir vu une armée de spectres se comptant par centaines de milliers, marchant vers le sud à travers les bois hantés. Le cauchemar auquel nous nous préparons depuis les origines de notre maison ne dort plus.\n\n#bold Les Autres sont revenus. Convoquez les bannières.#!#!"
 ln_opening.4.desc.dragon:0 "#e Le Nord annonce qu'une grande patrouille de frères noirs a découvert une armée colossale de cadavres en marche au fond des Frostfangs.\n\nIls affirment qu'ils sont des centaines de milliers, un cauchemar fait chair avançant lentement dans la neige. L'heure de la glace et du feu est enfin venue.\n\n#bold Le Grand Autre a révélé son armée. Il est temps de faire pleuvoir le feu sur eux.#!#!"
 ln_opening.4.desc.red:0 "#e L'Ennemi de la Lumière a révélé son armée. Un corbeau terrifié confirme qu'une patrouille loin au-delà du Mur a découvert un océan de morts.\n\nNos prophéties parlaient de cet instant précis. Les ténèbres se rassemblent au bord du monde, prêtes à éteindre les vivants.\n\n#bold La Longue Nuit a commencé. Nous devons trouver le prince qui fut promis.#!#!"
 ln_opening.4.desc.lord:0 "#e La Citadelle transmet une missive affolée venue du Mur. Une patrouille envoyée au fond du nord inexploré a été presque entièrement anéantie.\n\nLes survivants affirment avoir vu une armée de cent mille cadavres marchant dans la neige. Mon mestre tremble en la lisant. Si même une fraction de ce rapport est vraie, le royaume affronte son extinction.\n\n#bold Les mythes sont réels, et ils marchent vers le sud.#!#!"
 ln_opening.4.desc.nobody:0 "#e Le royaume est saisi par une rumeur terrifiante. On dit que les frères noirs se sont enfoncés dans les bois hantés et ont réveillé quelque chose d'ancien.\n\nDes voyageurs pleurent dans les tavernes, affirmant qu'une patrouille a trouvé cent mille cadavres marchant dans la neige profonde. \n\n#bold La Longue Nuit a commencé. Que les dieux nous viennent en aide à tous.#!#!"
 ln_opening.4.a:0 "Que les dieux aient pitié de nous."
 ln_opening.4.b:0 "L'acier et le feu. C'est la seule voie."

 # ── 5. A DEAD MAN IN THE CAPITAL ──────────────────────────────────────────────────────────────
 ln_opening.5.t:0 "#e Un Mort dans la Capitale#!"
 ln_opening.5.desc:0 "#e L'histoire te parvient comme les vraies le font toujours : non pas en chanson, mais en murmure terrifié qui se répand à travers le royaume. \n\nUn frère de la Garde de Nuit est entré dans la salle du Trône de Fer lui-même avec un mort au bout d'une chaîne, et a demandé à la couronne la permission de l'exécuter. Le travail du bourreau n'a rien fait. Le feu, finalement, si.\n\nPlusieurs centaines des meilleurs du royaume ont vu un cadavre refuser l'épée. Ce matin, on ne rit plus du Nord. On ne rit plus nulle part.\n\n#bold Les Autres sont revenus, et la Longue Nuit a commencé.#!#!"
 ln_opening.5.desc.watch:0 "#e Nous envoyons ce rapport exact vers le sud depuis cent ans. Il a fallu envoyer un frère traîner un cadavre en mouvement jusqu'à la capitale pour qu'ils écoutent enfin.\n\n#bold Le royaume voit la vérité. Maintenant il doit se battre.#!#!"
 ln_opening.5.desc.free_folk:0 "#e Il a fallu aux agenouillés qu'un corbeau amène un cadavre en marche dans leur belle salle du roi pour qu'ils nous croient enfin.\n\n#bold Les morts se moquent des trônes.#!#!"
 ln_opening.5.desc.north:0 "#e La Garde de Nuit a fait l'impossible. Elle a traîné la preuve vers le sud elle-même.\n\nLa capitale a vu les morts se relever de ses propres yeux quand un frère noir a présenté un spectre au Trône de Fer. Les ricanements sur nos « contes de vieilles nourrices » ont définitivement cessé.\n\n#bold Les Autres sont revenus. Le Nord avait raison depuis le début.#!#!"
 ln_opening.5.desc.dragon:0 "#e Nouvelle arrive de la capitale : un frère de la Garde de Nuit a amené un mort à la cour. \n\nLe royaume a vu le feu tuer enfin le monstre là où l'acier du roi avait échoué. Les sots appelleront cela un tour de baladin, mais nous montons des dragons, par tous les dieux. Je sais exactement ce que cela signifie. La magie est réelle, et la magie de la Glace s'est levée pour affronter la magie du Feu.\n\n#bold La Longue Nuit est là. Qu'ils brûlent.#!#!"
 ln_opening.5.desc.red:0 "#e Nous avons reçu nouvelle des prêtres rouges de la capitale. Un frère noir a traîné un cadavre en marche devant le Trône de Fer.\n\nL'acier de la Couronne n'a pas réussi à tuer le monstre, et il a fallu recourir au feu pour purifier la pourriture. Mes prêtres se sentent entièrement confirmés, bien qu'il n'y ait là aucune joie. La vérité du Maître de la Lumière est indéniable, et seul Son feu peut chasser ces ténèbres.\n\n#bold Le Grand Autre est réel. La Guerre pour l'Aube approche.#!#!"
 ln_opening.5.desc.lord:0 "#e Mon mestre a brisé ce matin le sceau d'un corbeau venu de la capitale. Sa voix tremblait tandis qu'il lisait à haute voix les mots impossibles.\n\nUn frère de la Garde de Nuit a présenté un spectre à la Couronne elle-même. La lettre détaille comment le bourreau du roi lui-même a frappé la créature, et comment sa main tranchée a continué de bouger sur le sol jusqu'à ce qu'on la brûle enfin en cendres. La Citadelle ne peut écarter un événement dont toute la cour a été témoin.\n\n#bold La Longue Nuit a commencé. Les vieux mythes étaient vrais.#!#!"
 ln_opening.5.desc.nobody:0 "#e La nouvelle se répand comme une peste depuis la capitale. On dit que les frères noirs ont traîné un monstre enchaîné devant le roi.\n\nSi les propres gardes du roi ont eu peur, quel espoir reste-t-il aux autres ?\n\n#bold Moi, je le croyais il y a une saison. Maintenant tout le monde le croit.#!#!"
 ln_opening.5.desc.crown:0 "#e Un frère de la Garde de Nuit s'est présenté devant mon trône aujourd'hui, les vêtements réduits en loques par la route, et a demandé la permission de procéder à une exécution en ma présence. \n\nLa chose qu'il a traînée au bout d'une chaîne avait la forme d'un homme. Elle était morte depuis longtemps. Elle bougeait encore.\n\nLe bourreau lui a pris la tête, et elle a continué de bouger. On lui a pris la main droite, et la main a continué de bouger séparément, ce qui était pire. Ce qui l'a enfin arrêtée, c'est le feu, et toute ma cour l'a regardée brûler dans un silence absolu et horrifié.\n\n#bold Les Autres sont revenus, et la Longue Nuit a commencé.#!#!"
 ln_opening.5.a:0 "Alors c'est vrai. Les mythes sont réels."
 ln_opening.5.b:0 "Préparez-vous. Nous devons nous battre."

