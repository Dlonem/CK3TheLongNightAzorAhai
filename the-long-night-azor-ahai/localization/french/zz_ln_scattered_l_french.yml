 # ── THE SCATTERED WATCH (Session 10) ────────────────────────────────────────────────────────────────────────
 ln_scatter.2.t:0 "Des manteaux noirs à tes portes"
 ln_scatter.2.desc:0 "Ils sont trois aux portes, et tes gardes ne savent qu'en faire, car rien chez eux n'a de sens aussi loin au sud.\n\nDes manteaux noirs, ou ce qu'il en reste. Il manque à l'un des doigts, pris par le gel. Ils ont marché, à en croire leurs bottes, très longtemps, et tous disent la même chose de la voix plate des hommes qui n'attendent plus qu'on les croie :\n\nLe Mur est tombé. La Garde est brisée. Les morts marchent vers le sud derrière eux, et ils ne marchent pas vite, parce qu'ils n'en ont pas besoin.\n\nTu avais entendu des rumeurs. Les rumeurs sont un temps qui passe. Ces hommes sont les survivants de la tempête elle-même, debout dans ta cour."
 ln_scatter.2.desc.north:0 "Tout homme du Nord sait la seule chose que la Garde de Nuit ne fait jamais : elle ne quitte pas le Mur.\n\nAussi, quand tes gardes annoncent trois frères noirs aux portes -- en loques, mordus par le gel, l'un d'eux amputé d'une demi-main -- tu es déjà debout avant qu'ils aient fini, car des manteaux noirs si loin du Mur ne sont ni des déserteurs ni des mendiants. Ils sont un calcul. La Garde n'est plus, et voici ce qui reste.\n\nIls le disent tout net, comme les hommes du Nord disent les choses : le Mur est tombé. Les morts descendent le Kingsroad, et ils ne sont pas pressés.\n\nOld Nan t'a dit comment se déroule cette histoire. Elle ne t'a jamais dit qu'elle arriverait à ta propre porte dans un manteau noir."
 ln_scatter.2.desc.red:0 "Le Maître de la Lumière n'envoie pas de corbeaux. Il envoie des témoins.\n\nTrois frères de la Garde déchue à tes portes, noircis par le froid comme d'autres hommes le sont par le feu, et chaque mot qui sort d'eux est un sermon que tu as déjà prêché : le Mur est tombé, les ténèbres sont lâchées, les morts marchent. Ton feu nocturne les a attirés depuis l'autre bout d'un royaume -- la seule lumière sur la route, ont-ils dit, qui ne se soit pas révélée être un feu follet.\n\nR'hllor a livré la preuve à ta porte, respirant encore.\n\nCe qu'on fait de la preuve est la mesure du fidèle."
 ln_scatter.2.a:0 "Il y a place dans ma salle pour des hommes qui l'ont vu."
 ln_scatter.2.b:0 "Nourrissez-les. Armez-les. Et envoyez-les à chaque forteresse au sud d'ici."
 ln_scatter.2.c:0 "Le châtiment pour avoir abandonné le Mur est la mort."
 ln_scatter_brothers_join_tt:0 "Les frères entrent au service de ta cour. La Garde à laquelle ils ont juré n'existe plus et ils sont déliés de leurs vœux : ils ne portent plus le noir, mais ils sont durs, aguerris, et valent plus dans une ligne de bataille que leurs années ne le laissent croire."
 ln_scatter.3.t:0 "Ce que la Garde t'a laissé"
 ln_scatter.3.desc:0 "[ln_scattered_brother.GetTitledFirstName] est dans ta salle depuis une saison, et il n'a pas demandé une seule chose.\n\nIl mange avec la garde. Il est debout avant elle. Un mot est monté de la caserne il y a trois jours, gêné de le dire : cet homme a oublié plus de choses sur la tenue d'un mur en hiver que personne dans ce château n'en a jamais apprises — et la garnison s'est mise à se tenir plus droite quand il passe, ce qui n'est pas une chose qu'on peut ordonner à des hommes.\n\nIl se réveille encore dans le noir, parfois. Personne ne lui en parle."
 ln_scatter.3.a:0 "Mettez-le sur les murs. C'est à cela qu'il sert."
 ln_scatter.3.b:0 "Faites-le asseoir avec mes commandants. Ils ont besoin de l'entendre."
 ln_black_cloaks_in_the_garrison_modifier:0 "Manteaux noirs sur les murs"
 ln_black_cloaks_in_the_garrison_modifier_desc:0 "Des hommes d'une Garde qui n'existe plus servent dans la garnison de ce château. Ils ont tenu des murs pires que celui-ci."
