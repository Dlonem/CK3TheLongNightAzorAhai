l_english:

 # AGOT: The Long Night & Azor Ahai -- the Last Hour melee (1.1.0, §3).
 # ⚠ ln_lasthour.1 is the §13 VOICE SAMPLE -- Thomas approves this exchange before the other four are written.

 ln_dawn.2.e:0 "We do not go to him alone - form the line"

 ln_lasthour.1.t:0 "The Last Hour"
 # The first block counts HIS side (the walker scopes vary 1-3 with the difficulty rule, §9.4); the
 # second counts yours. Never promise a number the portraits cannot keep.
 ln_lasthour.1.desc.walkers3:0 "He is waiting for you on the open snow, and he has not troubled to bring his army. Three of his pale kind stand a spear's length behind him, still as carved ice. He does not need more, and he knows that you know it."
 ln_lasthour.1.desc.walkers2:0 "He is waiting for you on the open snow, and he has not troubled to bring his army. Two of his pale kind stand a spear's length behind him, still as carved ice. He does not need more, and he knows that you know it."
 ln_lasthour.1.desc.walkers1:0 "He is waiting for you on the open snow, and he has not troubled to bring his army. One of his pale kind stands a spear's length behind him, still as carved ice. He does not need more, and he knows that you know it."
 ln_lasthour.1.desc.walkers0:0 "He is waiting for you on the open snow, and he has not troubled to bring his army. He does not need it, and he knows that you know it."
 ln_lasthour.1.desc.line:0 "\n\nBut you did not come alone either. Boots crunch behind you — the ones who answered, the ones with a reason of their own to be on this field. Steel, glass, and whatever gods any of you still keep.\n\nHe watches the line form. Something moves in the blue of his eyes that might, in a living face, have been interest."
 ln_lasthour.1.desc.alone:0 "\n\nNobody answered. Nobody came. It is you, the wind, and the dead.\n\nHe watches you walk the last hundred yards alone. Something moves in the blue of his eyes that might, in a living face, have been respect."
 ln_lasthour.1.a:0 "Forward - it ends here, one way or the other"
 ln_lasthour.1.c:0 "Draw it first. Let the whole field see what it is."
 ln_lasthour.1.d:0 "I take the front. This blade was made for something."
 ln_lasthour.1.e:0 "Get me close."
 ln_lasthour.1.f:0 "They came here because of me. They can watch me go first."
 ln_lasthour.1.b:0 "Turn back - this is not the hour"

 # ── option tooltips (the effects run hidden; these lines are what the player is told) ──
 ln_dawn.2.e_tt:0 "A line is drafted from those on the field — the man the story already chose, your kin and friends first, then every stranger carrying steel that works, six at most and never more than two of your own house. Then you go to him together."
 ln_lasthour.1.c_tt:0 "You go in first, holding the one thing every man behind you has heard about. It buys you a step. It also means the thing in the middle of that field is looking at nobody else."
 ln_lasthour.1.d_tt:0 "Valyrian steel, carried to the one fight it was ever really for. You take the front rank and the attention that comes with it."
 ln_lasthour.1.e_tt:0 "Obsidian is a knife-fighter's answer. It works, and it works at arm's length, which is the whole problem with it."
 ln_lasthour.1.f_tt:0 "You are what the priests have been telling them for years. Whether that is true has stopped mattering; what matters is that the line believes it while they watch you walk out."
 ln_lasthour.1.a_tt:0 "The melee begins. It will be fought man by man over the days that follow — wounds, falls, and worse — and a White Walker never accepts a yield."
 ln_lasthour.1.b_tt:0 "The line disbands and the field stands. He will still be there when you find your courage."
 ln_lasthour.20.a_tt:0 "The Night King is ended by your hand. Every fallen Walker of his line is added to your count, and every survivor of yours carries the memory."

 ln_lasthour.20.t:0 "The Dawn"
 ln_lasthour.20.desc:0 "It is over, and for a moment nobody trusts it. The wind still blows. The snow still stands in its drifts. But the cold — the cold that has sat inside every man's chest since the long dark began — is draining out of the world like water out of a cracked bowl.\n\nWhere he fell there is nothing now but a spreading ring of frost, and his pale kind are gone as if they had never stood there. Across the North, across the world, a hundred thousand dead men fall down at once and do not get up.\n\nThe men still standing in the line look at one another. Somebody laughs, high and cracked. Somebody else is on his knees. The sun is coming up, and it has been years since the sun came up."
 ln_lasthour.20.a:0 "Let it be morning"

 ln_lasthour.30.t:0 "What the Cold Keeps"
 ln_lasthour.30.desc:0 "There is no pain. That is the first wrong thing. There was pain, a great deal of it, and then the cold came up through it like water through snow, and now there is nothing at all.\n\nYou watch your own hands steady themselves on the ice without asking them to. They are the wrong colour. The thoughts you are thinking are getting shorter, and the space between them is getting wider, and somewhere in that widening space you understand — without fear, because fear has gone wherever the pain went — that this is the last one you will think in words.\n\nHe is standing over you. He is not gloating. He is waiting, the way a man waits for ice to finish forming on a pond he means to cross."
 ln_lasthour.30.a:0 "..."

 # ── Memories ──
 ln_faced_the_night_king_memory:0 "stood against the Night King"
 ln_faced_the_night_king_memory_desc:0 "I stood in the line at the Last Hour, against the Night King himself, and I was still breathing when the sun came up."
 ln_faced_the_night_king_memory_desc_second_perspective:0 "you stood in the line at the Last Hour, against the Night King himself, and you were still breathing when the sun came up."
 ln_faced_the_night_king_memory_desc_third_perspective:0 "[owner.GetName] stood in the line at the Last Hour, against the Night King himself."
 ln_raised_as_an_other_memory:0 "taken by the Night King"
 ln_raised_as_an_other_memory_desc:0 "I fell at the Last Hour, and the Night King did not let me die. He made me one of his own kind."
 ln_raised_as_an_other_memory_desc_second_perspective:0 "you fell at the Last Hour, and the Night King did not let you die. He made you one of his own kind."
 ln_raised_as_an_other_memory_desc_third_perspective:0 "[owner.GetName] fell at the Last Hour, and the Night King made [owner.GetHerHim] one of his own kind."
