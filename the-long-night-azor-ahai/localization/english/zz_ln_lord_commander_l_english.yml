l_english:

 # AGOT: The Long Night & Azor Ahai -- the Lord Commander's war.

 ln_call_the_great_ranging_decision:0 "Call the Great Ranging"
 ln_call_the_great_ranging_decision_desc:0 "The reports on your table do not agree with each other, and the men who wrote them are not available to reconcile them.\n\nThere is one way the Watch has ever settled what is actually in the north, and it has always cost the same coin: brothers, in numbers, riding past the last place anyone turns back from, with orders to look at the thing itself and come home.\n\nThe last Lord Commander to call one is remembered for it. That is not the same as saying it went well."
 ln_call_the_great_ranging_decision_tt:0 "Send a great ranging beyond the Wall to learn what is coming.\n\n#weak It comes back with word, or it does not come back, or — worst — it comes back quiet. What it learns, the Watch keeps.#!"
 ln_call_the_great_ranging_decision_confirm:0 "Sound the horn once"

 ln_lc.1.t:0 "The Great Ranging Rides"
 ln_lc.1.desc:0 "They go out the gate before first light, because you told them to and because none of them wanted to do it with the whole castle watching.\n\nTwo hundred brothers, provisioned for a season, on the best horses the Watch has left. The oldest of them has crossed eleven times and did not say anything at all this morning, which you noticed. The youngest is nineteen and could not stop talking, which you also noticed.\n\nThe gate comes down behind them with a sound like a verdict. Now the Watch does what the Watch has always done more of than fighting.\n\nIt waits."
 ln_lc.1.a:0 "Bring me word. Whatever it is."
 ln_lc.1.b:0 "You will lead it yourself. The Watch follows a cloak, not a raven."

 ln_lc.2.t:0 "Word From the North"
 ln_lc.2.desc:0 "They came back thinner and quieter and with four fewer horses, and the senior surviving ranger stood in your solar and gave his report like a man laying stones down one at a time.\n\nDistances. Names of valleys that no longer have anyone living in them. What the free folk are running from, in the words of the free folk who said it. Where the cold sits wrong, and how far south the wrongness has come since the oldest man in the party last saw it.\n\nIt is the first document in eight thousand years of Watch records that treats the enemy as a matter of logistics. You have read it four times.\n\nThe Citadel can argue with stories. It cannot argue with distances."
 ln_lc.2.desc.led:0 "There is no report to receive. You were there for every mile of it, and the only thing waiting in your solar is a map with its corners weighted down and the senior surviving ranger, who has been writing since Eastwatch and has not slept since the Milkwater.\n\nDistances. Names of valleys that no longer have anyone living in them. What the free folk are running from, in the words of the free folk who said it — and you were standing close enough to smell the smoke on them when they said it.\n\nYou put your own name at the bottom, under his. That is the part the Citadel will not be able to walk around. It is the first document in eight thousand years of Watch records that treats the enemy as a matter of logistics, and the man who signed it went and counted the miles himself.\n\nThe Citadel can argue with stories. It cannot argue with a Lord Commander who was there."
 ln_lc.2.a:0 "Copy it. Every castle gets one. So does Winterfell."

 ln_lc.3.t:0 "The Ranging Is Lost"
 ln_lc.3.desc:0 "It is the horses that settle it.\n\nBrothers can be delayed. Brothers can winter over, lose the trail, hole up in a wildling village and come home in the spring with a story. But eleven of the horses came back on their own, over weeks, in ones and twos — riderless, half-starved, and unwilling to be stabled facing north.\n\nTwo hundred men. You signed the order and you counted them out the gate.\n\nThe clerk has left the ledger open on your table, because somebody has to write the entry and the Watch's custom says it is you."
 ln_lc.3.desc.led:0 "You came back with nineteen.\n\nYou do not remember giving the order to turn. You remember the light going wrong on the fourth day past the Milkwater, and a horse screaming somewhere behind you in a dark that had arrived four hours early, and then a great deal of running that will be called a fighting withdrawal by the time the story reaches Winterfell.\n\nEleven more horses came home on their own over the following weeks, in ones and twos — riderless, half-starved, and unwilling to be stabled facing north. Not one of them brought a man with it.\n\nYou signed the order. You counted them out the gate. You rode at the head of them, which is what you told the whole castle a Lord Commander is for.\n\nThe clerk has left the ledger open on your table, because somebody has to write the entry and the Watch’s custom says it is you. The custom does not say what to write when the name at the top of the list is still breathing."
 ln_lc.3.a:0 "Two hundred names. I will write every one."
 ln_lc.3.a.led:0 "A hundred and eighty-one names. I will write every one of them myself."

 ln_lc.4.t:0 "They Came Back Quiet"
 ln_lc.4.desc:0 "The watcher on the gate saw them at dusk: thirty brothers, walking, in good order, and he was halfway through raising the cheer when he understood what was wrong with it.\n\nNo breath. Thirty men walking in the cold, and not one plume of breath above them.\n\nThe gate stayed down. The fire arrows did what fire does. And in the morning the ground in front of the Wall was littered with men you knew — men you SENT — with black cloaks stiff under the frost and eyes the colour of a star seen through ice.\n\nOne of the kitchen boys did not stay behind the wall of shields, and the Watch buried what was left of him at noon. The rest of what happened last night cannot be buried, because it got up."
 ln_lc.4.desc.led:0 "You beat them home by three days, and you have spent every hour since trying to decide what it was you actually saw on the ice.\n\nThen the watcher on the gate calls down at dusk: thirty brothers, walking, in good order. You are already moving for the stair before he finishes, because you left thirty men on that ice and you know exactly how they were lying when you left them.\n\nNo breath. Thirty men walking in the cold, and not one plume of breath above them.\n\nThe gate stayed down. The fire arrows did what fire does. And in the morning the ground in front of the Wall was littered with men you knew — men you LED — with black cloaks stiff under the frost and eyes the colour of a star seen through ice.\n\nOne of the kitchen boys did not stay behind the wall of shields. The Watch buried what was left of him at noon. The rest of what happened last night cannot be buried, because it got up."
 ln_lc.4.a:0 "Burn the cloaks. Burn all of it."

 ln_opening.10.t:0 "You Have Seen This Before"
 ln_opening.10.desc:0 "The riders bring the same words they brought last time, and around you the hall goes to pieces in the same order it went to pieces last time — the shouting men first, then the praying ones, then the ones who simply sit down.\n\nAnd you notice that you are standing quite still.\n\nYou were there. You stood in the snow in the front rank of the world with the dead coming on, and you watched the dark break — not in a song, not in a maester's history with your name spelled wrong, but in front of you, over the shoulders of men whose faces you still know.\n\nEvery man in this hall knows it. That is why, one by one, they are stopping their noise and turning to look at you."
 ln_opening.10.a:0 "I know how it ends. Bring me my sword."

 ln_ranging_still_out:0 "The last ranging has not come back yet. I will not send more men after them until I know."
 ln_ranging_men_need_rest:0 "The ranging is home, and the men who came back need rest. The Watch cannot mount another one yet."
 ln_send_out_the_crows_decision:0 "Send a Brother Recruiting"
 ln_send_out_the_crows_decision_desc:0 "The Watch has one recruiting method that has worked for eight thousand years, and it is not the letters.\n\nIt is a man. One brother past his best ranging years, with a good horse and a black cloak and no hurry at all, riding from Last Hearth to the Reach — and at every hall he asks the lord the same question: how full are your dungeons, and what were you planning to do with them?\n\nNobody loves a black cloak at the gate. Everybody feeds him. And the Wall's count goes up by whatever the realm was going to hang."
 ln_send_out_the_crows_decision_tt:0 "Send a sworn brother of your court riding south through the realm.\n\n#weak Every great lord with a full dungeon will be asked to empty it into the Watch. Some will. The visits arrive over months, as the roads allow.#!"
 ln_send_out_the_crows_decision_confirm:0 "Give him a horse and a list"
 ln_crows_need_a_brother_to_send:0 "You need a sworn brother at your court fit to ride south"
 ln_crows_are_still_on_the_road:0 "The last brother I sent is still on the road. The Watch has only so many men to spare for begging."
 ln_send_out_the_crows_effect_tt:0 "A brother of your court rides south. Every duke or greater in the Seven Kingdoms with #V 3#! or more prisoners will receive him in the months ahead."

 ln_lc.10.t:0 "A Black Brother at the Gate"
 ln_lc.10.desc:0 "[ln_wandering_crow.GetTitledFirstName] has been on the road long enough that the black has gone grey at the hem, and he does not bother with ceremony.\n\nHe eats what your hall serves him, thanks the server by name, and then asks you the question he has asked at every gate between here and the Wall: how full are your dungeons, my lord, and what were you planning to do with the men in them?\n\n'The rope is quick,' he says, in the tone of a man agreeing with an argument you have not made yet. 'The Wall is not. But the Wall is nineteen castles held by eight hundred men, and winter is not getting further away. A man who would die for nothing here can freeze for something there.'\n\nHe is not begging. He has done this too long to beg. He is simply waiting, and he can wait longer than you can."
 ln_lc.10.a:0 "Take them. Every unlanded man in my cells."
 ln_lc.10.b:0 "Coin for the Wall. My prisoners are my business."
 ln_lc.10.c:0 "The Wall gets nothing of mine. Good roads to you."
