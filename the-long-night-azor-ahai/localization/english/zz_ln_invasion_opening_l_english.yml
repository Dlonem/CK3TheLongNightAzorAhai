l_english:

 # ══════════════════════════════════════════════════════════════════════════════════════════════════
 # THE LONG NIGHT -- opening cards. 
 # ══════════════════════════════════════════════════════════════════════════════════════════════════

 # ── THE WARNING -- Winter Is Coming (fires from ln_struggle_cold_winds_reached_effect) 
 ln_opening.6.t:0 "#e Winter is Here#!"
 ln_opening.6.desc:0 "#e It is not a single event. That is what makes it so difficult to argue with.\n\nRavens from the North speak of rangings that have ceased returning—not lost, not late, but entirely gone. Wildlings are pressing against the Wall in numbers no raiding season can explain, and the maesters have quietly started debating how much time is left.\n\nThere is still summer in the far south. There is still time to do something with it.\n\n#bold Whatever the realm builds now is what the realm will have.#!#!"
 ln_opening.6.desc.watch:0 "#e I do not need the maesters to tell me. I have the ledgers.\n\nThree rangings have gone out since the thaw. One returned, and it came back missing the six men who went ahead to scout. The wildlings have stopped raiding the Wall and started begging at it. Any brother who has spent his life fighting them knows the dread in his stomach when he sees them run.\n\nNineteen castles were built for this hour. We can barely garrison three.\n\n#bold Eight thousand years of vows were written for what happens next. We are what is left of the Watch, and the Watch is what is left of the warning.#!#!"
 ln_opening.6.desc.free_folk:0 "#e The kneelers south of the Wall are still arguing about whether it is real. We stopped arguing long ago.\n\nIt is not in front of us, where a thing can be fought. It is behind us, where a thing can only be outrun. The Thenn are moving. The Hornfoot are moving. Clans that have shed each other's blood for centuries are marching in the exact same direction, and nobody had to tell them which way to go.\n\nThe old songs say the Wall was raised to keep something out. Our ancestors were left on the wrong side of it.\n\n#bold Winter is not coming for the south first.#!#!"
 ln_opening.6.desc.north:0 "#e Every Northern child hears the tales of the Long Night. The Others come, the cold comes with them, and the dark lasts a generation. Every Northern lord has smiled at the exaggeration of wet nurses.\n\nThe smiling has stopped. The rangings are not returning. The wildlings are fleeing in terror, and the maesters have quietly begun tallying what the granaries hold against how many years they might have to hold it.\n\nThe North remembers. That was always the part of our House words that nobody finished: we are meant to remember THIS.\n\n#bold There is still summer in the south. We must spend it like Northerners.#!#!"
 ln_opening.6.desc.dragon:0 "#e The blood of Old Valyria carries prophecies the way other houses carry swords they have forgotten how to draw.\n\nThe dream that drove Aenar out of Valyria; the song of ice and fire; the prince that was promised. For centuries, it has been an heirloom—ceremonial, sometimes embarrassing, but kept.\n\nNow word reaches us that rangings have vanished, wildlings are fleeing from something they refuse to name, and the old dreams have started arriving on schedule.\n\n#bold The blood of the dragon was put in the world for one hour. It is beginning to look like the hour is here.#!#!"
 ln_opening.6.desc.red:0 "#e We have preached of the Great Other's return into rooms that laughed at us. The rooms have stopped laughing.\n\nThe flames have shown the same vision for a year: a wall of ice, and something patient waiting in the freezing dark. Now the ravens from the North are confirming in ink what the Lord of Light has been saying in fire all along.\n\nThis is the war our faith exists for. Every sermon, every nightfire was preparation for exactly this—and somewhere in the world, the Lord of Light is choosing a hand to hold the sword.\n\n#bold The true night is at our doorstep. It is what we promised them all along.#!#!"
 ln_opening.6.desc.lord:0 "#e My maester brings me forwarded reports from the Citadel. They are deeply unsettling.\n\nIt is buried in dry language about missing Night's Watch rangings and unusual wildling migrations, but the implications are clear. The rivers in the North are freezing faster than they should, and the Citadel is quietly hoarding grain.\n\nMost lords will call it a harsh winter. But a harsh winter does not terrify the maesters into silence.\n\n#bold I do not know what is happening in the deep North, but it is coming south.#!#!"
 ln_opening.6.desc.nobody:0 "#e The air carries a colder, unnatural bite I have never felt before.\n\nThe greybeards in the camps and taverns speak of bad years and harsh frosts, but this feels different. Travelers bring strange rumors from the North—missing Black Brothers, wildlings abandoning their lands, and a cold that kills a man in his sleep. Nobody wants to say it aloud, but the summers we once knew are gone.\n\n#bold Something terrible is riding the northern winds.#!#!"
 ln_opening.6.desc.dance:0 "#e The realm has spent a generation arguing over a chair.\n\nThere are rival claimants, rival courts, and every lord has been asked which way they will jump. Half the letters in my solar are about the succession. The one from the Wall sits at the bottom, unread, because the Wall has never mattered to who sits the throne.\n\nBut it is a ranging report. Three sent north, none returned, and a desperate line at the end that the maester has underlined twice. The realm has more dragons in the sky right now than since Valyria burned, yet we are busy fighting each other.\n\n#bold The dark does not care which of us was meant to rule.#!#!"
 ln_opening.6.desc.dragons:0 "#e Word arrives from the North that the rangings have stopped coming back—and for once, the realm believes it has the answer.\n\nThere are dragons over the Blackwater. Children point at them the way other centuries pointed at clouds. Whatever is behind the Wall, it has picked the one age in eight thousand years when the living can put fire in the sky by the dozen.\n\nThe maesters counsel that the old accounts are less frightening when we have fire made flesh. But the maesters have never seen a thing that can pull a dragon down from the sky.\n\n#bold There is still summer in the south, and the sky is full of fire. We must spend both.#!#!"
 ln_opening.6.desc.close:0 "\n\n#EMP Nobody can tell you how long this lasts — not the maesters, not the priests, not the oldest man in your hall.#! What is certain is that this winter is not like the others."
 ln_opening.6.a:0 "Then we had better prepare for the cold. Time is short."
 ln_opening.6.b:0 "Let the North freeze. We have our own problems."
 ln_opening.6.c:0 "There is still summer in the south."

 # ── 1. THE SUN FORGETS TO RISE ───────────────
 ln_opening.1.t:0 "#e The Sun Forgets to Rise#!"
 ln_opening.1.desc:0 "#e It has been three days, and the dawn never came.\n\nThe sky is an unyielding, suffocating black, completely devoid of stars. This is not a storm; it is a physical shadow that has swallowed the world. The air smells of ancient dust and shattered ice, carrying a cold so profound that giant pines burst from their frozen sap.\n\nTerrified riders ride their horses to death bringing warnings of a tide of dead men walking in the pitch black. The Long Night is no longer a myth.\n\n#bold The Others have returned. The Long Night has begun.#!#!"
 ln_opening.1.desc.watch:0 "#e I stand atop the Wall, looking north, and there is no horizon. Just an absolute, unnatural darkness.\n\nThe sun has not risen in days. The wind carries no snow, only a supernatural cold that cracks the stone and freezes the brothers at their posts. We were warned that the true enemy brings the storm, but this is worse. They bring the night itself.\n\n#bold The Long Night is upon us. The shield of men is all that remains.#!#!"
 ln_opening.1.desc.free_folk:0 "#e We look to the sky, and there is only black. The true cold is here.\n\nThe sun has stopped coming up. The elders have fallen completely silent, and the young finally understand why we run. There is nowhere left to hide in the dark.\n\n#bold The Long Night has begun. The dead are coming.#!#!"
 ln_opening.1.desc.north:0 "#e The hearth fires struggle to pierce the gloom. Midday looks exactly like midnight.\n\nThe skies over the North have gone entirely black. A cold has settled that kills a man in his own bed if his fire burns low. The Long Night is no longer a story meant to frighten children. It is standing right outside our gates.\n\n#bold The Others have returned. The North must be the shield again.#!#!"
 ln_opening.1.desc.dragon:0 "#e The Valyrian scrolls spoke of a darkness that would sweep the world. I look at the black sky, and realize the doom did not die in the east.\n\nIt has been dark for days. A magical cold has settled over the realm that no normal fire can banish. The long promised hour of ice and fire is literally upon us.\n\n#bold The Long Night has begun. It is time to wake the dragon.#!#!"
 ln_opening.1.desc.red:0 "#e The Great Other has cast his physical shadow over the world. The literal night that never ends is here.\n\nOur priests have shouted the prophecy of Azor Ahai in the streets for centuries, and now the vanishing sun proves the truth of the Lord of Light's warnings. The night is dark, and it is full of terrors.\n\n#bold The enemy of the light has returned. Only fire can push back this dark.#!#!"
 ln_opening.1.desc.lord:0 "#e Even this far south, noon is as dark as midnight.\n\nThe rivers are freezing solid overnight, and the crops are turning to black rot in the fields. The maesters have no explanation for a sky without a sun, nor a cold this unnatural. The terrifying myths from the North are suddenly feeling very real.\n\n#bold The Long Night has begun. The realm is completely blind.#!#!"
 ln_opening.1.desc.nobody:0 "#e There has not been a sunrise in almost a week. The rivers are turning to solid ice.\n\nPeople are huddling around whatever fires they can build, terrified of the freezing wind and the pitch-black sky. Nobody knows what is happening, only that the world feels entirely broken.\n\n#bold The Long Night has come. I pray we survive it.#!#!"
 ln_opening.1.a:0 "Build the fires high. We wait in the dark."
 ln_opening.1.b:0 "Keep your steel close. The true war begins."

 # ── 2. A RANGING RETURNED ───────────────────────────────────────────────────────
 ln_opening.2.t:0 "#e A Ranging Returned#!"
 ln_opening.2.desc:0 "#e The horrific story is spreading from the North. A massive ranging went out into the deep woods, but only eleven men returned.\n\nThey came back entirely silent, half-mad with frostbite. They did not fall to wildlings. They report being ambushed in the freezing dark, where they were forced to watch their own fallen brothers open eyes of piercing blue and rise from the snow to slaughter them.\n\nThe myth is real, and it is weaponizing our own dead.\n\n#bold The Others have returned, and The Long Night has begun.#!#!"
 ln_opening.2.desc.watch:0 "#e We sent our best men deep into the haunted woods. Only eleven dragged themselves back through the gates.\n\nThey were half-mad with terror, weeping as they confessed to the Lord Commander what they saw. They were ambushed in the freezing dark, forced to cut down their own brothers—brothers who had just died, only to rise from the snow with pale blue eyes to butcher the living.\n\nThe Wall still stands, but we finally know exactly what is waiting for us.\n\n#bold The Others have returned. The Long Night is here.#!#!"
 ln_opening.2.desc.free_folk:0 "#e We watched forty crows march deep into the woods. Only eleven limped back out. We counted them coming and going.\n\nThe dead do not care about black cloaks. The kneelers are finally learning the terrible truth of what happens in the snow.\n\n#bold The Others have returned. There is no safety behind their ice.#!#!"
 ln_opening.2.desc.north:0 "#e The raven from Castle Black is terrifyingly brief. Maesters embroider rumors; nobody embroiders a massacre.\n\nA great ranging was slaughtered beyond the Wall. The Watch reports that the dead did not stay dead, rising from the snow to fight the living. Every Northern lord has sent sons to that Wall. Some of the men who fell and rose again are men I know.\n\n#bold The Long Night has begun. It starts wearing a familiar face.#!#!"
 ln_opening.2.desc.dragon:0 "#e Word arrives of a massive ranging slaughtered beyond the Wall, the survivors claiming the dead rose from the snow to butcher them.\n\nSome lords might call it a trick of the cold, but my ancestors conquered this continent to unite it against exactly this ancient magic. \n\n#bold The Long Night is here. We must meet their ice with fire.#!#!"
 ln_opening.2.desc.red:0 "#e My priests are spreading the horrific news from the North. The true war has officially begun.\n\nA ranging party was slaughtered in the deep woods, and the survivors report that the slain rose again as servants of the dark. The Lord of Light commands us to burn the rot before it spreads to the rest of the world.\n\n#bold The Long Night has begun. Fire is the only answer.#!#!"
 ln_opening.2.desc.lord:0 "#e The Citadel has forwarded a chilling, formal report from the Lord Commander of the Night's Watch.\n\nA great ranging party was decimated deep in the haunted woods. The survivors swore on their lives that they were ambushed in the dark, and that their fallen brothers rose from the snow with unnatural blue eyes to attack them. Most lords might dismiss this as madness or wildling treachery, but the Citadel does not forward mad ravings without reason.\n\n#bold If the dead truly walk, what protects the south?#!#!"
 ln_opening.2.desc.nobody:0 "#e I hear terrified whispers in the taverns that a massive ranging party was butchered in the deep North.\n\nThey say the Black Brothers did not fight wildlings, but rather corpses that rose from the snow to kill them. Even without lands or titles, I know the smell of a doomed realm.\n\n#bold The Long Night has begun. Nowhere is safe.#!#!"
 ln_opening.2.a:0 "If the dead walk, they must be burned."
 ln_opening.2.b:0 "Trust no one. Watch the shadows closely."

 # ── 3. THE HORROR BEYOND THE WALL (Hardhome) ──────────────────────────────────────────────────
 ln_opening.3.t:0 "#e The Horror Beyond the Wall#!"
 ln_opening.3.desc:0 "#e Ravens and rumors carry the same impossible story. The wildlings have arrived at the Wall the way a river hits a breaking dam.\n\nThey are not raiding. They are begging to be let through a gate they spent centuries trying to break. They speak of a massacre at a peninsula called Hardhome, where they were cornered against the freezing sea with nowhere to run. The dead slaughtered them on the beaches, and the slain opened eyes of piercing blue.\n\nThe argument over whether to let them in ended when the thing they were fleeing arrived behind them.\n\n#bold The Others have returned, and The Long Night has begun.#!#!"
 ln_opening.3.desc.watch:0 "#e I look down from the Wall at thousands of wildlings begging at our gates. They are completely broken.\n\nMen I have personally fought are white around the eyes. They speak of being cornered on a frozen peninsula at Hardhome, trapped between a massive horde of the dead and the freezing sea. The slain rose again to slaughter the living on the beaches.\n\nOur vow says we are the shield that guards the realms of men. It does not specify which men.\n\n#bold The dead take everyone. Tonight, the Watch decides what our words truly mean.#!#!"
 ln_opening.3.desc.free_folk:0 "#e Hardhome is a graveyard. We thought we could gather there, find ships, find anything. Instead, we were cornered on the peninsula with nowhere to run.\n\nYour people, your rivals, clans your grandfather blood-feuded—slaughtered together against the freezing sea. Now we stand at the Wall, begging the kneelers for mercy, because we have finally met the one thing worse than kneeling.\n\n#bold The dead take everyone. That makes everyone yours.#!#!"
 ln_opening.3.desc.north:0 "#e The sheer volume of wildlings begging at the Wall is unprecedented. They speak of being cornered and slaughtered against the sea at a place called Hardhome.\n\nWildlings do not run from men. Every Northern lord now holds the same ugly arithmetic: every wildling turned away to freeze is just another spear that will march back down the kingsroad with blue eyes.\n\n#bold The Others have returned. Every soul north of us is either a living spear or a wight.#!#!"
 ln_opening.3.desc.dragon:0 "#e Whispers reach me that thousands of wildlings are moving south, fleeing a massacre on the coast of Hardhome. No one with the blood of the dragon has ever heard of them running like this.\n\nThey speak of being trapped against the sea by an enemy that does not tire and cannot be reasoned with. It is a terrifying thought.\n\n#bold The Others have returned. We will see if they burn.#!#!"
 ln_opening.3.desc.red:0 "#e The wildlings run south, fleeing a horrific slaughter where they were cornered against the sea at Hardhome. The Great Other's army swells with every fallen soul.\n\nThey are running toward a realm that despises them, begging for salvation. My priests call it the ultimate conversion.\n\n#bold The dead take everyone. We must rally the living.#!#!"
 ln_opening.3.desc.lord:0 "#e Ravens from the North report an unprecedented crisis at the Wall. Thousands of wildling refugees are begging to be let through the gates.\n\nThe reports say they are terrified, claiming they were cornered on a frozen peninsula called Hardhome and slaughtered against the freezing sea. Most of the realm will ignore wildlings dying beyond the Wall, but I worry about the sheer panic spreading across the continent.\n\n#bold Something terrible has woken in the deep north.#!#!"
 ln_opening.3.desc.nobody:0 "#e I hear wild stories from merchants and wandering septons. They say thousands of wildlings are begging at the Wall, fleeing a horrific slaughter deep in the frozen north.\n\nPeople do not abandon their homes and walk that far for a ghost story. If the wildlings are terrified enough to beg the kneelers for mercy, we are all doomed.\n\n#bold The Long Night has begun.#!#!"
 ln_opening.3.a:0 "Every soul saved is one less soldier for the dead."
 ln_opening.3.b:0 "We can only save ourselves."

 # ── 4. THE TRUE ENEMY REVEALED (Deep Beyond the Wall) ───────────────
 ln_opening.4.t:0 "#e The True Enemy Revealed#!"
 ln_opening.4.desc:0 "#e A frantic mass-raven arrives from the maester at Castle Black, carrying a warning that will echo for a thousand years.\n\nA great ranging was sent deep into the freezing wastes of the Frostfangs to find what was driving the wildlings south. What they found was a slaughter. An army of dead men, stretching as far as the eye can see, marching through the haunted woods in total silence.\n\nThe myth was found hiding in the deep north, and now it knows we are watching.\n\n#bold The Others have returned. The Long Night has begun.#!#!"
 ln_opening.4.desc.watch:0 "#e We sent our best men deep into the Frostfangs. We had to know what was pushing the wildlings south.\n\nOnly a handful of riders made it back to the Wall. They were half-mad with frostbite and terror, babbling about an ocean of corpses marching through the deep woods. A hundred thousand dead men, perfectly still, moving as one.\n\nWe have sent ravens to every corner of the realm, begging them to understand the scale of what is coming.\n\n#bold The army of the dead is marching. The shield of men must hold.#!#!"
 ln_opening.4.desc.free_folk:0 "#e The crows finally went deep enough into the woods to see what we are running from.\n\nTheir great ranging was swallowed by the cold in the Frostfangs. The kneelers have finally seen the sheer size of the horde, and now they know their wall of ice will not be enough.\n\n#bold The dead are marching. No one is safe.#!#!"
 ln_opening.4.desc.north:0 "#e A raven bearing a black seal arrives from the Wall. The Watch's great ranging has been slaughtered deep in the Frostfangs.\n\nThe survivors claim to have seen a host of wights numbering in the hundreds of thousands, marching south through the haunted woods. The nightmare we have prepared for since the dawn of our House is no longer sleeping.\n\n#bold The Others have returned. Call the banners.#!#!"
 ln_opening.4.desc.dragon:0 "#e Word arrives from the North that a great ranging of Black Brothers found a colossal army of walking corpses deep in the Frostfangs.\n\nThey claim there are hundreds of thousands of them, a nightmare made flesh marching slowly through the snow. The hour of ice and fire is finally here.\n\n#bold The Great Other has revealed his host. It is time to rain fire upon them.#!#!"
 ln_opening.4.desc.red:0 "#e The Enemy of the Light has revealed his host. A terrified raven confirms that a ranging deep beyond the Wall has uncovered an ocean of the dead.\n\nOur prophecies spoke of this exact moment. The darkness gathers at the edge of the world, preparing to extinguish the living.\n\n#bold The Long Night has begun. We must find the Prince That Was Promised.#!#!"
 ln_opening.4.desc.lord:0 "#e The Citadel forwards a panicked missive from the Wall. A ranging party sent deep into the uncharted north has been all but wiped out.\n\nThe survivors claim to have seen an army of a hundred thousand corpses marching through the snow. My maester is trembling as he reads it. If even a fraction of this report is true, the realm is facing extinction.\n\n#bold The myths are real, and they are marching south.#!#!"
 ln_opening.4.desc.nobody:0 "#e The realm is gripped by a terrifying rumor. They say the Black Brothers went deep into the haunted woods and woke something ancient.\n\nTravelers are weeping in the taverns, claiming a ranging found a hundred thousand corpses marching through the deep snow. \n\n#bold The Long Night has begun. May the Gods help us all.#!#!"
 ln_opening.4.a:0 "May the Gods have mercy on us."
 ln_opening.4.b:0 "Steel and fire. It is the only way."

 # ── 5. A DEAD MAN IN THE CAPITAL ──────────────────────────────────────────────────────────────
 ln_opening.5.t:0 "#e A Dead Man in the Capital#!"
 ln_opening.5.desc:0 "#e The story reaches you the way the true ones always do—not as a song, but as a terrified whisper spreading across the realm. \n\nA brother of the Night's Watch walked into the throne room of the Iron Throne itself with a dead man on a chain, and asked the crown's leave to execute it. The headsman's work did nothing. The fire, eventually, did.\n\nSeveral hundred of the realm's finest watched a corpse refuse the sword. There is no laughing at the North this morning. There is no laughing anywhere.\n\n#bold The Others have returned, and The Long Night has begun.#!#!"
 ln_opening.5.desc.watch:0 "#e We have been sending that exact report south for a hundred years. It took sending a brother to drag a moving corpse into the capital to finally make them listen.\n\n#bold The realm sees the truth. Now they must fight.#!#!"
 ln_opening.5.desc.free_folk:0 "#e The kneelers needed a crow to bring a walking corpse into their fancy king's hall before they would finally believe us.\n\n#bold The dead do not care about thrones.#!#!"
 ln_opening.5.desc.north:0 "#e The Night's Watch has done the impossible. They hauled the proof south themselves.\n\nThe capital watched the dead rise with their own eyes when a Black Brother presented a wight to the Iron Throne. The snickering at our 'old nurses tales' has permanently ended.\n\n#bold The Others have returned. The North was right all along.#!#!"
 ln_opening.5.desc.dragon:0 "#e Word arrives from the capital that a brother of the Night's Watch brought a dead man to the court. \n\nThe realm watched fire finally kill the monster when the King's steel failed. Fools might call it a mummer's trick, but we ride dragons for crying out loud. I know exactly what this means. Magic is real, and the magic of Ice has risen to meet the magic of Fire.\n\n#bold The Long Night is here. Let them burn.#!#!"
 ln_opening.5.desc.red:0 "#e We have received word from the red priests in the capital. A Black Brother dragged a walking corpse before the Iron Throne.\n\nThe Crown's steel failed to kill the monster, and they were forced to use fire to cleanse the rot. My priests feel entirely vindicated, though there is no joy in it. The Lord of Light's truth is undeniable, and only His fire can banish this dark.\n\n#bold The Great Other is real. The War for the Dawn is nearing.#!#!"
 ln_opening.5.desc.lord:0 "#e My maester broke the seal on a raven from the capital this morning. His voice shook as he read the impossible words aloud.\n\nA brother of the Night's Watch presented a wight to the Crown itself. The letter details how the King's own headsman struck the creature, only for its severed hand to continue moving on the floor until it was finally burned to ash. The Citadel cannot dismiss an event witnessed by the entire court.\n\n#bold The Long Night has begun. The old myths were true.#!#!"
 ln_opening.5.desc.nobody:0 "#e Word is spreading like a plague from the capital. They say the Black Brothers dragged a monster in chains before the King.\n\nIf the King's own guards were afraid, what hope do the rest of us have?\n\n#bold I believed it a season ago. Now everyone else does.#!#!"
 ln_opening.5.desc.crown:0 "#e A brother of the Night's Watch stood before my throne today, travel-worn to rags, and asked leave to carry out an execution in my presence. \n\nThe thing he dragged in on a chain wore the shape of a man. It had been dead a long time. It was still moving.\n\nThe headsman took its head, and it kept moving. They took its right hand, and the hand kept moving separately, which was worse. What finally stopped it was fire, and my entire court watched it burn in absolute, horrified silence.\n\n#bold The Others have returned, and The Long Night has begun.#!#!"
 ln_opening.5.a:0 "Then it is true. The myths are real."
 ln_opening.5.b:0 "Prepare yourselves. We must fight."

 # -- MODIFIERS ---------------------------------------------------------------------------------------
 # 1.0.12 -- these two had NO English at all. ln_the_watch_knows_modifier is applied for twenty years to
 # the holder of Castle Black by the 20-weight "last ranging" opening (zz_ln_invasion_opening_effects.txt),
 # so it is live on the Workshop right now and English players have been reading the raw key name in the
 # character's modifier list. Russian had both strings; English had neither.
 ln_the_watch_knows_modifier:0 "The Watch Knows"
 ln_the_watch_knows_modifier_desc:0 "They opened the gate to their own brothers, and what came back through it was not their brothers. Whatever else happens on this Wall, that is the part that will be remembered."
