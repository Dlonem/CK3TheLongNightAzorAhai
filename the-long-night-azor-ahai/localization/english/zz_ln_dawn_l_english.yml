l_english:


 # AGOT: The Long Night & Azor Ahai -- the killing blow.

 ln_dawn.2.t:0 "The Field Afterwards"
 ln_dawn.2.a:0 "End it."
 ln_dawn.2.b:0 "Sound the retreat. Not today, and not with this."

 ln_dawn.2.desc.lightbringer:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you the way a man watches weather, and the cold coming off him is doing something to the air that makes it hard to look directly at.\n\nThe sword at your hip is warm. It has been warm since the night you finished it, and it has never once been warm at a convenient moment — it is warm now, in a field where every other living thing has gone quiet, and you understand that whatever you paid for it, this is the hour the price was for.\n\n#bold There will not be a better one.#!"
 ln_dawn.2.desc.dragon:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, and he is looking up. Not at you — at the thing above you, at the heat coming off it in waves that are turning the frost to fog for a hundred yards in every direction.\n\nYou have been told your whole life that dragons ended the last one. Nobody ever said whether the dragon survived it.\n\n#bold He is looking up. He has not looked away.#!"
 ln_dawn.2.desc.valyrian:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you with an expression that is not quite interest. Behind him the field is white and perfectly still.\n\nThe blade on your hip was folded in a city that has been ash for four hundred years, by men who knew things nobody has known since. It has cut through mail and bone and a great deal of ordinary steel, and you have never once needed it to be more than a very good sword.\n\n#bold Today is the day it either is or it is not.#!"
 ln_dawn.2.desc.glass:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and every man still on his feet behind you is holding a chipped black knife that the maesters said was a waste of good gold.\n\nIt shatters against mail. It will not hold an edge. The children of the forest used it for eight thousand years against something the Citadel is confident never existed, and you took the children's word.\n\n#bold Now you find out what that was worth.#!"
 ln_dawn.2.desc.named:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you. The priests have been saying your name for years — in temples, in market squares, to anyone who would hold still — and the thing in front of you does not appear to have heard any of it.\n\nYou have no sword the songs would recognise. You have what the songs said you were.\n\n#bold It is going to be one or the other, and you are about to find out which.#!"
 ln_dawn.2.desc.nothing:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and you are carrying a good sword that will do nothing at all.\n\nYou know this. Every man behind you knows it. Steel is for people. Whatever is standing in the middle of that field has not been a person for a very long time, and the only honest thing anyone could say about walking out to meet it is that somebody has to be first.\n\n#bold Somebody has to be first.#!"

 ln_dawn.3.t:0 "#e The Dawn#!"
 ln_dawn.3.desc:0 "#e It does not fall the way a man falls.\n\n There is a sound like a lake going over in spring, and then the shape in front of you comes apart — not into pieces, into weather, into a cold that goes through the field and out the other side and is simply gone.\n\n And behind it, all across the ice, the dead stop.\n\n Ten thousand of them, mid-stride, and then all of them at once going down into what they always were: somebody's brother, somebody's father, a boy from a village nobody has been able to find on a map for years. The field is suddenly very loud, because the living are still breathing and there is nothing else making any noise at all.\n\n Somebody is shouting your name. Somebody else has started to laugh, and cannot stop.\n\n #bold The Long Night is over, and you ended it.#!#!"
 ln_dawn.3.a:0 "Bring me every man who is still standing. I want their names."

 ln_dawn.4.t:0 "Not Enough"
 ln_dawn.4.desc.shield:0 "You get three steps.\n\nThe cold takes the breath out of you before the blow does — and the blow does not come, because [ln_dawn_shield.GetTitledFirstName|E] is in front of you.\n\n[ln_dawn_shield.GetSheHe|U] does not say anything clever. [ln_dawn_shield.GetSheHe|U] gets [ln_dawn_shield.GetHerHis] shield up, and holds, and is still holding when the thing goes through it and through [ln_dawn_shield.GetHerHim] and you are being dragged backwards by men shouting words you cannot hear.\n\nYou were not ready. [ln_dawn_shield.GetSheHe|U] knew that before you did, and did it anyway, and that is the entire difference between the two of you at this moment.\n\n#bold You are alive. Write down what [ln_dawn_shield.GetSheHe] did.#!"
 ln_dawn.4.desc.alone:0 "You get three steps.\n\nThe cold takes the breath out of you before the blow does, and after that the field is mostly noise and the ground being in the wrong place. Somebody has hold of your sword arm. Somebody is screaming at the horns.\n\nYou come to on a sledge with your own blood frozen down one side of your face and a great deal of it not yours, and the first thing you understand is that it let you go.\n\nNot spared. Released — the way a man puts down something he has finished looking at.\n\n#bold You are alive, and you have learned exactly what it costs to be wrong about this.#!"
 ln_dawn.4.a:0 "Then we do it again, and better."

 # -- THE MAN WHO HAS BEEN HERE BEFORE ------------------------------------------------------------------------
 # Both keep the opening line every other ln_dawn.2 branch opens with, on purpose: it is the same field.
 ln_dawn.2.desc.again:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and you have been exactly this close to him once before. You did not walk off that field so much as get taken off it, and what it cost to manage even that is not a thing you have ever said out loud.\n\nHe has not aged. He has not healed. He does not appear to remember you at all — you are the only one of the two of you keeping score.\n\nThere is nothing in your hands worth the name. But you know how it moves, and there is nobody else alive who does."
 ln_dawn.2.desc.twice:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you. The last time you stood in a field with this thing at the far end of it you gave the order to pull back — and your household went home alive, and you have spent every year since being told by men who were not there that it was the right call.\n\nYou are carrying a good sword that will do nothing at all. You were carrying one last time.\n\nThe difference is that every man behind you already knows what you did, and is waiting to find out whether you do it twice."

 # ── 1.0.13: WHAT ELSE THE FIELD KNOWS ABOUT YOU ────────────────────────────────
 ln_dawn.2.desc.spear:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and somewhere north of here is a shape you would know at any distance in any light, flying for him.\n\nYou have been closer to this thing than anyone alive. You were falling at the time. You remember the arm coming up, and the sound she made, and the ground arriving.\n\nHe knows you. You can tell by how still he is being."
 ln_dawn.2.desc.dawn:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and the sword in your hands is the colour of milk and starlight and does not belong to this century.\n\nDawn was quenched in a falling star before there were maesters to write it down. It asked nothing of you but everything of somebody, once, and it has been waiting the whole time for a morning exactly like this one.\n\nIt is not warm. It has never been warm. It is simply not going to break."
 ln_dawn.2.c:0 "I have already seen how this goes."
 ln_dawn.2.c_tt:0 "You have dreamed this field. You know which way he moves first.\n\n#weak Better odds than the blind version of the same fight — and knowing is not the same as being ready. You will carry it either way.#!"

