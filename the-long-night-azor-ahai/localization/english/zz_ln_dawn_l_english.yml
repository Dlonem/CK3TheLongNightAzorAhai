l_english:


 # AGOT: The Long Night & Azor Ahai -- the killing blow.

 ln_dawn.2.t:0 "The Field Afterwards"
 ln_dawn.2.a:0 "End it."
 ln_dawn.2.b:0 "Sound the retreat. Not today, and not with this."

 ln_dawn.2.desc.lightbringer:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you the way a man watches weather, and the cold coming off him is doing something to the air that makes it hard to look directly at.\n\nThe sword at your hip is warm. It has been warm since the night you finished it, and it has never once been warm at a convenient moment — it is warm now, in a field where every other living thing has gone quiet, and you understand that whatever you paid for it, this is the hour the price was for.\n\n#bold There will not be a better one.#!"
 ln_dawn.2.desc.dragon:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, and he is looking up. Not at you — at the thing above you, at the heat coming off it in waves that are turning the frost to fog for a hundred yards in every direction.\n\nYou have been told your whole life that dragons ended the last one. Nobody ever said whether the dragon survived it.\n\n#bold He is looking up. He has not looked away.#!"
 ln_dawn.2.desc.valyrian:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you with an expression that is not quite interest. Behind him the field is white and perfectly still.\n\nThe blade on your hip was folded in a city that has been ash for four hundred years, by men who knew things nobody has known since. It has cut through mail and bone and a great deal of ordinary steel, and you have never once needed it to be more than a very good sword.\n\n#bold Today is the day it either is or it is not.#!"
 ln_dawn.2.desc.glass:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and every man still on his feet behind you is holding a chipped black knife that the maesters said was a waste of good gold.\n\nIt shatters against mail. It will not hold an edge. The children of the forest used it for eight thousand years against something the Citadel is confident never existed, and you took the children's word.\n\n#bold Now you find out what that was worth.#!"
 ln_dawn.2.desc.named:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you. The priests have been saying your name for years — in temples, in market squares, to anyone who would hold still — and the thing in front of you does not appear to have heard any of it.\n\nYou have no sword the songs would recognise. You have what the songs said you were.\n\n#bold It is going to be one or the other, and you are about to find out which.#!"
 ln_dawn.2.desc.dragon_refused:0 "His host is broken and scattered across the ice, and he has not moved.\n\n[ln_dawn_dragon.GetTitledFirstName] is not here. [ln_dawn_dragon.GetSheHe|U] came as far as the Wall and stopped. Hissed, veered off, would not be made to go on — three times, and then not at all — and in the end you left [ln_dawn_dragon.GetHerHim] on the south side of it and walked the rest of the way north like everybody else.\n\nEverything you meant to do to the thing standing in the middle of that field, you meant to do from four hundred feet up.\n\n#bold You are on foot. He is looking straight at you.#!"
 ln_dawn.2.desc.nothing:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and you are carrying a good sword that will do nothing at all.\n\nYou know this. Every man behind you knows it. Steel is for people. Whatever is standing in the middle of that field has not been a person for a very long time, and the only honest thing anyone could say about walking out to meet it is that somebody has to be first.\n\n#bold Somebody has to be first.#!"

 ln_dawn.3.t:0 "#e The Dawn#!"
 ln_dawn.3.desc:0 "#e It does not fall the way a man falls.\n\n There is a sound like a lake going over in spring, and then the shape in front of you comes apart — not into pieces, into weather, into a cold that goes through the field and out the other side and is simply gone.\n\n And behind it, all across the ice, the dead stop.\n\n Ten thousand of them, mid-stride, and then all of them at once going down into what they always were: somebody's brother, somebody's father, a boy from a village nobody has been able to find on a map for years. The field is suddenly very loud, because the living are still breathing and there is nothing else making any noise at all.\n\n Somebody is shouting your name. Somebody else has started to laugh, and cannot stop.\n\n #bold The Long Night is over, and you ended it.#!#!"
 ln_dawn.3.a:0 "Bring me every man who is still standing. I want their names."

 ln_dawn.4.t:0 "Not Enough"
 ln_dawn.4.desc.shield:0 "You get three steps.\n\nThe cold takes the breath out of you before the blow does — and the blow does not come, because [ln_dawn_shield.GetTitledFirstName|E] is in front of you.\n\n[ln_dawn_shield.GetSheHe|U] does not say anything clever. [ln_dawn_shield.GetSheHe|U] gets [ln_dawn_shield.GetHerHis] shield up, and holds, and is still holding when the thing goes through it and through [ln_dawn_shield.GetHerHim] and you are being dragged backwards by men shouting words you cannot hear.\n\nYou were not ready. [ln_dawn_shield.GetSheHe|U] knew that before you did, and did it anyway, and that is the entire difference between the two of you at this moment.\n\n#bold You are alive. Write down what [ln_dawn_shield.GetSheHe] did.#!"
 ln_dawn.4.desc.alone:0 "You get three steps.\n\nThe cold takes the breath out of you before the blow does, and after that the field is mostly noise and the ground being in the wrong place. Somebody has hold of your sword arm. Somebody is screaming at the horns.\n\nYou come to on a sledge with your own blood frozen down one side of your face and a great deal of it not yours, and the first thing you understand is that it let you go.\n\nNot spared. Released — the way a man puts down something he has finished looking at.\n\n#bold You are alive, and you have learned exactly what it costs to be wrong about this.#!"
 ln_dawn.4.a:0 "Then we do it again, and better."

 # -- THE MAN WHO HAS BEEN HERE BEFORE ------------------------------------------------------------------------
 # Both keep the opening line every other ln_dawn.2 branch opens with, on purpose: it is the same field.
 ln_dawn.2.desc.again:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and you have been exactly this close to him once before. You did not walk off that field so much as get taken off it, and what it cost to manage even that is not a thing you have ever said out loud.\n\nHe has not aged. He has not healed. He does not appear to remember you at all — you are the only one of the two of you keeping score.\n\nThere is nothing in your hands worth the name. But you know how it moves, and there is nobody else alive who does."
 ln_dawn.2.desc.twice:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you. The last time you stood in a field with this thing at the far end of it you gave the order to pull back — and your household went home alive, and you have spent every year since being told by men who were not there that it was the right call.\n\nYou are carrying a good sword that will do nothing at all. You were carrying one last time.\n\nThe difference is that every man behind you already knows what you did, and is waiting to find out whether you do it twice."

 # ── 1.0.13: WHAT ELSE THE FIELD KNOWS ABOUT YOU ────────────────────────────────
 ln_dawn.2.desc.spear:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and somewhere north of here is a shape you would know at any distance in any light, flying for him.\n\nYou have been closer to this thing than anyone alive. You were falling at the time. You remember the arm coming up, and the sound [ln_spear_dragon.GetFirstName] made, and the ground arriving.\n\nHe knows you. You can tell by how still he is being."
 ln_dawn.2.desc.spear_unnamed:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and somewhere north of here is a shape you would know at any distance in any light, flying for him.\n\nYou have been closer to this thing than anyone alive. You were falling at the time. You remember the arm coming up, and the sound your dragon made, and the ground arriving.\n\nHe knows you. You can tell by how still he is being."
 ln_dawn.2.desc.dawn:0 "His host is broken and scattered across the ice, and he has not moved.\n\nHe is standing where the line was, watching you, and the sword in your hands is the colour of milk and starlight and does not belong to this century.\n\nDawn was quenched in a falling star before there were maesters to write it down. It asked nothing of you but everything of somebody, once, and it has been waiting the whole time for a morning exactly like this one.\n\nIt is not warm. It has never been warm. It is simply not going to break."
 ln_dawn.2.c:0 "I have already seen how this goes."
 ln_dawn.2.c_tt:0 "You have dreamed this field. You know which way he moves first.\n\n#weak Better odds than the blind version of the same fight — and knowing is not the same as being ready. You will carry it either way.#!"


 # ── 1.0.15 -- the ending funnel ─────────────────────────────────────────────────────────────────────────

 ln_dawn.11.t:0 "The Last Hour"
 ln_dawn.11.desc.field_lb:0 "The war is decided. The hosts of the dead are broken, scattered, burned in windrows along the ice — and their king stands alone in the ruin of them, and looks at nothing but you.\n\nMen have died in numbers no maester will ever count true to bring this hour about, and it comes down, in the end, to a small circle of trampled snow and a sword that has been warm at your hip since the day you finished it.\n\nThe others hang back. Nobody has ordered them to. They can feel it the way cattle feel weather — that whatever happens in the next minute is not for them.\n\n#bold The war is won. This is the part that was never about the war.#!"
 ln_dawn.11.desc.field_plain:0 "The war is decided. The hosts of the dead are broken, scattered, burned in windrows along the ice — and their king stands alone in the ruin of them, and looks at nothing but you.\n\nOut of every hand that held a sword in this war — the named, the anointed, the ones the priests were so sure about — the hour has picked yours. No song prepared you for it. Perhaps that is what the songs were always for: the man they never mention.\n\nThe others hang back. Nobody ordered them to.\n\n#bold The war is won. This is the part that was never about the war.#!"
 ln_dawn.11.desc.chains_lb:0 "They brought him in chained in old iron and dragonglass, and the cold came in with him.\n\nThree days he has stood in your cells, and nothing about him has done what a prisoner does. He does not eat. He does not sleep. The guards have stopped drawing lots to bring him water, because the water is ice before it reaches the door.\n\nThere is one thing in this castle that has an answer to him, and it has been warm in its scabbard since the hour they dragged him through your gates.\n\n#bold A cell cannot hold winter. End it while it is yours to end.#!"
 ln_dawn.11.desc.chains_plain:0 "They brought him in chained in old iron and dragonglass, and the cold came in with him.\n\nThree days he has stood in your cells, and nothing about him has done what a prisoner does. He does not eat. He does not sleep. He watches the door — not the way a man watches for rescue, but the way the sea watches a harbour wall.\n\nEvery hour he stands there the frost climbs another stone, and every man in your keep knows where it is coming from.\n\n#bold A cell cannot hold winter. End it while it is yours to end.#!"
 # 1.0.16 -- WAS "End the Long Night." Thomas: "I don't like that one text for the one event about end it.
 # If anything, it should read more attempt to end it or like go in for the kill." The old text PROMISED an
 # outcome, and the old option delivered one with no roll -- which is exactly what MPREG reported as a
 # missing duel. ln_dawn.11.a is a duel now, so the button promises an attempt and nothing more.
 ln_dawn.11.a:0 "Go in for the kill."
 # The two duel outcome labels, matching ln_dawn.2.duel.win / .lose in voice: bare, present tense, no drama
 # in the label itself because the card around it is already carrying all of it.
 ln_dawn.11.duel.win:0 "Finish him"
 ln_dawn.11.duel.lose:0 "He is faster than you"
 ln_dawn.11.b:0 "This hour belongs to another. Send for them."

 ln_dawn.20.t:0 "The Thing in Your Cells"
 ln_dawn.20.desc.other:0 "Your gaoler has served this keep for thirty years, and this morning he would not go down the stair alone.\n\nThe thing you took alive stands in the middle of its cell — has stood, since they closed the door, in the exact middle, as far from every wall as a thing can be. Frost has climbed the stones around it in patterns that no one has been willing to look at for long. It has not asked for ransom. It has not asked for trial. It has not made a sound.\n\nIt is waiting, and everyone in your keep can feel what for.\n\n#bold The cold does not surrender. It only waits.#!"
 ln_dawn.20.desc.wight:0 "It has been dead for some time. That is the problem.\n\nThe thing your men dragged in does not stop moving. It worked at the chains until the flesh came off the bone and then it kept working, and the sound of it — patient, tireless, all night — has emptied the cells on either side. The gaoler asks, respectfully, whether my lord intends to keep it, and if so whether my lord would care to listen to it for an hour first.\n\n#bold Meat does not stop. Fire stops it.#!"
 # ── and whether you knew it. Appended under either base card; see the note in ln_dawn.20. ──
 ln_dawn.20.desc.knew_spouse:0 "\n\n#EMP You were married to it.#!\n\nTwo of your household know that. Neither has been able to look at you since the cart came through the gate, and you have not gone down to the cells, and every man in this keep knows exactly why the order has not been given yet.\n\nNobody ever laid [ln_captured_other.GetHerHim] out. [ln_captured_other.GetSheHe|U] is still wearing what you last saw [ln_captured_other.GetHerHim] in."
 ln_dawn.20.desc.knew_lover:0 "\n\n#EMP You knew it, and not the way you know your bannermen.#!\n\nThere was a version of this where you never had to find out what happened after. That version ended when your men brought the cart through the gate and somebody said a name aloud in the yard, and then said it again, quieter, because the first time had not sounded like a question.\n\nIt does not know you. That is the part you will keep."
 ln_dawn.20.desc.knew_blood:0 "\n\n#EMP It is your blood.#!\n\nYour house has a crypt and a mason and eight hundred years of practice at burying its own, and none of that is any use here, because the thing in the cell is standing up. The septon has been consulted and has gone away to consult somebody else.\n\nWhatever you decide, it will be written down with your name beside it, and your grandchildren will read it."
 ln_dawn.20.desc.knew_friend:0 "\n\n#EMP You knew it. You used to know it well.#!\n\nIt drank in your hall. It has an opinion about your steward that you still repeat. Somebody in the barracks was telling that story last month, and now nobody is telling it, and the silence has a shape.\n\nYou have put down a dozen of these and thought nothing of it. That was the point of the dozen."
 ln_dawn.20.desc.knew_nobody:0 ""
 ln_dawn.20.a:0 "Put it to the sword. Now."
 ln_dawn.20.b:0 "Keep it below. Let the realm know what I hold."

 # ── 1.0.15b -- the bane rule ────────────────────────────────────────────────────────────────────────────
 ln_dawn.11.c:0 "We have nothing that can end him. Break off."
 ln_dawn.11.c_tt:0 "Only #bold dragonglass#!, #bold Valyrian steel#! or #bold dragonfire#! can destroy him. You carry none of the three.\n\nThe war is won either way — but the Long Night does not end until he does."

 # ── 1.0.15 -- the duel, on the engine's own duelling mechanic ───────────────────────────────────────────
 ln_dawn.2.duel.win:0 "Land the blow"
 ln_dawn.2.duel.lose:0 "Fall short"
 ln_dawn.2.d:0 "Go out there anyway. Somebody has to be first."
 ln_dawn.2.d_tt:0 "You carry nothing that can harm him — not #bold dragonglass#!, not #bold Valyrian steel#!, and no dragon above you.\n\nYou will not kill him today. Men will remember that you walked out there."
 # ── 1.1.3 -- the cast-down card: he is not destroyed ─────────────────────────────────────────────────
 ln_dawn.30.t:0 "He Is Not Destroyed"
 ln_dawn.30.desc.dragon:0 "The Night King fell to [ln_dawn30_killer.GetFirstName]'s fire in the press of a battle, and the dead did not stop. Within days he stood among them again, the same face, the same cold.\n\nA dragon in the press of battle is not enough. He has to be faced.\n\n"
 ln_dawn.30.desc.bane:0 "[ln_dawn30_killer.GetTitledFirstName] struck the Night King down with something that could have ended him, in the wrong place at the wrong hour, and the dead did not stop. Within days he stood among them again, the same face, the same cold.\n\nThe right weapon is not enough. He has to be faced.\n\n"
 ln_dawn.30.desc.nokiller:0 "The Night King is dead, and no hand claims it. The dead did not stop. Within days he stood among them again, the same face, the same cold.\n\nWhatever ended the body did not end what wore it.\n\n"
 ln_dawn.30.desc:0 "The Night King fell, and the dead did not stop. Within days he stood among them again, the same face, the same cold.\n\nSteel ends the body. It does not end what wears it.\n\n"
 ln_dawn.30.desc.rule.death:0 "He is destroyed only when he is faced — in the field after his host is broken, cornered after a lost War for the Dawn, or in chains — by a hand carrying dragonglass, Valyrian steel or Lightbringer, or with a dragon overhead. Any other death only casts him down."
 ln_dawn.30.desc.rule.war:0 "In this world the dark lifts only when the War for the Dawn is won and he is faced at the end of it, by a hand carrying dragonglass, Valyrian steel or Lightbringer, or with a dragon overhead. Any death before that only casts him down."
 ln_dawn.30.desc.beaten:0 "\n\nThe War for the Dawn can now be called."
 ln_dawn.30.desc.notbeaten:0 ""
 ln_dawn.30.a:0 "Then it is not over."
