l_english:

 ln_intro.1.t:0 "What They Say in Your Hall"

 # Every branch below is what the PLAYER'S COURT believes, not what is true. None of them names the Long Night.

 ln_intro.1.desc.watch:0 "#e I stare at the ledgers. We have fewer men than anyone south of the Wall can fathom.\n\nRangings go out, and a smaller fraction returns every decade. Brothers stagger back from the haunted woods, lips sealed about what turned them around—or they babble contradictions so wild the Lord Commander has stopped recording them.\n\nThe Citadel insists the North is simply cold, and men die in it. They aren't wrong, but it isn't an explanation as to why the bodies of the fallen can never be recovered.\n\nThe Watch is only several hundred men strong. This Wall was built for twenty thousand.#!"

 ln_intro.1.desc.free_folk:0 "#e My people do not need to be told.\n\nWe have moved our camps three times in a generation—always south. The elders whisper their reasons carefully, leaving quiet offerings so as not to anger the dead, while the young foolishly dismiss it as mere weather. But there are valleys we no longer winter in. There are names my grandmother would not dare utter after dark, and she feared nothing.\n\nThe kneelers cowering behind their wall of ice think we are just raiders. I would tell them the truth, if they ever bothered to ask.#!"

 ln_intro.1.desc.north:0 "#e The wet nurses love to tell the old tales, speaking them badly on purpose to scare a child into obedience before bed.\n\nThey speak of a winter that lasted a generation. A freezing dark that hid walking corpses, and a last hero venturing into the dead lands with a shattered sword.\n\nWe are taught to dismiss these as mere fables. Yet, I also know that every Northern house that has held its seat for eight thousand years built its walls thickest on the north-facing side. Nobody has ever been able to tell me why.#!"

 ln_intro.1.desc.dragon:0 "#e There is a secret in the blood of Old Valyria, though I am no longer certain we still grasp it.\n\nAegon the Conqueror left behind a dream, passed from ruler to heir. Whether the one who sits the Iron Throne today has heard it, or believes it, I cannot say.\n\nThose of us who share the blood of the dragon only know the shape of it: a darkness rising from the farthest North. A song of ice and fire. Something dragonriders are meant to stand against in a century no one bothered to specify.\n\nI often wonder if our ancestors stopped speaking of it because the duty was fulfilled—or because the nightmare hasn't started yet.#!"

 ln_intro.1.desc.red:0 "#e My red priest is absolutely certain, and that is precisely the problem.\n\nThe night is dark and full of terrors, they say. The Night King stirs in the bitter cold, and an ancient prophecy foretells that a champion will be reborn amidst salt and smoke. My priest can recite the holy verses flawlessly, even predicting the exact hour of our deliverance.\n\nOf course, they also predicted three previous exact hours, named two previous champions, and I have buried both.\n\nThe flames do not lie, but they show a great deal, and priests are only mortal men choosing what they wish to see. Something is coming. But everything my faith claims about its shape feels like a desperate guess by someone who badly wants to be right.#!"

 ln_intro.1.desc.lord:0 "#e My maester mentioned it once, in that tedious way maesters do—buried in a subordinate clause at the end of a long, dry parchment comparing our current grain yields to historical anomalies.\n\nHe cited 'the Long Night' as the ultimate example of poor harvests. Eight, six, or twelve thousand years ago; the Citadel cannot agree and finds the academic dispute far more interesting than the event itself. A generation of winter. Deaths beyond counting. Nonsense about the dead rising, which the learned men of Oldtown confidently assure me is just a crude historical metaphor for famine.\n\nI did not read to the end of the parchment. There were more pressing matters then, just as there are now. The frozen wastes of the North have never been my problem.#!"

 ln_intro.1.desc.nobody:0 "#e No one has warned me of anything, because there is nothing to tell.\n\nThe summers are delightfully long, the harvests overflow the granaries, and the roads are safe enough that merchants complain about tolls instead of cutthroats. Men of my age have never seen a true winter. The greybeards describe the cold the way sailors describe legendary storms—as something survived, and greatly exaggerated in the telling.\n\nSomewhere far to the north, I am told there is a giant wall of ice. I have never had cause to wonder why.#!"

 ln_intro.1.a:0 "Send a raven to the Citadel and ask what the records say."
 ln_intro.1.b:0 "The world is full of ancient myths, and this one can wait."