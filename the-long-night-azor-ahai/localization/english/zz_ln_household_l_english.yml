l_english:

 # AGOT: The Long Night & Azor Ahai -- household administration.
 # Deliberately dull where it can be. Nothing here should read as remarkable to a player who is not
 # looking for it -- an estate in order, a house writing itself down, a ship coming home late.

 ln_household_ledger_decision:0 "Take Up the Household Ledger"
 ln_household_ledger_decision_desc:0 "The accounts have gone unread for years. Rents uncollected, debts unchased, servants unthanked.\n\nAn afternoon with the ledger and the steward, and the house is in order again — the coin that was owed you found, and the men who kept faith through the lean years marked down as men who kept faith. Some of them will need reminding what they are worth. One or two will need reminding what they are not."
 ln_household_ledger_decision_tt:0 "Set the household in order."
 ln_household_ledger_decision_confirm:0 "Send for the steward"

 ln_household_charter_decision:0 "Set Down the House Charter"
 ln_household_charter_decision_desc:0 "Every house that lasts writes itself down at some point — what it is for, what it will not do, and what it expects of the ones who come after.\n\nMost never bother, and most are forgotten inside three generations. Yours will not be."
 ln_household_charter_decision_tt:0 "Commit the house to writing."
 ln_household_charter_decision_confirm:0 "Write it down"

 ln_household_valyria_decision:0 "A Sail Out of the Smoking Sea"
 ln_household_valyria_decision_desc:0 "She was written off years ago — a hired cog out of Volantis with a captain fool enough to take a Freehold charter and a crew fool enough to sign it. Nobody sails east of the Smoking Sea and comes back. That is not superstition; it is arithmetic.\n\nShe came back.\n\nWhat is left of her crew will not say what they saw past the ash banks, and the captain will not come ashore at all. But the hold was opened on the dock in front of witnesses: a chest of old coin, still bright; a blade of rippled steel that no smith living could have folded; and packed in sand at the bottom, in a nest of oiled cloth, two eggs — heavy as stone, warm as sleeping things.\n\nThe captain asks no payment. He asks only that you take it all off his ship tonight, and that his name be struck from the charter. Something in the hold has been keeping him awake, and he has decided it was looking for a family, not a fortune."
 ln_household_valyria_decision_tt:0 "Receive what the ship carried home."
 ln_household_valyria_decision_confirm:0 "Have it brought ashore"

 # Retained for saves that still carry it. No decision applies or reads this any more.
 ln_household_ledger_cooldown_modifier:0 "Accounts Settled"
 ln_household_ledger_cooldown_modifier_desc:0 "The household books were balanced recently. There is nothing left to find in them for a while yet."

 # ── THE SHIP'S MANIFEST, IN PLAIN WORDS (1.0.12b) ──────────────────────────────
 ln_valyria_sword_tt:0 "A #bold Valyrian steel blade#! of uncertain make comes off the ship, into your trunk — the blade in your hand stays in your hand."
 ln_valyria_eggs_tt:0 "#bold Two dragon eggs#!, colours unknown until they are unwrapped."
 ln_valyria_dragon_tt:0 "If a living dragon is bonded to you, it is fed and flown: it grows, quickens, and its constitution improves one step — and the blood of the dragon is confirmed in your line."

 # ── THE FOURTH DOOR (1.0.12b) ───────────────────────────────────────────────────
 ln_household_mend_decision:0 "Send for the House's Physician"
 ln_household_mend_decision_desc:0 "The household keeps its own physician, and he asks no questions the ledger has not already answered. Wounds close, fevers break, and the body is given back the years the story took from it.\n\nWhat he cannot mend is a name. What people say about you, you keep."
 ln_household_mend_decision_tt:0 "Mend the body — wounds, scars, sickness and the weight on the mind."
 ln_household_mend_decision_confirm:0 "Let him work."
 ln_household_mend_effect_tt:0 "Every wound, scar, sickness and infirmity is healed, and #V 100#! stress is lifted. Nicknames, reputation and the prophecy are untouched."

