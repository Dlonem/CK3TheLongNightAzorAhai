l_english:

 # ── The Long Night begins again ─────────────────────────────────────────────────────────────────────────────
 # Only ever seen with the "The Cycle" game rule on. Wave 1 uses the original others.2.desc.

 ln_others.2.desc.wave_again:0 "#e The ravens go out before the riders do, and the maesters do not argue about what the reports mean. There is no argument left to have.\n\n It has happened before. Not in living memory — the last man who saw it died before anyone now breathing was born — but the Citadel keeps its records, and the North keeps its stories, and for once the two agree.\n\n The wildlings are already moving south. They did not wait to be sure.\n\n #bold The Others have returned. The Long Night has come again.#!#!"

 ln_others.2.desc.wave_late:0 "#e There is a word for it now, in every tongue from Oldtown to Asshai, and children learn it before they learn to count.\n\n The North keeps its ruins the way other lands keep monuments. Half the great seats in Westeros are names on a map and a pile of stone, and every one of them was lost in a winter men swore would be the last.\n\n Nobody sends ravens asking whether it is true. They send ravens asking how long they have.\n\n #bold The Others have returned. They have never really left.#!#!"

 ln_others.2.desc.wave_last:0 "#e There is not much left to take.\n\n The maps in the Citadel are mostly blank now, and the maesters have stopped redrawing them. What survives of the realm survives because the dead have not yet bothered with it.\n\n No one asks who Azor Ahai was any more. They ask whether he was ever anyone at all, and whether the prophecy was only ever a story the living told each other so they could sleep.\n\n #bold The Others have returned. This is very likely the last time it will matter.#!#!"

 # ── The dawn, under the cycle ───────────────────────────────────────────────────────────────────────────────
 ln_others.3.desc.cycle:0 "#BER The dead lie still. The cold breaks. Somewhere south of the Neck the first green shows through, and men who have not slept properly in years finally do.\n\n It is not over. It has never once been over.\n\n The maesters will write down the year, as they wrote down the last one, and someone a century from now will read it and think it a very long time ago. The realm has perhaps three generations to become something that can do better than survive.\n\n #bold Spring has come. Make it count.#!"

 # ── DAWN CARD, BRANCHED ON HOW THE DARK ARRIVED (global_var:ln_invasion_opening) ─────────────────────────────
 ln_others.3.desc.wall:0 "#BER The dead lie still. The cold breaks. Somewhere south of the Neck the first green shows through, and men who have not slept properly in years finally do.\n\nThere is a gap at Castle Black seven hundred feet deep and a hundred yards wide, and the wind comes through it exactly as it did on the day it opened. Nobody has any idea how to close it. The honest answer, which nobody will say to a king, is that the men who built it are eight thousand years dead and did not write it down.\n\nSpring has come to a realm with a hole in its northern wall.\n\n#bold It is over. It is not fixed.#!"

 ln_others.3.desc.inside:0 "#BER The dead lie still. The cold breaks. The first green shows, and men who have not slept properly in years finally do.\n\nNobody in this realm will be able to look at a stranger the same way again. It did not come over the Wall — it was already here, in a hall, wearing a face somebody trusted, and it had been for longer than anyone has managed to establish.\n\nThe maesters would like to determine how long. The lords would prefer they did not, because every one of them is quietly counting back through their own household and not liking the arithmetic.\n\n#bold Spring has come. Nobody is going to sleep with the door open again.#!"

 ln_others.3.desc.exodus:0 "#BER The dead lie still. The cold breaks. The first green shows through, and men who have not slept properly in years finally do.\n\n The free folk are still here. Tens of thousands of them, south of a Wall they came over running, in a realm that spent eight thousand years building that Wall specifically to keep them out — and which then spent this war finding out they were the only people in the world who had been telling the truth about what was behind them.\n\n Nobody has worked out what happens next. There is not a precedent in the Citadel for any of it.\n\n #bold Spring has come, and the map is going to have to be redrawn.#!"

 ln_others.3.desc.ranging:0 "#BER The dead lie still. The cold breaks. The first green shows through, and men who have not slept properly in years finally do.\n\n It started with a ranging that came back wrong, and there are men alive who were at Castle Black the night it walked in, and none of them have ever been able to describe it in a way that satisfies anyone who was not.\n\n The Watch has the record. Six names, a date, and four words in a clerk's hand that the Lord Commander has since ordered copied into every castle along the Wall, because it is the only warning anyone got and nobody acted on it.\n\n #bold Spring has come. Read the ledgers next time.#!"

 # ── WHAT THE WORLD REMEMBERS OF THE LAST DAWN ───────────────────────────────────────────────────────────────
 # Written against design-backlog-additions.md LN-021: "ship three excellent branches, not ten serviceable
 # ones." [ln_last_dawn_dragon.GetName] resolves generations later because the dragon is locked unpruneable at
 # the moment of the dawn. The champion's name comes back the same way.
 ln_others.2.desc.dragon_lives:0 "#e They have come back, and so has [ln_last_dawn_dragon.GetSheHe].\n\n [ln_last_dawn_dragon.GetName|E] was there the last time. Old men who were boys then still describe the shadow going over, and the sound the dead made when the fire reached them — a sound they say was not screaming, because screaming is something the living do.\n\n [ln_last_dawn_dragon.GetSheHe|U] is still in the world. Older, slower, and the only creature under the sky that has done this before.\n\n #bold The Others have returned. So has the dragon that ended them.#!#!"
 ln_others.2.desc.dragon_dead:0 "#e They have come back. [ln_last_dawn_dragon.GetName|E] has not.\n\n The last Long Night ended from a dragon's back, and every account of it agrees on the same picture: the ice going dark under the fire, and the thing in the middle of it finally stopping. That dragon is bones now, in a hall or a barrow or the bottom of a bay, depending on which maester you ask.\n\n There are dragons in the world still. Nobody alive knows whether that is the same thing.\n\n #bold The Others have returned, and the one that beat them last time is not coming.#!#!"
 ln_others.2.desc.dragon_gone:0 "#e They have come back. There is nothing in the sky.\n\n [ln_last_dawn_dragon.GetName|E] ended the last one. There is no [ln_last_dawn_dragon.GetName|E] now, and no other either — the world let the last of them go the way it lets everything go, slowly and without deciding to.\n\n The men who will fight this one have read about fire. That is the whole of their preparation.\n\n #bold The Others have returned, and this time the sky is empty.#!#!"
 ln_others.2.desc.champion_lives:0 "#e They have come back, and the one who stopped them last time is still alive to hear it.\n\n [ln_last_dawn_champion.GetTitledFirstName|E] did it once. The realm has spent the years since deciding what that was worth — a saviour, a lucky one, a story that got out of hand — and every one of those arguments ends today.\n\n [ln_last_dawn_champion.GetSheHe|U] knows something nobody else in the world knows: what it costs, and whether [ln_last_dawn_champion.GetSheHe] has it twice.\n\n #bold The Others have returned. So has [ln_last_dawn_champion.GetSheHe].#!#!"

 # -- HOW LONG AGO, AND WHETHER THE PROPHECY WORKED -----------------------------------------------------------
 # Trigger-driven, no interpolation: see the note on the desc block in others_events.txt.
 ln_others.2.desc.living_memory:0 "#e They have come back, and this time there are men in the hall who remember the last one.\n\n Not from a book. Not from a song. They were boys when the dark broke, and they have spent every year since being asked what it was like by people who could not possibly understand the answer — and now they are the only ones in the room whose hands are steady, because they are also the only ones who already know how it ends.\n\n They know one other thing, which none of them has been saying: it was not supposed to be able to do this twice in a lifetime.\n\n #bold The Others have returned, inside one lifetime.#!#!"
 ln_others.2.desc.named_true:0 "#e They have come back, and the priests are already speaking.\n\n Last time they were right. That is the thing the Citadel has never been able to discuss comfortably — the red temples named a man, and the man went north, and the dark ended. Whatever anyone thinks of R'hllor, the record is the record.\n\n So when a priest stands up in a market square this winter and says a name, nobody is going to laugh. It will be written down, the man will be found, and a very great deal will be expected of him very quickly.\n\n #bold The Others have returned. Last time, the prophecy was true.#!#!"
 ln_others.2.desc.named_false:0 "#e They have come back, and nobody is listening to the priests.\n\n Last time the red temples named a dozen men. They named princes and bastards and a girl in Volantis, and they were certain about every one of them — and the dark was ended by somebody they had never once mentioned, a man with no prophecy on him at all, who happened to be standing there.\n\n The priests have explanations. They have had a long time to work on them.\n\n #bold The Others have returned. Last time, it was nobody the songs had chosen.#!#!"

 ln_others.3.desc.proof:0 "#BER The dead lie still. The cold breaks. Somewhere south of the Neck the first green shows through, and men who have not slept properly in years finally do.\n\nThis was the war nobody could pretend was rumour. It began in a throne room, with a corpse that would not die and a court that watched it burn — the realm believed from the first day, and it still very nearly was not enough.\n\nThe maesters will write down the year. The realm has perhaps three generations to become something that can do better than believe in time.\n\nSpring has come. Make it count.#!"
