l_english:

 # The rider who lived while his dragon did not -- fired from ln_the_dead_claim_dragon_effect.
 ln_dragonfall.1.t:0 "The Wrong Colour"
 ln_dragonfall.1.desc:0 "[ln_cold_dragon.GetFirstName] fell. There is no kinder word for it -- the wings folded wrong, the snow came up, and something that had carried [ROOT.Char.GetHerHis] whole life on its back hit the earth like a keep falling over.\n\n[ROOT.Char.GetSheHe|U] did not look away, and so [ROOT.Char.GetSheHe] saw the rest of it. The dead walked to the body without hurry, the way men walk to a table that is already laid. And then [ln_cold_dragon.GetFirstName] stood up.\n\nThe shape is right. The shape is exactly right, that is the worst of it. But the scales have gone the grey of week-old ice, and the eyes that found [ROOT.Char.GetHerHim] across every field in the world are a blind, boiled blue -- and they passed over [ROOT.Char.GetHerHim] like [ROOT.Char.GetSheHe] was ground."
 ln_dragonfall.1.a:0 "[ln_cold_dragon.GetSheHe|U] will know me. Even now."
 ln_dragonfall.1.b:0 "That is not [ln_cold_dragon.GetHerHim]. Kill it twice."
