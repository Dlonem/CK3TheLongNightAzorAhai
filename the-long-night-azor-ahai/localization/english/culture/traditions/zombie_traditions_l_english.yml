l_english:

 # 1.0.16 -- these six were all the placeholder string "Winter". That was harmless while the traditions were
 # assigned to nothing; as of 1.0.16 frostborn carries all three (common/culture/cultures/00_other_culture.txt),
 # so they are on the culture screen, in tooltips, and in the culture window for anyone who inspects the
 # Others -- which is exactly what Zobertus was doing when he found the innovation gap.
 tradition_others_name:0 "The Long Cold"
 tradition_others_desc:0 "They are not a people. They do not marry out, take counsel, or change their minds, and nothing that lives has ever persuaded one of anything. What they have instead of a culture is a direction, and it is south."

 tradition_others2_name:0 "No Terms"
 tradition_others2_desc:0 "There is no embassy to send and no price to pay. They take what they walk over, they keep coming through a winter that would end an army, and the only conversation anyone has ever had with them was held at sword's length."

 tradition_others3_name:0 "The Dead Do Not Tire"
 tradition_others3_desc:0 "Every hold they take stands back up and walks behind them. Losses do not weaken this army in the way losses weaken yours — they are the mechanism by which it grows."

 # `other_parameter` is a culture PARAMETER, and CK3 renders those as culture_parameter_<name> -- the same
 # bare-in-script / prefixed-in-loc convention as struggle parameters (see
 # zz_ln_struggle_parameters_l_english.yml). The prefixed key already exists in
 # culture/other_maa_innovations_l_english.yml. The bare one below is KEPT, not deleted, per the standing
 # rule now written into common/genes/zz_long_night_genes.txt: deprecate, never delete.
 other_parameter:0 "Cannot be reasoned with, bargained with, or outlasted"
