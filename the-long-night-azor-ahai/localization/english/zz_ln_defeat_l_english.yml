l_english:

 # AGOT: The Long Night & Azor Ahai -- the long defeat, and meeting your own dead.

 ln_defeat.1.t:0 "#e The Long Defeat#!"
 ln_defeat.1.desc:0 "#e Nobody declares it. There is no raven, and no last stand worth the name — only a season that does not turn, and then another, and then a generation of them.\n\n The maesters stopped issuing the winter count some years ago. There was no announcement about that either. The last man who remembered a harvest died in the spring that was not a spring, and the children being born now will grow up believing the grey overhead is simply what the sky is.\n\n Somewhere north of everything, in a hall of ice that used to be a castle, a king who does not eat or sleep or age is holding a realm larger than any Targaryen ever managed, and he is not in a hurry, because he has already won and only the living are still finding that out.\n\n #bold The Long Night did not end. It became the world.#!#!"
 ln_defeat.1.desc.watch:0 "#e You are the Night's Watch. You were the shield that guards the realms of men.\n\n There is no realm left to guard and there are no men to speak of, and the vow — the one they made you say in the snow with your hands cold on a sword you had not earned yet — turns out to have been a description of a job that could be lost.\n\n Nineteen castles. You could not hold one. Whatever is left of the order is a few dozen men in a broken keep who keep the fires going out of habit, and who no longer bother sending rangers north, because north is everywhere now.\n\n #bold The night that came was the one in the stories. Nobody was ready, and it did not wait.#!#!"
 ln_defeat.1.desc.named:0 "#e The priests named you. They were wrong, or you were, or the fire was — and the distinction has stopped mattering to anyone but you.\n\n There is no prophecy left to argue about. There is a frozen continent held by a king who was never promised anything and did not need to be, and there is you, alive, which the songs never covered.\n\n Somewhere in a red temple that is now a ruin, a priest who spent his life pointing at you died still certain. You would like to be angry with him. Mostly you remember that he believed it more than you ever did.\n\n #bold You were the promised prince. This is what that was worth.#!#!"
 ln_defeat.1.a:0 "Then we live in it."

 ln_defeat.2.t:0 "Someone You Knew"
 ln_defeat.2.desc.child:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nYou know before you get there. You knew from the way he was standing.\n\nIt is your child. Grey now, and wrong about the eyes, and still — unmistakably, unfairly — recognisable. Whatever was done to them did not bother to change the face. Perhaps it could not. Perhaps it did not see the point.\n\n#bold They are on the ground and they are not moving, and you have to decide what to do about that.#!"
 ln_defeat.2.desc.parent:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nIt is your father's face. Your mother's. Whichever it is, it is the face that taught you what a face was, grey now and cracked with cold, lying in the mud among the rest of them.\n\nThey died years ago. You were at the burial. You remember thinking, at the time, that at least that part was over.\n\n#bold It was not over.#!"
 ln_defeat.2.desc.sibling:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nYour brother. Your sister. The person you fought with over nothing for twenty years and would have died for on any of those days, lying in the frost with their mouth open and the cold still coming off them.\n\nSomebody put a spear through them today. It might have been one of yours. It might have been you.\n\n#bold You are going to have to look at this properly, and then decide.#!"
 ln_defeat.2.desc.spouse:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nIt is your wife. Your husband. The person whose breathing you learned to sleep beside, lying in the frost with frost in their hair, and the thing that used to be behind their eyes has been gone a long while.\n\nYou have imagined this. Everyone in this war has imagined this. It turns out imagining it was not the same.\n\n#bold Nobody else is going to do this for you.#!"
 ln_defeat.2.desc.friend:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nIt is your friend — the real kind, the one you did not have to explain yourself to. [ln_known_dead.GetSheHe] went missing in a rout two winters ago and you told [ln_known_dead.GetHerHis] household [ln_known_dead.GetSheHe] had probably been taken, because it was kinder than the alternative and you did not know then that there was a third thing.\n\n[ln_known_dead.GetSheHe] is here. [ln_known_dead.GetSheHe] is not taken and [ln_known_dead.GetSheHe] is not dead in any way that helped.\n\n#bold You owe [ln_known_dead.GetHerHim] better than this, and better than this is not much.#!"
 ln_defeat.2.desc.lover:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nYou know the shape of them before you know the face. That is the part you will remember afterwards — that you recognised them at forty paces, in the dark, by how they stood.\n\nThey are not standing now.\n\n#bold Whatever is left in there is not them, and you still cannot make yourself hurry.#!"
 ln_defeat.2.desc.sworn:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nIt is one of yours. Somebody who knelt to you, whose keep you have eaten in, whose children's names you could produce if you had a moment. [ln_known_dead.GetSheHe] was lost somewhere in the long retreat and nobody wrote it down, because by then nobody was writing anything down.\n\n[ln_known_dead.GetSheHe] came back south with them. [ln_known_dead.GetSheHe] has been coming south with them this whole time.\n\n#bold [ln_known_dead.GetSheHe] swore to you. That did not stop when [ln_known_dead.GetSheHe] died.#!"
 ln_defeat.2.a:0 "Build the fire. [ln_known_dead.GetSheHe] goes properly."
 ln_defeat.2.b:0 "Leave [ln_known_dead.GetHerHim]. We will be back this way."

 # -- WHAT THE DEAD REMEMBER ----------------------------------------------------------------------------------
 ln_defeat.2.desc.again:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nIt is him. The one you left.\n\nYou knew it would be, in the way you know a thing you have refused to say out loud. There was a column to move and a light to make and a hundred good reasons, and every one of them was true, and not one of them is standing here now.\n\nHe has been walking ever since. He came a very long way to be in this particular field, and there is no version of this where that is a coincidence."
 ln_defeat.2.desc.long_after:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nHe is young. He has stopped because he has never seen one up close, and because nobody told him they keep the faces.\n\nYou have. For longer than he has been alive. There was a year, a long time ago, when this was the worst thing that could happen to a man in an afternoon — and there are children in your hall now who have never once seen the sun get high enough to cast a short shadow, and who do not think of any of this as having gone wrong.\n\nSomebody has to say what is done with the body. It has been you for fifty years."
 ln_defeat.2.desc.sworn_burned:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nIt is one of yours. A man who knelt to you, lost somewhere in a retreat nobody wrote down properly, standing in the frost now with the wrong colour behind his eyes.\n\nYou have done this before. That is the part nobody warns you about — not the first one, but the discovery that you already know the order of it. How long the fire takes. Where to stand so the wind does not bring it back at you. What to say to the men afterwards, which is almost nothing.\n\nSomeone hands you the torch without being asked. They have started assuming."
 ln_defeat.2.desc.sworn_left:0 "The field is being walked, the way fields are walked afterwards, and one of your men has stopped and will not go on.\n\nIt is one of yours. A man who knelt to you, whose keep you have eaten in, standing in the frost with the wrong colour behind his eyes.\n\nThere was another one, before this. You left him where he lay and you had reasons, and you have not been back that way since, and you have noticed that you no longer take the north road if there is a road that is not the north road.\n\nYour men are not looking at the body. They are looking at you, and waiting to hear which kind of lord you are this time."
 ln_the_dark_won_modifier:0 "The Dark Won"
 ln_the_dark_won_modifier_desc:0 "There was a war for the dawn and it was lost. What is left rules what is left, and is obeyed out of something closer to terror than loyalty."
