l_english:

 # AGOT: The Long Night & Azor Ahai -- the Wall.

 ln_man_an_empty_castle_decision:0 "[ROOT.Char.Custom('ln_ManAnEmptyCastleTitle')]"
 ln_man_an_empty_castle_plain:0 "Man an Empty Castle"
 ln_man_an_empty_castle_raven:0 "Send a Raven: Man the Castle"
 # Updated! note this triggers for Rangers of the Night's Watch
 ln_man_an_empty_castle_decision_desc:0 "I have served ably as a ranger, but a different project calls to me now. Many of the castles along the Wall lie in ruin, abandoned out of necessity as our numbers have dwindled. Settling men in the ruins will shore up our defenses, and the sight of smoke rising above the Wall may dissuade the wildlings from attempting to climb over and raid the southern lands."
 ln_man_an_empty_castle_decision_tt:0 "Ask the Lord Commander for one of the Wall's empty Castles. You will hold it as his vassal, and defend your stretch of the Wall from invaders.\n\n#weak If the Nightfort is unmanned, you will receive it; otherwise, you will get a random empty castle.#!"
 ln_man_an_empty_castle_decision_confirm:0 "Assemble a party. We leave at dawn."
 ln_watch.1.t:0 "Yours Now"
 ln_watch.1.desc:0 "[ln_lord_commander.GetTitledFirstName] seems hesitant as he meets me in my new holding. "I'm still not sure this is the right idea," he admits warily, taking in the dismal scene, "but what's done is done."\n\nThe men of the Night's Watch have already begun the arduous task of making this fort habitable, but it will be a long time before this place can be truly called a castle again. The walls have long since crumbled, the kitchen roof has collapsed, and the smell of mold wafts out from what's left of the library.\n\nThe Lord Commander offers some final words of advice before he leaves. 'You'll do well to choose one problem to fix at a time, else you'll drown in a swamp of your own making.'"
 ln_watch.1.a:0 "We start with the walls. Security is our top priority."
 ln_watch.1.b:0 "The kitchens first. Men can't fight on an empty stomach."
 ln_watch.1.c:0 "The library, and whatever knowledge we lost with it."

 ln_watch.2.t:0 "Mole's Town"
 # Updated! Left option c alone; it seemed good enough. Reduced number of crows from 6 to 2 because that's how many pop up
 ln_watch.2.desc:0 "Two of the men are gone, and everyone knows exactly where to look. Mole's Town is half a league south of Castle Black, and men of the Night's Watch have bent their vows there since the Wall was new. The steward stifles a smirk as he reports the men are absent from their posts.\n\nIf we beheaded every boy who rode to Mole's Town in the night, only ghosts would guard the Wall... but these six men were caught, and something has to be done about them."
 ln_watch.2.a:0 "Ride down there and haul them back by the collar!"
 ln_watch.2.b:0 "What of it? Every man here has done the same."
 ln_watch.2.c:0 "Let them come back on their own. Then flog them."

 ln_watch.3.t:0 "The Fist of the First Men"
 # Updated!
 ln_watch.3.desc:0 "The Fist of the First Men rises up from the forests north of the wall, a single isolated hill upon which sits an ancient ringfort, constructed by the First Men during the Dawn Age. For generations, it has served the Watch as an outpost during its rangings, providing shelter from the elements, a defensible position, and a view over the the surrounding forest. Now, a grizzled old ranger claims it can serve us further.\n\n\"On my first ranging, I found a cache of dragonglass arrowheads buried on that hill,\" he tells me, wringing his weathered hands. \"Didn't think much of it at the time. But now, with all that's been happening, I can't stop thinking about it.\"\n\nHis expression is hopeful, but also a little embarassed, as if he knows what his words sound like madness. \"Just give me a few men and some supplies, and I'm sure I could find that cache again,\" he vows earnestly."
 ln_watch.3.a:0 "If such a cache exists, we must have it, no matter the cost."
 ln_watch.3.b:0 "I will not waste the Watch's resources chasing snarks and grumkins."

 ln_watch.4.t:0 "The Deserter"
 # Updated! "The Deserter" might be a better title but idk if that's changeable or not
 ln_watch.4.desc:0 "My steward wakes me early in the morning with grim news: one of our sworn brothers was caught attempting to desert under cover of darkness. All men know that brothers of the Night's Watch swear their vows for life; the punishment for desertion is death.\n\nYet, as the man is dragged towards the block, he does not plead for his own life, only for someone to listen to him. His ramblings are nearly incoherent; he speaks of the cold, of dead things walking the woods, and of pale white shadows. The rest of the men murmur fearfully to one another, clearly unsettled by their brother's babbling."
 ln_watch.4.a:0 "I'll hear no more of this. Bring me my sword."
 ln_watch.4.b:0 "Calm down and speak clearly. Are these to be your final words?"
 ln_watch.4.c:0 "Send him to Castle Black. Let the Lord Commander hang him."

 # ── REBUILDING ──────────────────────────────────────────────────────────────────────────────────────────────
 # 1.0.12b -- RENAMED. Thomas, in play: "I feel like you need to change the decision localization for Open
 # Another Castle to, like, Restore Castle Ruins, because I had no idea that's what that meant." He wrote the
 # feature and could not tell from the button what it did, which is the whole argument. "Open Another Castle"
 # reads like unlocking a menu; the decision takes one of YOUR ruins and makes it a working castle again.
 # The two stale TODO comments that used to sit here ("Might need to be renamed. Not clear if it does
 # anything") were inherited and are answered now.
 ln_rebuild_the_castle_decision:0 "[ROOT.Char.Custom('ln_RebuildTheCastleTitle')]"
 ln_rebuild_the_castle_plain:0 "Restore a Ruined Castle"
 ln_rebuild_the_castle_raven:0 "Send a Raven: Coin for the Castle"
 ln_rebuild_the_castle_decision_desc:0 "Many of the castles along the Wall lie in ruin, abandoned out of necessity as our numbers dwindled. The time has come to rebuild these castles and shore up our defenses against threats to our north. Wood will be cut from the Gift, stone shipped from White Harbor, and builders sent from the Shadow Tower and Eastwatch-by-the-Sea to see the work to completion. The work will be arduous, but the work will all be worth it when a castle stands where there was once only a ruin."
 ln_rebuild_the_castle_decision_tt:0 "Bring one of your ruined castles back into service, making it fit to defend a stretch of the Wall and house sworn brothers of the Night's Watch.\n\nThe work will be slow and expensive. This decision can be repeated as long as there are castles left to restore."
 ln_rebuild_the_castle_decision_confirm:0 "Send for the masons."
 ln_rebuild_needs_the_coin:0 "You need #V 400#! gold to raise a castle out of a ruin."

 ln_watch.5.t:0 "It Has a Roof"
 # Updated! Mostly.
 ln_watch.5.desc:0 "As the builders remove the last of the scaffolding, I gaze upon their finished work. The castle is not beautiful. The new stone is a different color than the old, and the walls are not quite level with one another. But the gate shuts, the well has water, and a fire blazes in the kitchens. Though it's not perfect, [ln_rebuilt_county.GetName] is once again home to the Night's Watch— and that's all that counts."
 ln_watch.5.a:0 "Send a raven to Castle Black: the castle is manned."
 # consider improving this
 ln_watch.5.b:0 "Spread the news south, so the whole realm knows what I have done."
 ln_black_needs_somewhere_for_the_realm_to_go:0 "You must have an heir or a liege for your lands to pass to"
 ln_black_needs_a_castle_standing_empty:0 "The Lord Commander must have a castle standing empty"
 ln_black_not_at_war_with_the_watch:0 "Must not be at war with the Night's Watch"
 # The one below NEEDS to be updated, but it's not clear what the trigger is to "be somebody"
 ln_black_needs_to_be_somebody:0 "The Lord Commander gives castles to men who can hold them — a known name, a lordship to lay down, a knight's spurs, or men at your back"

 # ── BEGGING ─────────────────────────────────────────────────────────────────────────────────────────────────
 ln_petition_the_realm_decision:0 "[ROOT.Char.Custom('ln_PetitionTheRealmTitle')]"
 ln_petition_the_realm_plain:0 "Petition the Realm"
 ln_petition_the_realm_raven:0 "Send a Raven: Petition the Realm"
 # Updated with clearer text!
 # This event gives you gold but doesn't tell you how much!
 ln_petition_the_realm_decision_desc:0 "The lands of the Gift have never been enough to feed the Night's Watch. Ever since the Age of Heroes, the lords of Westeros have understood the importance of the Wall... and the importance of keeping its defenders fed.\n\nThe realm's generosity has faded over time, but if we send our ravens, at least a few northern lords will always answer."
 ln_petition_the_realm_decision_tt:0 "Ask the North to remember the Wall.\n\n#weak The colder it gets, the more likely lords are to send aid.#!"
 ln_petition_the_realm_decision_confirm:0 "Send the ravens."
 ln_petition_the_realm_effect_tt:0 "Ask the northern houses to support the Night's Watch. Only a few will answer, but some coin is better than none."
 ln_watch.6.t:0 "Carts on the Kingsroad"
 ln_watch.6.desc:0 "Carts of supplies from the lords of the North arrive one by one over the next several days. The Night's Watch is not the noble institution it once was, in the eyes of the realm. My brothers are disheartened to see how little they have sent us; a few barrels of salted beef, some hard tack, and a few meager coins. It's not much, but it's better than nothing.\n\nAlong with the supplies, we have also received a murder of ravens, each one bearing a letter from one of the lords of the North. Some inform me they have sent the Watch what they could, while others explain with honeyed words why they sent us nothing. Etiquette dictates I should answer them all, but the Night's Watch runs short on parchment, and I must choose which letters to answer."
 ln_watch.6.a:0 "Write to those who sent us aid, thanking them for their contributions."
 ln_watch.6.b:0 "Send rebukes to the lords who sent us nothing."

 # ── THE WATCH GOES ON ───────────────────────────────────────────────────────────────────────────────────────
 ln_watch.7.t:0 "And Now My Watch Begins"
 ln_watch.7.desc:0 "They burned him at first light, because the ground is too hard for anything else and because of what happens to men who are left in it.\n\nNobody made a speech. Somebody said the words — the whole of them, not the short version they use for recruits — and everyone said them back, and then the fire took and everyone went to work, because there is a watch to keep and it does not stop for this.\n\nThe castle is yours now. So is everything outside it, which is worse.\n\nNight gathers."
 ln_watch.7.a:0 "The words are the same words. Say them again."

 # ── THE OTHER SIDE OF THE PETITION ──────────────────────────────────────────────────────────────────────────
 ln_send_men_and_grain_decision:0 "[ROOT.Char.Custom('ln_SendMenAndGrainTitle')]"
 ln_send_men_and_grain_plain:0 "Send Men and Grain to the Wall"
 ln_send_men_and_grain_raven:0 "Send a Raven: Men and Grain for the Wall"
 # Updated! Added some flavor about the north, since this event only triggers for northern houses as far as I can tell
 ln_send_men_and_grain_decision_desc:0 "The Night's Watch has no shortage of costs. Men, grain, and coin are essential to keep the Wall standing and the wildlings at bay. Every year, their list of needs grows longer; a generous contribution from one of the noble houses would relieve some of the Watch's burden... and win favor with the Lord Commander."
 ln_send_men_and_grain_decision_desc_north:0 "Your house has fed the Watch since before there were Kings in the South to forget it. The Wall is the North's roof; the men on it are the North's men, whoever they were born to; and a northern lord who lets Castle Black go hungry will answer for it to his own dead.\n\nSend what the year can spare. It is not generosity. It is the oldest rent in the world, and it has always been paid."
 ln_send_men_and_grain_decision_tt:0 "Send coin, grain and men north. The Night's Watch will remember those who help them."
 ln_send_men_and_grain_decision_confirm:0 "Load the carts."
 ln_send_men_and_grain_effect_tt:0 "Choose how much to send north. Every copper  counts!"
 ln_donate_needs_the_coin:0 "You need at least #V 100#! gold to send aid to the Night's Watch"
 ln_watch.8.t:0 "A Letter From the Wall"
 ln_watch.8.desc:0 "The Lord Commander sends his reply as soon as the carts arrive, which says something about how little correspondence [ln_lord_commander.GetTitledFirstName] receives. He thanks me for my support, and details exactly how my coin will be spent, as if he expects to be audited.\n\nBelow his name, the Lord Commander adds a short, awkward postscript: \"Most men have forgotten the Wall. Thank you for remembering us.\""
 ln_watch.8.a:0 "The North remembers."
 ln_watch.8.b:0 "Make sure the men know who is feeding them."

 # ── A WALL WITH NO VACANCIES ────────────────────────────────────────────────────────────────────────────────
 ln_black_needs_a_castle:0 "A castle must be abandoned, or held by a ruler who is unfit to hold it"
 # Updated! May need to come back and update again
 ln_black_needs_someone_to_relieve:0 "A castle must be held by a brother the Lord Commander would relieve— one who is incapable, older than 70, or never swore his vows"
 ln_take_the_black_and_wait_decision:0 "Ask for a Command"
 ln_take_the_black_and_wait_decision_desc:0 "The Wall must be held by capable men. If any castles are commanded by the incapable, the elderly, or the disloyal, it is the Lord Commander's duty to arrange for a younger, more competent man to assume the command in his place. I can be that man; I need only ask."
 ln_take_the_black_and_wait_decision_tt:0 "Ask the Lord Commander to relieve a brother who can no longer hold his castle. The command will transfer to you.\n\n#weak A player's castle is never taken— only an AI brother who is incapable, past seventy, or never swore his vows.#!"
 ln_take_the_black_and_wait_decision_confirm:0 "Write to the Lord Commander."
 ln_watch.9.t:0 "My New Command"
 ln_watch.9.desc:0 "It doesn't take long for the Lord Commander to find me a post. The previous commander of the castle isn't happy to be handing over the reins, but he doesn't argue, either. After he hands me the keys and the ledger, he asks whether he may at least remain here as a steward.\n\n\"I've held this castle most of my life,\" he tells me with a grim sigh. \"I mean to stay here, if you'll let me.\""
 ln_watch.9.a:0 "Stay; I could use a good man like you."
 ln_watch.9.b:0 "I have no more use for you. Don't bother me again."
 # It's unclear what option C does, except that it triggers if there is no castle available. May need to be rewritten.
 ln_watch.9.c:0 "Then inform me when a post opens."


 ln_watch.10.t:0 "How Much"
 # Updated!
 ln_watch.10.desc:0 "The steward awaits me in the courtyard, where men prepare to load up the supplies I will send to the Wall. He offers me a ledger detailing our resources and a letter from the Lord Commander outlining what the Night's Watch needs to get through the next three years.\n\nAll that remains is for me to decide what to send."
 ln_watch.10.a:0 "A cart of grain should suffice."
 ln_watch.10.b:0 "Send them everything we can afford to lose."
 ln_watch.10.c:0 "Spare no expense. The Night's Watch must not fall."
 ln_watch.10.d:0 "I've changed my mind. Send nothing."

 ln_emptied_the_vaults:0 "Emptied the Vaults"

 # The Watch cannot secede from itself. See common/casus_belli_types/zz_ln_independence_war_shadow.txt.
 # changed this one for clarity. I don't think this needs fancy text
 ln_cannot_forsake_the_watch:0 "Not possible to declare independence from the Night's Watch!"

 # ── A WALL CASTLE'S OFFICERS ────────────────────────────────────────────────────────────────────────────
