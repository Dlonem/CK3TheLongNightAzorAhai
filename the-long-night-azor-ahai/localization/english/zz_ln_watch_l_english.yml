 # and his ranging captains get the ranks a single castle actually has. Flavorization loc keys are named
 # after the entry itself -- see common/flavorization/zz_ln_nw_keeper_councillor_flavor.txt.
 ln_nw_keeper_marshal_flavor:0 "Master-at-Arms"
 ln_nw_keeper_marshal_flavor_possessive:0 "Master-at-Arms'"
 ln_nw_keeper_castellan_flavor:0 "Steward of the Keep"
 ln_nw_keeper_castellan_flavor_possessive:0 "Steward of the Keep's"
 ln_nw_keeper_steward_flavor:0 "Master Builder"
 ln_nw_keeper_steward_flavor_possessive:0 "Master Builder's"
 ln_nw_keeper_chancellor_flavor:0 "Recruiter"
 ln_nw_keeper_chancellor_flavor_possessive:0 "Recruiter's"
