l_english:

 long_night_plus_wall.1.t:0 "The Wall Has Fallen"
 long_night_plus_wall.1.desc:0 "For eight thousand years it stood — seven hundred feet of ice raised against the dark. Now, with a roar that shakes the very roots of the world, the Wall comes crashing down at Castle Black. Where it breaks, the cold pours through, and behind it march the dead, an endless tide of the Night King's host. There is nothing now between the living and the Long Night."
 long_night_plus_wall.1.a:0 "The watch is ended."

 long_night_plus_wall.2.t:0 "#F The Age of Heroes Is Ended#!"
 long_night_plus_wall.2.desc:0 "Brandon the Builder raised it when the First Men still carved their words in runes, and for eight thousand years every kneeler and king, every wildling and Watchman, every maester and midwife lived their whole life in its shadow and never thought to ask whether it would hold. It held. It was the one promise the world kept.\n\nNo longer. The Wall is fallen at Castle Black, and through the breach walks winter itself. Ravens fly to every keep in Westeros carrying the same three words the Watch has whispered for centuries, words that were a warning and are now simply the weather: the dead come.\n\nWhat stands between the living and the Long Night now is not ice. It is you."
 long_night_plus_wall.2.a:0 "And now our watch begins."
