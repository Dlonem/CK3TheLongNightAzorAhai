l_english:

 ln_wandering_dead.1.t:0 "Something Came Out of the Trees"

 ln_wandering_dead.1.desc:0 "The riders come in before dawn with a man across a saddle, and he is the lucky one — he is only dead.\n\nThey were not an army. Eleven of them, walking out of the treeline at the northern edge of [ROOT.Char.GetPrimaryTitle.GetName], in the clothes they were buried in, with eyes the colour of a star seen through ice. They do not shout and they do not tire and they did not stop when the first three were cut down.\n\nThe front is still leagues away. This is what leaks out ahead of it."

 ln_wandering_dead.1.a:0 "Bring my sword. I will meet them myself."
 ln_wandering_dead.1.b:0 "Send the household guard. That is what they are for."
 ln_wandering_dead.1.c:0 "Bar the gates and let them walk on south."
 ln_wandering_dead.1.d:0 "Wake the red priest. Let him show them what fire is."

 ln_faced_the_dead_modifier:0 "Faced the Dead"
 ln_faced_the_dead_modifier_desc:0 "This one stood in front of the walking dead with a blade and did not run. People notice a thing like that."
