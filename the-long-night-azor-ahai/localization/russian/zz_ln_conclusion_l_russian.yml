 # AGOT: The Long Night & Azor Ahai -- the conclusion.

 nick_the_dawnbringer:0 "Приносящий Рассвет"
 nick_the_dawn:0 "Рассвет"
 nick_the_prince_that_was_promised:0 "Обещанный Принц"

 ln_reveal.9.t:0 "Подсчёт"
 ln_reveal.9.desc_open:0 "Мейстеры занимались этим с оттепели и наконец выдали число, и именно из-за этого числа никто не хочет читать остальную страницу.\n\n"
 ln_reveal.9.desc_sword:0 "Всё кончилось мечом, который для этого и ковали. Именно это певцы сохранят, а мейстеры будут оспаривать четыреста лет: что кто-то изготовил ту вещь, которую велело изготовить старое сказание, а потом пошёл и сделал то, что велело сделать старое сказание, и всё сработало ровно так, как обещано. Записать это в книгу истории без неловкости невозможно.\n\n"
 ln_reveal.9.desc_sword_unused:0 "Меч был выкован. Он стоил ровно того, чего, по сказанию, должен был стоить. И в конце концов кончил всё не меч — и эту фразу кому-то придётся объяснять тому, кто за него заплатил.\n\n"
 ln_reveal.9.desc_no_sword:0 "Ни один меч выкован не был. Никто не пел. Всё кончилось так, как кончается большинство вещей: люди с обычной сталью, оказавшиеся не в том месте в нужный миг, и большинство из них этого не пережило.\n\n"
 ln_reveal.9.desc_watch_held:0 "Ночной Дозор устоял. Не целым — целого в нём не осталось ничего, — но на Стене есть чёрные плащи, а в замках люди, и то учреждение, к которому юг сто лет относился как к каторге для насильников и воров, и есть причина, по которой юг существует.\n\n"
 ln_reveal.9.desc_watch_broke:0 "Ночной Дозор не устоял. Замки пусты так, как не были пусты никогда, а люди, которые могли бы их занять, лежат под снегом отсюда и до Стены.\n\n"
 ln_reveal.9.desc_close:0 "Солнце взошло. Это и есть все добрые вести, и их довольно.\n\nВеликий мейстер хочет знать, что написать наверху страницы. Он спрашивает уже неделю. Ему нужно название для этого, и дата, и фраза, которую люди через триста лет смогут прочесть, не нуждаясь в остальной книге."
 ln_reveal.9.a:0 "Записать. Всё. Особенно те места, из которых никто не выходит красиво."
 ln_reveal.9.b:0 "Пусть следующие разбираются сами. Мы же разобрались."
 # ── WHAT KIND OF MAN THE HISTORIES ARE WRITING ABOUT ────────────────────────────────────────────────────────
 ln_reveal.9.desc_you_forge:0 "Ваше имя там не раз, и не по тем причинам, которые вы бы выбрали. У них есть горн. У них есть все три закалки. Кто-то записал, чего стоила третья, а кто-то другой это вычеркнул и вписал обратно.\n\n"
 ln_reveal.9.desc_you_risen:0 "Ваше имя там, и то, что с вами случилось, изложено тем ровным, невозмутимым слогом, каким мейстеры пишут о том, во что не верят. «[ROOT.Char.GetSheHe|U] был мёртв. Затем [ROOT.Char.GetSheHe|U] мёртв не был». Четыре слова оговорок — и сразу к следующей записи.\n\n"
 ln_reveal.9.desc_you_watch:0 "Ваше имя там под Стеной, в списке людей, удержавших замок, которого на памяти живых не удерживал никто. Список короткий, и это единственная часть всего этого, которую Север прочтёт дважды.\n\n"
 ln_reveal.9.desc_you_return:0 "Ваше имя там, а рядом с ним — то слово, каким называют людей, вернувшихся из Эссоса с тем, чего держава не хотела и не могла отвергнуть.\n\n"
 ln_reveal.9.desc_you_chosen:0 "Ваше имя там очень часто: наречение, те, кто приезжал посмотреть, правда ли это, и те, кто приезжал убедиться, что нет. Что бы истории ни решили, обойтись без вас они не смогут.\n\n"
 ln_reveal.9.desc_you_favored:0 "Ваше имя там, в той части, что о жрецах, с теми оговорками, которыми мейстеры пользуются, когда записывают, что люди во что-то верили, а не что оно так и было.\n\n"
 ln_reveal.9.desc_you_witness:0 "Ваше имя там один раз, в списке, посередине. Вы там были. Это, как выясняется, стоит больше, чем почти всё прочее в этой книге.\n\n"
 ln_reveal.9.desc_you_nobody:0 "Вашего имени там нет вовсе, что потребовало известных усилий, учитывая, где вы стояли почти всё это время.\n\n"

 ln_reveal.9.desc_close_cycle:0 "Солнце взошло. Это и есть все добрые вести, и их довольно.\n\nВеликому мейстеру нужно название для этого, и дата, и фраза, которую прочтут люди через триста лет. Он остановился на «конце».\n\nВольный народ, потерявший больше всех и не записывающий ничего, пользуется другим словом. Не кончилось — #EMP уснуло#!. С ними об этом не спорят. Никто из тех, кто там был, не вполне уверен, что они неправы."

 # ln_dawn.4 -- he walked into its reach and walked back out.
 nick_the_undaunted:0 "Неустрашимый"
