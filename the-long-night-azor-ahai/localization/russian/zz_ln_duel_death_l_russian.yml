l_russian:
# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- how a Walker dies (1.1.0, 1 Sep 2026).
 #
 # THOMAS, watching agot_multi_duel.0022 narrate the Night King's death: "the Night King, he shattered
 # into ice when he died in Game of Thrones." AGOT's outro lines are written for a body -- "pierces his
 # heart, and he falls with a final gasp", "a spray of blood", "crumples to the ground". None of that is
 # true of a thing that has not been a person for eight thousand years.
 #
 # ⚠ THIS IS A LOCALIZATION OVERRIDE, NOT A COPIED EVENT, AND THAT IS THE WHOLE POINT. agot_multi_duel.0022
 # is ~1,200 lines of triggered_desc and portrait wiring; shadowing it would put us on the hook for every
 # duel in AGOT and break on their next update. Overriding ten loc keys does not.
 #
 # ⚠ AND EVERY OTHER DUEL IN THE GAME IS BYTE-IDENTICAL. Each override is a single Custom() call that
 # branches on the loser: a Walker or the Night King gets ice, and ANYTHING ELSE gets AGOT's own original
 # sentence, reproduced verbatim below under ln_duel_outro_agot_N. Those ten strings were extracted
 # programmatically from agot_multi_duel_events_l_english.yml rather than retyped, so a human duel reads
 # exactly as it did before this file existed. If AGOT rewrites their outros, ours go stale and want
 # re-extracting -- that is the maintenance cost, and it is the cheapest one on offer.

 # ── the overrides ──
 agot_multi_duel.0020.desc.outro1:0 "[loser_duelist.Custom('LN_MultiDuelOutro_1')]"
 agot_multi_duel.0020.desc.outro2:0 "[loser_duelist.Custom('LN_MultiDuelOutro_2')]"
 agot_multi_duel.0020.desc.outro3:0 "[loser_duelist.Custom('LN_MultiDuelOutro_3')]"
 agot_multi_duel.0020.desc.outro4:0 "[loser_duelist.Custom('LN_MultiDuelOutro_4')]"
 agot_multi_duel.0020.desc.outro5:0 "[loser_duelist.Custom('LN_MultiDuelOutro_5')]"
 agot_multi_duel.0020.desc.outro6:0 "[loser_duelist.Custom('LN_MultiDuelOutro_6')]"
 agot_multi_duel.0020.desc.outro7:0 "[loser_duelist.Custom('LN_MultiDuelOutro_7')]"
 agot_multi_duel.0020.desc.outro8:0 "[loser_duelist.Custom('LN_MultiDuelOutro_8')]"
 agot_multi_duel.0020.desc.outro9:0 "[loser_duelist.Custom('LN_MultiDuelOutro_9')]"
 agot_multi_duel.0020.desc.outro10:0 "[loser_duelist.Custom('LN_MultiDuelOutro_10')]"

 # ── AGOT's originals, verbatim, for every loser who is not one of them ──
 ln_duel_outro_agot_1:0 "\n\nПоследним отчаянным выпадом [winner_duelist.GetTitledFirstNameNoTooltip] вгоняет [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')] в грудь [loser_duelist.GetTitledFirstNamePossessiveNoTooltip], и поединок кончается брызгами крови. [loser_duelist.GetTitledFirstNameNoTooltip] падает на землю, чтобы больше не подняться."
 ln_duel_outro_agot_2:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] успевает обезоружить [winner_duelist.GetTitledFirstNameNoTooltip], но прежде чем [loser_duelist.GetSheHe] добьёт [winner_duelist.GetHerHim], [winner_duelist.Custom('signature_weapon')] [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] находит дорогу к сердцу [loser_duelist.GetTitledFirstNamePossessiveNoTooltip]. [loser_duelist.GetTitledFirstNameNoTooltip] оседает на землю и умирает прежде, чем [loser_duelist.GetSheHe] её коснётся."
 ln_duel_outro_agot_3:0 "\n\n[winner_duelist.Custom('signature_weapon')] [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] достаёт [loser_duelist.GetTitledFirstNameNoTooltip] в горло, и брызги крови отмечают конец поединка: [loser_duelist.GetTitledFirstNameNoTooltip] падает без жизни."
 ln_duel_outro_agot_4:0 "\n\nПоследний отчаянный взмах [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] уходит в пустоту и открывает [loser_duelist.GetHerHim] для смертельного удара [winner_duelist.GetTitledFirstNamePossessiveNoTooltip]. [winner_duelist.Custom('signature_weapon')] [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] [winner_duelist.Custom('AGOT_SignatureWeaponCriticalPresent')] [loser_duelist.GetHerHis] сердце, и [loser_duelist.GetTitledFirstNameNoTooltip] падает с последним выдохом."
 ln_duel_outro_agot_5:0 "\n\nЗверским взмахом [winner_duelist.GetTitledFirstNameNoTooltip] сносит голову [loser_duelist.GetTitledFirstNameNoTooltip], и поединок кончается одним решающим ударом. Тело [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] оседает на землю."
 ln_duel_outro_agot_6:0 "\n\nПоследний удар [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] [winner_duelist.Custom('AGOT_SignatureWeaponCriticalPresent')] бок [loser_duelist.GetTitledFirstNamePossessiveNoTooltip], и смертельная рана валит [loser_duelist.GetTitledFirstNameNoTooltip] на [loser_duelist.GetHerHis] колени, а затем [loser_duelist.GetSheHe] оседает и умирает."
 ln_duel_outro_agot_7:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip] наносит [loser_duelist.GetTitledFirstNameNoTooltip] смертельный удар: [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')] уходит глубоко в грудь [winner_duelist.GetHerHis] противника. Безжизненное тело [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] оползает на землю."
 ln_duel_outro_agot_8:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] проваливается в выпаде, и [winner_duelist.GetTitledFirstNameNoTooltip] этим пользуется, пронзая [winner_duelist.GetHerHim] одним точным ударом [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')]. [loser_duelist.GetTitledFirstNameNoTooltip] падает и умирает прежде, чем [loser_duelist.GetSheHe] коснётся земли."
 ln_duel_outro_agot_9:0 "\n\nБыстрым свирепым ударом [winner_duelist.GetTitledFirstNameNoTooltip] вскрывает горло [loser_duelist.GetTitledFirstNamePossessiveNoTooltip]. Глаза [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] широко раскрываются от потрясения, [loser_duelist.GetSheHe] оседает, и из раны льёт кровь."
 ln_duel_outro_agot_10:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip] проходит сквозь защиту [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] и вгоняет [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')] глубоко в [loser_duelist.GetHerHis] живот. [loser_duelist.GetTitledFirstNameNoTooltip] качается одно биение сердца, а потом падает без жизни на залитую кровью землю."

 # ── and how one of them ends instead ──
 ln_duel_outro_ice_1:0 "\n\nКлинок проходит насквозь, и ничто не кровоточит. Раздаётся треск, как будто весной вскрывается озеро, и [loser_duelist.GetTitledFirstNameNoTooltip] распадается — осколок за осколком [loser_duelist.GetHerHim], и они тают уже там, где падают."
 ln_duel_outro_ice_2:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] не столько падает, сколько отказывает. В один миг в снегу есть очертание с мечом в нём; в следующий — россыпь бледного стекла на земле и холод, идущий от неё так, что воздух ноет."
 ln_duel_outro_ice_3:0 "\n\nОн входит под руку, и [loser_duelist.GetHerHim] сводит целиком — белое и неподвижное, как вода, решившая стать льдом. Потом [loser_duelist.GetTitledFirstNameNoTooltip] разлетается, и ветер уносит большую часть того, что осталось, прежде чем оно упадёт."
 ln_duel_outro_ice_4:0 "\n\nПредсмертного крика нет. [loser_duelist.GetTitledFirstNameNoTooltip] просто перестаёт быть одним и становится несколькими тысячами, звеня о мёрзлую землю, как упавшее мирийское стекло, и куски успевают стать водой прежде, чем кому-нибудь придёт в голову поднять один."
 ln_duel_outro_ice_5:0 "\n\nУдар доходит, и [loser_duelist.GetTitledFirstNameNoTooltip] разрывается — не кровь, не кость, а жёсткая яркая россыпь льда, что жжёт лицо каждому, кто стоял достаточно близко, чтобы это видеть, и сходит с их щёк за один вдох."
