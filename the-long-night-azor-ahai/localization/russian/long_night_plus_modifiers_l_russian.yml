l_russian:

 dawn_refugee_modifier:0 "Бежал на юг"
 dawn_refugee_modifier_desc:0 "Изгнанный от очага и родного зала идущими мертвецами, он бежал на юг, к живым, — беженец, лишённый дома, преследуемый тем, что осталось позади, скорый на подъём и закалённый выживанием."

 # 1.0.15 -- имена для модификаторов, которые показывались сырыми ключами.
 others_sword_modifier:0 "Клинок Долгой ночи"
 others_sword_modifier_desc:0 "Меч изо льда Иных — он пьёт тепло, и рука, что его держит, забывает, каким было лето."
 others_weak_modifier:0 "Мощь зимы (слабая)"
 others_weak_modifier_desc:0 "Холод за спиной Короля Ночи в этот век жидок; мёртвые идут, но медленно."
 others_standard_modifier:0 "Мощь зимы"
 others_standard_modifier_desc:0 "С ним движется вся сила долгой тьмы."
 others_strong_modifier:0 "Мощь зимы (глубокая)"
 others_strong_modifier_desc:0 "В этот век холод идёт глубоко, а мёртвые вместе с ним."
 others_insane_modifier:0 "Мощь зимы (бесконечная)"
 others_insane_modifier_desc:0 "Ночь темна и полна ужасов, а в этот век она ещё и бездонна."

 # 1.0.15 -- новые модификаторы.
 ln_named_azor_ahai_modifier:0 "Азор Ахай Перерождённый"
 ln_named_azor_ahai_modifier_desc:0 "Долгая ночь окончилась от этой руки. С таким мир не спорит."
 ln_cold_trophy_modifier:0 "Пленный Иной"
 ln_cold_trophy_modifier_desc:0 "Один из холодных стоит в подземелье, и каждый в зале это знает. Королевство боится лорда, который его держит. Челядь боится в основном лестницы."

