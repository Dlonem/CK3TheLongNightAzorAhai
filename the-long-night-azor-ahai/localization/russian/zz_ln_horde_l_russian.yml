l_russian:

 # ── the horde ──────────────────────────────────────────────────────────────────────────────────────────────
 ln_wight_horde:0 "Восставшие мертвецы"
 ln_wight_horde_flavor:0 "Простые мертвецы из каждого владения, взятого Иными, идущие лишь потому, что им велено. Поодиночке они ничто — медлительные, ломкие, вооружённые тем, с чем умерли. Просто их очень много, и они не останавливаются."

 # ── the realm renames itself ────────────────────────────────────────────────────────────────────────────────
 ln_realm_the_long_night:0 "Долгая Ночь"

 # ── recurrence game rule ────────────────────────────────────────────────────────────────────────────────────
 rule_agot_long_night_recurrence:0 "#explanation_link_light_background;bold AGOT:#! #e;bold Долгая Ночь#! — повторение"
 setting_long_night_once:0 "Однажды #EMP (по умолчанию)#!"
 setting_long_night_once_desc:0 "Долгая Ночь приходит один раз. Если живые её переживут, всё кончено."
 setting_long_night_recurs:0 "Круг"
 setting_long_night_recurs_desc:0 "Долгая Ночь возвращается, и каждая зима хуже прежней. Сколько мир получает между ними, задаёт правило сроков вторжения. Всё кончится, когда какой-нибудь дом разорвёт этот круг — или круг разорвёт мир."
 # ── wave escalation modifiers ───────────────────────────────────────────────────────────────────────────────
 ln_wave_escalation_1_modifier:0 "Мёртвые помнят"
 ln_wave_escalation_1_modifier_desc:0 "Они уже приходили на юг и не забыли дороги."
 ln_wave_escalation_2_modifier:0 "Столетия зимы"
 ln_wave_escalation_2_modifier_desc:0 "Мир обескровлен дважды. Каждое владение, когда-либо взятое мёртвыми, всё ещё их — и его можно поднять снова."
 ln_wave_escalation_3_modifier:0 "Последняя Долгая Ночь"
 ln_wave_escalation_3_modifier_desc:0 "Завоёвывать осталось немного, и не осталось ничего, что помнило бы лето."
