l_russian:

 ln_wandering_dead.1.t:0 "Что-то вышло из-за деревьев"

 ln_wandering_dead.1.desc:0 "Всадники возвращаются перед рассветом, поперёк седла — человек, и ему повезло больше прочих: он всего лишь мёртв.\n\nЭто не было войско. Их было одиннадцать: они вышли из-за кромки леса на северном краю земель [ROOT.Char.GetPrimaryTitle.GetName], в той одежде, в которой их хоронили, с глазами цвета звезды, увиденной сквозь лёд. Они не кричат, они не устают, и они не остановились, когда первых троих зарубили.\n\nФронт всё ещё в лигах отсюда. Это лишь то, что просачивается впереди него."

 ln_wandering_dead.1.a:0 "Подайте мой меч. Я встречу их сам."
 ln_wandering_dead.1.b:0 "Послать домашнюю стражу. Для того она и есть."
 ln_wandering_dead.1.c:0 "Запереть ворота. Пусть идут дальше на юг и станут чужой заботой."
 ln_wandering_dead.1.d:0 "Разбудить красного жреца. Пусть покажет им, что такое огонь."

 ln_faced_the_dead_modifier:0 "Встретил мёртвых"
 ln_faced_the_dead_modifier_desc:0 "Этот стоял с клинком перед идущими мертвецами и не побежал. Такое люди замечают."
