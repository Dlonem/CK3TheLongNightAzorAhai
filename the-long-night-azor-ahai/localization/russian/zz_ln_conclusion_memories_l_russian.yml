l_russian:

 # Past tense, lower-case, no-perspective default first -- vanilla's own design standard for memories,
 # straight out of _character_memories.info.
 ln_forged_lightbringer_memory:0 "выковал Светозарный"
 ln_forged_lightbringer_memory_desc:0 "Я выковал Светозарный и заплатил ту цену, о которой говорит предание."
 ln_forged_lightbringer_memory_desc_second_perspective:0 "вы выковали Светозарный и заплатили ту цену, о которой говорит предание."
 ln_forged_lightbringer_memory_desc_third_perspective:0 "[owner.GetName] выковал Светозарный и заплатил ту цену, о которой говорит предание."

 ln_slew_the_night_king_memory:0 "положил конец Долгой Ночи"
 ln_slew_the_night_king_memory_desc:0 "Я был тем, кто стоял там, когда это решалось. Король Ночи пал, и взошло солнце."
 ln_slew_the_night_king_memory_desc_second_perspective:0 "вы были тем, кто стоял там, когда это решалось. Король Ночи пал, и взошло солнце."
 ln_slew_the_night_king_memory_desc_third_perspective:0 "[owner.GetName] стоял там, когда это решалось. Король Ночи пал, и взошло солнце."

 # The memory type own name key. Its three perspective descriptions have always lived in
 # zz_ln_reveal_l_english.yml; this line was not anywhere, and the live log said so:
 # "Character memory name 'ln_stood_at_the_dawn_memory' is not localized".
 ln_stood_at_the_dawn_memory:0 "встретил рассвет"

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_lived_to_see_the_dawn_memory:0 "дожил до рассвета"
 ln_lived_to_see_the_dawn_memory_desc:0 "Я был жив, когда тьма отступила. Большинство людей, с которыми я её начинал, — нет."
 ln_lived_to_see_the_dawn_memory_desc_second_perspective:0 "вы были живы, когда тьма отступила. Большинство людей, с которыми вы её начинали, — нет."
 ln_lived_to_see_the_dawn_memory_desc_third_perspective:0 "[owner.GetName] был жив, когда тьма отступила. Большинство людей, с которыми [owner.GetHeShe] её начинал, — нет."
 ln_the_dark_won_memory:0 "видел, как победила тьма"
 ln_the_dark_won_memory_desc:0 "Рассвет не пришёл. С тех пор я веду счёт годам и перестал называть кому-либо это число."
 ln_the_dark_won_memory_desc_second_perspective:0 "рассвет не пришёл. С тех пор вы ведёте счёт годам и перестали называть кому-либо это число."
 ln_the_dark_won_memory_desc_third_perspective:0 "рассвет не пришёл, и [owner.GetName] до сих пор ведёт счёт годам."
 ln_paid_in_full_memory:0 "заплатил цену Светозарного"
 ln_paid_in_full_memory_desc:0 "Я вогнал меч в сердце [ln_beloved.GetTitledFirstName], и он взял огонь, и с тех пор я не сумел его отложить."
 ln_paid_in_full_memory_desc_second_perspective:0 "вы вогнали меч в сердце [ln_beloved.GetTitledFirstName], и он взял огонь, и с тех пор вы не сумели его отложить."
 ln_paid_in_full_memory_desc_third_perspective:0 "[owner.GetName] вогнал меч в сердце [ln_beloved.GetTitledFirstName], и он взял огонь."
 ln_came_back_memory:0 "возвращён огнём"
 ln_came_back_memory_desc:0 "Я умер, и огонь получил от [ln_the_priest.GetTitledFirstName] то, что просил, и я вернулся. Вернулся не весь."
 ln_came_back_memory_desc_second_perspective:0 "вы умерли, и огонь получил от [ln_the_priest.GetTitledFirstName] то, что просил, чтобы вас вернуть."
 ln_came_back_memory_desc_third_perspective:0 "[owner.GetName] умер, и [owner.GetHerHim] вернули оттуда — руками [ln_the_priest.GetTitledFirstName]."
 ln_spent_myself_memory:0 "отдал последний поцелуй"
 ln_spent_myself_memory_desc:0 "Я прижался губами к губам [ln_the_charge.GetTitledFirstName] и попросил у Владыки Света ещё одну жизнь, и плату Он взял с меня. Больше меня не спросят."
 ln_spent_myself_memory_desc_second_perspective:0 "вы отдали последний поцелуй [ln_the_charge.GetTitledFirstName], и плату огонь взял с вас."
 ln_spent_myself_memory_desc_third_perspective:0 "[owner.GetName] отдал последний поцелуй [ln_the_charge.GetTitledFirstName] и целым больше не был никогда."
