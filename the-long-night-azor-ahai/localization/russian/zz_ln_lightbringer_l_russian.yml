l_russian:

 # AGOT: The Long Night & Azor Ahai -- Lightbringer.

 # ── THE ARTIFACT ────────────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer_name:0 "Светозарный"
 ln_lightbringer_full_description:0 "Красный меч героев, кованный трижды.\n\nОн тёплый. Не от огня и не от руки — тёплый так, как тепло живое, по всей длине клинка, в комнате, где вовсе нет огня. Те, кто его держал, не сходятся в том, какого он цвета.\n\nТретья закалка взяла душу, и душа всё ещё там."
 ln_lightbringer_lesser_description:0 "Красный меч героев, кованный трижды.\n\nОн тёплый, и он держит лезвие, которого ему не давал ни один точильный камень, и в темноте по долу идёт тончайшая красная нить — довольно, чтобы его найти, но недостаточно, чтобы при нём что-то разглядеть.\n\nКузнец, видевший, как он вышел из третьей закалки, сказал, что это лучшее, что он когда-либо сделает, и что что-то в нём взялось не до конца. Больше он не сказал ничего."

 # ── THE DECISION ────────────────────────────────────────────────────────────────────────────────────────────
 ln_forge_lightbringer_decision:0 "Выковать Светозарный"
 ln_forge_lightbringer_decision_desc:0 "Салладор Саан рассказывает это так, красные жрецы иначе, но очертания всегда одни и те же.\n\nАзор Ахай работал тридцать дней и тридцать ночей и закалил клинок в воде, и сталь сломалась. Он работал пятьдесят дней и пятьдесят ночей и закалил его в сердце льва, и сталь сломалась. Он работал сто дней и сто ночей, а когда всё было готово, позвал жену.\n\nГорн холоден. Железо на наковальне. Никто не заставляет вас это делать."
 ln_forge_lightbringer_decision_tt:0 "Предпринять одну ковку красного меча.\n\n#weak Ковок нужно три. Первые две проваливаются — так рассказывают, это не бросок костей. Третья кое-что просит, и вы можете ей отказать.#!"
 ln_forge_lightbringer_decision_confirm:0 "Разжечь горн."
 ln_forge_lightbringer_effect_tt:0 "Начать ковку. #weak Сталь займёт месяцы. Что из неё выйдет, зависит от того, что вы готовы в неё вложить.#!"
 ln_forge_needs_a_forge:0 "Вам нужен собственный чертог и под рукой придворный кузнец или красный жрец"
 ln_forge_needs_the_coin:0 "Вам нужно золота на ковку — #V 300#! для графа, больше для великого лорда"
 ln_forge_is_still_cold:0 "Горн ещё не остыл после прошлой попытки"

 # ── 1. WATER ────────────────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.1.t:0 "Тридцать дней и тридцать ночей"
 ln_lightbringer.1.desc:0 "Это лучший клинок, какой кто-либо в вашем чертоге видел, — ровно до того мига, когда он входит в корыто.\n\nВода принимает его, и раздаётся звук — не шипение, а треск, плоский и окончательный, как ломающаяся кость. Посередине идёт трещина, в которую можно вложить ноготь.\n\nОн говорит, что это его вина. Это не так. Он работал тридцать дней и всё делал правильно, и воды не могло хватить никогда, — и под разочарованием вы это уже знали, потому что вы знаете, как идёт эта история, и надеялись, что она неверна."
 ln_lightbringer.1.a:0 "Снова. С самого начала."
 ln_lightbringer.1.b:0 "Послать за жрецом. У того, что здесь нужно, есть имя."

 # ── 2. THE HEART OF A LION ──────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.2.t:0 "Пятьдесят дней и пятьдесят ночей"
 ln_lightbringer.2.desc:0 "В Вестеросе нет львов и не было ещё до того, как появились Ланнистеры, чтобы поместить одного на знамя.\n\nТак что сказание просит того, чего у вас быть не может: жрец говорит, что в этом и суть, а кузнец говорит, что это беда. Льва можно купить в Вольных городах за монету и восемь недель. Сумеречного кота можно взять в горах людьми и дерзостью. Боевой конь стоит в вашей же конюшне, и сердце в нём не хуже, чем в ком-либо ещё.\n\nПятьдесят дней работы лягут на наковальню в любом случае. Что пойдёт в закалку — решать вам."
 ln_lightbringer.2.a:0 "Льва. Привезти из Волантиса. В сказании сказано — лев."
 ln_lightbringer.2.b:0 "Сумеречного кота. Возьмём сами, в горах."
 ln_lightbringer.2.c:0 "Боевого коня из моей конюшни. Сердце есть сердце."

 # ── 3. THE THIRD FORGING ────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.3.t:0 "Сто дней"
 ln_lightbringer.3.desc:0 "Жрец не заставляет вас тянуть это из него. Он говорит прямо, и от этого почему-то хуже.\n\n«Вода — ничто. Зверь — почти ничто: души в нём не больше, чем в воде, он лишь обильнее кровит. Сталь просит не крови. Она просит жизни, которая знала, что она жизнь».\n\nОн даёт этому осесть.\n\n«Азор Ахай позвал жену, и она пришла, и она знала, и она всё равно пришла. Вот почему меч работает. Не убийство. Знание — и приход после него».\n\nКлинок на наковальне, остывает. Он вместит всё, что вы в него вложите."
 ln_lightbringer.3.a:0 "Позвать [ln_beloved.GetFirstName]. [ln_beloved.GetSheHe|U] вправе быть спрошен."
 ln_lightbringer.3.b:0 "[ln_volunteer.GetTitledFirstName] вызвался сам. Принять."
 ln_lightbringer.3.c:0 "Мою. Смерть однажды меня уже брала. Пусть попробует снова."
 ln_lightbringer.3.d:0 "Отложить молот. Ни за какой меч на свете."

 # ── 4. NISSA NISSA ──────────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.4.t:0 "[ln_beloved.GetHerHis|U] душа ушла в сталь"
 ln_lightbringer.4.desc:0 "[ln_beloved.GetSheHe|U] пришёл.\n\nИменно это никто из записывающих не передаёт верно — из этого делают убийство. Это было хуже убийства. [ln_beloved.GetSheHe|U] выслушал всё, задал два вопроса, потом убрал [ln_beloved.GetHerHis] руки за [ln_beloved.GetHerHis] спину, чтобы [ln_beloved.GetSheHe] не потянулся к клинку, и стал ждать.\n\nЗвук, который [ln_beloved.GetSheHe] издал, будет стоять в этой комнате до конца ваших дней. Потом сталь взяла [ln_beloved.GetHerHim], всего [ln_beloved.GetHerHim], как вода берёт соль, и клинок поднялся, светясь так красно, что кузнец закрыл глаза рукой, а огонь в горне погас.\n\nОн тёплый. Он тёплый с тех самых пор. За восемь тысяч лет никто не описал это лучше."
 ln_lightbringer.4.a:0 "Светозарный."

 # ── 5. THE VOLUNTEER ────────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.5.t:0 "Жизнь, которая знала, что она жизнь"
 ln_lightbringer.5.desc:0 "[ln_volunteer.GetTitledFirstName] не приходится уговаривать, и отговорить его не удастся. Всё занимает меньше времени, чем ожидали вы оба.\n\nСталь берёт. Клинок выходит красным, остаётся тёплым, и все в комнате опускаются на колени. По любой мерке, какую можно назвать, это сработало.\n\nДовольным не выглядит только жрец. Когда вы на него нажимаете, он говорит то, чего вы боялись: «Жизнь — да. Даже согласная. Но вы не любили [ln_volunteer.GetHerHim], и [ln_volunteer.GetSheHe] не был вашей потерей».\n\n«Меч настоящий», — говорите вы ему.\n\n«Меч настоящий, — соглашается он. — Но не тот, что из сказания»."
 ln_lightbringer.5.a:0 "Убивать их он будет ничуть не хуже."

 # ── 6. HIS OWN HEART ────────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.6.t:0 "Смерть однажды меня уже брала"
 ln_lightbringer.6.desc:0 "Жрец говорит вам, что это невозможно, потом видит ваше лицо и начинает вместо этого молиться.\n\nСказание точно: третья закалка забирает того, кто уходит в меч. Душа из тела — и в кусок металла, и нет ни одной версии, в которой кузнец уходит на своих ногах.\n\nНо вы уже проходили сквозь эту дверь однажды.\n\nВы выясняете.\n\nКлинок входит. Горн темнеет. Много позже — кузнец не скажет, сколько, и говорить об этом больше не станет — вы поднимаетесь с пола с горящим красным мечом в руке и с дырой внутри, которая не затягивается."
 ln_lightbringer.6.a:0 "Она всё равно никогда не была моей, чтобы её удержать."

 # ── 7. THE HAMMER GOES DOWN ─────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.7.t:0 "Молот ложится"
 ln_lightbringer.7.desc:0 "Вы кладёте его на верстак и выходите.\n\nЖрец идёт за вами во двор и спрашивает, понимаете ли вы, от чего отказываетесь. Вы говорите: да. Он спрашивает иначе, и вы снова говорите: да. Он не сердит — он нечто худшее. Он терпелив, и он говорит, что будет здесь.\n\nСто дней работы стынут на наковальне, а где-то к северу от Стены то, что ходит восемь тысяч лет, ходит и сейчас.\n\nА ещё вы знаете, чьё это было бы лицо. Вот так."
 ln_lightbringer.7.a:0 "Пусть мир обойдётся без одного меча."
 ln_lightbringer.7.b:0 "Не сегодня. Оставить железо на верстаке."

 # ── 8. WORD GETS OUT ────────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer.8.t:0 "Меч, который горит"
 ln_lightbringer.8.desc:0 "История приходит раньше любого надёжного её изложения — по этому и понятно, что она будет большой.\n\n[ln_forger.GetTitledFirstName] выковал меч. Не нашёл — выковал, трижды, и третий раз стоил жизни, и все, кто вам об этом рассказывает, совершенно ясны в этом и совершенно ненадёжны во всём остальном.\n\nСептоны говорят, что это ересь. Мейстеры говорят, что это меч. Ваш собственный кузнец, у которого за всю жизнь не было мнения ни о чём, спрашивает, правда ли, что он не гаснет.\n\nВосемь тысяч лет красные жрецы это обещали — и вот имя, которое вы действительно узнаёте."
 ln_lightbringer.8.a:0 "Сказка. Сталь есть сталь, а стали я повидал немало."
 ln_lightbringer.8.b:0 "Значит, это правда, и все мы очень опаздываем."

 # ── MODIFIERS ───────────────────────────────────────────────────────────────────────────────────────────────
 ln_lightbringer_full_modifier:0 "Светозарный"
 ln_lightbringer_lesser_modifier:0 "Светозарный"
 ln_would_not_pay_the_price_modifier:0 "Не заплатил цену"
 ln_the_forge_is_cold_modifier:0 "Горн холоден"
 ln_hole_in_his_chest_modifier:0 "Дыра, которая не затягивается"
