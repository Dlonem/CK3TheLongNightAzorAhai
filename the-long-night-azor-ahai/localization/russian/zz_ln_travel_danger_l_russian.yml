l_russian:
# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # ── THE ROADS THE DEAD HOLD (1.0.12) ────────────────────────────────────────────────
 ln_the_dead_hold_this_land:0 "Эту землю держат мёртвые"
 ln_the_dead_hold_this_land_desc:0 "Дороги здесь не держит ничто живое. То, что по ним ходит, не нуждается в еде, не спит и не останавливается на краю леса."
 ln_the_dead_are_near:0 "Мёртвые в одном графстве отсюда"
 ln_the_dead_are_near_desc:0 "Граница их страны — черта на карте. То, что внутри неё, об этом не знает."

 ln_travel.1.t:0 "Дорога не пуста"
 ln_travel.1.desc:0 "Ваши разъездные возвращаются галопом, и это первое, что не так, потому что возвращаться им положено шагом.\n\nВпереди на дороге фигуры. Немного — двадцать, может быть, тридцать. Двигаются они небыстро. Это второе, что не так: те, кто хочет вас ограбить, спешат, а те, кто хочет поговорить, останавливаются.\n\nЭти не делают ни того ни другого. Они просто идут вперёд, всё тем же неторопливым шагом, и на ближайшем из них — то, что осталось от крестьянской куртки, и то, что осталось от крестьянина."
 ln_travel.1.desc.btw:0 "Дороги здесь нет. Есть путь через лес, которым ходили достаточно долго, чтобы его протоптать, а это не одно и то же.\n\nОни выходят из сосен с обеих сторон сразу, без звука и без спешки, и их больше, чем можно счесть при том свете, какой у вас есть. На некоторых шкуры. На одном чёрное — или было.\n\nХолод сохранил их очень хорошо."
 ln_travel.1.a:0 "Проехать сквозь них. Они медленны."
 ln_travel.1.a_through:0 "Сквозь — и наружу с другой стороны"
 ln_travel.1.a_caught:0 "На поводе сомкнулась рука"
 ln_travel.1.b:0 "Встать в строй. Развести огонь."
 ln_travel.1.b_tt:0 "Ваша охрана держит дорогу, пока зажигают факелы.\n\n#weak Получается гораздо чаще, чем нет. Когда не получается, это стоит одного из них. Так или иначе это стоит вам месяца с половиной.#!"
 ln_travel.1.b_burned:0 "Они горят"
 ln_travel.1.b_cost:0 "Они горят, и один из ваших тоже"
 ln_travel.1.c:0 "Оставить телеги. Ехать."
 ln_travel.1.c_tt:0 "Всё, что на колёсах, остаётся на дороге. Вы — нет.\n\n#weak Никто не ранен, и все слышат, что вы бежали.#!"

 ln_travel.2.t:0 "Один из них"
 ln_travel.2.desc:0 "Лошади встают прежде, чем вы им велите. Все разом — и дальше они не идут и не поворачивают.\n\nОно стоит там, где тропа делает поворот, и оно тоже не спешит, но по другой причине. Оно выше человека и тоньше человека. Его доспех цвета глубокого льда и выглядит выросшим, а не сделанным. Оно какое-то время смотрело, как вы подходите.\n\nЗа ним деревья белы от инея, которого час назад не было.\n\nКогда оно двигается, звук вашего дыхания — самое громкое в мире."
 ln_travel.2.a:0 "Выйти к нему. Я проделал этот путь не для того, чтобы меня нашли в снегу."
 ln_travel.2.a_shatter:0 "Оно разлетелось, как лёд о камень"
 ln_travel.2.a_cold:0 "Оно оставило вас жить, что хуже"
 ln_travel.2.b:0 "Кто-то должен быть самым медленным."
 ln_travel.2.b_tt:0 "Вы оставляете [ln_travel_guard.GetTitledFirstName] на дороге и не останавливаетесь.\n\n#weak Он не возвращается. Все, кто с вами, будут точно знать, что было сделано и кем.#!"
 ln_travel.2.c:0 "Ехать. Не оглядываться."
 ln_travel.2.c_clear:0 "Оно не пошло следом"
 ln_travel.2.c_hurt:0 "Оно шло следом недолго"
 ln_travel.2.c_taken:0 "Ему нужен был только один из вас"
 ln_past_the_wall:0 "За Стеной"
 ln_past_the_wall_desc:0 "Здесь не действует ничья воля, и за вами никто не придёт. Холод забирает путников, которые всё делали правильно, а то, что ходит по этой земле в Долгую Ночь, о себе не предупреждает."

