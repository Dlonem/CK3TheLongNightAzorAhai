l_russian:

 # ── THE SCATTERED WATCH (Session 10) ────────────────────────────────────────────────────────────────────────
 ln_scatter.2.t:0 "Чёрные плащи у ваших ворот"
 ln_scatter.2.desc:0 "Их трое у ворот, и ваша стража не знает, что с ними делать, потому что так далеко на юге в них нет ни малейшего смысла.\n\nЧёрные плащи — или то, что от них осталось. У одного отморожены пальцы. Судя по сапогам, они прошли очень долгий путь, и все говорят одно и то же ровными голосами людей, переставших надеяться, что им поверят:\n\nСтена пала. Дозор сломлен. Мёртвые идут на юг вслед за ними — и идут не спеша, потому что спешить им незачем.\n\nВы слышали слухи. Слухи — это погода. А эти люди — уцелевшие из самой бури, и они стоят у вас во дворе."
 ln_scatter.2.desc.north:0 "Всякий северянин знает одно: Ночной Дозор никогда не уходит со Стены.\n\nПоэтому, когда стража докладывает о трёх чёрных братьях у ворот — оборванных, обмороженных, у одного нет половины кисти, — вы уже поднимаетесь, не дослушав, потому что чёрные плащи так далеко от Стены не дезертиры и не попрошайки. Они — арифметика. Дозора больше нет, а это остаток.\n\nОни говорят прямо, как говорят северяне: Стена пала. Мёртвые идут по Королевскому тракту, и они никуда не торопятся.\n\nСтарая Нэн рассказывала вам, как идёт эта история. Она не говорила, что она придёт к вашим воротам в чёрном плаще."
 ln_scatter.2.desc.red:0 "Владыка Света не шлёт воронов. Он шлёт свидетелей.\n\nТрое братьев павшего Дозора у ваших ворот, обожжённые холодом дочерна, как других обжигает огонь, и каждое их слово — проповедь, которую вы уже читали: Стена пала, тьма на свободе, мёртвые ходят. Ваш ночной костёр привёл их за половину королевства — единственный свет на дороге, сказали они, который не оказался мертвецкой свечой.\n\nРглор доставил доказательство к вашему порогу, ещё дышащим.\n\nА как поступают с доказательством — это и есть мера верного."
 ln_scatter.2.a:0 "В моём чертоге найдётся место для тех, кто это видел."
 ln_scatter.2.b:0 "Накормить. Вооружить. И разослать по всем замкам к югу отсюда."
 ln_scatter.2.c:0 "За оставление Стены полагается смерть."
 ln_scatter_brothers_join_tt:0 "Трое братьев поступают на службу при вашем дворе. Это присягнувшие люди Дозора, которого больше нет: крепкие, опытные и стоящие в строю куда больше, чем можно подумать по их годам."
 ln_scatter.3.t:0 "Что оставил вам Дозор"
 ln_scatter.3.desc:0 "[ln_scattered_brother.GetTitledFirstName] в вашем чертоге уже целый сезон и ни разу ничего не попросил.\n\nОн ест со стражей. Он встаёт раньше неё. Три дня назад из казарм пришло сообщение — неловкое, — что этот человек забыл о том, как держат стену зимой, больше, чем кто-либо в этом замке когда-либо знал, и что гарнизон начал распрямляться, когда он проходит мимо, а такого людям не прикажешь.\n\nИногда он ещё просыпается в темноте. Об этом его никто не спрашивает."
 ln_scatter.3.a:0 "Поставить его на стены. Для того он и есть."
 ln_scatter.3.b:0 "Усадить его с моими военачальниками. Им нужно это услышать."
 ln_black_cloaks_in_the_garrison_modifier:0 "Чёрные плащи на стенах"
 ln_black_cloaks_in_the_garrison_modifier_desc:0 "В гарнизоне этого замка стоят люди Дозора, которого больше нет. Они держали стены и похуже этой."
