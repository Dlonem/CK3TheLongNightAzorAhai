l_russian:

 ln_mine_dragonglass_decision_desc:0 "Послать людей копать и заплатить, сколько это будет стоить.\n\nПод Драконьим Камнем очень много [dragonglass|E], и ещё больше — в дюжине мест, которые никто не потрудился разведать, потому что до самого недавнего времени на свете не было ни одной причины его хотеть."
 ln_mine_dragonglass_decision_tt:0 "Заложить запасы [dragonglass|E]."
 ln_mine_dragonglass_decision_confirm:0 "Копать."

 ln_prophecy.31.t:0 "Застывший огонь"
 ln_prophecy.31.desc:0 "Приходят первые телеги, и ваш мастер над оружием откровенно не впечатлён.\n\nЭто стекло. Оно крошится, если не так на него посмотреть, оно не держит лезвия против приличного меча, и вооружить им людей — значит вооружить их тем, что разлетается вдребезги. Он совершенно прав.\n\nА ещё, замечаете вы, у него самого такой на поясе.\n\nДети Леса звали его застывшим огнём и восемь тысяч лет пускали его в ход против того, чего, по твёрдому убеждению Цитадели, никогда не существовало. Вы верите детям, а не Цитадели, — и не ожидали, что когда-нибудь сможете сказать о себе такую фразу."
 ln_prophecy.31.a:0 "Всё равно вооружить. Каждого, кто может его нести."
 ln_prophecy.31.b:0 "Тихо. Державе незачем знать зачем."

 # Station branches, added Session 10.
 ln_prophecy.31.desc.watch:0 "Приходят первые телеги, и в Чёрном Замке никто не смеётся.\n\nСтекло крошится, если не так на него посмотреть. Оно не держит лезвия против приличного меча. Оба этих обстоятельства известны каждому брату на Стене, и каждый брат всё равно берёт себе такой, потому что Дозор — единственное место в мире, где старые свидетельства так и не отправили целиком в разряд сказок.\n\nЯ — щит, что охраняет царства людей. Восемь тысяч лет люди произносили эти слова, не зная, из чего этот щит полагалось сделать.\n\nТеперь вы знаете."
 ln_prophecy.31.desc.seen:0 "Приходят первые телеги, и ваш мастер над оружием откровенно не впечатлён. Это стекло, говорит он. Оно разлетается вдребезги, говорит он.\n\nВы даёте ему договорить. Речь разумная, и он прав во всём.\n\nНо его там не было. Он не видел того, что видели вы, — холода, который приходит раньше него самого, глаз, как зимнее небо, за которым ничего нет. Цитадель может спорить с Детьми Леса. С вашей памятью она спорить не может, и вы тоже.\n\nЗастывший огонь, звали его дети. Вы больше не верите ничьим словам."

 # ── PREPARATION MODIFIERS ───────────────────────────────────────────────────────────────────────────────────
 ln_valyrian_armed_modifier:0 "Сталь, выкованная с чарами"
 ln_valyrian_armed_modifier_desc:0 "Клинок из фригольда, мёртвого четыреста лет, в руке у того, у кого есть причина им воспользоваться.\n\nЕму всё равно, насколько холодно то, что перед ним."
 ln_dragonglass_stores_modifier:0 "Запасы драконьего стекла"
 ln_dragonglass_stores_modifier_desc:0 "Ящики колотого чёрного стекла, розданные людям, которые считают, что вы лишились рассудка.\n\nОни перестанут так считать."

 # ── THE DRAGONGLASS, SPLIT IN TWO ───────────────────────────────────────────────────────────────────────────
 ln_dragonglass_armed_modifier:0 "Вооружены драконьим стеклом"
 ln_dragonglass_armed_modifier_desc:0 "Каждому копью в ополчении переменили наконечник на чёрное стекло, и каждому человеку сказали, для чего это. Это продлится ровно столько же, сколько тьма."
 ln_dragonglass_knight_modifier:0 "С драконьим стеклом"
 ln_dragonglass_knight_modifier_desc:0 "Носит клинок из чёрного вулканического стекла. О кольчугу он разлетается вдребезги — и убивает то, чего сталь не берёт."
