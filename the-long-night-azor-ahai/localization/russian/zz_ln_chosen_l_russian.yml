l_russian:

 # AGOT: The Long Night & Azor Ahai -- the Chosen chain.

 ln_chosen.1.t:0 "Корона решила, для чего вы нужны"
 ln_chosen.1.desc:0 "Предложение щедрое, и это не вполне предложение.\n\nЗемли, место в совете, брак, если захотите, — а взамен вы едете под [ln_chosen_king.GetHerHis] знаменем, вас при этом видят, и слово, которое ходит за вами следом, становится [ln_chosen_king.GetHerHim] собственностью.\n\n[ln_chosen_king.GetHerHis|U] посланник осторожен и вслух этого не говорит. Он говорит о чести, о необходимости и о временах, в которые мы живём, а потом даёт паузе тянуться самую малость дольше нужного, чтобы вы поняли: он точно знает, что покупает.\n\nТрудно всё это тем, что он, возможно, прав. Имя, за которым нет войска, — это слух. Имя, за которым стоит король, — это дело."
 ln_chosen.1.a:0 "Я присягну. Знамя — всего лишь ткань."
 ln_chosen.1.b:0 "Я поддержу [ln_chosen_king.GetHerHim] в бою. Но [ln_chosen_king.GetHerHim] знамени я не понесу."
 ln_chosen.1.c:0 "Короли — южная забота. Так и передайте [ln_chosen_king.GetHerHim] посланнику."

 ln_chosen.2.t:0 "Посланник от другого"
 ln_chosen.2.desc:0 "Он приехал без даров, без титулов и без требований, и уже одно это говорит вам, что эти люди настроены серьёзно.\n\n«Тот, кто меня послал, не говорит, что вы ложный, — говорит посланник. — Только что он не знает. Те же знаки, те же жрецы — и большое желание оказаться в одной комнате с единственным другим живым человеком, который понимает эту задачу».\n\nОн выжидает. Потом, тише: «Меня просили сказать ещё одно, ровно так: если это вы, они пойдут за вами. И смотреть при этом на ваше лицо».\n\nОн смотрит на ваше лицо."
 ln_chosen.2.a:0 "Значит, мы встретимся. Один из нас ошибается, и это может быть я."
 ln_chosen.2.b:0 "Отправить его домой. Мне нечего сказать слуху."
 ln_chosen.2.c:0 "Отправить его домой с именем и с тем, где я буду стоять."

 ln_chosen.3.t:0 "У Цитадели есть вопросы"
 ln_chosen.3.desc:0 "В нём одиннадцать страниц, и оно невероятно учтиво.\n\nМейстера Цитадели приставили к вашему делу, и он был бы признателен за ответы. Имена свидетелей. Может ли комету в год вашего рождения подтвердить кто-нибудь вне вашего двора. Согласитесь ли вы на осмотр.\n\nКаждый вопрос разумен. Каждый вопрос при этом весьма точно устроен так, чтобы дать ответ, который можно записать, подшить и тихо не публиковать.\n\nЦитадель занимается тем, чтобы события оказывались не бывшими, уже очень давно, и умеет это превосходно."
 ln_chosen.3.a:0 "Ответить на все одиннадцать страниц. Честно."
 ln_chosen.3.b:0 "Сжечь. Они меня не изучают, они меня заносят в опись."
 ln_chosen.3.c:0 "Пригласить его сюда. Пусть год за мной наблюдает."

 ln_chosen.4.t:0 "Они не спросили"
 ln_chosen.4.desc:0 "Костёр уже сложен, когда вы спускаетесь, и к нему уже привязан человек.\n\nЗа вами не посылали. Именно этого вы не можете обойти. Всё это устроили в вашем собственном дворе жрецы, считающие вопрос решённым, и ни одному из них не пришло в голову, что с человеком, стоящим в середине пророчества, может понадобиться посоветоваться.\n\nОсуждённый — браконьер, лет сорока, сидит в ваших клетях с Девина дня. Он не издаёт ни звука вовсе, и это почему-то худшая из имеющихся подробностей.\n\nФакел зажжён. Жрец, который его держит, смотрит на вас с выражением чистого, безоблачного радушия."
 ln_chosen.4.a:0 "Погасить. Своими руками, если придётся."
 ln_chosen.4.b:0 "Останавливать поздно. Стоять и смотреть."
 ln_chosen.4.c:0 "Погасить — и повесить того, кто поджёг."

 ln_chosen.5.t:0 "Нож"
 ln_chosen.5.desc:0 "Он подобрался ближе, чем кому-либо хочется признавать.\n\nСлуга, четыре месяца в доме, с рекомендациями, на подделку которых кто-то потратил настоящие деньги. Он был быстр и не был удачлив, и теперь он в клетях со сломанной рукой и очень странным спокойствием.\n\nОн не скажет, кто его послал. Зато он говорит, без всякого вопроса, что не считает вас ложным, — и верит в это совершенно. Именно поэтому он и пришёл. Обоими быть нельзя, а самый быстрый способ разрешить пророчество — уменьшить число притязателей.\n\nЗа эту арифметику кто-то заплатил очень много денег."
 ln_chosen.5.a:0 "Пусть станет известно, что он не преуспел. Это стоит больше, чем он сам."
 ln_chosen.5.b:0 "Выяснить, кто его послал. Тихо и до конца."
 ln_chosen.5.c:0 "Отпустить его. Пусть расскажет им, что видел."

 ln_chosen.6.t:0 "Они чего-то ждут"
 ln_chosen.6.desc:0 "Это чувствуется по всему строю ещё до того, как затрубят рога.\n\nОни не боятся. В этом и беда. Испуганные люди полезны: страх держит их близко и заставляет слушать. Эти спокойны, потому что у костров разошлась история о том, кто их ведёт, и немалое их число тихо решило, что сегодня не тот день, когда они умрут.\n\nПоэтому, когда строй сломается — а строи ломаются, — он сломается не так, как ломаются строи обычно. Он уйдёт весь разом, потому что держала его вовсе не выучка.\n\nВаш маршал об этом ничего не сказал. Он и ни разу за это утро на вас не посмотрел."
 ln_chosen.6.a:0 "Проехать вдоль строя и сказать им правду до рогов."
 ln_chosen.6.b:0 "Ничего не говорить. Пусть побудут с этим ещё один день."
 ln_chosen.6.c:0 "Выехать вперёд, туда, где меня видят их лучники."

 ln_chosen.7.t:0 "Соль и дым"
 ln_chosen.7.desc:0 "Вы не спите. Вы уверены, что не спите, и именно эта подробность вас не отпустит.\n\nНа губах соль — настоящая соль, а моря нет на сотню миль вокруг. Есть дым, который идёт не от огня. И есть очертание на краю всего, которое не делает вообще ничего, а просто есть, — и это хуже, чем если бы оно двигалось.\n\nПо свече это длится минут девять.\n\nПотом комната снова комната, а вы — человек, сидящий в постели с дрожащими руками, и на тыльной стороне ладони у вас соляной налёт, и утром он всё ещё там."
 ln_chosen.7.a:0 "Записать в точности, что было. Ничего не толковать."
 ln_chosen.7.b:0 "Отнести это жрецу. Он поймёт, что это было."
 ln_chosen.7.c:0 "Это был сон. Людям снятся сны."

 ln_chosen.8.t:0 "Вера отвечает"
 ln_chosen.8.desc:0 "Это зачитали со ступеней Великой Септы, и в течение месяца прочтут в каждой септе державы.\n\nЕретиком вас не называют — они всегда осторожны. Осуждается «чужой огонь и те, кто позволяет ему себя наречь», что то же самое, сказанное так, что на это нельзя ответить поединком.\n\nДвое септонов уже покинули ваши земли. Сговор о браке, согласованный на три четверти, затих. Ваш мейстер говорит, что это читают и на Севере, и там оно не заходит вовсе.\n\nЧто не то же самое, что «заходит хорошо для вас». Это другого рода беда, подальше отсюда."
 ln_chosen.8.a:0 "Пусть читают. Мне готовиться к войне."
 ln_chosen.8.b:0 "Ответить. Письменно, в каждую септу державы."
 ln_chosen.8.c:0 "Хорошо. Пусть прочтут это на Севере и посмотрят, что будет."

 ln_chosen.9.t:0 "Тот, кто не станет этого произносить"
 ln_chosen.9.desc:0 "[ln_holdout.GetTitledFirstName] никогда ни в чём вам не отказывал и не отказывает сейчас. [ln_holdout.GetSheHe|U] явился с пересчитанными [ln_holdout.GetHerHis] ополченцами, с присягнувшими [ln_holdout.GetHerHis] рыцарями — и с прямым отказом произнести это слово.\n\n«Я поеду туда, куда вы укажете, и умру там, если так надо, — говорит [ln_holdout.GetSheHe]. — Чего я не сделаю, так это не встану во дворе и не назову живого человека пророчеством, потому что я в это не верю, а лгать перед собственными сыновьями я не стану».\n\nЭто слышал весь чертог. Вопрос не в том, верен ли [ln_holdout.GetSheHe], — очевидно, что [ln_holdout.GetSheHe] верен. Вопрос в том, что остальные сделают с тем обстоятельством, что сказать «нет» вслух оказалось делом, которое можно пережить."
 ln_chosen.9.a:0 "[ln_holdout.GetSheHe|U] не обязан в это верить. [ln_holdout.GetSheHe|U] обязан ехать."
 ln_chosen.9.b:0 "Наказать [ln_holdout.GetHerHim] в назидание. Остальные смотрят."

 ln_chosen.10.t:0 "Здесь больше нечего делать"
 ln_chosen.10.desc.open:0 "Кони готовы и готовы с первого света. Больше вас никто не спрашивал. Просто всё приготовили, а потом нашли себе другие дела в виду двора.\n\n"
 ln_chosen.10.desc.burned:0 "Вы всё думаете о браконьере. Не об огне — о тишине. Сорок лет от роду, и ни звука, и толпа, считавшая, что смотрит на нечто святое."
 ln_chosen.10.desc.believed:0 "Вы всё думаете о строе людей, которые не боялись, о том, что это было вашей работой, и о том, чего это стоило, когда строй ушёл."
 ln_chosen.10.desc.dismissed:0 "С тех пор вы соли не пробовали. Вы сказали себе, что это был сон, и с тех пор старательно не смотрите на тыльную сторону ладони."
 ln_chosen.10.desc.risen:0 "Вы уже побывали по ту сторону этого однажды. Только это и делает двор выносимым: что бы там наверху ни было, вы неплохо представляете, каково это — проиграть, и это было тише, чем думают."
 ln_chosen.10.desc.plain:0 "Ваш маршал пересчитал колонну трижды. Он точно знает, сколько уходит. Вслух он этого числа не произнёс."
 ln_chosen.10.desc.close:0 "\n\nСеверная дорога — единственная, которую расчистили."
 ln_chosen.10.a:0 "Значит, выступаем."
 ln_chosen.10.b:0 "Пока нет. Сперва здесь есть дело."

 # ── FERVOR REASONS ──────────────────────────────────────────────────────────────────────────────────────────
 ln_fervor_loss_refusal:0 "Избранный отверг огонь"

 # The friendship reason when two Chosen meet instead of feuding (ln_chosen.2, option a).
 ln_friend_two_chosen:0 "встретил единственного другого живого человека, который понимает эту задачу"

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_chosen.3.d:0 "Я уже знаю, что Цитадель делает с таким письмом. Отправить его назад нераспечатанным."
 ln_chosen.7.d:0 "Эта комната мне снилась. Снилась ещё до соли."
 ln_chosen.10.desc.dreamt:0 "Вы здесь уже были — в том смысле, который важен. Не в этой комнате: в этом часе. Он снился вам много лет назад, и вы проснулись, не в силах никому объяснить, почему плачете, и с тех пор шли к нему, ни разу не сумев сказать об этом вслух.\n\nЕсть особое одиночество в том, чтобы узнать худший день своей жизни, пока ещё стоишь у его начала.\n\nЛюди смотрят на вас так, как смотрят на того, кто что-то знает. Они правы, и это ни разу не помогло."
 ln_chosen.10.desc.silent:0 "Цитадель написала вам одиннадцать страниц, а вы отправили их назад с нетронутой печатью, и думали вы об этом чаще, чем ожидали.\n\nИм нужно было, чтобы это записали и подшили. Подшитое перестаёт быть правдой. Чем бы это ни было, оно осталось опасным именно потому, что ни одному мейстеру не довелось поставить на нём число и положить его на полку.\n\nЗаписи о вас не останется. Останется лишь то, что будет дальше, и то, уцелеет ли кто-нибудь, чтобы скверно об этом рассказать."
