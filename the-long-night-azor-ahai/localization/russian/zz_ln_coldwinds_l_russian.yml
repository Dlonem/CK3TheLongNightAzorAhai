l_russian:

 # The Cold Winds flavour cards -- Wall and North only, strictly atmosphere.
 ln_coldwinds.1.t:0 "Там никого не было"
 ln_coldwinds.1.desc:0 "Разведчик, который это рассказывает, говорил вещи и потяжелее, не моргнув, — и [ROOT.Char.GetSheHe] не моргает и сейчас. Тем и худо.\n\n«Нашли поход в трёх днях пути. Всех. Лежат в снегу с открытыми глазами, холодные как камень, — я пересчитал тела дважды, мой [ROOT.Char.Custom('FormOfAddressForLiege')]. Поехали назад за телегой и людьми. Не было нас полдня».\n\nОн смотрит в огонь и [ROOT.Char.GetHerHim] не видит.\n\n«Когда вернулись — там никого не было. Не утащили. Следов наружу нет. Только снег, примятый там, где они лежали, и восемь цепочек следов, уходящих на север»."
 ln_coldwinds.1.a:0 "Мёртвые не встают и не уходят. Искать снова."
 ln_coldwinds.1.b:0 "Запирать ворота в сумерках. Каждые сумерки."
 ln_coldwinds.2.t:0 "Тишина"
 ln_coldwinds.2.desc:0 "У Зачарованного леса всегда был голос — волки в сумерках, вороны, бранящиеся в белых деревьях, мелкая возня и треск тех, кто живёт свою жизнь под снегом.\n\nЛюди, что ходят поверху льда, начали об этом заговаривать, а у таких людей это значит два слова и движение подбородком: ничего не движется. В этом месяце нет волков. На этой неделе нет птиц. Последний дозор вернулся, и единственный звук, о котором они смогли доложить после трёх дней среди деревьев, — дыхание собственных лошадей.\n\nЛес не бывает беззвучным. Разве что всему в нём есть куда уйти."
 ln_coldwinds.2.a:0 "Лес затихает, когда в нём кто-то охотится."
 ln_coldwinds.2.b:0 "Зима. Это всего лишь зима."
 ln_coldwinds.3.t:0 "Огни требуют присмотра"
 ln_coldwinds.3.desc:0 "Заметили самые старые — те, кто кормит ночные костры сорок лет и знает их нрав, как пастух знает погоду. Огни требуют присмотра, говорят они. Дрова, которых должно хватить до утра, к средней страже уже серая зола. Пламя странно встаёт в неподвижном воздухе, клонится, будто есть ветер, которого никто рядом с ним не чувствует.\n\nИ безо всякого приказа старики перестали садиться спиной к северу."
 ln_coldwinds.3.a:0 "Удвоить выдачу дров. Ничего не говорить."
 ln_coldwinds.3.b:0 "Посидеть со стариками. Выслушать их."
 ln_coldwinds.4.t:0 "Волки идут на юг"
 ln_coldwinds.4.desc:0 "Зверь идёт. Лоси на Королевском тракте в числе, какого не видел и самый старый охотник, олени переплывают реки, которых никогда не переходили, а за ними волки — целыми стаями, минуя ночью [ROOT.Char.GetHerHis] крепость и не останавливаясь потревожить загоны.\n\nИменно эту подробность простой люд повторяет снова и снова — так, как повторяют то, что пугает вкось: волки не охотятся. Они идут. Всему, что живёт севернее, есть куда уйти, и всё это — на юг."
 ln_coldwinds.4.a:0 "Что ж, добрая охота."
 ln_coldwinds.4.b:0 "Спросить, от чего они бегут."
 ln_coldwinds.5.t:0 "Она ни разу не ошиблась"
 ln_coldwinds.5.desc:0 "На кухнях есть старуха, пережившая трёх лордов этого чертога, и каждую зиму своей долгой жизни она называла погоду прежде, чем та приходила, — те, кто рассчитывает забой скота и семенное зерно, тихо справляются сначала у неё, и так уже много лет.\n\nВ этом году она не назовёт срока оттепели. Она садится ближе к огню, чем прежде, работает спицами и всякому, кто спросит, отвечает одно и то же — ровным голосом женщины, которая сообщает то, что видит в окно:\n\n«Холодные ветры поднимаются. Эта не кончится»."
 ln_coldwinds.5.a:0 "Дать ей место у большого огня."
 ln_coldwinds.5.b:0 "Старухи говорят старое."
