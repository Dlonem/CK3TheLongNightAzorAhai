l_russian:

 # ── THE DECISION ────────────────────────────────────────────────────────────────────────────────────────────
 ln_send_for_a_red_priest_decision_desc:0 "Где-то к востоку отсюда есть люди, которые проповедуют о долгой ночи и обещанном принце ещё с тех пор, как у вашего дома не было имени. Вы всегда считали их безумцами. Теперь вы не так в этом уверены.\n\nПисьмо в Мир — и монеты довольно, чтобы переезд стоил жрецу хлопот."
 ln_send_for_a_red_priest_decision_tt:0 "Послать за Узкое море за жрецом Рглора. Переезд занимает месяцы, и вы не обязаны радоваться тому, что услышите в конце."
 ln_send_for_a_red_priest_decision_confirm:0 "Написать в Мир"
 ln_send_for_a_red_priest_decision_desc.hear:0 "Жрец Рглора уже живёт под вашей крышей. Месяцами вы слышали разговоры об огне за своим столом и ни разу не спросили, что он говорит.\n\nСпросите."
 ln_send_for_a_red_priest_decision_tt.hear:0 "Красный жрец уже стоит в вашем чертоге. Выслушайте, что скажет огонь. Это ничего не стоит, и вы не обязаны этому радоваться."
 ln_send_for_a_red_priest_decision_confirm.hear:0 "Спросить."

 # ── THE ARRIVAL ─────────────────────────────────────────────────────────────────────────────────────────────
 ln_pledge.1.t:0 "Жрец у ворот"
 ln_pledge.1.t.hall:0 "Жрец за столом"

 ln_pledge.1.desc.summer:0 "Жрец худее, чем вы ожидали, и старше, и он не кланяется.\n\n«Вы послали за мной, потому что что-то не даёт вам спать, и никому в этом чертоге вы об этом не сказали». Жрец даёт этому осесть. «Я не стану говорить вам, что мир кончается. Я скажу вам, что он уже кончался — и что один человек стоял там, где тьма была гуще всего, и не побежал. Мой орден давно ждёт, чтобы узнать, кто встанет там следующим».\n\nВзгляд, который вы ловите, длится на мгновение дольше нужного.\n\n«Обычно это не тот, кто за нами посылает»."
 ln_pledge.1.desc.hall:0 "Жрец месяцами живёт под моей крышей, ест за моим столом, и я ни разу не спросил, что говорит огонь. Сегодня спросил.\n\n— Я ждал, когда вы спросите. — Ни поклона, ни удивления. — Я не скажу вам, что мир кончается. Я скажу, что он уже кончался, и один человек стоял там, где тьма была гуще всего, и не побежал. Мой орден давно ждёт, чтобы узнать, кто встанет там следующим.\n\nВзгляд задерживается на мне на миг дольше, чем следует.\n\n— Обычно это не тот, кто спрашивает."
 ln_pledge.1.desc.cold:0 "Лето сломалось, пока корабль был ещё в море.\n\nЖрец входит из ветра, которому ещё рано быть таким холодным, встаёт, капая, посреди вашего чертога, и первые слова — не приветствие.\n\n«Давно ли холодно?»\n\nКогда вы отвечаете, кивок в ответ — это кивок человека, подтверждающего дату, которая у него уже была. «Значит, времени у нас меньше, чем я надеялся, и больше, чем я боялся. Милорд, ваши боги — прекрасная вера для мира, который будет и дальше существовать. Я здесь потому, что мой бог — единственный, кому когда-либо задавали именно этот вопрос, и он ответил, и я могу показать вам, чего этот ответ стоил»."

 ln_pledge.1.desc.night:0 "Жрец приехал не обращать вас. На это времени уже нет, и вы оба это знаете.\n\nСошёл с корабля, прошёл на север сквозь беженцев, идущих в другую сторону, и явился к вашим воротам с котомкой и лицом человека, прибывшего ровно туда, куда собирался.\n\n«Вы знаете, что происходит, — говорит жрец. — Чего не знает никто в этом чертоге, так это что с этим можно драться, что с этим уже дрались и что огонь — не иносказание». Котомка опускается на пол. «Я могу научить ваших кузнецов трём вещам, прежде чем умру от этого холода. Или вы можете меня сжечь и примерно с сезон чувствовать себя очень праведно»."

 ln_pledge.1.a:0 "Тогда твой бог — мой бог."
 ln_pledge.1.a.tt:0 "Вы обращаетесь к Рглору.\n\nРглор — вера этой войны: [struggle_interloper|E], принявший её, становится [struggle_involved|E] в Долгой Ночи. Знаменосцы вас за это не поблагодарят."
 ln_pledge.1.b:0 "Оставь себе свой огонь, жрец. Я оставлю себе свои мечи — и пущу их в ход."
 ln_pledge.1.c:0 "Сжечь жреца."

 # ── AFTER THE CONVERSION ────────────────────────────────────────────────────────────────────────────────────
 ln_pledge.2.t:0 "Что услышал чертог"
 ln_pledge.2.desc:0 "Одиннадцать дней ушло на то, чтобы это дошло до всех, кто важен, а на двенадцатый [ln_objector.GetTitledFirstName] пришёл сказать это вам в лицо.\n\n«Я присягал очень многому у вас на службе, — говорит [ln_objector.GetSheHe]. — Этому я не присягал. Мой отец покоится перед нашими богами. Моих детей нарекали перед ними». Пауза — а потом та часть, которую [ln_objector.GetSheHe] явно репетировал. «Я не прошу вас объясняться. Я спрашиваю, ожидается ли, что я пойду за вами в это»."
 ln_pledge.2.a:0 "Ожидается. От всех вас."
 ln_pledge.2.b:0 "Нет. Я сделал это не для того, чтобы это делал кто-то ещё."

 # ── AFTER THE PLEDGE ────────────────────────────────────────────────────────────────────────────────────────
 ln_pledge.3.t:0 "Колонна на север"
 ln_pledge.3.desc:0 "Они уходят по Королевскому тракту в первой серости утра, и колонна меньше, чем вы воображали, когда произносили те слова.\n\nУ вашего маршала числа записаны, и он всё равно читает их вам вслух — так, как делают люди, желающие, чтобы на бумаге осталось, что они предупреждали: столько-то копий ушло, стольких-то рук не хватит на жатву, столько-то лет до того, как хоть кто-то вернётся. Он не говорит «если». Он вас щадит.\n\nВ хвосте телега с кузнечной снастью. О кузнецах вы не подумали."
 ln_pledge.3.a:0 "Послать за ними второй набор."
 ln_pledge.3.b:0 "Это то, что я обещал. Кто-то должен держать юг."

 # ── AFTER THE BURNING ───────────────────────────────────────────────────────────────────────────────────────
 ln_pledge.4.t:0 "Что было сказано в огне"
 ln_pledge.4.desc:0 "Жрец не кричал, и именно этого вы не можете отложить.\n\nЛюди кричат. Вы жгли людей и прежде — разбойников, отравителя, однажды кузена, — и они кричат, а потом всё кончается, и вы идёте ужинать. Жрец всё это время смотрел на вас с выражением, которому вы уже несколько недель не можете подобрать имени, и ближе к концу сказал нечто, что стража расслышала по-разному. Ваш капитан говорит, что это была молитва. Мальчишка, который поджигал, говорит, что это была дата.\n\nПо утрам стало холодно."
 ln_pledge.4.a:0 "Это была молитва. И только."
 ln_pledge.4.b:0 "Говорить, что это была молитва. Громко и часто."

 # ── MODIFIERS ───────────────────────────────────────────────────────────────────────────────────────────────
 ln_sworn_to_the_dawn_modifier:0 "Присягнувший рассвету"
 ln_sworn_to_the_dawn_modifier_desc:0 "Люди, монета и кузнецы, отданные войне на Севере, в которую половина вашего двора не верит."
 ln_burned_the_red_priest_modifier:0 "Сжёг красного жреца"
 ln_burned_the_red_priest_modifier_desc:0 "Благочестивые отзываются о вас очень тепло. Как и все, кто никогда не бывал севернее Перешейка."
 ln_took_the_red_modifier:0 "Принял красного бога"
 ln_took_the_red_modifier_desc:0 "Вы сменили богов на глазах у собственных знаменосцев, и они смотрели."
 ln_gave_the_last_kiss_modifier:0 "Дал последний поцелуй"
 ln_gave_the_last_kiss_modifier_desc:0 "Воззвал душу обратно из огня и заплатил разницу. То, что было взято, назад не вернули."
