l_russian:
 # The ranging marches (1.0.6)
 ln_march_the_ranging_decision:0 "Выступить в поход"
 ln_march_the_ranging_decision_desc:0 "Лагерь сворачивают за час. В этом всегда и был смысл похода: это не замок, и люди в нём — не гарнизон. Единственный вопрос, на который капитан по-настоящему отвечает, задаёт карта."
 ln_march_the_ranging_decision_tt:0 "Выберите землю за Стеной и переведите лагерь туда."
 ln_march_the_ranging_decision_confirm:0 "Трубить в рог"
 ln_return_to_the_wall_decision:0 "Вернуться к Стене"
 ln_return_to_the_wall_decision_desc:0 "Что бы поход ни нашёл или не нашёл, кончается он у Стены. Лагерь поворачивает на юг, и каждый в нём идёт немного быстрее, чем шёл туда."
 ln_return_to_the_wall_decision_tt:0 "Отвести лагерь домой, к Чёрному Замку."
 ln_return_to_the_wall_decision_confirm:0 "Поворачивать на юг"
 ln_ranging.1.t:0 "Куда идёт поход"
 ln_ranging.1.desc:0 "Отряд построен, сани нагружены, ворота открыты. К северу отсюда есть три места, куда капитан может разумно направиться, и у каждого брата в колонне есть мнение обо всех трёх."
 ln_ranging.1.a:0 "Замок Крастера. Крыша — хоть какая-то."
 ln_ranging.1.b:0 "Белое Древо. Глухой лес."
 ln_ranging.1.c:0 "Суровый Дом. Дальний берег."
 ln_ranging.1.d:0 "Пока нет. Лагерь остаётся."
 ln_ranging.2.t:0 "Лагерь стоит"
 ln_ranging.2.desc.north:0 "Палатки подняты и ров выкопан до темноты. Это не замок. Им и не собирались быть. Но это Дозор, стоящий там, где Дозор нужен, — и сегодня это здесь."
 ln_ranging.2.desc.home:0 "Стена съедает горизонт за день до того, как вы её достигнете, — как всегда. Лагерь встаёт в её тени, и впервые за много недель караулы проходят тихо."
 ln_ranging.2.a:0 "Так и есть."
