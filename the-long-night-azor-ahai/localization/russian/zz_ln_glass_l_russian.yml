# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- dragonglass lore (1.1.0, §11).

 TRAVEL_POINT_OF_INTEREST_TT_ln_poi_dragonglass:0 "Место знания о драконьем стекле"
 ln_poi_dragonglass_tt:0 "Запустит событие знания о драконьем стекле"

 ln_glass.1.t:0 "Стеклянный берег"
 ln_glass.1.desc:0 "Берега под Драконьей Горой чёрные. Не тёмные — чёрные, тем истинным чёрным, какой бывает у того, что ни разу не было ничем иным. Простой люд здесь собирает его так, как на других берегах собирают плавник, и скажет вам, если спросите, какие жилы дают клинки, а какие — бусины.\n\nСтарый каменолом катает кусок в пальцах и показывает вам всю хитрость: где камень хочет сломаться, а где будет с вами бороться. Застывший огонь, звали его валирийцы. Он не знает почему. Всё остальное о нём он знает."
 ln_glass.1.a:0 "Выучить камень"
 ln_glass.2.t:0 "Что хранят записи"
 ln_glass.2.desc:0 "У Цитадели для этого есть комната — не полка, комната. Трактаты об обсидиане с трёх материков, ящик клинков из раскопок за Стеной и мейстер с тремя звеньями валирийской стали в цепи, счастливый так, как счастлив человек, о чьём предмете никто не спрашивал сорок лет.\n\nСтарые отчёты сходятся друг с другом — потому и стоят потраченной свечи. Дети Леса давали Дозору сто кинжалов в год. Кинжалы были из обсидиана. Зачем — записать тогда никто не подумал, потому что тогда это знали все."
 ln_glass.2.a:0 "Прочесть всё"
 ln_glass.3.t:0 "Склепы помнят"
 ln_glass.3.desc:0 "Старые Короли Зимы сидят в темноте с железными мечами на коленях, и чем глубже вы идёте, тем старее делается темнота. Ниже тех подземелий, которые вы знаете, склепы идут дальше — обвалившиеся, заложенные, старше замка над ними.\n\nВ самом дальнем их конце ваш факел находит полку, вырубленную в живом камне, а на ней, уложенные плоско и в порядке, как в день, когда их оставили, — ряд клинков из чёрного стекла. Оставил кто? Для чего? Старки сидят над этой полкой восемь тысяч лет. Кто-то в начале этого срока счёл, что на дне дома должны быть ножи."
 ln_glass.3.a:0 "Взять один из клинков"
 ln_glass.4.t:0 "Дозор это записал"
 ln_glass.4.desc:0 "Дозор держит свои записи в подвале под оружейной, и самые старые из них — не бумага, а счётные палочки и камень. Сто кинжалов в год, от Детей Леса Дозору, покуда держался уговор. Писцы заносили числа без замечаний три тысячи лет.\n\nБрат-присяжный с испачканными чернилами пальцами показывает вам последнюю запись в этой книге. А потом показывает полку, где держали кинжалы. Она пуста, и пыль на ней старая."
 ln_glass.4.a:0 "Списать то, что важно"
 ln_glass.5.t:0 "Каменнорождённые знают"
 ln_glass.5.desc:0 "Скагосцы вам, прямо скажем, не рады. Но обсидиан стоит в стенах этого острова, как жир в овце, и каменнорождённые работают с ним так, как работали их отцы, ни разу не прекращая.\n\nРезчик с рукоятью из рога единорога в кулаке рассказывает вам, на торговом наречии и жестами, то, что рассказала ему бабка: стекло — для холодных. Не для охоты. Не для войны. Для холодных, когда они вернутся. Он говорит «КОГДА» так, как южане говорят «ЗИМОЙ»."
 ln_glass.5.a:0 "Выменять это знание"
 ln_glass.6.t:0 "Схрон под камнями"
 ln_glass.6.desc:0 "Кулак Первых Людей поднимается из Зачарованного леса, точно костяшка старого мира, обведённый стеной, которую не помнит построенной ни одна живая рука. Земля здесь отдаёт то, что в ней лежит, если копать там, где земля выглядит неправильно.\n\nПод курганным камнем на венце холма — свёрток. Плащ, расползающийся от касания, а в нём, завёрнутое как нечто драгоценное или нечто опасное, драконье стекло: наконечники копий, лезвия ножей, наконечники стрел — десятками. Кто-то спрятал это здесь, на худшей земле в мире, против нужды, которую не мог назвать. Вы стоите там, где стоял он. Вы её назвать можете."
 ln_glass.6.a:0 "Унести свёрток на юг"

 ln_prophecy.31.c:0 "Огранить как надо - я знаю, как идут грани"

 # ── the gate lines. Written as what the player must GO AND DO, not as what he lacks. ──
 ln_knows_the_glass_gate_tt:0 "Вы изучили драконье стекло — где идут жилы и как ломаются грани"
 ln_needs_an_unedged_weapon_tt:0 "Вы несёте оружие, которому такого лезвия ещё не поставили"

 # ── the modifiers ──
 ln_knows_the_glass_modifier:0 "Изучил драконье стекло"
 ln_knows_the_glass_modifier_desc:0 "Отправился туда, где лежат записи, и узнал, для чего нужен застывший огонь: где идут жилы, как ломаются грани и зачем Дети Леса отсчитывали сто кинжалов в год."
 ln_artifact_dragonglass_edged_modifier:0 "С лезвием из драконьего стекла"
 ln_artifact_dragonglass_edged_modifier_desc:0 "Как надо огранённое лезвие из застывшего огня, поставленное рукой, что изучила камень. Оно остаётся при оружии, кто бы ни взял его следующим."
