l_russian:

 ln_reveal.1.t:0 "Рассвет"

 # 1. NAMED, AND RIGHT. The least interesting of the four, and deliberately not the most common.
 ln_reveal.1.desc.vindicated:0 "#BER Мёртвые лежат недвижно.\n\n Это сделал [ln_slayer.GetTitledFirstName], и [ln_slayer.GetHerHis] имя годами произносили вслух в храмах от Асшая до Староместа, прежде чем удар достиг цели.\n\n Значит, жрецы были правы. С этим стоит посидеть, потому что случается такое так редко, что ни у кого нет на этот случай обряда. Они читали пламя, пламя не лгало, и тот, на кого они указали, ушёл на север и довёл дело до конца — с опозданием на восемь тысяч лет и точно в срок.\n\n Через сто лет мейстеры найдут причины в этом усомниться, потому что мейстеры для того и есть. Они будут неправы, и это не будет иметь значения.\n\n #bold Это было пророчество. Иначе и быть не могло.#!#!"
 # 2. NAMED, AND IT HAD NOTHING TO DO WITH IT.
 ln_reveal.1.desc.named_but_hollow:0 "#BER Мёртвые лежат недвижно.\n\n Это сделал [ln_slayer.GetTitledFirstName]. Храмы говорили это годами, и теперь храмы говорят, что они это говорили, и то и другое правда.\n\n Вот что тоже правда и чего никто в красном одеянии никогда не скажет вслух: принца не было. Обещания не было. Была одна жизнь с нужными знаками на ней, жрецы, которым очень хотелось, чтобы знаки что-то значили, и война, которую кто-то должен был выиграть.\n\n Её выиграли — мечом, в холоде; и никакое пламя не вкладывало этот меч в [ln_slayer.GetHerHim] руку. Всё было бы ровно так же, если бы никто никогда не прочёл в огне ни строчки.\n\n #bold Вера запомнит эту ночь как ночь, когда её правота была доказана. Не была.#!#!"
 # 3. THERE WAS A PRINCE, AND EVERY PRIEST NAMED THE WRONG MEN. The one worth playing for.
 ln_reveal.1.desc.wrong_men:0 "#BER Мёртвые лежат недвижно.\n\n Это был [ln_slayer.GetTitledFirstName], и [ln_slayer.GetHerHis] имени не произносил никто и никогда.\n\n Ни разу. Ни в храме, ни в роще, ни устами женщины, читающей огонь под изгородью. Каждый жрец в мире целое столетие считал знаки на чужих жизнях и был уверен, и хоронил тех, в ком был уверен, — а всё это время ответ стоял там, куда никто из них не смотрел.\n\n Принц был. Именно это их и сломает. Пророчество было настоящим, обещание было сдержано, а вся махина, выстроенная, чтобы найти человека, ошиблась так полно, что могла бы и не существовать.\n\n #bold Пламя никогда не лгало. Читать его так никто и не выучился.#!#!"
 # 4. NOTHING. A man with a sword.
 ln_reveal.1.desc.just_a_man:0 "#BER Мёртвые лежат недвижно.\n\n Это был [ln_slayer.GetTitledFirstName]. Больше об этом сказать нечего, и этим всё сказано.\n\n Никакого пророчества. Ни обещанного принца, ни поборника, рождённого среди соли и дыма, ни горящего меча — ничего этого не было ни в один миг и ни в какой части. Восемь тысяч лет храмов, счёта, наречения и уверенности, выстроенных поверх истории, которую кто-то однажды рассказал про кончившуюся зиму.\n\n В этот раз зима тоже кончилась. Кто-то ушёл на север и сделал то, что нужно было сделать, и [ln_slayer.GetSheHe] сделал это не потому, что [ln_slayer.GetSheHe] был избран. А потому, что [ln_slayer.GetSheHe] был там.\n\n #bold Этого придётся хватить. И этого, по правде, даже больше.#!#!"

 # 5. NOBODY KNOWS WHO DID IT.
 ln_reveal.1.desc.nameless:0 "#BER Мёртвые лежат недвижно.\n\n Никто не может сказать, кто это сделал.\n\n Это не пробел в записи — запись и есть пробел. Была битва в темноте, в зиму, тянувшуюся так долго, что времена года уже никто не считал, и в какой-то её миг то, что двигало их, остановилось, и всякий труп на поле осел разом и больше не встал.\n\n Кто-то стоял ближе всех. Кто-то ударил. Мейстеры четыреста лет будут строить ответ, и ответ будет неверным, потому что те, кто мог бы его назвать, стояли в первом ряду, а первый ряд — это и есть то место, куда ушла вся арифметика.\n\n #bold Это кончилось. Только это кто-либо и может доказать.#!#!"

 ln_reveal.1.a:0 "Тогда пусть встаёт солнце."

 ln_reveal.10.t:0 "Те, кто там был"
 ln_reveal.10.desc_open:0 "Певцы переврут это в тот же год. Они поставят в первый ряд королей, которые были в четырёхстах лигах к югу, и рассвет там, где был только сереющий снег, и со временем именно их версию будут знать все.\n\nПоэтому пусть это будет записано один раз, просто, пока те, кто это видел, ещё могут возразить:\n\nЭто был [ln_slayer.GetTitledFirstName].\n\n"
 ln_reveal.10.desc_knight_1:0 "И [ln_slayer.GetSheHe] стоял там не один. [ln_dawn_knight_1.GetTitledFirstName] держал землю на [ln_slayer.GetHerHis] фланге."
 ln_reveal.10.desc_knight_2:0 " [ln_dawn_knight_2.GetTitledFirstName] не дал строю сложиться, когда строй хотел сложиться."
 ln_reveal.10.desc_knight_3:0 " [ln_dawn_knight_3.GetTitledFirstName] был там, в темноте и холоде, когда мёртвые шли вперёд и не было ни единой причины верить, что следующий час когда-нибудь настанет.\n\nНикого из них не будет в песнях. Все они были в снегу."
 ln_reveal.10.desc_alone:0 "Имена, что должны были стоять рядом с [ln_slayer.GetHerHim] именем, назвать нельзя: снег оставил этих людей себе. Кто держал фланг, кто не дал строю сложиться в темноте — первый ряд и есть то место, куда ушла вся арифметика, и в записи стоит тишина там, где должны стоять их имена."
 ln_reveal.10.desc_close:0 "\n\nПомните это просто, так, как это было. Кто-то ударил, кто-то стоял рядом, и взошло солнце."
 ln_reveal.10.a:0 "Записать их имена. Все до единого."

