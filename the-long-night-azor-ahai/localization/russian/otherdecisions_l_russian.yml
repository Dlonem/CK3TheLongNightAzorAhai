l_russian:
 other_turnoff_decision:0 "Прекратить поднятие мёртвых"
 other_turnoff_decision_desc:0 "Запретить поднимать мёртвых вручную, чтобы случайный жест не разбудил то, чему следует спать. Примите это решение снова, чтобы снять запрет."
 other_turnoff_decision_tooltip:0 "Запретить или разрешить взаимодействие поднятия мёртвых"
 other_turnoff_decision_confirm:0 "Да будет так"
 other_turnoff_flag_tooltip:0 "Поднятие мёртвых сейчас запрещено"

 # The Long Night+: Flee South decision
 flee_south_decision_title:0 "Бежать на юг"
 flee_south_decision_desc:0 "Мёртвые у моих ворот, а моё войско лежит сломленным в снегу. Я могу встать на стенах и умереть вместе со своими людьми... или бросить всё — престол, земли, родной чертог, — собрать тех родичей и верные мечи, что пойдут за мной, и уйти на юг впереди холода. Да, безземельным беженцем. Но живым, чтобы однажды сразиться за рассвет."
 flee_south_decision_confirm:0 "Бросить всё и бежать на юг"
 flee_south_decision_tooltip:0 "Отдать свои земли Иным и бежать на юг безземельным беженцем Рассвета"

 # The Long Night+: Reform the Night's Watch decision
 reform_nights_watch_decision_title:0 "Возродить Ночной Дозор"
 reform_nights_watch_decision_desc:0 "Долгая Ночь сломлена и мёртвые лежат недвижно, но Стена стоит почти без людей: её замки выстыли, её гарнизоны рассеяны или перебиты. По праву короны я возрожу присягнувшее братство: назову нового лорда-командующего, верну Дозору его древние твердыни и снова поставлю на Стену дозорных в чёрных плащах, чтобы царства людей больше никогда не застали врасплох."
 reform_nights_watch_decision_confirm:0 "Возродить Дозор"
 reform_nights_watch_decision_tooltip:0 "Возродить Ночной Дозор под началом нового лорда-командующего и передать ему замки Стены"