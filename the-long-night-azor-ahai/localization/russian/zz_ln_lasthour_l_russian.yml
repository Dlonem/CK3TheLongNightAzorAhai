# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- the Last Hour melee (1.1.0, §3).
 # ⚠ ln_lasthour.1 is the §13 VOICE SAMPLE -- Thomas approves this exchange before the other four are written.

 ln_dawn.2.e:0 "К нему не идут в одиночку — встать в строй"

 ln_lasthour.1.t:0 "Последний Час"
 # The first block counts HIS side (the walker scopes vary 1-3 with the difficulty rule, §9.4); the
 # second counts yours. Never promise a number the portraits cannot keep.
 ln_lasthour.1.desc.walkers3:0 "Он ждёт вас на открытом снегу и не потрудился привести своё войско. Трое его бледного рода стоят на длину копья за его спиной, недвижные, как резной лёд. Больше ему не нужно, и он знает, что вы это знаете."
 ln_lasthour.1.desc.walkers2:0 "Он ждёт вас на открытом снегу и не потрудился привести своё войско. Двое его бледного рода стоят на длину копья за его спиной, недвижные, как резной лёд. Больше ему не нужно, и он знает, что вы это знаете."
 ln_lasthour.1.desc.walkers1:0 "Он ждёт вас на открытом снегу и не потрудился привести своё войско. Один из его бледного рода стоит на длину копья за его спиной, недвижный, как резной лёд. Больше ему не нужно, и он знает, что вы это знаете."
 ln_lasthour.1.desc.walkers0:0 "Он ждёт вас на открытом снегу и не потрудился привести своё войско. Оно ему не нужно, и он знает, что вы это знаете."
 ln_lasthour.1.desc.line:0 "\n\nНо и вы пришли не один. За вами скрипит снег под сапогами — те, кто откликнулся, те, у кого есть своя причина быть на этом поле. Сталь, стекло и какие бы боги у кого из вас ни остались.\n\nОн смотрит, как строится строй. В синеве его глаз что-то двигается — на живом лице это назвали бы любопытством."
 ln_lasthour.1.desc.alone:0 "\n\nНикто не откликнулся. Никто не пришёл. Есть вы, ветер и мёртвые.\n\nОн смотрит, как вы проходите последние сто ярдов один. В синеве его глаз что-то двигается — на живом лице это назвали бы уважением."
 ln_lasthour.1.a:0 "Вперёд — здесь это кончится, так или иначе"
 ln_lasthour.1.c:0 "Обнажить его первым. Пусть всё поле увидит, что это."
 ln_lasthour.1.d:0 "Я встану в первый ряд. Этот клинок для чего-то да сделали."
 ln_lasthour.1.e:0 "Подведите меня ближе."
 ln_lasthour.1.f:0 "Они пришли сюда из-за меня. Пусть посмотрят, как я иду первым."
 ln_lasthour.1.b:0 "Повернуть назад — это не тот час"

 # ── option tooltips (the effects run hidden; these lines are what the player is told) ──
 ln_dawn.2.e_tt:0 "Строй набирается из тех, кто на поле: сперва тот, кого сказание уже выбрало, ваша родня и друзья, затем всякий чужой человек с работающей сталью — шестеро самое большее и никогда больше двоих из вашего собственного дома. А потом вы идёте к нему вместе."
 ln_lasthour.1.c_tt:0 "Вы идёте первым, держа в руке ту единственную вещь, о которой слышал каждый за вашей спиной. Это покупает вам шаг. Это же значит, что тварь посреди того поля не смотрит больше ни на кого."
 ln_lasthour.1.d_tt:0 "Валирийская сталь, принесённая в тот единственный бой, для которого она по-настоящему и была. Вы берёте первый ряд и то внимание, что идёт с ним."
 ln_lasthour.1.e_tt:0 "Обсидиан — ответ того, кто бьётся ножом. Он работает, и работает на длину руки, в чём и вся с ним беда."
 ln_lasthour.1.f_tt:0 "Вы и есть то, о чём жрецы твердят им годами. Правда ли это, значения уже не имеет; важно, что строй в это верит, пока смотрит, как вы выходите вперёд."
 ln_lasthour.1.a_tt:0 "Схватка начинается. Её будут вести человек за человеком в следующие дни — раны, падения и хуже, — а Белый Ходок никогда не принимает сдачи."
 ln_lasthour.1.b_tt:0 "Строй расходится, а поле остаётся. Он будет там и тогда, когда вы отыщете своё мужество."
 ln_lasthour.20.a_tt:0 "Король Ночи кончен вашей рукой. Каждый павший Ходок его рода идёт в ваш счёт, и каждый ваш уцелевший несёт об этом память."

 ln_lasthour.20.t:0 "Рассвет"
 ln_lasthour.20.desc:0 "Всё кончено, и какое-то мгновение никто в это не верит. Ветер всё ещё дует. Снег всё ещё стоит сугробами. Но холод — тот холод, что сидел в груди у каждого с начала долгой тьмы, — вытекает из мира, как вода из треснувшей чаши.\n\nТам, где он пал, нет теперь ничего, кроме расходящегося кольца изморози, а его бледного рода не стало — будто они там и не стояли. По всему Северу, по всему миру сто тысяч мёртвых падают разом и не встают.\n\nЛюди, ещё стоящие в строю, смотрят друг на друга. Кто-то смеётся — высоко и надорванно. Кто-то стоит на коленях. Восходит солнце, а солнце не восходило уже годами."
 ln_lasthour.20.a:0 "Пусть будет утро"

 ln_lasthour.30.t:0 "Что холод хранит"
 ln_lasthour.30.desc:0 "Боли нет. Это первое, что не так. Боль была, и немало, а потом сквозь неё поднялся холод, как вода сквозь снег, и теперь нет вообще ничего.\n\nВы смотрите, как ваши собственные руки упираются в лёд, не спросив у вас разрешения. Они не того цвета. Мысли, которые вы думаете, становятся короче, а промежутки между ними — шире, и где-то в этом растущем промежутке вы понимаете, без страха, потому что страх ушёл туда же, куда ушла боль, что эта мысль — последняя, которую вы додумаете словами.\n\nОн стоит над вами. Он не торжествует. Он ждёт — так, как человек ждёт, пока на пруду, который он собирается перейти, дойдёт лёд."
 ln_lasthour.30.a:0 "..."

 # ── Memories ──
 ln_faced_the_night_king_memory:0 "стоял против Короля Ночи"
 ln_faced_the_night_king_memory_desc:0 "Я стоял в строю в Последний Час, против самого Короля Ночи, и я ещё дышал, когда взошло солнце."
 ln_faced_the_night_king_memory_desc_second_perspective:0 "вы стояли в строю в Последний Час, против самого Короля Ночи, и вы ещё дышали, когда взошло солнце."
 ln_faced_the_night_king_memory_desc_third_perspective:0 "[owner.GetName] стоял в строю в Последний Час, против самого Короля Ночи."
 ln_raised_as_an_other_memory:0 "забран Королём Ночи"
 ln_raised_as_an_other_memory_desc:0 "Я пал в Последний Час, и Король Ночи не дал мне умереть. Он сделал меня одним из своего рода."
 ln_raised_as_an_other_memory_desc_second_perspective:0 "вы пали в Последний Час, и Король Ночи не дал вам умереть. Он сделал вас одним из своего рода."
 ln_raised_as_an_other_memory_desc_third_perspective:0 "[owner.GetName] пал в Последний Час, и Король Ночи сделал [owner.GetHerHim] одним из своего рода."
