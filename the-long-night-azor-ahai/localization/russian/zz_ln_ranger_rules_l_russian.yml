l_russian:

 # AGOT: The Long Night & Azor Ahai -- the ranging companies rule.
 # Written the way Thomas asked game rules to be written: obvious unless the vagueness is the point, and the
 # default marked so you can see it without opening anything.

 rule_ln_ranger_recruitment:0 "Походные отряды"
 rule_ln_ranger_recruitment_desc:0 "На Стене восемь походных отрядов. Это правило решает, сколько из них Ночной Дозор заполняет сам. При любой настройке лорд-командующий может отставить капитана ради вас."

 setting_ln_rangers_watch_fills_ranks:0 "Дозор набирает сам #EMP (по умолчанию)#!"
 setting_ln_rangers_watch_fills_ranks_desc:0 "Все восемь выступают с начала игры. Когда капитан гибнет, Дозор ставит нового, но своих в поле у него никогда не больше пяти. #EMP Остальные три ждут игрока.#!"
 setting_ln_rangers_players_only:0 "Оставить их игрокам"
 setting_ln_rangers_players_only_desc:0 "Все восемь выступают с начала игры под своими историческими капитанами. Когда капитан гибнет, Дозор не ставит никого, и место ждёт игрока."
 setting_ln_rangers_all_eight_ride:0 "Выступают все восемь"
 setting_ln_rangers_all_eight_ride_desc:0 "Потеряв капитана, отряд всегда получает следующего. Ни одного места про запас."

 # -- 1.1.3: кто отвечает на Северный вопрос ----------------------------------------------------------------
 rule_ln_question_of_the_north:0 "Северный вопрос"
 rule_ln_question_of_the_north_desc:0 "Когда Долгая Ночь кончается, один правитель решает, возродится ли Ночной Дозор или одичалые пройдут через Стену. Это правило решает, кого спросят первым."
 setting_ln_question_player_in_the_north_first:0 "Сначала игрок на Севере #EMP (по умолчанию)#!"
 setting_ln_question_player_in_the_north_first_desc:0 "Игрок на Железном троне, затем игрок, владеющий Севером (вассал или нет), затем игрок высшего ранга с землями на Севере. Лишь если ни один игрок не подходит, вопрос уходит короне под управлением ИИ."
 setting_ln_question_the_crown:0 "Корона"
 setting_ln_question_the_crown_desc:0 "Железный трон, иначе независимый правитель Севера, иначе тот, кто правит Вестеросом. Игрока под короной ИИ не спрашивают."
