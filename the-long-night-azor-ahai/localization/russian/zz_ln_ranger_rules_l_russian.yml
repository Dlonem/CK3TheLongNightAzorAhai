l_russian:

 # AGOT: The Long Night & Azor Ahai -- the ranging companies rule.
 # Written the way Thomas asked game rules to be written: obvious unless the vagueness is the point, and the
 # default marked so you can see it without opening anything.

 rule_ln_ranger_recruitment:0 "Походные отряды"
 rule_ln_ranger_recruitment_desc:0 "На Стене восемь походных отрядов. Это правило решает, заполняет ли их Ночной Дозор сам — или оставляет пустыми для игроков."

 setting_ln_rangers_watch_fills_ranks:0 "Дозор набирает сам #EMP (по умолчанию)#!"
 setting_ln_rangers_watch_fills_ranks_desc:0 "Со временем Дозор ставит своих разведчиков, но никогда больше пяти. #EMP Три отряда всегда остаются открытыми для игроков.#!"
 setting_ln_rangers_players_only:0 "Оставить их игрокам"
 setting_ln_rangers_players_only_desc:0 "Все восемь отрядов выступают с начала игры под своими историческими капитанами — именно поэтому у них есть лагеря, — но когда капитан гибнет или уходит, Дозор не ставит никого. Его лагерь стоит, а место ждёт игрока.\n\nДля полной группы. Ничьё место не занимает человек, выдуманный игрой."
 setting_ln_rangers_all_eight_ride:0 "Выступают все восемь"
 setting_ln_rangers_all_eight_ride_desc:0 "Потеряв капитана, отряд всегда получает следующего — все восемь, ни одного места про запас.\n\nСамая живая версия Стены. Путь внутрь есть всегда: лорд-командующий может отставить служащего капитана ради вас."
