l_russian:
# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- consecration, the second road to Lightbringer.
 # TOKEN FORM: bare saved-scope names, [ln_beloved.GetFirstName], NOT [scope:ln_beloved...]. That is the form
 # the rest of the Lightbringer chain uses and the one proven live in this mod. [ln_the_blade.GetName] is an
 # artifact scope -- vanilla uses [this_artifact.GetName] 37 times, so the promote is real.

 # -- THE DECISION -------------------------------------------------------------------------------------------
 ln_consecrate_blade_decision:0 "Освятить клинок"
 ln_consecrate_blade_decision_desc:0 "Предание говорит, что Азор Ахай трудился сто дней и сто ночей и сделал меч из ничего. Оно не говорит, что это единственный способ, каким это когда-либо делали.\n\nВалирийская сталь никогда не была только огнём и проковкой. Что бы кузнецы Фригольда в неё ни вложили, сталь это выпила — и пьёт до сих пор; потому клинок пятисотлетней давности и держит лезвие, какого ему не поставит ни один живой оружейник.\n\nТо, что выпило однажды, можно заставить выпить снова. Что вложат в него во второй раз, то и решит, что выйдет обратно."
 ln_consecrate_blade_decision_tt:0 "Освятить валирийский клинок, который я несу."
 ln_consecrate_blade_decision_confirm:0 "Разжечь огонь."
 ln_consecrate_blade_decision_effect_tt:0 "Огонь разожгут, обряд подготовят. Всё будет готово в пределах двух недель."

 ln_consecrate_needs_a_voice:0 "Кто-то должен быть способен произнести слова: красный жрец — мой придворный капеллан или жрец лагеря, либо я сам красный жрец."
 ln_consecrate_needs_a_price:0 "Сталь берёт цену: к огню идёт тот, кого я люблю. Рассвет — исключение. Он не берёт жизни, но лишь у того, кто рождён под кровоточащей звездой."
 ln_consecrate_dawn_not_yours:0 "Рассвет — единственный клинок при мне, а звезда падала не ради меня. Он не возьмёт жизни, и просить его буду не я."
 ln_consecrate_rite_is_spent:0 "Огонь уже разжигали однажды. Он ещё не остыл."

 # -- MODIFIERS ----------------------------------------------------------------------------------------------
 ln_lightbringer_consecrated_modifier:0 "Светозарный"
 ln_lightbringer_consecrated_modifier_desc:0 "Клинок выпил во второй раз, и то, что в него вошло, там и осталось. Теперь он отзывается на имя постарше, что бы ни было вырезано на яблоке рукояти."
 ln_the_rite_is_spent_modifier:0 "Огонь ещё горит"
 ln_the_rite_is_spent_modifier_desc:0 "Обряд созван и ещё не получил ответа. Пока не получит, у этого пламени больше ничего не попросишь."

 # -- 1. THE CHOICE ------------------------------------------------------------------------------------------
 ln_consecrate.1.t:0 "Второе питьё"
 ln_consecrate.1.desc.dawn:0 "Огонь сложили во дворе, потому что в этом замке нет очага такой величины, а [ln_the_blade.GetName] лежит рядом на двух козлах, бледный, как молочное стекло, и холоднее ночи.\n\nЖрец читает пламя третий день и перестал делать вид, что спокоен насчёт того, что нашёл. Этот меч никогда не был валирийским, говорит он. Что бы Фригольд ни делал со своей сталью, с этим не делал никто: он упал с неба уже законченным и восемь тысяч лет ждал, чтобы кто-нибудь заметил, что он такое.\n\n\"Его уже закалили,\" — говорит он. \"В звезде. Платить больше нечем, и вкладывать в него нечего. Он хочет лишь одного — чтобы его попросили, и попросит его лишь тот, ради кого сошла звезда.\"\n\nОн смотрит на меня так, как человек смотрит на дверь, которую не уверен, что хочет открыть."
 ln_consecrate.1.desc.beloved:0 "Огонь сложили во дворе, а [ln_the_blade.GetName] лежит рядом на двух козлах.\n\nЖрец не прикоснётся к клинку. Он целый день очень тщательно объяснял: это не ковка, и здесь ничего не сделают — меч уже есть, меч уже необычен, и всё, что может обряд, — это дать ему, чем стать.\n\nА потом он сказал мне, чего это стоит, и ничего не смягчил, и с тех пор я ни о чём другом думать не могу.\n\n[ln_beloved.GetTitledFirstName] в чертоге у меня за спиной. [ln_beloved.GetSheHe|U] знает, что огонь разожжён. Не думаю, что [ln_beloved.GetSheHe] знает зачем."
 ln_consecrate.1.desc:0 "Огонь сложили во дворе, [ln_the_blade.GetName] лежит рядом на двух козлах, и жрец ждёт, что я что-нибудь скажу.\n\nСталь согласна. Вот это и тревожит меня больше всего: ему не пришлось её убеждать, или готовить, или что-то вымаливать у Владыки Света. Он просто посмотрел на клинок и сказал, что тот возьмёт всё, что я в него вложу.\n\nТрудность целиком моя."
 ln_consecrate.1.a:0 "Позвать [ln_beloved.GetFirstName]. [ln_beloved.GetSheHe|U] вправе услышать этот вопрос."
 ln_consecrate.1.b:0 "Произнести слова. Звезда заплатила за это очень давно."
 ln_consecrate.1.c:0 "Вернуть его в ножны."

 # -- 2. THE LIFE --------------------------------------------------------------------------------------------
 ln_consecrate.2.t:0 "Это и так уже был меч"
 ln_consecrate.2.desc:0 "[ln_beloved.GetSheHe|U] выходит к огню.\n\nПредания врут здесь так же, как врут всегда: они рассказывают это как убийство, а это много хуже убийства. [ln_beloved.GetSheHe|U] выслушивает всё до конца, задаёт один вопрос, на который я не могу ответить, а потом встаёт туда, куда жрец [ln_beloved.GetHerHim] поставил, и больше не двигается.\n\nВот о чём никто не предупреждает: клинок не изменился. Он не засветился, не запел, не возвестил о себе. Он вошёл так, как входит любой меч, потому что он и так уже был мечом, — и в этом разница между этим и ковкой. Не было мига, когда сталь чем-то стала. Было только [ln_beloved.GetTitledFirstName] — а потом не было.\n\nТеперь он тёплый. Я не знаю, когда это началось. С тех пор я не могу его отложить и уже не понимаю, моё ли это решение."
 ln_consecrate.2.a:0 "Значит, это того стоило. Это должно было того стоить."

 # -- 3. DAWN -----------------------------------------------------------------------------------------------
 ln_consecrate.3.t:0 "Звезда сходит дважды"
 ln_consecrate.3.desc:0 "Жрец произнёс слова, моя рука легла на рукоять — и не произошло ровным счётом ничего.\n\nОн не удивился. Он сказал, что освящение я понимаю неверно: будто мне хотелось что-то мечу дать, тогда как вся суть этого клинка в том, что ему дали всё в день, когда он упал. Нынче ночью к [ln_the_blade.GetName] ничего не добавили. Его узнали.\n\nА потом из него ушёл холод. Иначе я это описать не могу. Сколько мой дом держит этот меч, столько мы и звали его бледным, прекрасным и невыносимым в руке надолго, — а нынче ночью он просто тёплый, как тёпл камень, на котором полежало солнце.\n\nВсе во дворе опустились на колени. Их об этом не просили, и остановить их было нельзя."
 ln_consecrate.3.a:0 "Он всегда был этим. Мы его только носили."

 # -- 4. HE PUT IT BACK ---------------------------------------------------------------------------------------
 ln_consecrate.4.t:0 "Холодное железо"
 ln_consecrate.4.desc:0 "Я молчу, пока огонь не прогорает, и в конце концов жрец понимает и уходит внутрь.\n\nОн расскажет это как малодушие. Может быть, так и было. Но я полночи это перебираю и всё прихожу к одному и тому же: меч, который стоит человека, — не оружие, а долг, и я знаю, что делают люди, однажды такой долг заплатившие. Остаток жизни они доказывают, что цена была разумной.\n\nТьма всё равно идёт. Я встречу её той сталью, что у меня уже есть, и теми людьми, которые в неё не вошли."
 ln_consecrate.4.a:0 "Стали довольно. Должно быть довольно."
