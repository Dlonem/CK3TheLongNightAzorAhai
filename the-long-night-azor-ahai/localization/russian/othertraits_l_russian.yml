#Traits and modifiers
 trait_other_trait:0 "Иной"
 trait_other_trait_desc:0 "Иные высоки и худы, плоть их бледна, как молоко. У них холодные синие глаза, о которых говорят, что они горят, как лёд, или сияют, как синие звёзды. Кровь у Иных бледно-голубая, а кости блестят, точно молочное стекло"
 trait_other_trait_character_desc:0 "Иные высоки и худы, плоть их бледна, как молоко. У них холодные синие глаза, о которых говорят, что они горят, как лёд, или сияют, как синие звёзды. Кровь у Иных бледно-голубая, а кости блестят, точно молочное стекло"
 trait_wight_trait:0 "Упырь"
 trait_wight_trait_desc:0 "Труп, поднятый холодным колдовством Иных для службы в их нескончаемом воинстве. Неутомимый и бесчувственный, он не знает ни боли, ни страха, и глаза его горят зловещей синевой. Когда Иные наконец будут побеждены и Долгая Ночь закончится, тёмная сила, что движет им, иссякнет, и он снова осядет безжизненной плотью."
 trait_wight_trait_character_desc:0 "Труп, поднятый холодным колдовством Иных для службы в их нескончаемом воинстве. Неутомимый и бесчувственный, он не знает ни боли, ни страха, и глаза его горят зловещей синевой. Когда Иные наконец будут побеждены и Долгая Ночь закончится, тёмная сила, что движет им, иссякнет, и он снова осядет безжизненной плотью."



