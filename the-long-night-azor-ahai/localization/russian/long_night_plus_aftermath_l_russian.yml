l_russian:
 # The Long Night+ — AFTERMATH (resettling) localization.

 # The renamed Wall kingdom if the wildling path is taken (set_title_name on k_the_wall).
 ln_giftlands:0 "Дарные земли"
 ln_giftlands_adj:0 "Дарноземельский"

 # --- THE QUESTION OF THE NORTH (ln_aftermath.1) ---
 ln_aftermath.1.t:0 "Вопрос о Севере"
 ln_aftermath.1.desc:0 "Долгая Ночь окончена. Мёртвые наконец лежат недвижно, а за проломленной Стеной уцелевшие вольного народа смотрят на юг, на землю, опустевшую от живых.\n\nДержава ждёт от [ROOT.Char.GetTitledFirstName] ответа, который не может ждать: подняться ли Ночному Дозору снова, чтобы держать гарнизон на руинах Стены и не пускать одичалых, — или принять вольный народ на юге, чтобы он заселил мёртвые земли как подданные Короны?\n\nКакая дорога ни будет выбрана, назад по ней уже не пойдёшь."
 ln_aftermath.1.a:0 "Дозор поднимется снова."
 ln_aftermath.1.a.tt:0 "#bold Ночной Дозор#! основан заново на руинах Стены. Вольный народ #bold никогда#! не будет принят на юге."
 ln_aftermath.1.b:0 "Пусть вольный народ идёт на юг."
 ln_aftermath.1.b.tt:0 "Вольный народ заселяет Стену и земли под ней, клан за кланом, как вассалы Короны. #bold Ночной Дозор#! #bold никогда#! не поднимется снова."

 # --- Notification: the free folk pour south (ln_aftermath.3) ---
 ln_aftermath.3.t:0 "Вольный народ идёт на юг"
 ln_aftermath.3.desc:0 "Стена в руинах, и на том, что от неё осталось, нет чёрных плащей. Через пролом идут уцелевшие вольного народа — на сей раз не налётчиками, а поселенцами, гоня стада в опустевший Север. Ночной Дозор больше не поднимется никогда."
 ln_aftermath.3.a:0 "Мир изменился."

 ln_aftermath.4.t:0 "Дозор поднимается снова"
 ln_aftermath.4.desc:0 "По проломленной Стене снова движутся чёрные плащи. Там, где от Ночного Дозора остались кости и тишина, Корона подняла его заново — гарнизон на руинах, присягнувший держать пролом против всего, что Север ещё скрывает. За ним вольному народу велено держаться своей стороны стены, которой больше нет."
 ln_aftermath.4.a:0 "Мир изменился."

 # --- Player refugee arrival (ln_aftermath.21) ---
 ln_aftermath.21.t:0 "Дорога домой"
 ln_aftermath.21.desc:0 "Обоз останавливается. Перед [ROOT.Char.GetFirstName] лежит пустая земля — холодные очаги, невспаханные поля и ни одной живой души, чтобы их взять. Поселенцы смотрят на своего вожака: здесь ли кончаются странствия?"
 ln_aftermath.21.a:0 "Здесь мы отстроимся заново."
 ln_aftermath.21.a.tt:0 "Заселить это графство сейчас: оно становится вашим, вашей культуры и веры. Ваши поселенцы основывают новую общину, и ваши дни беженца окончены."
 ln_aftermath.21.b:0 "Ещё нет. Идём дальше."

 # --- Player notification: the road ends (ln_aftermath.25) ---
 ln_aftermath.25.t:0 "Земли не осталось"
 ln_aftermath.25.desc:0 "Каждое графство, которое стоило заселять, забрал кто-то другой — вернувшиеся лорды, одичалые кланы, эссосские грамоты. Дорога домой больше никуда не ведёт. Остаётся лагерь, а с ним жизнь странствующего искателя приключений."
 ln_aftermath.25.a:0 "Быть по сему."

 # --- Sell Colonization Rights to Essos (decision) ---
 ln_sell_colonization_rights_decision_title:0 "Продать права на заселение Эссосу"
 ln_sell_colonization_rights_decision_desc:0 "Выскобленные берега Севера лежат пусты, а у Вольных городов есть лишние монета и поселенцы. Отдать по грамоте одно из мёртвых прибрежных графств эссосскому лорду — золото Короне сейчас, чужеземный анклав на северной земле навсегда."
 ln_sell_colonization_rights_decision_confirm:0 "Подписать грамоту"
 ln_sell_colonization_rights_decision_tooltip:0 "Продать разорённое прибрежное графство Севера лорду Вольных городов."
 ln_sell_colonization_rights_effect_tt:0 "Случайное #bold прибрежное дикое графство#! Севера заселяет созданный #bold эссосский лорд#! (скорее всего браавосец), присягающий вам как вассал. Ваши #bold северные вассалы#! будут этой продажей недовольны."

 # --- Return North (decision) ---
 ln_return_north_decision_title:0 "Вернуться на Север"
 ln_return_north_decision_desc:0 "Долгая Ночь окончена, и на юг доходит весть, что мёртвые земли лежат пусты. Где-то там наверху есть очаг, который был вашим — или мог бы им стать. Собрать лагерь, нагрузить телеги и выйти на дорогу домой."
 ln_return_north_decision_confirm:0 "Выйти на дорогу домой"
 ln_return_north_decision_tooltip:0 "Снарядить обоз поселенцев и отправиться назад на север, чтобы вновь заселить утраченный престол — или ближайшую пустую землю."
 ln_return_north_effect_tt:0 "Ваш лагерь снаряжают для возвращения: #bold припасы для поселения#!, #bold полный запас провизии#! и #bold монета#! на основание новой общины. Обоз идёт по #bold Королевскому тракту#! к вашему #bold прежнему престолу#!, если тот пуст, или к ближайшему незанятому графству, пополняя припасы по пути в #bold Королевской Гавани#!, в #bold Трактире на перепутье#! и во #bold Рву Кейлин#!, как потребует дорога. По прибытии под ваше знамя собираются #bold люди-поселенцы#! числом по вашему прежнему положению — уцелевшие Севера стекаются к вернувшемуся лорду, — и вы можете заселить землю, став её лордом и перестав быть беженцем."

 # --- Modifiers / opinions ---
 ln_restored_ancestral_seat_modifier:0 "Восстановил родовой престол"
 ln_restored_ancestral_seat_modifier_desc:0 "Бежал впереди мёртвых, пережил Долгую Ночь и вернулся домой, чтобы поднять родовой престол из пепла. Песни это запомнят."
 ln_sold_the_north_opinion:0 "Продал северную землю чужеземцам"

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_aftermath.1.desc.watch_held:0 "Долгая Ночь окончена. Мёртвые наконец лежат недвижно — а Стена всё ещё стоит, и на ней всё ещё есть чёрные плащи.\n\nИх меньше, чем было. Половина замков обратилась в пепел, а поимённые списки лорда-командующего читаются как перечень потерь, — но они удержали пролом и держат его сейчас, а это больше того, что сумел за те же годы любой король Вестероса.\n\nЗа ними ждут уцелевшие вольного народа, и они не идут в набег. Они просят. Держава ждёт от [ROOT.Char.GetTitledFirstName] ответа, который не может ждать: подкрепить Дозор и держать те ворота закрытыми — или открыть их и расселить вольный народ на Севере, где не осталось никого, кто станет его пахать.\n\nКакая дорога ни будет выбрана, назад по ней уже не пойдёшь."
 ln_aftermath.1.desc.not_the_crown:0 "\n\nКорона оставила Север вам. Что бы вы здесь ни решили, вы решаете это за неё."
 ln_aftermath.1.desc.the_crown:0 ""
 ln_aftermath.1.a.held:0 "Дозор удержал. Подкрепить его и держать ворота закрытыми."
