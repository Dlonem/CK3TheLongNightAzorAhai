l_russian:

 # ── THE INTERACTION ─────────────────────────────────────────────────────────────────────────────────────────
 ln_lords_blessing_interaction:0 "Предложить благословение Владыки"
 ln_lords_blessing_interaction_desc:0 "Встать перед [recipient.GetTitledFirstName] и произнести слова: что Владыка Света избрал [recipient.GetHerHim] не напрасно, что вы будете рядом, когда это станет важно, и что, когда [recipient.GetSheHe] падёт, вы намерены об этом поспорить.\n\n[recipient.GetSheHe|U], разумеется, может велеть вам убираться."
 LN_LORDS_BLESSING_NOTIFICATION:0 "[actor.GetTitledFirstName] предлагает [recipient.GetTitledFirstName] благословение Рглора"
 ln_blessing_must_be_present_tt:0 "Вы должны быть при одном дворе с ними — благословение дают лично или не дают вовсе"
 ln_fervor_gain_blessing:0 "Лорд принял благословение Владыки"
 ln_fervor_gain_resurrection:0 "Человека воззвали обратно из огня"

 # ── THE BLESSING LANDS ──────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.40.t:0 "Слова произнесены"
 ln_prophecy.40.desc:0 "[ln_blessing_sponsor.GetTitledFirstName] не устраивает из этого обряда, и от этого почему-то хуже.\n\nНи ладана, ни пения, и никого не зовут. [ln_blessing_sponsor.GetSheHe|U] находит вас там, где вы случайно стоите, кладёт ладонь вам на грудину, коротко говорит что-то на языке, которого у вас нет, — а потом на общем наречии, чтобы не вышло путаницы: «Когда падёшь, не дай похоронить себя быстро. Пошли за мной. Что бы от тебя ни осталось — пошли за мной».\n\nПотом [ln_blessing_sponsor.GetSheHe] убирает [ln_blessing_sponsor.GetHerHis] руку и спрашивает, ели ли вы.\n\nПозже той ночью вы замечаете, что так и не перестали думать о словах «что бы ни»."
 ln_prophecy.40.a:0 "Тогда я пошлю за тобой. Рглор храни нас обоих."
 ln_prophecy.40.b:0 "Я на что-то согласился и не вполне понимаю, на что."

 # ── THE KILLING BLOW ────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.21.t:0 "Пошли за мной — что бы ни осталось"
 ln_prophecy.21.desc:0 "Слово они сдержали. На это ушло два дня и загнанная насмерть лошадь, но за вами послали — и теперь вы в шатре, где [ln_the_fallen.GetTitledFirstName] лежит на козлах, а [ln_the_fallen.GetHerHis] лицо накрыто чьим-то плащом.\n\nТе, кто [ln_the_fallen.GetHerHim] сюда донёс, не ушли. Молва разнесла, что вы сказали тогда во дворе, и полстана решило, что это было обещание, а другая половина — что похвальба, и обе ждут, чем оно окажется.\n\nУ вас есть одно такое. У вас всегда было ровно одно.\n\nОгонь в жаровне делает то, что делает огонь, когда у него вот-вот попросят. Он клонится."
 ln_prophecy.21.a:0 "Тогда возьми это из меня. Не [ln_the_fallen.GetHerHim]."
 ln_prophecy.21.b:0 "Не этого. Рглор, прости меня, — не этого."

 # ── THE MODIFIER ────────────────────────────────────────────────────────────────────────────────────────────
 ln_fell_in_the_dark_modifier:0 "Пал во тьме"
 ln_fell_in_the_dark_modifier_desc:0 "Свалился от удара, которым всё должно было кончиться, и с тех пор толком не поднялся."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_ask_for_the_blessing_decision_title:0 "Просить благословения Владыки"
 ln_ask_for_the_blessing_decision_desc:0 "Под вашей крышей живёт красный жрец, и вы всё думаете о том, что однажды сказал один из них.\n\nОни предлагают это нечасто и не всякому. Но попросить не стоит ничего — кроме той части, где придётся сказать вслух: что вы ждёте смерти, что предпочли бы обойтись без неё и что хотели бы, чтобы в тот час кто-то был рядом."
 ln_ask_for_the_blessing_decision_tt:0 "Просить красного жреца произнести слова над вами."
 ln_ask_for_the_blessing_decision_confirm:0 "Послать за ним."
 ln_ask_blessing_already_blessed_tt:0 "Жрец уже произнёс слова над вами"
 ln_ask_blessing_already_returned_tt:0 "Огонь уже однажды вас вернул"
 ln_prophecy.41.t:0 "Для чего нужен красный жрец"
 ln_prophecy.41.desc:0 "[ln_the_priest.GetTitledFirstName] — гость неудобный. [ln_the_priest.GetSheHe|U] велит держать огонь выше, чем кому-либо хочется, и имеет мнение о тенях по углам вашего чертога.\n\nНо кто-то из ваших домашних повторяет слова, сказанные [ln_the_priest.GetHerHim] умирающему конюшему прошлой зимой, и они в вас остаются: что Владыка Света не всегда забирает то, что Ему подносят, и что жрец, стоящий достаточно близко в нужную минуту, иногда может об этом поспорить.\n\nКонюший всё равно умер. Никто не спросил [ln_the_priest.GetTitledFirstName] заранее."
 ln_prophecy.41.a:0 "Суеверие. Огонь берёт то, что берёт."
 ln_prophecy.41.b:0 "Тогда пусть кто-нибудь спросит [ln_the_priest.GetTitledFirstName] заранее."
 ln_prophecy.21.c:0 "Отдать — и пусть знает, чего мне это стоило."
 ln_prophecy.22.t:0 "Вы не встаёте"
 ln_prophecy.22.desc.hope:0 "Удар доходит, и земля приходит быстрее, чем должна.\n\nВы замечаете, как уходит шум. Кто-то выкрикивает приказ, который вас больше не касается. Между вами и небом изрядно вашей собственной крови, и арифметика тут несложная.\n\nГде-то позади строя за [ln_the_priest.GetTitledFirstName] уже послали. Придёт ли [ln_the_priest.GetSheHe] и что [ln_the_priest.GetSheHe] согласится отдать, когда [ln_the_priest.GetSheHe] придёт, теперь вовсе не в ваших руках."
 ln_prophecy.22.desc.spent:0 "Удар доходит, и земля приходит быстрее, чем должна.\n\nВы замечаете, как уходит шум. Кто-то выкрикивает приказ, который вас больше не касается. Между вами и небом изрядно вашей собственной крови, и арифметика тут несложная.\n\nГде-то позади строя за [ln_the_priest.GetTitledFirstName] уже послали. Но [ln_the_priest.GetSheHe] делает это не впервые — однажды уже, для другого, — а отдать это можно было только раз."
 ln_prophecy.22.a:0 "Вот, значит, как это бывает."
 ln_prophecy.23.t:0 "Огонь вас вернул"
 ln_prophecy.23.desc:0 "Вы не знаете о споре, который ведут над вами. Вы не знаете ничего — в этом и вся беда, — и длится это столько времени, что потом никто не сойдётся на одном числе.\n\nПотом на вашей груди оказывается ладонь, слишком горячая, и голос повторяет слова на языке, которого у вас нет, снова и снова, с упорством, похожим не столько на молитву, сколько на взыскание долга.\n\nВы возвращаетесь так, как человек выходит из глубокой воды: плохо и сразу. Лицо у [ln_the_priest.GetTitledFirstName] серое до самых губ, и глаза отведены. За это что-то взяли, и взяли не только с вас."
 ln_prophecy.23.a:0 "Встать."
 ln_prophecy.24.t:0 "Огонь оставил себе то, что имел"
 ln_prophecy.24.desc:0 "[ln_the_priest.GetTitledFirstName] опускается на колени в грязь рядом с вами и долго на вас смотрит.\n\nВы не слышите, что [ln_the_priest.GetSheHe] решает. Вы видите только [ln_the_priest.GetHerHis|U] лицо, пока [ln_the_priest.GetSheHe] это решает, — а потом [ln_the_priest.GetHerHim] уже не видно, и там, где была [ln_the_priest.GetHerHis] голова, остаётся небо.\n\nОтдать это можно лишь раз. И отдано это будет не вам."
 ln_prophecy.24.a:0 "Значит, здесь это и кончается."
