l_russian:

 # ── THE INTERACTION ─────────────────────────────────────────────────────────────────────────────────────────
 ln_lords_blessing_interaction:0 "Предложить благословение Владыки"
 ln_lords_blessing_interaction_desc:0 "Встать перед [recipient.GetTitledFirstName] и произнести слова: что Владыка Света избрал [recipient.GetHerHim] не напрасно, что вы будете рядом, когда это станет важно, и что, когда [recipient.GetSheHe] падёт, вы намерены об этом поспорить.\n\n[recipient.GetSheHe|U], разумеется, может велеть вам убираться."
 LN_LORDS_BLESSING_NOTIFICATION:0 "[actor.GetTitledFirstName] предлагает [recipient.GetTitledFirstName] благословение Рглора"
 ln_blessing_must_be_present_tt:0 "Вы должны быть при одном дворе с ними — благословение дают лично или не дают вовсе"
 ln_fervor_gain_blessing:0 "Лорд принял благословение Владыки"
 ln_fervor_gain_resurrection:0 "Человека воззвали обратно из огня"

 # ── THE BLESSING LANDS ──────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.40.t:0 "Слова произнесены"
 ln_prophecy.40.desc:0 "[ln_blessing_sponsor.GetTitledFirstName] не устраивает из этого обряда, и от этого почему-то хуже.\n\nНи ладана, ни пения, и никого не зовут. [ln_blessing_sponsor.GetSheHe|U] находит вас там, где вы случайно стоите, кладёт ладонь вам на грудину, коротко говорит что-то на языке, которого у вас нет, — а потом на общем наречии, чтобы не вышло путаницы: «Когда падёшь, не дай похоронить себя быстро. Пошли за мной. Что бы от тебя ни осталось — пошли за мной».\n\nПотом [ln_blessing_sponsor.GetSheHe] убирает [ln_blessing_sponsor.GetHerHis] руку и спрашивает, ели ли вы.\n\nПозже той ночью вы замечаете, что так и не перестали думать о словах «что бы ни»."
 ln_prophecy.40.a:0 "Тогда я пошлю за тобой. Рглор храни нас обоих."
 ln_prophecy.40.b:0 "Я на что-то согласился и не вполне понимаю, на что."

 # ── THE KILLING BLOW ────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.21.t:0 "Пошли за мной — что бы ни осталось"
 ln_prophecy.21.desc:0 "Слово они сдержали. На это ушло два дня и загнанная насмерть лошадь, но за вами послали — и теперь вы в шатре, где [ln_the_fallen.GetTitledFirstName] лежит на козлах, а [ln_the_fallen.GetHerHis] лицо накрыто чьим-то плащом.\n\nТе, кто [ln_the_fallen.GetHerHim] сюда донёс, не ушли. Молва разнесла, что вы сказали тогда во дворе, и полстана решило, что это было обещание, а другая половина — что похвальба, и обе ждут, чем оно окажется.\n\nУ вас есть одно такое. У вас всегда было ровно одно.\n\nОгонь в жаровне делает то, что делает огонь, когда у него вот-вот попросят. Он клонится."
 ln_prophecy.21.a:0 "Тогда возьми это из меня. Не [ln_the_fallen.GetHerHim]."
 ln_prophecy.21.b:0 "Не этого. Рглор, прости меня, — не этого."

 # ── THE MODIFIER ────────────────────────────────────────────────────────────────────────────────────────────
 ln_fell_in_the_dark_modifier:0 "Пал во тьме"
 ln_fell_in_the_dark_modifier_desc:0 "Свалился от удара, которым всё должно было кончиться, и с тех пор толком не поднялся."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_ask_for_the_blessing_decision_title:0 "Ask for the Lord's Blessing"
 ln_ask_for_the_blessing_decision_desc:0 "There is a red priest under your roof, and you have been thinking about something one of them said once.\n\nThey do not offer it often, and they do not offer it to everyone. But the asking costs nothing except the part where you have to say it out loud — that you expect to die, that you would rather not, and that you would like somebody to be there when it happens."
 ln_ask_for_the_blessing_decision_tt:0 "Ask the red priest to say the words over you."
 ln_ask_for_the_blessing_decision_confirm:0 "Send for him."
 ln_ask_blessing_already_blessed_tt:0 "A priest has already said the words over you"
 ln_ask_blessing_already_returned_tt:0 "The fire has already given you back once"
 ln_prophecy.41.t:0 "What the Red Priest Is For"
 ln_prophecy.41.desc:0 "[ln_the_priest.GetTitledFirstName] is not a comfortable guest. [ln_the_priest.GetSheHe|U] keeps the fire built higher than anyone wants it and has opinions about the shadows in the corners of your hall.\n\nBut one of your household repeats something [ln_the_priest.GetHerHim] said to a dying stablehand last winter, and it stays with you: that the Lord of Light does not always take back what He is offered, and that a priest who is standing close enough at the right moment can sometimes argue the point.\n\nThe stablehand died anyway. Nobody had asked [ln_the_priest.GetTitledFirstName] beforehand."
 ln_prophecy.41.a:0 "Superstition. The fire takes what it takes."
 ln_prophecy.41.b:0 "Then somebody should ask [ln_the_priest.GetTitledFirstName] beforehand."
 ln_prophecy.21.c:0 "Give it — and let him know what it cost me."
 ln_prophecy.22.t:0 "You Do Not Get Up"
 ln_prophecy.22.desc.hope:0 "The blow lands and the ground arrives faster than it should.\n\nYou are aware of the noise going away. Someone is shouting an order that no longer concerns you. There is a great deal of your own blood between you and the sky, and the arithmetic of it is not complicated.\n\nSomewhere behind the line, [ln_the_priest.GetTitledFirstName] is being sent for. Whether [ln_the_priest.GetSheHe] comes, and what [ln_the_priest.GetSheHe] is willing to spend when [ln_the_priest.GetSheHe] arrives, is now entirely out of your hands."
 ln_prophecy.22.desc.spent:0 "The blow lands and the ground arrives faster than it should.\n\nYou are aware of the noise going away. Someone is shouting an order that no longer concerns you. There is a great deal of your own blood between you and the sky, and the arithmetic of it is not complicated.\n\nSomewhere behind the line, [ln_the_priest.GetTitledFirstName] is being sent for. But [ln_the_priest.GetSheHe] has done this before, for someone else, and there was only ever one of it to give."
 ln_prophecy.22.a:0 "So this is how it goes."
 ln_prophecy.23.t:0 "The Fire Gave You Back"
 ln_prophecy.23.desc:0 "You are not aware of the argument being had over you. You are not aware of anything, which is the entire problem, and it lasts an amount of time that nobody afterwards will agree on.\n\nThen there is a hand on your chest that is far too hot, and a voice saying words in a language you do not have, over and over, with a stubbornness that sounds less like prayer than like a debt being collected.\n\nYou come back the way a man comes up out of deep water — badly, and all at once. [ln_the_priest.GetTitledFirstName] is grey to the lips and does not look at you. Something has been taken to pay for this, and it was not taken from you alone."
 ln_prophecy.23.a:0 "Get up."
 ln_prophecy.24.t:0 "The Fire Kept What It Had"
 ln_prophecy.24.desc:0 "[ln_the_priest.GetTitledFirstName] kneels in the mud beside you and looks at you for a long moment.\n\nYou cannot hear what [ln_the_priest.GetSheHe] decides. You can only see [ln_the_priest.GetHerHis|U] face while [ln_the_priest.GetSheHe] decides it — and then [ln_the_priest.GetHerHim] standing up, and the sky where [ln_the_priest.GetHerHis] head had been.\n\nThere is only ever one of it to give. It was not going to be given to you."
 ln_prophecy.24.a:0 "Then it ends here."
