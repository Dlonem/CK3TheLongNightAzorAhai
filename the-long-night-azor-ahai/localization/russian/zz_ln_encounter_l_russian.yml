# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- White Walkers in Winter Is Coming (1.1.0, §5).

 # ── The encounter ──
 ln_encounter.1.t:0 "Снег встаёт"
 ln_encounter.1.desc.men:0 "Ветер умирает разом — так, как умирает разговор, когда в чертог входит не тот человек. Ваше дыхание висит перед вами и не двигается.\n\nОно стоит между двумя деревьями, и вы понимаете, что стоит оно там уже некоторое время. Высокое, тонкое, цвета молочного льда. Оно несёт клинок, который, похоже, не делал никто. Снег под ним не скрипит, потому что стоит оно не на снегу.\n\nВаши люди тоже его увидели. Пока никто не побежал. Это ещё может пойти и так и так."
 ln_encounter.1.desc.alone:0 "Ветер умирает разом. Ваше дыхание висит перед вами и не двигается.\n\nОно стоит между двумя деревьями, и вы понимаете, что стоит оно там уже некоторое время. Высокое, тонкое, цвета молочного льда. Оно несёт клинок, который, похоже, не делал никто. Снег под ним не скрипит, потому что стоит оно не на снегу.\n\nВы здесь одни. Оно это тоже знает."
 ln_encounter.1.a:0 "Строиться - драться будем здесь"
 ln_encounter.1.b:0 "Отходить - ничем из того, что у нас есть, его не достать"

 # ── Victory ──
 ln_encounter.20.t:0 "Оно распалось"
 ln_encounter.20.desc:0 "Удар доходит, и тварь не кровоточит. Она ломается. Она распадается так, как весной сходит лёд с крыши, — разом и со звуком, будто вскрывается озеро, — и там, где она стояла, нет ничего, кроме инея, падающего из воздуха.\n\nХолод уходит. Возвращается ветер, и деревья вспоминают, как двигаться.\n\nТе, кто ещё стоит на ногах, смотрят на иней, оседающий в снег, а потом на вас. В каждом чертоге, куда это дойдёт, рассказывать будут по-своему. Вы были там. Вы знаете, чего это стоило."
 ln_encounter.20.a:0 "Посмотреть, что от неё осталось"

 # ── The taking ──
 ln_encounter.21.t:0 "Холод смыкается"
 ln_encounter.21.desc:0 "Вы на спине в снегу и не помните, как упали. Бой окончен. По звуку слышно, насколько окончен.\n\nОно идёт к вам без спешки, потому что ничего, что могло бы ему повредить, больше не стоит на ногах. Холод приходит раньше него: сперва в руки, потом выше, потом в те части вас, которые вы всегда считали своими.\n\nПоследнее, что вы понимаете, — оно не собирается вас убивать. Оно собирается вас оставить себе."
 ln_encounter.21.a:0 "Больше сделать нечего"

 # ── The Sam Tarly outcome ──
 ln_encounter.22.t:0 "Оно оставляет одного"
 ln_encounter.22.desc:0 "Оно останавливается.\n\nКлинок у горла [ln_enc_the_spared.GetTitledFirstName] — и оно останавливается, и длинное белое лицо поворачивается и разглядывает его так, как человек разглядывает собаку, которая слишком мала, чтобы тратить на неё сапог. Потом оно проходит мимо, и синие глаза останавливаются на вас.\n\nОн будет жить. Он будет всю оставшуюся жизнь стоять в чертогах и рассказывать, что видел здесь, и ему будут наливать эля и не верить ни слову. Потому оно его и оставило. Кто-то должен рассказать живым, что идёт, и оно решило, что это будет он — а не вы."
 ln_encounter.22.a:0 "Значит, кто-то будет знать"

 # ── Break and run ──
 ln_encounter.24.t:0 "Вы не перестаёте бежать"
 ln_encounter.24.desc:0 "В этом нет ни порядка, ни чести. Есть миг, когда строя больше нет, а ваши ноги уже двигаются, и деревья хлещут мимо, а позади остаётся звук, который вы будете слышать до конца своих дней: как останавливаются те, кто бежать не мог.\n\nВы бежите, пока кровь во рту не начинает отдавать железом, а холод в груди не делается похож на утопание. Когда вы наконец оглядываетесь, между деревьями нет ничего, кроме снега.\n\nОно за вами не погналось. Вот этого вы не расскажете никому."
 ln_encounter.24.a:0 "Идти, пока не будет огней"

 # ── A sighting ──
 ln_encounter.30.t:0 "Что-то на гребне"
 ln_encounter.30.desc:0 "Охотники возвращаются рано и без одной собаки. В высоком снегу они нашли следы — человеческий шаг, но слишком длинный, и веса в нём нет, будто тот, кто его оставил, ступал ПО снегу, а не в снег. Следы идут полмили вдоль гребня и обрываются посреди шага.\n\nСтарший из них ходит на этот гребень тридцать лет. Именно он об этом говорить не станет."
 ln_encounter.30.a:0 "Мне известно, что там прошло, - и было известно всегда"
 ln_encounter.30.b:0 "Холод морочит усталых людей"

 # ── option tooltips (the effects run hidden; these lines are what the player is told) ──
 ln_encounter.1.a_tt:0 "Бой начинается. Решаться он будет человек за человеком в следующие дни, а Белый Ходок никогда не принимает сдачи."
 ln_encounter.1.b_tt:0 "Никто не дерётся. Тварь смотрит, как вы уходите."
 ln_encounter.20.a_tt:0 "Ходок уничтожен. Ваш счёт растёт на одного, и всякий уцелевший несёт эту память."
 ln_encounter.21.a_tt:0 "Те, кто ещё дышит, из снега не уйдут. И вы тоже — а что холод берёт, то холод оставляет себе."
 ln_encounter.22.a_tt:0 "Он жив. Все прочие остаются в снегу, и вы вместе с ними, последними, — а один человек уходит на юг рассказывать то, чему никто не поверит."
 ln_encounter.24.a_tt:0 "Вы живы и тяжело ранены. Те, кто не смог бежать, — нет."

 # ── Memories (§6 -- the type key is the title line, then three perspectives: I / you / [owner]) ──
 ln_slew_a_walker_memory:0 "убил одного из Иных"
 ln_slew_a_walker_memory_desc:0 "Я вышел против одного из Иных в снегу, и сломался он, а не я."
 ln_slew_a_walker_memory_desc_second_perspective:0 "вы вышли против одного из Иных в снегу, и сломался он, а не вы."
 ln_slew_a_walker_memory_desc_third_perspective:0 "[owner.GetName] вышел против одного из Иных в снегу, и сломался Иной."
 ln_the_walker_spared_me_memory:0 "пощажён одним из Иных"
 ln_the_walker_spared_me_memory_desc:0 "Оно убило всех, кто был рядом со мной, а потом посмотрело на меня и оставило жить. Не знаю, почему именно меня. Я спрашиваю об этом во сне."
 ln_the_walker_spared_me_memory_desc_second_perspective:0 "оно убило всех, кто был рядом с вами, посмотрело на вас и оставило вас жить."
 ln_the_walker_spared_me_memory_desc_third_perspective:0 "[owner.GetName] был пощажён одним из Иных, и никто не мог сказать почему."
