l_russian:

 # ── THE NAMING ──────────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.1.t:0 "Нечто произнесённое вслух"

 ln_prophecy.1.desc.priest:0 "#e Ваш жрец наблюдает за вами уже несколько недель. Вы списывали это на обычное внимание человека, чей хлеб зависит от вас.\n\n Нынче вечером он это говорит — ровно, как сообщают о факте, который предпочли бы не находить. Жрец, который кричит про [the_others|E] и ошибается, — это жрец, которого никто не кормит, так что осторожен он был долго.\n\n Он не уверен и так и говорит. Он ошибался прежде, дважды, и обоих похоронил.\n\n Ещё он говорит, что если он прав и промолчит, то он худший человек из всех живших.#!"
 ln_prophecy.1.desc.self:0 "#e Вы знаете это уже некоторое время и никому не сказали.\n\n Сны приходят не как пророчество. Они приходят как память — как то, что, вы уверены, случилось, чего затем ещё не случилось и что затем случается. Вы рано выучились, что от рассказа о них вслух люди начинают вас бояться.\n\n Изменилось же число. Вы можете перечислить знаки на собственной жизни, и их выходит больше, чем позволительно совпадению.\n\n Вас никто не нарёк. Вы делаете это сами, молча, и обнаруживаете, что верите в это, и обнаруживаете, что не рады.#!"

 ln_prophecy.1.desc.greenseer:0 "#e Тот, кто видит, пришёл к вам.\n\n Он не объясняет — объяснять он не мастер. Он сказал, что в чардревах есть ваше лицо, — так, как обмолвились бы, что пошёл дождь. Свойство мира, не похвала и не предостережение.\n\n Потом другое: что деревья показывают это дольше, чем вы живёте на свете, и всё это время ждали, кем это окажется.\n\n Он ничего у вас не попросил. От этого почему-то хуже.#!"
 ln_prophecy.1.desc.witch:0 "#e Женщина оказалась в вашем чертоге прежде, чем её кто-либо объявил, и объяснить этого потом никто не может.\n\n Она стара, грязна и совершенно вами не впечатлена, и она прошла долгий путь, чтобы сказать четыре фразы и уйти. Она считала. Счёт окончен. Вы отмечены, а быть отмеченным ни разу ещё не было подарком.\n\n Имени она не произносит. Она произносит другое, более старое, на языке, который, по словам вашего мейстера, к северу от Перешейка не звучал четыре тысячи лет, — и лицо мейстера, пока он переводит, вы и запомните.#!"
 ln_prophecy.1.a:0 "Пусть будет сказано. И пусть будет сказано громко."
 ln_prophecy.1.b:0 "Возможно, это правда. Но говорить это при свидетелях необязательно."
 ln_prophecy.1.c:0 "Нет. Найдите кого-нибудь другого. Я не ваш принц."

 # ── CHOSEN ──────────────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.2.t:0 "Обещанный принц"

 ln_prophecy.2.desc.first:0 "#e Это уже не один жрец.\n\n Весть пошла по той цепи, что носит вести между храмами, и вернулась, согласная сама с собой, чего с ней случается крайне редко. Знаки на вашей жизни сосчитаны людьми, которые вас в глаза не видели и не имеют причин вам льстить.\n\n Вас называют обещанным принцем. Некоторые пользуются именем более старым и более опасным — Азор Ахай, рождённый вновь, — и те, кто им пользуется, не из осторожных.\n\n Героем это вас не делает. Это делает вас спорным вопросом, и люди будут умирать по обе его стороны.\n\n #bold Никто в этой истории не знает, прав ли он. И меньше всех — вы.#!#!"
 ln_prophecy.2.desc.rival:0 "#e Это уже не один жрец, и, хуже того, вы не единственный.\n\n Уже есть человек, которого называют обещанным принцем: за ним храм, за ним последователи и такая версия событий, в которой настоящие знаки — его, а ваши — это жрец, вычитавший в огне собственные надежды.\n\n Теперь это говорят и о вас.\n\n Обоими вы быть не можете. Вера вполне способна держать эту мысль в голове и всё равно давать деньги обоим, потому что вера, ждавшая восемь тысяч лет, выучилась подстраховываться.\n\n #bold Одного из вас запомнят как человека, который считал себя принцем.#!#!"

 ln_prophecy.2.a:0 "Тогда пусть меня так и зовут — и пусть узнают, чего это стоит."
 ln_prophecy.2.b:0 "Вы взяли не того. Скажите это, пока кто-нибудь не умер, поверив вам."

 # ── THE DOUBT ───────────────────────────────────────────────────────────────────────────────────────────────
 ln_prophecy.3.t:0 "Жрец пересчитывает заново"

 ln_prophecy.3.desc:0 "Прямо он этого не говорит, потому что он не глуп, а вы не терпеливы. Он говорит это обходя стороной — спрашивая, держите ли вы ещё то, что держали, проходя знаки по одному и останавливаясь на тех, которых больше нет.\n\n Всё дело всегда было в счёте. Он ниже, чем был.\n\n Он вас ни в чём не обвиняет. Для этого ему нужно было бы быть уверенным — и самое скверное, к чему он на ваших глазах приходит, в том, что он уже не помнит, был ли он уверен или ему просто очень хотелось."
 ln_prophecy.3.a:0 "Значит, вы ошиблись. Скажите это прямо, и обоим станет легче."
 ln_prophecy.3.b:0 "Вы меня нарекли. Разречь меня обратно вам не дано."

 # ── THE CAPSTONE TRAIT ──────────────────────────────────────────────────────────────────────────────────────
 trait_azor_ahai_reborn:0 "Азор Ахай, рождённый вновь"
 trait_azor_ahai_reborn_desc:0 "Этот персонаж убил Короля Ночи.\n\nНе был наречён. Не был провозглашён. Сделал — и держит единственную ступень этой лестницы, с которой не поспоришь: она дана деянием, а не чьим-то прочтением огня.\n\nДелает ли это его обещанным принцем — вопрос отдельный, и очень многие ответят на него крайне уверенно в обе стороны."
