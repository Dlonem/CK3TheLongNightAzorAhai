l_russian:

 ln_omen.1.t:0 "Поход не вернулся"
 ln_omen.1.desc:0 "Шестеро ушли на север от [wall|E] ещё до последней оттепели. Люди опытные — один из них ходил туда одиннадцать раз и находил Молочную в тумане.\n\n Они запаздывают на восемь недель. Само по себе это не примечательно. Походы затягиваются, люди ломают ноги, [free_folk|E] берёт пленных и иногда возвращает их за выкуп.\n\n Примечательно другое: отряд, посланный их искать, повернул у Зачарованного леса и пришёл домой, и ни один из четверых не говорит почему.\n\n Лорд-командующий записал это как шестерых потерянных. Писарь, вносивший запись, при этом ни разу не поднял глаз."
 ln_omen.1.a:0 "Послать людей. Я хочу знать, что повернуло тот отряд назад."
 ln_omen.1.b:0 "Шестеро. Дозор теряет шестерых почти каждый год."

 ln_omen.2.t:0 "Тот, кто вернулся"
 ln_omen.2.desc:0 "Он разведчик — или был им. Он вошёл в ваш чертог, не будучи объявлен, и не попросил ни еды, ни огня.\n\n Он говорит, что видел одного. Стоял на опушке, выше человека и тоньше, и холод шёл от него так, как жар идёт от горна. Оно посмотрело на него и не стало торопиться. Он говорит, что четверо, что были с ним, всё ещё там, наверху, и всё ещё идут.\n\n В нём трясётся всё, что вам видно, кроме рук, которые совершенно неподвижны, — и ваш мейстер потихоньку говорит вам, что именно это его и тревожит.\n\n Он ждёт, что вы что-нибудь скажете. Вместе с ним ждёт весь чертог."
 ln_omen.2.a:0 "Я ему верю. Сказать это вслух, чтобы чертог слышал, как я это говорю."
 ln_omen.2.b:0 "Накормить его. Оставить при себе. Никому не говорить: лорд, кричащий о призраках, собирает войско в одиночку."
 ln_omen.2.c:0 "Он пьян, или безумен, или подкуплен. Выставить его вон."

 # ── SILVERWING'S REFUSAL ────────────────────────────────────────────────────────────────────────────────────
 ln_omen.10.t:0 "[ln_dragon.GetTitledFirstName] не полетит через неё"
 ln_omen.10.desc.open:0 "[ln_dragon.GetTitledFirstName] влетал в стену щитов. [ln_dragon.GetSheHe|U] проходил сквозь дым [ln_dragon.GetHerHis] собственного огня со стрелами в [ln_dragon.GetHerHis] крыле и не сворачивал.\n\nА в миле ото льда [ln_dragon.GetSheHe] останавливается. Не замедляется — останавливается, как конь останавливается перед змеёй, потом шипит, а потом заваливается на крыло так резко, что вы едва не срываетесь с [ln_dragon.GetHerHis] спины в деревья.\n\nВы поднимаете [ln_dragon.GetHerHim] снова и пробуете восточнее, где Стена ниже. То же самое. Вы пробуете в третий раз, под вечер, заходя высоко, с солнцем за спиной, чтобы [ln_dragon.GetSheHe] не увидел её, пока вы почти не окажетесь над ней, — и [ln_dragon.GetSheHe] всё равно её видит, и на сей раз [ln_dragon.GetSheHe] кричит.\n\n "
 ln_omen.10.desc.will:0 "Это не страх. Вы чувствовали [ln_dragon.GetHerHis] испуг — однажды, скверно, в буре у Тарта, — и это ничуть не похоже. [ln_dragon.GetHerHim] не бьёт дрожь, в нём нет дикости. [ln_dragon.GetSheHe|U] просто не станет — так, как человек не станет совать руку в огонь, — и когда вы понуждаете [ln_dragon.GetHerHim] в третий раз, [ln_dragon.GetSheHe] разворачивает [ln_dragon.GetHerHis] голову кругом на этой длинной шее и смотрит на вас, пока вы не перестанете просить.\n\n "
 ln_omen.10.desc.fear:0 "И [ln_dragon.GetSheHe] напуган. Именно в это никто не поверит, когда вы расскажете, потому что все знают, что такое дракон, — но вы годами сидели на [ln_dragon.GetHerHis] спине и точно знаете, каков [ln_dragon.GetSheHe] бывает, когда [ln_dragon.GetSheHe] напуган, и [ln_dragon.GetSheHe] напуган сейчас — полосой льда, на которой ничего не стоит.\n\n "
 ln_omen.10.desc.ward:0 "И вы не можете понять почему. Ничем не пахнет, ничего не слышно, на льду ничего нет, и за ним ничего, кроме белой земли, что тянется без конца. То, во что [ln_dragon.GetSheHe] упёрся, не принадлежит миру, который вам виден. Оно в Стене — или оно И ЕСТЬ Стена, — и его туда вложили люди, которые мертвы восемь тысяч лет и записки не оставили.\n\n "
 ln_omen.10.desc.close:0 "Дозорные на парапете перестали делать вид, что заняты. Один из тех, кто постарше, вовсе не смотрит на дракона. Он смотрит на вас, чтобы увидеть, что вы с этим сделаете, и в этом есть что-то почти похожее на жалость.\n\nСемь тысяч лет льда — и никто ни разу не записал, что в него вложили."
 ln_omen.10.a:0 "Ещё раз. Поднять [ln_dragon.GetHerHim] снова."
 ln_omen.10.b:0 "Довольно. [ln_dragon.GetSheHe|U] знает то, чего не знаю я."
 ln_omen.10.c:0 "Написать в Цитадель. Разумная причина найдётся."

 # ── THE TALE, for those who will never sit on a dragon ──────────────────────────────────────────────────────
 ln_omen.11.t:0 "Заметка на полях"
 ln_omen.11.desc:0 "Это даже не предмет книги. Это строка в главе о королевских объездах, где как курьёз отмечено, что при посещении Стены королевой Алисанной её дракон Среброкрылая не полетела через неё и что её милость трижды пыталась перебраться, прежде чем оставила эту затею.\n\nТрижды. Кто-то написал «трижды» и перешёл к описанию пира.\n\nДраконы не отказываются. В этом весь их смысл.\n\nЗначит, либо мейстер солгал о королеве, в хронике, без всякой причины, — либо в этом льду что-то есть, оно старше Валирии, и его туда вложили, чтобы не пустить что-то внутрь."
 ln_omen.11.a:0 "Значит, его вложили туда, чтобы что-то не пустить. Я хочу знать что."
 ln_omen.11.b:0 "У дракона старой женщины выдался неудачный день. И только."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_omen.10.b_tt:0 "[ln_dragon.GetSheHe|U] с этих пор остаётся вне ваших войн, как будто вы сами взяли #bold Не использовать дракона#!. Возьмите #bold Использовать дракона#!, чтобы передумать."
 ln_omen.10.d:0 "Всё равно попросить об этом [ln_dragon.GetTitledFirstName]."
 ln_omen.10.d_tt:0 "[ln_dragon.GetTitledFirstName] никогда ни в чём другом вам не отказывал. [ln_dragon.GetSheHe|U] перелетает — и перелетает снова.\n\n#N Пока Стена стоит, то, что ждёт в этом небе, скорее всего сведёт [ln_dragon.GetHerHim] вниз, — а то, что он забирает, мёртвым не остаётся.#!"
