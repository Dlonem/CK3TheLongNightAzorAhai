l_russian:
# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- the melee's prowess modifiers (1.1.0).
 #
 # These are all temporary: applied when an LN melee opens, stripped at the scrub, bounded at two years so a
 # missed scrub cannot follow a man for life. Every one of them is visible on the character sheet while the
 # fight is running, which is why every one of them needs a name -- the 1 Sep audit found the whole set
 # shipping with none, which would have put raw keys like "ln_the_cold_between_3_modifier" on screen mid-duel.
 #
 # The five cold bands share a name on purpose. A fighter only ever holds one of them, so the band number is
 # bookkeeping and the player has no use for it.

 ln_the_cold_between_0_modifier:0 "Холод между вами"
 ln_the_cold_between_1_modifier:0 "Холод между вами"
 ln_the_cold_between_2_modifier:0 "Холод между вами"
 ln_the_cold_between_3_modifier:0 "Холод между вами"
 ln_the_cold_between_4_modifier:0 "Холод между вами"
 ln_the_cold_between_0_modifier_desc:0 "Всему, что вы знаете об убийстве людей, вы выучились на людях. Против того, кто человеком не был восемь тысяч лет, умение идёт в половину."
 ln_the_cold_between_1_modifier_desc:0 "Всему, что вы знаете об убийстве людей, вы выучились на людях. Против того, кто человеком не был восемь тысяч лет, умение идёт в половину."
 ln_the_cold_between_2_modifier_desc:0 "Всему, что вы знаете об убийстве людей, вы выучились на людях. Против того, кто человеком не был восемь тысяч лет, умение идёт в половину."
 ln_the_cold_between_3_modifier_desc:0 "Всему, что вы знаете об убийстве людей, вы выучились на людях. Против того, кто человеком не был восемь тысяч лет, умение идёт в половину."
 ln_the_cold_between_4_modifier_desc:0 "Всему, что вы знаете об убийстве людей, вы выучились на людях. Против того, кто человеком не был восемь тысяч лет, умение идёт в половину."

 ln_bane_lightbringer_modifier:0 "Светозарный в руке"
 ln_bane_lightbringer_modifier_desc:0 "Меч, о котором и всё пророчество, — в том единственном бою, для которого он был сделан. Он отдаёт больше, чем забирает холод."
 ln_bane_valyrian_modifier:0 "Валирийская сталь в руке"
 ln_bane_valyrian_modifier_desc:0 "Драконья сталь. Никто из живых не помнит, как её делали, и ей всё равно, что она рассекает."
 ln_bane_glass_modifier:0 "Драконье стекло в руке"
 ln_bane_glass_modifier_desc:0 "Застывший огонь, и он работает — на длину руки, в чём и вся с ним беда."

 ln_melee_named_chosen_modifier:0 "Наречён, и строй это знает"
 ln_melee_named_chosen_modifier_desc:0 "Люди за вашей спиной слышали, как вас зовут жрецы. Правда ли это, значения уже не имеет; важно, что они держатся на ногах, пока смотрят на вас."
 ln_melee_named_favored_modifier:0 "Отмечен, и строй это знает"
 ln_melee_named_favored_modifier_desc:0 "Когда-то кто-то произнёс над вами слова, и строй помнит, что об этом слышал."

 ln_led_with_the_bane_modifier:0 "Вы пошли первым"
 ln_led_with_the_bane_modifier_desc:0 "Вы обнажили клинок прежде, чем вас об этом попросили, и вышли вперёд своего же строя. Это покупает вам шаг — и это значит, что тварь посреди того поля не смотрит больше ни на кого."
