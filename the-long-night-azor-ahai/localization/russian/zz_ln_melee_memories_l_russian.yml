# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- memories of the Long Night (1.1.0, §6).

 ln_saved_by_kin_memory:0 "спасён [target0.GetTitledFirstName]"
 ln_saved_by_kin_memory_desc:0 "[target0.GetTitledFirstName] принял удар, предназначенный мне. Кровь отвечает за кровь; моя всё ещё ходит по земле благодаря [target0.GetHerHis] крови."
 ln_saved_by_kin_memory_desc_second_perspective:0 "[target0.GetTitledFirstName] принял удар, предназначенный вам."
 ln_saved_by_kin_memory_desc_third_perspective:0 "[owner.GetName] должен был принять тот удар — а принял его [target0.GetTitledFirstName]."
 ln_saved_by_a_friend_memory:0 "спасён [target0.GetTitledFirstName]"
 ln_saved_by_a_friend_memory_desc:0 "[target0.GetTitledFirstName] шагнул под удар, предназначенный мне. Никакая клятва этого не требовала. Вот чего я не могу отложить."
 ln_saved_by_a_friend_memory_desc_second_perspective:0 "[target0.GetTitledFirstName] шагнул под удар, предназначенный вам."
 ln_saved_by_a_friend_memory_desc_third_perspective:0 "[owner.GetName] должен был принять тот удар — а под него шагнул [target0.GetTitledFirstName]."
 ln_blade_broke_memory:0 "сталь подвела против Иного"
 ln_blade_broke_memory_desc:0 "Я выставил против бледного клинка добрую замковую сталь, и моя разлетелась, как лёд на пруду. Звук, который она издала, я помню лучше всего, что было потом."
 ln_blade_broke_memory_desc_second_perspective:0 "ваша сталь разлетелась о бледный клинок."
 ln_blade_broke_memory_desc_third_perspective:0 "[owner.GetName] вышел со сталью против клинка Иного, и сталь разлетелась."
 ln_took_the_black_memory:0 "надел чёрное"
 ln_took_the_black_memory_desc:0 "Я произнёс слова по собственной просьбе. Чем бы я ни был прежде, я оставил это к югу от Стены."
 ln_took_the_black_memory_desc_second_perspective:0 "вы произнесли слова по собственной просьбе."
 ln_took_the_black_memory_desc_third_perspective:0 "[owner.GetName] надел чёрное по своей воле."
 ln_the_wall_fell_memory:0 "жив, когда пала Стена"
 ln_the_wall_fell_memory_desc:0 "Я был жив в тот день, когда пал Чёрный Замок, и я точно знаю, что я посылал и чего не посылал на север в годы до того."
 ln_the_wall_fell_memory_desc_second_perspective:0 "вы были живы в тот день, когда пал Чёрный Замок."
 ln_the_wall_fell_memory_desc_third_perspective:0 "[owner.GetName] был жив в тот день, когда пал Чёрный Замок."
 ln_learned_the_glass_memory:0 "изучил драконье стекло"
 ln_learned_the_glass_memory_desc:0 "Я пошёл туда, где лежат записи, и выучил, для чего застывший огонь. Большинство тех, кто встречает холод, узнаёт это в последнее мгновение своей жизни; я узнал это в библиотеке."
 ln_learned_the_glass_memory_desc_second_perspective:0 "вы пошли туда, где лежат записи, и выучили, для чего застывший огонь."
 ln_learned_the_glass_memory_desc_third_perspective:0 "[owner.GetName] изучил драконье стекло и выучил, для чего оно."

 # ── §6's threshold modifier ──
 ln_dread_of_the_walker_slayer_modifier:0 "Убийца Белых Ходоков"
 ln_dread_of_the_walker_slayer_modifier_desc:0 "Трое из бледного рода разбились об этого человека. Живые рассказывают об этом в чертогах; что бы ни считалось разговором у мёртвых, до них это тоже дошло."
