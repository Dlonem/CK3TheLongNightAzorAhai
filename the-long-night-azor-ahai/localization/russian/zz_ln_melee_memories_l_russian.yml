 # AGOT: The Long Night & Azor Ahai -- memories of the Long Night (1.1.0, §6).

 ln_saved_by_kin_memory:0 "saved by [target0.GetTitledFirstName]"
 ln_saved_by_kin_memory_desc:0 "[target0.GetTitledFirstName] took the blow that was meant for me. Blood answers for blood; mine still walks because of [target0.GetHerHis]."
 ln_saved_by_kin_memory_desc_second_perspective:0 "[target0.GetTitledFirstName] took the blow that was meant for you."
 ln_saved_by_kin_memory_desc_third_perspective:0 "[target0.GetTitledFirstName] took the blow that was meant for [owner.GetName]."
 ln_saved_by_a_friend_memory:0 "saved by [target0.GetTitledFirstName]"
 ln_saved_by_a_friend_memory_desc:0 "[target0.GetTitledFirstName] stepped into the blow that was meant for me. No oath required it. That is the part I cannot put down."
 ln_saved_by_a_friend_memory_desc_second_perspective:0 "[target0.GetTitledFirstName] stepped into the blow that was meant for you."
 ln_saved_by_a_friend_memory_desc_third_perspective:0 "[target0.GetTitledFirstName] stepped into the blow that was meant for [owner.GetName]."
 ln_blade_broke_memory:0 "steel failed against the Other"
 ln_blade_broke_memory_desc:0 "I put good castle-forged steel against the pale blade, and mine came apart like ice on a pond. I remember the sound it made more than anything that came after."
 ln_blade_broke_memory_desc_second_perspective:0 "your steel came apart against the pale blade."
 ln_blade_broke_memory_desc_third_perspective:0 "[owner.GetName]'s steel came apart against an Other's blade."
 ln_took_the_black_memory:0 "took the black"
 ln_took_the_black_memory_desc:0 "I said the words at my own asking. Whatever I was before, I left it south of the Wall."
 ln_took_the_black_memory_desc_second_perspective:0 "you said the words at your own asking."
 ln_took_the_black_memory_desc_third_perspective:0 "[owner.GetName] took the black by choice."
 ln_the_wall_fell_memory:0 "alive when the Wall fell"
 ln_the_wall_fell_memory_desc:0 "I was alive on the day Castle Black fell, and I know exactly what I did and did not send north in the years before it."
 ln_the_wall_fell_memory_desc_second_perspective:0 "you were alive on the day Castle Black fell."
 ln_the_wall_fell_memory_desc_third_perspective:0 "[owner.GetName] was alive on the day Castle Black fell."
 ln_learned_the_glass_memory:0 "studied the dragonglass"
 ln_learned_the_glass_memory_desc:0 "I went where the records are and learned what the frozen fire is for. Most men who face the cold learn it in the last second of their lives; I learned it in a library."
 ln_learned_the_glass_memory_desc_second_perspective:0 "you went where the records are and learned what the frozen fire is for."
 ln_learned_the_glass_memory_desc_third_perspective:0 "[owner.GetName] studied the dragonglass and learned what it is for."

 # ── §6's threshold modifier ──
 ln_dread_of_the_walker_slayer_modifier:0 "Slayer of White Walkers"
 ln_dread_of_the_walker_slayer_modifier_desc:0 "Three of the pale kind have broken against this one. The living tell the story in halls; whatever passes for talk among the dead, it has reached them too."
