l_russian:

 # ── THE WARNING (The Cold Winds Rise) ───────────────────────────────────────────────────────────────────────
 ln_opening.6.t:0 "#e Холодные ветры поднимаются#!"
 ln_opening.6.desc:0 "#e Дело не в чём-то одном. Тем и трудно с этим спорить.\n\n Походы перестали возвращаться — не пропали, не задержались, а перестали. Вольный народ жмётся к Стене в числе, какого не объяснит никакой набеговый сезон, а взятые живыми не говорят, от чего бегут, — только что оно у них за спиной.\n\n Мейстеры тихо перестали спорить о том, преувеличены ли старые свидетельства, и начали спорить о том, сколько осталось времени.\n\n На юге всё ещё лето. Ещё есть время что-то с ним сделать.\n\n #bold Что государство построит сейчас, то у государства и будет.#!#!"
 ln_opening.6.a:0 "Тогда лучше его не растратить."
 ln_opening.6.b:0 "Послать в Цитадель. Мне нужны свидетельства, а не споры."
 ln_opening.6.c:0 "На юге всё ещё лето."

 # Station branches, added Session 10. Same ladder as the intro card; the fallback is the original text.
 ln_opening.6.desc.watch:0 "#e Мейстеры вам не понадобились. У вас есть книга.\n\n Три похода с оттепели. Вернулся один — и вернулся без шести человек, ушедших вперёд посмотреть. Вольный народ перестал ходить на Стену набегами и начал у неё просить, а брат, которому одичалые лгали всю его жизнь, чует разницу нутром.\n\n Девятнадцать замков строили ради этого часа. Вы можете держать гарнизон в трёх.\n\n #bold Восемь тысяч лет обетов написаны ради того, что будет дальше. Вы — то, что осталось от Дозора, а Дозор — то, что осталось от предупреждения.#!#!"
 ln_opening.6.desc.free_folk:0 "#e Коленопреклонённые к югу от Стены всё ещё спорят, правда ли это. Вам спорить больше не нужно.\n\n Оно не перед вами, где с ним можно драться. Оно позади вас, где от него можно только убежать. Тенны снялись. Роговстопые снялись. Кланы, резавшие друг друга девять тысяч лет, идут в одну сторону, и никому не пришлось объяснять, в какую.\n\n Старые песни говорят, что Стену подняли, чтобы не пустить что-то. Ваш народ оставили не с той её стороны.\n\n #bold Зима придёт не за югом первым.#!#!"
 ln_opening.6.desc.north:0 "#e У сказки Старой Нэн была своя форма: приходят Иные, с ними приходит холод, и долгая ночь длится поколение. Её слышал каждый северный ребёнок. Над ней улыбался каждый северный лорд.\n\n Улыбки кончились. Походы не возвращаются, вольный народ жмётся к Стене в числе, какого не объяснит никакой набеговый сезон, а ваш собственный мейстер — южанин, выучка Цитадели, не друг нянькиным россказням — тихо начал считать, что лежит в амбарах, против того, сколько зим этому, возможно, придётся пролежать.\n\n Север помнит. Это всегда были слова дома, которые никто не договаривал: он помнит ИМЕННО ЭТО.\n\n #bold На юге всё ещё лето. Потратьте его по-северному.#!#!"
 ln_opening.6.desc.dragon:0 "#e Ваш дом нёс пророчество так, как другие дома носят меч, который никто уже не помнит как обнажать.\n\n Сон, что увёл Энара из Валирии; песнь льда и пламени; обещанный принц, о котором септоны слишком учтивы, чтобы упоминать. Триста лет это было родовой реликвией — церемониальной, неловкой, хранимой.\n\n Теперь походы перестали возвращаться, вольный народ бежит от того, чего не называет, а сны в вашей семье начали приходить по расписанию.\n\n #bold Кровь дракона вложена в мир ради одного часа. Похоже, что это тот самый час.#!#!"
 ln_opening.6.desc.red:0 "#e Вы проповедовали о Великом Ином в залах, которые над вами смеялись. Залы смеяться перестали.\n\n Пламя целый год показывает одно и то же: стену изо льда и что-то терпеливое не с той её стороны. Теперь вороны с севера осторожной мейстерской рукой пишут то, что Рглор всё это время говорил прямо.\n\n Это та война, ради которой вера и существует. Каждая проповедь, каждый ночной костёр, каждый неправдоподобный новообращённый были подготовкой ровно к этому часу — и где-то в мире Владыка Света выбирает руку, что удержит меч.\n\n #bold Ночь идёт. Именно это вы им всё время и обещали.#!#!"
 ln_opening.6.desc.dance:0 "#e Ваш дом целое поколение спорит о кресле.\n\n Есть притязатель на Драконьем Камне и притязатель на Железном Троне, и каждого лорда державы тихо спросили, в какую сторону он прыгнет. Половина писем в вашей горнице — о наследовании. То, что со Стены, лежит внизу нераспечатанным, потому что Стена пишет всегда и ни разу не имела значения для того, кто сидит на троне.\n\n Это донесение о походе. Троих послали на север, не вернулся никто, и в конце строка дрожащей рукой, которую мейстер подчеркнул дважды.\n\n В небе у вашей семьи сейчас больше драконов, чем было в мире с тех пор, как сгорела Валирия. А ещё у неё два двора, и ни один из них этого не читает.\n\n #bold Тьме всё равно, кому из вас предназначалось быть королём.#!#!"
 ln_opening.6.desc.dragons:0 "#e Походы перестали возвращаться — и на сей раз у державы есть чем на это ответить.\n\n Почти каждое утро над Черноводной драконы. Дети показывают на них пальцем так, как в другие века показывали на облака. Что бы ни стояло за Стеной, оно выбрало единственный век за восемь тысяч лет, когда живые могут поднять в небо огонь дюжинами.\n\n Мейстеры советуют считать, что это делает старые свидетельства менее страшными. Мейстеры никогда не видели того, что валит дракона наземь, а потом поднимает его снова.\n\n #bold На юге всё ещё лето, и небо полно огня. Потратьте и то и другое.#!#!"

 # ── 1. THE WALL COMES DOWN ──────────────────────────────────────────────────────────────────────────────────
 ln_opening.1.t:0 "#e Стена пала#!"
 ln_opening.1.desc:0 "#e Восемь тысяч лет льда — и всё ушло за один день.\n\n Свидетельств, как именно, нет. Тех, кто на ней стоял, не спросить. То, что прошло на юг через пролом, не стало осаждать Чёрный Замок: оно просто прошло мимо, как проходит мимо погода.\n\n Всадники, что везли весть на юг, скакали, пока не пали их кони, а потом бежали, и они никому не смогли втолковать одного: войска не было. Войско можно встретить. Это больше похоже на прилив, в котором есть лица.\n\n #bold Иные вернулись, и Долгая Ночь началась.#!#!"
 ln_opening.1.a:0 "Тогда мы встретим их в открытом поле."
 ln_opening.1.b:0 "Трубить во все рога отсюда до Дорна. Уводить деревни на юг."
 ln_opening.1.desc.watch:0 "#e Вы почувствовали, как она пошла. Все на Стене почувствовали — дрожь сквозь восемь тысяч лет льда, а потом тишина с дырой посередине.\n\n Чёрный Замок ещё стоит. В этом и вся мерзость: ваши стены, ваши ворота, ваши братья на постах — а в полулиге к востоку Стены попросту больше нет, и то, ради остановки чего подняли Дозор, идёт мимо Дозора, не сбиваясь с шага.\n\n В обете о Стене не сказано ничего. Вы замечаете это только теперь. В нём сказано: я — щит.\n\n #bold Ледяной щит пал. Остаётся щит из людей.#!#!"
 ln_opening.1.desc.north:0 "#e Теперь всякий северный дом на одном и том же расстоянии от этого: первым.\n\n Стена была роскошью Севера — причиной, по которой зима была временем года, а не осадой, причиной, по которой сказка Старой Нэн оставалась сказкой. Она пала, и всё между проломом и вашими воротами — это дорога, а те, кто на дороге, не устают, не едят и не задерживаются пограбить.\n\n Югу достанутся вороны. Северу достаются беженцы, а потом достаются мёртвые.\n\n #bold Иные вернулись, и Север снова щит — такой же, каким был в первый раз.#!#!"

 # ── 2. THE LAST RANGING ─────────────────────────────────────────────────────────────────────────────────────
 ln_opening.2.t:0 "#e Последний поход#!"
 ln_opening.2.desc:0 "#e Поход вышел в сорок человек. Вернулись одиннадцать.\n\n Вернулись ночью — и Дозору стоило бы этим озадачиться; вернулись молча — и этим стоило бы озадачиться крепче. К утру Чёрный Замок потерял от рук собственных братьев больше людей, чем от всего, что есть за Стеной.\n\n Стена ещё стоит. Она перестала иметь значение в тот миг, когда открыли ворота.\n\n #bold Иные вернулись, и Долгая Ночь началась.#!#!"
 ln_opening.2.a:0 "Сжечь их. Сжечь их всех."
 ln_opening.2.b:0 "Почтить мёртвых. А потом удвоить стражу у каждых оставшихся ворот."
 ln_opening.2.desc.watch:0 "#e Вы знали всех сорок. Именно этого юг никогда в этом не поймёт: те одиннадцать, что вошли в ворота, были братьями, с именами, а те, кто открыл им ворота, годами делили с ними хлеб.\n\n К утру вы потеряли в собственном дворе больше людей, чем от всего, что есть за Стеной, и уцелевшие смотрят друг на друга так, как смотрят на дверь, которая, может быть, и не дверь.\n\n Стена ещё стоит. Стена никогда и не была слабым местом.\n\n #bold Им был Дозор. Иные вернулись, и вошли они в чёрном.#!#!"
 ln_opening.2.desc.north:0 "#e Ворон из Чёрного Замка короток — по этому и понятно, что это правда. Мейстеры расшивают слухи. Список потерь не расшивает никто.\n\n Поход вернулся неправильным, и Дозор до рассвета сжёг во дворе собственных мёртвых. Каждый северный лорд сто поколений слал на эту Стену сыновей и лишние мечи. Некоторые имена на том костре вам знакомы.\n\n Старая Нэн никогда не говорила, как это начнётся. Началось так, как начинается всё самое худшее: дома, со знакомым лицом.\n\n #bold Иные вернулись, и Долгая Ночь началась.#!#!"

 # ── 3. THE EXODUS ───────────────────────────────────────────────────────────────────────────────────────────
 ln_opening.3.t:0 "#e Сперва пришли бегущие#!"
 ln_opening.3.desc:0 "#e Вольный народ пришёл к Стене так, как река приходит к плотине.\n\n Не налётчики. Целые кланы — тенны, роговстопые и речной люд, не говорившие друг с другом на памяти живых, — идут в одну сторону с детьми за спиной, и каждый просит пропустить его в ворота, которые они девять тысяч лет пытались сломать.\n\n Одни лорды говорили о милосердии. Другие — об опасности. Все ещё спорили, когда пришло то, от чего они бежали, и решило вопрос.\n\n #bold Иные вернулись, и Долгая Ночь началась.#!#!"
 ln_opening.3.a:0 "Надо было открыть ворота."
 ln_opening.3.b:0 "Открыть ворота. Всякая душа по правильную сторону Стены — это копьё."
 ln_opening.3.desc.free_folk:0 "#e Вы не читаете об исходе. Вы идёте в нём.\n\n Ваши люди, ваши соперники, кланы, с которыми ваш дед вёл кровную вражду, — все движутся на юг вместе, потому что тому, что у вас за спиной, всё равно, какого вы клана. Дети перестали спрашивать, от чего вы бежите. Старики не спрашивали вовсе.\n\n Впереди Стена и ворота, которые держат люди, поклявшиеся вас убивать, и вы встанете перед ними и будете просить — потому что вольный народ наконец встретил единственное, что хуже, чем преклонить колено.\n\n #bold Мёртвые берут всех. Стало быть, все — ваши.#!#!"
 ln_opening.3.desc.watch:0 "#e Дозор дрался с вольным народом девять тысяч лет, а теперь вольный народ стоит у ворот и просит Дозор оказаться правым в одном: что Стена удержит то, что у них за спиной.\n\n Целые кланы. Тенны, роговстопые и речной люд, дети за спиной, и каждый крепкий мужчина среди них — люди, с которыми вы дрались лично, — с белками навыкате, как у лошадей в горящей конюшне.\n\n В вашем обете сказано: царства людей. Не сказано, каких людей.\n\n #bold Иные вернулись, и нынче ночью Дозор решает, что эти слова значили всё это время.#!#!"
 ln_opening.3.desc.north:0 "#e Одичалые в Даре — это осень. Одичалые, просящие у ворот знаменосцев Винтерфелла, безоружные, с поднятыми на руках детьми вместо доказательства, — это не осень.\n\n Они не идут в набег. Они бегут, а вольный народ не бегает от людей. У каждого северного лорда теперь одна и та же скверная арифметика: всякий отвергнутый клан — это несколько сотен трупов, которые вернутся по Королевскому тракту с чем-то другим за глазами.\n\n #bold Иные вернулись, и всякая душа к северу от вас — либо копьё, либо упырь. Третьего нет.#!#!"

 # ── 4. IT WAS ALREADY INSIDE ────────────────────────────────────────────────────────────────────────────────
 ln_opening.4.t:0 "#e Оно уже было здесь#!"
 ln_opening.4.desc:0 "#e Крепость не пала. Она тихо сменила хозяина, и целый сезон этого никто не замечал.\n\n Ни Стена, ни одичалые, ничего из того, за чем держава сто лет следила. Что-то вошло в открытую дверь годы назад, с лицом, которое кто-то узнал, и стало ждать.\n\n Теперь каждый лорд Вестероса оглядывает собственный чертог и гадает, давно ли его собственные люди — его собственные люди.\n\n #bold Иные вернулись. Им не нужно было идти на юг. Они уже были здесь.#!#!"
 ln_opening.4.a:0 "Привести ко мне всех до одного в этом чертоге. Немедленно."
 ln_opening.4.b:0 "Ничего не менять. Следить за всем."
 ln_opening.4.desc.watch:0 "#e Дозор восемь тысяч лет смотрел на север. В этом и был весь замысел: Стена впереди, держава позади, и враг с правильной стороны.\n\n Крепость, сменившая хозяина, южнее вас. Позади вас. Ворота, которых никто не сторожил, были дверью в чьём-то чертоге, годы назад, и теперь всякий ворон молит Дозор о помощи, которой Дозор дать не может, потому что Стена — это щит, а щит не умеет разворачиваться.\n\n #bold Иные не пришли на юг. Они были на юге. Долгая Ночь началась у вас за спиной.#!#!"
 ln_opening.4.desc.red:0 "#e У веры есть для этого имя, и есть уже тысячу лет: слуги Великого Иного не выламывают дверей. Их приглашают внутрь, они носят лица и ждут.\n\n Вы об этом проповедовали. Это была та проповедь, от которой пустели залы: слишком странно, слишком мнительно, красный жрец видит демонов в кладовой. А теперь крепость на севере сменила хозяина, не пав, и каждый лорд Вестероса оглядывает собственный чертог, и на ваши ночные костры вдруг стало ходить очень много народу.\n\n #bold Ночь здесь. Она всегда должна была начаться внутри дома.#!#!"

 # ── modifier ────────────────────────────────────────────────────────────────────────────────────────────────
 ln_the_watch_knows_modifier:0 "Дозор знает"
 ln_the_watch_knows_modifier_desc:0 "Они открыли ворота собственным братьям. Что бы ни было дальше, запомнят именно это."

 # ── 5. THE PROOF (replaces the retired wall_breached opening; Thomas, 13 Aug) ──
 ln_opening.5.t:0 "#e Доказательство#!"
 ln_opening.5.desc.crown:0 "#e Сегодня перед вашим троном стоял лорд Севера, истрёпанный дорогой до лохмотьев, и просил дозволения совершить казнь в вашем присутствии. То, что он приволок на цепи, имело облик человека. Мёртвым оно было уже давно. И оно двигалось.#!\n\n#e Палач снял с него голову, и оно продолжало двигаться. Ему отняли правую руку, и рука продолжала двигаться отдельно, что было хуже. Остановил его в конце концов огонь, и весь двор стоял и смотрел, как оно горит, в той особой тишине, с какой несколько сотен человек разом пересматривают всё, во что верили.#!\n\n#e Север слал воронов годами. Этого донесли на руках.#!\n\n#e Иные вернулись, и Долгая Ночь началась.#!"
 ln_opening.5.desc:0 "#e Весть доходит до вас так, как всегда доходят правдивые: не песней, а донесением, сухим, как книга каптенармуса. Северный лорд вошёл в тронный зал самого Железного Трона с мертвецом на цепи и попросил у короны дозволения его казнить. Работа палача не дала ничего. Огонь в конце концов дал.#!\n\n#e Несколько сотен лучших людей державы смотрели, как труп отказывает мечу, и корона смотрела вместе с ними. Нынче утром над Севером никто не смеётся. Нигде не смеётся никто.#!\n\n#e Иные вернулись, и Долгая Ночь началась.#!"
 ln_opening.5.a:0 "Значит, всё это правда. Всё до последнего."
 ln_opening.5.b:0 "Сжечь эту тварь. А потом собрать державу."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_opening.6.desc.lord:0 "#e My maester brings me forwarded reports from the Citadel. They are deeply unsettling.\n\nIt is buried in dry language about missing Night's Watch rangings and unusual wildling migrations, but the implications are clear. The rivers in the North are freezing faster than they should, and the Citadel is quietly hoarding grain.\n\nMost lords will call it a harsh winter. But a harsh winter does not terrify the maesters into silence.\n\n#bold I do not know what is happening in the deep North, but it is coming south.#!#!"
 ln_opening.6.desc.nobody:0 "#e The air carries a colder, unnatural bite I have never felt before.\n\nThe greybeards in the camps and taverns speak of bad years and harsh frosts, but this feels different. Travelers bring strange rumors from the North—missing Black Brothers, wildlings abandoning their lands, and a cold that kills a man in his sleep. Nobody wants to say it aloud, but the summers we once knew are gone.\n\n#bold Something terrible is riding the northern winds.#!#!"
 ln_opening.6.desc.close:0 "\n\n#EMP Nobody can tell you how long this lasts — not the maesters, not the priests, not the oldest man in your hall.#! What is certain is that this winter is not like the others."
 ln_opening.1.desc.free_folk:0 "#e We look to the sky, and there is only black. The true cold is here.\n\nThe sun has stopped coming up. The elders have fallen completely silent, and the young finally understand why we run. There is nowhere left to hide in the dark.\n\n#bold The Long Night has begun. The dead are coming.#!#!"
 ln_opening.1.desc.dragon:0 "#e The Valyrian scrolls spoke of a darkness that would sweep the world. I look at the black sky, and realize the doom did not die in the east.\n\nIt has been dark for days. A magical cold has settled over the realm that no normal fire can banish. The long promised hour of ice and fire is literally upon us.\n\n#bold The Long Night has begun. It is time to wake the dragon.#!#!"
 ln_opening.1.desc.red:0 "#e The Great Other has cast his physical shadow over the world. The literal night that never ends is here.\n\nOur priests have shouted the prophecy of Azor Ahai in the streets for centuries, and now the vanishing sun proves the truth of the Lord of Light's warnings. The night is dark, and it is full of terrors.\n\n#bold The enemy of the light has returned. Only fire can push back this dark.#!#!"
 ln_opening.1.desc.lord:0 "#e Even this far south, noon is as dark as midnight.\n\nThe rivers are freezing solid overnight, and the crops are turning to black rot in the fields. The maesters have no explanation for a sky without a sun, nor a cold this unnatural. The terrifying myths from the North are suddenly feeling very real.\n\n#bold The Long Night has begun. The realm is completely blind.#!#!"
 ln_opening.1.desc.nobody:0 "#e There has not been a sunrise in almost a week. The rivers are turning to solid ice.\n\nPeople are huddling around whatever fires they can build, terrified of the freezing wind and the pitch-black sky. Nobody knows what is happening, only that the world feels entirely broken.\n\n#bold The Long Night has come. I pray we survive it.#!#!"
 ln_opening.2.desc.free_folk:0 "#e We watched forty crows march deep into the woods. Only eleven limped back out. We counted them coming and going.\n\nThe dead do not care about black cloaks. The kneelers are finally learning the terrible truth of what happens in the snow.\n\n#bold The Others have returned. There is no safety behind their ice.#!#!"
 ln_opening.2.desc.dragon:0 "#e Word arrives of a massive ranging slaughtered beyond the Wall, the survivors claiming the dead rose from the snow to butcher them.\n\nSome lords might call it a trick of the cold, but my ancestors conquered this continent to unite it against exactly this ancient magic. \n\n#bold The Long Night is here. We must meet their ice with fire.#!#!"
 ln_opening.2.desc.red:0 "#e My priests are spreading the horrific news from the North. The true war has officially begun.\n\nA ranging party was slaughtered in the deep woods, and the survivors report that the slain rose again as servants of the dark. The Lord of Light commands us to burn the rot before it spreads to the rest of the world.\n\n#bold The Long Night has begun. Fire is the only answer.#!#!"
 ln_opening.2.desc.lord:0 "#e The Citadel has forwarded a chilling, formal report from the Lord Commander of the Night's Watch.\n\nA great ranging party was decimated deep in the haunted woods. The survivors swore on their lives that they were ambushed in the dark, and that their fallen brothers rose from the snow with unnatural blue eyes to attack them. Most lords might dismiss this as madness or wildling treachery, but the Citadel does not forward mad ravings without reason.\n\n#bold If the dead truly walk, what protects the south?#!#!"
 ln_opening.2.desc.nobody:0 "#e I hear terrified whispers in the taverns that a massive ranging party was butchered in the deep North.\n\nThey say the Black Brothers did not fight wildlings, but rather corpses that rose from the snow to kill them. Even without lands or titles, I know the smell of a doomed realm.\n\n#bold The Long Night has begun. Nowhere is safe.#!#!"
 ln_opening.3.desc.dragon:0 "#e Whispers reach me that thousands of wildlings are moving south, fleeing a massacre on the coast of Hardhome. No one with the blood of the dragon has ever heard of them running like this.\n\nThey speak of being trapped against the sea by an enemy that does not tire and cannot be reasoned with. It is a terrifying thought.\n\n#bold The Others have returned. We will see if they burn.#!#!"
 ln_opening.3.desc.red:0 "#e The wildlings run south, fleeing a horrific slaughter where they were cornered against the sea at Hardhome. The Great Other's army swells with every fallen soul.\n\nThey are running toward a realm that despises them, begging for salvation. My priests call it the ultimate conversion.\n\n#bold The dead take everyone. We must rally the living.#!#!"
 ln_opening.3.desc.lord:0 "#e Ravens from the North report an unprecedented crisis at the Wall. Thousands of wildling refugees are begging to be let through the gates.\n\nThe reports say they are terrified, claiming they were cornered on a frozen peninsula called Hardhome and slaughtered against the freezing sea. Most of the realm will ignore wildlings dying beyond the Wall, but I worry about the sheer panic spreading across the continent.\n\n#bold Something terrible has woken in the deep north.#!#!"
 ln_opening.3.desc.nobody:0 "#e I hear wild stories from merchants and wandering septons. They say thousands of wildlings are begging at the Wall, fleeing a horrific slaughter deep in the frozen north.\n\nPeople do not abandon their homes and walk that far for a ghost story. If the wildlings are terrified enough to beg the kneelers for mercy, we are all doomed.\n\n#bold The Long Night has begun.#!#!"
 ln_opening.4.desc.free_folk:0 "#e The crows finally went deep enough into the woods to see what we are running from.\n\nTheir great ranging was swallowed by the cold in the Frostfangs. The kneelers have finally seen the sheer size of the horde, and now they know their wall of ice will not be enough.\n\n#bold The dead are marching. No one is safe.#!#!"
 ln_opening.4.desc.north:0 "#e A raven bearing a black seal arrives from the Wall. The Watch's great ranging has been slaughtered deep in the Frostfangs.\n\nThe survivors claim to have seen a host of wights numbering in the hundreds of thousands, marching south through the haunted woods. The nightmare we have prepared for since the dawn of our House is no longer sleeping.\n\n#bold The Others have returned. Call the banners.#!#!"
 ln_opening.4.desc.dragon:0 "#e Word arrives from the North that a great ranging of Black Brothers found a colossal army of walking corpses deep in the Frostfangs.\n\nThey claim there are hundreds of thousands of them, a nightmare made flesh marching slowly through the snow. The hour of ice and fire is finally here.\n\n#bold The Great Other has revealed his host. It is time to rain fire upon them.#!#!"
 ln_opening.4.desc.lord:0 "#e The Citadel forwards a panicked missive from the Wall. A ranging party sent deep into the uncharted north has been all but wiped out.\n\nThe survivors claim to have seen an army of a hundred thousand corpses marching through the snow. My maester is trembling as he reads it. If even a fraction of this report is true, the realm is facing extinction.\n\n#bold The myths are real, and they are marching south.#!#!"
 ln_opening.4.desc.nobody:0 "#e The realm is gripped by a terrifying rumor. They say the Black Brothers went deep into the haunted woods and woke something ancient.\n\nTravelers are weeping in the taverns, claiming a ranging found a hundred thousand corpses marching through the deep snow. \n\n#bold The Long Night has begun. May the Gods help us all.#!#!"
 ln_opening.5.desc.watch:0 "#e We have been sending that exact report south for a hundred years. It took sending a brother to drag a moving corpse into the capital to finally make them listen.\n\n#bold The realm sees the truth. Now they must fight.#!#!"
 ln_opening.5.desc.free_folk:0 "#e The kneelers needed a crow to bring a walking corpse into their fancy king's hall before they would finally believe us.\n\n#bold The dead do not care about thrones.#!#!"
 ln_opening.5.desc.north:0 "#e The Night's Watch has done the impossible. They hauled the proof south themselves.\n\nThe capital watched the dead rise with their own eyes when a Black Brother presented a wight to the Iron Throne. The snickering at our 'old nurses tales' has permanently ended.\n\n#bold The Others have returned. The North was right all along.#!#!"
 ln_opening.5.desc.dragon:0 "#e Word arrives from the capital that a brother of the Night's Watch brought a dead man to the court. \n\nThe realm watched fire finally kill the monster when the King's steel failed. Fools might call it a mummer's trick, but we ride dragons for crying out loud. I know exactly what this means. Magic is real, and the magic of Ice has risen to meet the magic of Fire.\n\n#bold The Long Night is here. Let them burn.#!#!"
 ln_opening.5.desc.red:0 "#e We have received word from the red priests in the capital. A Black Brother dragged a walking corpse before the Iron Throne.\n\nThe Crown's steel failed to kill the monster, and they were forced to use fire to cleanse the rot. My priests feel entirely vindicated, though there is no joy in it. The Lord of Light's truth is undeniable, and only His fire can banish this dark.\n\n#bold The Great Other is real. The War for the Dawn is nearing.#!#!"
 ln_opening.5.desc.lord:0 "#e My maester broke the seal on a raven from the capital this morning. His voice shook as he read the impossible words aloud.\n\nA brother of the Night's Watch presented a wight to the Crown itself. The letter details how the King's own headsman struck the creature, only for its severed hand to continue moving on the floor until it was finally burned to ash. The Citadel cannot dismiss an event witnessed by the entire court.\n\n#bold The Long Night has begun. The old myths were true.#!#!"
 ln_opening.5.desc.nobody:0 "#e Word is spreading like a plague from the capital. They say the Black Brothers dragged a monster in chains before the King.\n\nIf the King's own guards were afraid, what hope do the rest of us have?\n\n#bold I believed it a season ago. Now everyone else does.#!#!"
