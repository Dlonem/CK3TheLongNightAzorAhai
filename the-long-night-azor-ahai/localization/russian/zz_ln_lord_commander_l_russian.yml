l_russian:

 # AGOT: The Long Night & Azor Ahai -- the Lord Commander's war.

 ln_call_the_great_ranging_decision:0 "Созвать великий поход"
 ln_call_the_great_ranging_decision_desc:0 "Донесения у вас на столе не сходятся друг с другом, а тех, кто их писал, не спросить, чтобы свести их воедино.\n\nДозор всегда решал, что на самом деле лежит на севере, одним-единственным способом, и стоил он всегда одной и той же монеты: братья, числом, идут дальше того места, откуда все поворачивают назад, с приказом взглянуть на само это — и вернуться домой.\n\nПоследнего лорда-командующего, созвавшего такой поход, за это и помнят. Что не то же самое, что сказать, будто всё прошло хорошо."
 ln_call_the_great_ranging_decision_tt:0 "Отправить великий поход за Стену, чтобы узнать, что идёт.\n\n#weak Он возвращается с вестью, или не возвращается, или — хуже всего — возвращается молча. Что он узнает, то Дозор себе и оставит.#!"
 ln_call_the_great_ranging_decision_confirm:0 "Протрубить в рог один раз"

 ln_lc.1.t:0 "Великий поход выступает"
 ln_lc.1.desc:0 "Они выходят за ворота до первого света — потому что вы им так велели и потому что никому из них не хотелось делать это на глазах у всего замка.\n\nДвести братьев, с припасом на сезон, на лучших конях, какие у Дозора остались. Старший из них ходил туда одиннадцать раз и нынче утром не сказал вообще ничего, что вы заметили. Младшему девятнадцать, и он не мог перестать говорить, что вы тоже заметили.\n\nВорота опускаются за ними со звуком, похожим на приговор. Теперь Дозор делает то, чего он всегда делал больше, чем воевал.\n\nОн ждёт."
 ln_lc.1.a:0 "Принесите мне весть. Какой бы она ни была."
 ln_lc.1.b:0 "Вы поведёте его сами. Дозор идёт за плащом, а не за вороном."

 ln_lc.2.t:0 "Весть с севера"
 ln_lc.2.desc:0 "Они вернулись худее, тише и на четырёх лошадей меньше, и старший из уцелевших разведчиков стоял в вашей горнице и излагал донесение, как человек, кладущий камни по одному.\n\nРасстояния. Названия долин, в которых больше никто не живёт. От чего бежит вольный народ — словами того вольного народа, который это сказал. Где холод лежит неправильно и насколько южнее эта неправильность подошла с тех пор, как старший в отряде видел её в последний раз.\n\nЭто первый за восемь тысяч лет документ в записях Дозора, который обращается с врагом как с вопросом снабжения. Вы прочли его четырежды.\n\nЦитадель умеет спорить со сказками. С расстояниями она спорить не умеет."
 ln_lc.2.a:0 "Переписать. По одному в каждый замок. И в Винтерфелл тоже."

 ln_lc.3.t:0 "Поход потерян"
 ln_lc.3.desc:0 "Всё решают лошади.\n\nБратья могут задержаться. Братья могут перезимовать, потерять след, засесть в одичалой деревне и прийти домой по весне с историей. Но одиннадцать лошадей вернулись сами, в течение недель, по одной и по две — без седоков, полуголодные и не желавшие стоять в стойле мордой на север.\n\nДвести человек. Вы подписали приказ и сами пересчитали их за воротами.\n\nПисарь оставил книгу открытой у вас на столе, потому что кто-то должен внести запись, а обычай Дозора говорит, что это вы."
 ln_lc.3.a:0 "Двести имён. Я напишу каждое."

 ln_lc.4.t:0 "Они вернулись молча"
 ln_lc.4.desc:0 "Дозорный на воротах увидел их в сумерках: тридцать братьев, идут, в добром порядке, — и он уже на половине радостного крика понял, что с этим не так.\n\nНет дыхания. Тридцать человек идут в холоде, и ни одного облачка пара над ними.\n\nВорота остались опущены. Горящие стрелы сделали то, что делает огонь. А утром земля перед Стеной была усеяна людьми, которых вы знали, — людьми, которых вы ПОСЛАЛИ, — с чёрными плащами, заскорузлыми под инеем, и глазами цвета звезды, увиденной сквозь лёд.\n\nОдин из кухонных мальчишек не остался за стеной щитов, и в полдень Дозор похоронил то, что от него осталось. Остальное из случившегося прошлой ночью похоронить нельзя, потому что оно поднялось."
 ln_lc.4.a:0 "Сжечь плащи. Сжечь всё."

 ln_opening.10.t:0 "Вы это уже видели"
 ln_opening.10.desc:0 "Всадники привозят те же слова, что привозили в прошлый раз, и вокруг вас чертог разваливается в том же порядке, в каком развалился тогда: сперва те, кто кричит, потом те, кто молится, потом те, кто просто садится.\n\nИ вы замечаете, что стоите совершенно неподвижно.\n\nВы там были. Вы стояли в снегу, в первом ряду мира, когда мёртвые шли вперёд, и вы видели, как ломается тьма, — не в песне, не в мейстерской истории с перевранным вашим именем, а прямо перед собой, через плечи людей, чьи лица вы до сих пор помните.\n\nЭто знает каждый в этом чертоге. Потому они один за другим и умолкают и поворачиваются посмотреть на вас."
 ln_opening.10.a:0 "Я знаю, чем это кончается. Подайте мне мой меч."

 ln_ranging_still_out:0 "Последний поход ещё не вернулся. Я не пошлю за ними новых людей, пока не узнаю."
 ln_send_out_the_crows_decision:0 "Отправить брата на вербовку"
 ln_send_out_the_crows_decision_desc:0 "У Дозора есть один способ набора, который работает уже восемь тысяч лет, и это не письма.\n\nЭто человек. Один брат, чьи лучшие походные годы позади, с добрым конём, чёрным плащом и полным отсутствием спешки, едущий от Последнего Очага до Простора, — и у каждого чертога он задаёт лорду один и тот же вопрос: насколько полны ваши подземелья и что вы собирались с ними делать?\n\nЧёрному плащу у ворот никто не рад. Кормят его все. И счёт Стены растёт ровно на то, что держава собиралась повесить."
 ln_send_out_the_crows_decision_tt:0 "Отправить присягнувшего брата из вашего двора на юг через державу.\n\n#weak Каждого герцога и выше с полным подземельем попросят опорожнить его в Дозор. Некоторые опорожнят. Визиты придут в течение месяцев, как позволят дороги.#!"
 ln_send_out_the_crows_decision_confirm:0 "Дать ему коня и список"
 ln_crows_need_a_brother_to_send:0 "При вашем дворе нужен присягнувший брат, годный ехать на юг"
 ln_send_out_the_crows_effect_tt:0 "Брат вашего двора едет на юг. Каждый герцог и выше в Семи Королевствах, у кого #V 3#! или более пленников, примет его в ближайшие месяцы."

 ln_lc.10.t:0 "Чёрный брат у ворот"
 ln_lc.10.desc:0 "[ln_wandering_crow.GetTitledFirstName] в дороге уже так долго, что чёрное по подолу вылиняло в серое, и церемоний он не разводит.\n\nОн ест то, что подаёт ему ваш чертог, благодарит подавальщика по имени, а потом задаёт вам вопрос, который задавал у каждых ворот отсюда до Стены: насколько полны ваши подземелья, милорд, и что вы собирались делать с людьми, которые в них сидят?\n\n«Верёвка быстра, — говорит он тоном человека, соглашающегося с доводом, которого вы ещё не привели. — Стена — нет. Но Стена — это девятнадцать замков, которые держат восемьсот человек, а зима ближе не становится. Тот, кто здесь умрёт ни за что, там может замёрзнуть за что-то».\n\nОн не просит. Он занимается этим слишком долго, чтобы просить. Он просто ждёт — и ждать он умеет дольше, чем вы."
 ln_lc.10.a:0 "Забирайте. Всех безземельных, кто сидит в моих клетях."
 ln_lc.10.b:0 "Монету для Стены. Мои узники — моё дело."
 ln_lc.10.c:0 "Стена не получит от меня ничего. Доброй вам дороги."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_lc.2.desc.led:0 "Донесения принимать не от кого. Вы сами были там каждую милю, и в вашей горнице вас ждёт только карта с прижатыми углами и старший из уцелевших разведчиков, который пишет с Восточного Дозора и не спал с Молочной.\n\nРасстояния. Названия долин, в которых больше никто не живёт. От чего бежит вольный народ — словами того вольного народа, который это сказал, — а вы стояли достаточно близко, чтобы чуять на них дым, когда они это говорили.\n\nВнизу, под его именем, вы ставите своё. Вот чего Цитадель обойти не сумеет. Это первый за восемь тысяч лет документ в записях Дозора, который обращается с врагом как с вопросом снабжения, — и человек, его подписавший, сам поехал и пересчитал эти мили.\n\nЦитадель умеет спорить со сказками. С лордом-командующим, который там был, она спорить не умеет."
 ln_lc.3.desc.led:0 "Вы вернулись с девятнадцатью.\n\nВы не помните, как отдали приказ поворачивать. Вы помните, как на четвёртый день за Молочной свет лёг неправильно, и как где-то позади закричала лошадь в темноте, пришедшей на четыре часа раньше срока, а потом очень много бега, который к тому времени, как рассказ дойдёт до Винтерфелла, назовут отходом с боем.\n\nЕщё одиннадцать лошадей пришли домой сами в следующие недели, по одной и по две — без седоков, полуголодные и не желавшие стоять в стойле мордой на север. Ни одна из них не привела с собой человека.\n\nВы подписали приказ. Вы сами пересчитали их за воротами. Вы шли во главе — то самое, для чего, как вы сказали всему замку, и нужен лорд-командующий.\n\nПисарь оставил книгу открытой у вас на столе, потому что кто-то должен внести запись, а обычай Дозора говорит, что это вы. Обычай не говорит, что писать, когда имя в начале списка ещё дышит."
 ln_lc.3.a.led:0 "Сто восемьдесят одно имя. Я напишу каждое сам."
 ln_lc.4.desc.led:0 "Вы опередили их на три дня и каждый час с тех пор пытаетесь решить, что же вы на самом деле видели на льду.\n\nА потом дозорный на воротах кричит вниз в сумерках: тридцать братьев, идут, в добром порядке. Вы уже идёте к лестнице, не дослушав, потому что вы оставили на том льду тридцать человек и точно знаете, как они лежали, когда вы их оставили.\n\nНет дыхания. Тридцать человек идут в холоде, и ни одного облачка пара над ними.\n\nВорота остались опущены. Горящие стрелы сделали то, что делает огонь. А утром земля перед Стеной была усеяна людьми, которых вы знали, — людьми, которых вы ВЕЛИ, — с чёрными плащами, заскорузлыми под инеем, и глазами цвета звезды, увиденной сквозь лёд.\n\nОдин из кухонных мальчишек не остался за стеной щитов. В полдень Дозор похоронил то, что от него осталось. Остальное из случившегося прошлой ночью похоронить нельзя, потому что оно поднялось."
 ln_ranging_men_need_rest:0 "Поход вернулся, и тем, кто пришёл назад, нужен отдых. Снарядить новый Дозор пока не может."
 ln_crows_are_still_on_the_road:0 "Брат, которого я послал в прошлый раз, ещё в дороге. Людей, которых Дозор может отрядить на сбор подаяния, не так много."
 ln_lc.10.desc.north:0 "Странствующему брату в этом чертоге объясняться не надо. Ваш дед давал людей Дозору, и его дед, и всякий присягнувший Старкам лорд дальше всякого счёта. В клетях сидит то, что в них сидит; Стене нужно то, что ей было нужно всегда; эта арифметика старше вашего имени.\n\nОн просит тихо, как просят северяне, и ждёт. Вы оба уже знаете, что лорд Севера отвечает на просьбу Дозора."
