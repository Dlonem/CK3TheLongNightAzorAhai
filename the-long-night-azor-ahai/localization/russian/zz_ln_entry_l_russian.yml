l_russian:

 # AGOT: The Long Night & Azor Ahai -- the orientation card.

 ln_prophecy.30.t:0 "Об этом говорят уже некоторое время"
 ln_prophecy.30.desc_open:0 "[ln_the_seer.GetTitledFirstName] кружил вокруг этого неделями и наконец сказал прямо — ровным, лишённым смущения тоном человека, решившего, что смущение здесь не главное.\n\n"
 ln_prophecy.30.desc_favored:0 "«О вас кое-что говорят. Не в лицо. Это старое пророчество — то самое, о принце, который был обещан, о человеке, рождённом заново среди соли и дыма, чтобы пробудить драконов из камня и покончить с долгой ночью прежде, чем она начнётся».\n\n«Это говорят о ком-нибудь в каждом поколении. И каждый раз ошибались».\n\n"
 ln_prophecy.30.desc_chosen:0 "«О вас кое-что говорят, и уже довольно давно это перестало быть шёпотом. Принц, который был обещан. Азор Ахай, вернувшийся вновь».\n\n«Поймите, что это значит на деле. Придут жрецы. Люди, которые в это верят, пойдут за вами дальше, чем позволяет здравый смысл. А где-то есть второй человек, которому говорят то же самое, и кто-то уже подсчитывает, как это противоречие разрешить».\n\n"
 ln_prophecy.30.desc_risen:0 "«Вы умерли. Хочу быть ясным: я говорю не поэтически. Ваше сердце остановилось, тело остыло, а потом всё это не осталось таким, как было, — и каждый, кто был в той комнате, с тех пор рассказывает это с одним и тем же лицом».\n\n«У Красной веры есть слово для того, чем вы стали, и я пока не стану произносить его при вас. Но знайте: люди начнут его употреблять, и не все — по-доброму».\n\n"
 ln_prophecy.30.desc_azor:0 "«Вы и сами знаете. Вы там были. Но истории понадобится, чтобы кто-то произнёс это вслух, в комнате, при свидетелях. Итак: Азор Ахай, вернувшийся вновь, принц, который был обещан, и человек, положивший этому конец».\n\n«Мне нечему вас учить. Я проделал очень долгий путь, чтобы встать здесь и убедиться, — и я убедился».\n\n"
 ln_prophecy.30.desc_close:0 "«Сегодня ничего с этим делать не нужно. Но это будет повторяться, и звучать всё громче, и однажды явится тот, кому от этого что-то понадобится. Лучше вы услышали это от меня, сидя»."
 ln_prophecy.30.a:0 "Я знаю, что говорят. Скажите всё равно."
 ln_prophecy.30.b:0 "Я об этом не просил и мне это не нужно."
