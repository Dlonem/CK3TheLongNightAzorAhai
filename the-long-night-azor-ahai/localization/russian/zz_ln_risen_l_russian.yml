l_russian:

 # AGOT: The Long Night & Azor Ahai -- the Resurrected chain.

 ln_risen.1.t:0 "Что вы помните"
 ln_risen.1.desc:0 "Спрашивает мальчишка септона, потому что ему девять и ему не сказали, что нельзя.\n\n«А как это было?»\n\nВ чертоге делается так тихо, что слышно огонь. Всякий здесь хотел спросить это месяцами, и ни у кого не хватало духу, а теперь это сделал ребёнок.\n\nЧестная сложность в том, что вы не знаете, какой ответ верен. Иными утрами там нет ничего — дверь закрылась, дверь открылась, и никакого коридора между ними. Другими утрами вы просыпаетесь с ноющей челюстью и твёрдым знанием, что там что-то было, что оно вас сознавало и что ему не было до вас ни малейшего дела."
 ln_risen.1.a:0 "Ничего, малец. Там не было вообще ничего."
 ln_risen.1.b:0 "Там что-то было. И описывать это при ребёнке я не стану."

 ln_risen.2.t:0 "Вкус вещей"
 ln_risen.2.desc:0 "Ваш повар бьётся уже месяц и начал принимать это на свой счёт.\n\nОн приготовил вам пирог с миногами, который вы просили на собственной свадьбе. Нынче утром он вышел из кухни посмотреть, как вы едите, замотав руки в передник, а вы жевали, глотали и сказали ему, что очень хорошо.\n\nЭто было как есть тёплую ткань. Всё такое. Хлеб, вино, мёд, дым от огня — вы можете определить, что они есть, так же, как определяют, что в комнате холодно: как сведение, на расстоянии. Что-то, лежащее глубже, перестало трудиться приходить к столу."
 ln_risen.2.a:0 "Съесть. Похвалить. Ему знать незачем."
 ln_risen.2.b:0 "Отодвинуть тарелку. Притворяться я закончил."

 ln_risen.3.t:0 "Она не может на вас смотреть"
 ln_risen.3.desc:0 "[ln_close.GetTitledFirstName] с тех пор ни разу не посмотрел на вас прямо.\n\nНи через стол, ни в темноте, ни в тот день, когда вы вернулись домой. [ln_close.GetSheHe|U] смотрит на ваши руки, на ваше плечо, на место чуть за вашим ухом — и при этом говорит с вами совершенно обыкновенно. С [ln_close.GetHerHis] глазами всё в порядке: вы видели [ln_close.GetHerHim] с другими людьми.\n\nПрошлой ночью [ln_close.GetSheHe] уснул раньше вас и повернулся к вам так, как [ln_close.GetSheHe] делал всегда, а потом проснулся, и вы почувствовали, как [ln_close.GetHerHim] всего сковало, прежде чем [ln_close.GetSheHe] заставил [ln_close.GetHerHimself] улечься. [ln_close.GetSheHe|U] думал, что вы спите."
 ln_risen.3.a:0 "Ничего не говорить. Не торопить [ln_close.GetHerHim] — сколько бы это ни заняло."
 ln_risen.3.b:0 "Поднять [ln_close.GetHerHis] подбородок. Заставить [ln_close.GetHerHim] сказать, что [ln_close.GetSheHe] видит."
 ln_risen.3.c:0 "Отослать [ln_close.GetHerHim] к [ln_close.GetHerHis] родне. На это [ln_close.GetSheHe] не соглашался."

 ln_risen.4.t:0 "Во что огонь обратил [ln_close.GetHerHim]"
 ln_risen.4.desc:0 "[ln_close.GetTitledFirstName] долго ничего не просит, и по этому вы и понимаете, что просьба будет.\n\nКогда она приходит, это не золото и не титул. [ln_close.GetSheHe|U] хочет храм. Не великий — маленькое каменное строение с ночным костром внутри, со жрецом в нём после [ln_close.GetHerHim] и со жрецом после того. [ln_close.GetSheHe|U] давно уже присмотрел место.\n\n«Я не прошу вас верить, — говорит [ln_close.GetSheHe]. — Я прошу вас заметить, что вы живы, что вот чего это стоило и что следующему это будет стоить того же. Кто-то должен быть здесь, чтобы платить».\n\n[ln_close.GetSheHe|U] поседел с той ночи. Не постарел. Посерел — так, как серым делается уголь."
 ln_risen.4.a:0 "[ln_close.GetSheHe|U] получит [ln_close.GetHerHis] храм. До последнего камня."
 ln_risen.4.b:0 "[ln_close.GetSheHe|U] сделал это не ради меня. [ln_close.GetSheHe|U] сделал это ради [ln_close.GetHerHis] бога. Пусть этот бог и платит."

 ln_risen.5.t:0 "Женщина у ворот"
 ln_risen.5.desc:0 "Она стоит у ворот ещё с ночи, и ребёнка она принесла с собой.\n\nОн мёртв четыре дня. Она хорошо его укутала и совершенно спокойна, и именно это вас не отпустит. Она прошла одиннадцать миль, потому что на юг дошла весть, что лорд в этом замке умер и снова поднялся, — а если это можно сделать для лорда, то можно и для мальчика.\n\nНикому не хочется быть тем, кто её отсюда уведёт.\n\nОно работает не так. Чего вы не знаете — так это потому ли, что такова она, или потому, что таковы вы."
 ln_risen.5.a:0 "Спуститься самому и сказать ей правду."
 ln_risen.5.b:0 "Послать за жрецом. Пусть попробует, при ней."
 ln_risen.5.c:0 "Не спускаться. Управляющий разберётся."

 ln_risen.6.t:0 "Она не затягивается"
 ln_risen.6.desc:0 "Вы зацепили предплечье о гвоздь в конюшне на второй неделе весны. Это едва царапина — из тех, что мальчишка получает дважды за лето и больше о них не думает.\n\nСейчас четвёртая неделя осени, и она не затянулась.\n\nОна не воспалена. Она не болит. В ней нет жара, нет опухоли, ничего, чему мейстер дал бы имя. Она ровно настолько же открыта, как в тот день, когда появилась, с чистыми краями, — будто срастаться было тем, что ваше тело когда-то умело и тихо перестало видеть в этом смысл.\n\nВы начали носить наруч и в доме."
 ln_risen.6.a:0 "Перевязать. Носить наруч. Знать об этом никому не нужно."
 ln_risen.6.b:0 "Показать мейстеру. Пусть запишет, что видит."

 ln_risen.7.t:0 "Мерзость"
 ln_risen.7.desc:0 "Это не чужак и не толпа. Это [ln_close.GetTitledFirstName], который годами ел за вашим столом, и [ln_close.GetSheHe] пришёл сказать это вам в лицо.\n\n«Отец судит, — говорит [ln_close.GetSheHe]. — [ln_close.GetSheHe|U] осудил вас. А потом чужой жрец полез в этот суд и вынул вас обратно, и никто не спросил, чем за это положено платить». [ln_close.GetSheHe|U] испуган — и всё равно это делает. «Умершие остаются мёртвыми. Это не жестокость, это устройство мира, а вы стоите вне его, и я обязан это сказать, иначе я вовсе не септон».\n\nЧертог вокруг вас двоих опустел так, как пустеет улица перед дракой."
 ln_risen.7.a:0 "Выслушать [ln_close.GetHerHim]. И пусть [ln_close.GetHerHim] никто не остановит, когда он скажет это в септе."
 ln_risen.7.b:0 "[ln_close.GetSheHe|U] не скажет этого дважды."
 ln_risen.7.c:0 "Садитесь, септон. Скажите мне в точности, чем вы меня считаете."

 ln_risen.8.t:0 "Немного меньше"
 ln_risen.8.desc:0 "Вы не можете вспомнить голос своей матери.\n\nВы помните, что он у неё был и что ещё в прошлом году вы могли вызвать его целиком и на миг снова стать ребёнком.\n\nЕго нет. Не поблёк. Нет — так, как нет слова, с чистым краем там, где он был.\n\nИ вы начали замечать, чего ещё не хватает. Не важного — тёплого. Клички лошади, которая была у вас в двенадцать. То, что вернулось из того огня, сохранило бой, арифметику и обиды и с тех пор тихо откладывает всё остальное."
 ln_risen.8.a:0 "Послать за пергаментом. Записать всё, пока не ушло."
 ln_risen.8.b:0 "Пусть уходит. То, что от меня осталось, ещё держит меч."

 ln_risen.9.t:0 "Проверка"
 ln_risen.9.desc:0 "Он межевой рыцарь, и он даже не пьян.\n\nОн дожидается, пока чертог наполнится, проходит его насквозь и всаживает вам нож в бок под рёбра — не смертельным ударом, а осторожным, каким бьёт человек, подумавший об угле. Потом он отступает с открытыми ладонями и смотрит, как ваша стража валит его наземь.\n\n«Мне надо было знать, — говорит он вполне рассудительно, с сапогом на шее. — Все это говорят, а никто не видел. Теперь видели».\n\nОн прав. Двести человек только что это видели, и каждый в этой комнате нынче вечером опишет это жене по-своему."
 ln_risen.9.a:0 "Повесить его во дворе. Сейчас же, у всех на виду."
 ln_risen.9.b:0 "Отпустить его. Сегодня он узнал больше, чем я."

 ln_risen.10.t:0 "Сделали бы вы это снова"
 ln_risen.10.desc.open:0 "Вопрос приходит с самой неожиданной стороны: от вашего собственного мейстера, за игрой, которую он проигрывает, ни с того ни с сего.\n\n«Если бы это предложили снова, — говорит он, скверно передвигая фигуру, — зная то, что вы знаете теперь. Вы бы взяли?»\n\n"
 ln_risen.10.desc.less:0 "И вы обнаруживаете, что не можете ответить быстро, потому что для ответа надо чего-то хотеть, а хотение — одна из тех частей, которые вы отложили."
 ln_risen.10.desc.pages:0 "В вашей горнице сорок страниц вашей собственной рукой, писанных так, чтобы человек, который тихо пустеет, мог сверить себя нынешнего с записью. Вы давно их не открывали. Вы не уверены, что узнали бы человека, который в них."
 ln_risen.10.desc.nothing:0 "И честная сложность всё та же: там ничего не было. Нечего бояться и не на что надеяться. От чего бы вас ни спасли, ни от чего вас не спасали."
 ln_risen.10.desc.plain:0 "И вы замечаете, что рассматриваете это как дело житейское — издержки, выгода, что кому причитается, — а не как ту огромную вещь, какой оно является."
 ln_risen.10.desc.close:0 "\n\nМейстер ждёт. Он очень стар, он задал за доской очень многим людям очень много бестактных вопросов и ни разу не отвёл глаз от ответа."
 ln_risen.10.a:0 "Да. Не задумываясь ни на миг."
 ln_risen.10.b:0 "Нет. И никому, кого я любил, я бы этого сделать не позволил."

 # ── THE COUNTERWEIGHT ───────────────────────────────────────────────────────────────────────────────────────
 ln_risen.11.t:0 "Они пойдут за вами куда угодно"
 ln_risen.11.desc.open:0 "Ваш маршал пришёл что-то сказать и скверно справляется с началом.\n\nВ конце концов он добирается. Вот что: люди где-то за последний год перестали вас бояться, и никто этого не решал. А то, что пришло на смену, — не покой. Это нечто заметно более полезное.\n\n"
 ln_risen.11.desc.spared:0 "«Всё дело в межевом рыцаре, — говорит он. — В том, который всадил в вас нож и вышел отсюда живым. Половина думала, что вы его повесите, другая половина — что сделаете кое-что похуже, а вы не сделали ни того ни другого, и с тех пор они об этом не умолкают»."
 ln_risen.11.desc.truth:0 "«Всё дело в женщине у ворот, — говорит он. — Вы спустились туда сами. Вы сказали ей «нет» в лицо, с ребёнком у неё на руках, и не послали управляющего сделать это за вас. Об этом в замке знал каждый ещё до ужина»."
 ln_risen.11.desc.pages:0 "«Парни забрали себе в голову, что вы ведёте записи, — говорит он немного неловко. — Что вы всё записываете, потому что боитесь это потерять. И они находят это... не знаю слова, милорд. Это их успокаивает. То, что вы чего-то боитесь»."
 ln_risen.11.desc.plain:0 "«Они сообразили, что худшее, что может случиться с человеком, с вами уже случилось, — говорит он. — И что вы поднялись. И они решили, что если вы куда-то идёте, то это, наверное, можно пережить»."
 ln_risen.11.desc.close:0 "\n\nПотом он говорит то, ради чего пришёл, и говорит это глядя в пол:\n\n«На этой земле нет человека, который не пошёл бы с вами на север. Не потому, что они храбрые. Потому, что вы там уже были, и вернулись, и они думают, что вы знаете дорогу»."
 ln_risen.11.a:0 "Тогда мне лучше стоить того, чтобы за мной шли."
 ln_risen.11.b:0 "Им следует идти за живым человеком. Я им такого найду."

 ln_death_holds_no_terror_modifier:0 "Смерть не страшит"
 ln_death_holds_no_terror_modifier_desc:0 "Худшее, что может случиться с человеком, с этим уже случилось, при свидетелях, и он поднялся. Угрожать ему на редкость трудно, и его личная стража это заметила."

 ln_risen.12.t:0 "Огонь, который остался"
 ln_risen.12.desc:0 "Впервые вы заметили это на учебном дворе, когда меч, которым вы махали десять тысяч раз, взлетел как ивовый прут.\n\nПотом остальное. Холод вас не находит. Раны, которым положено ныть по утрам, не подают голоса вовсе. Где-то за рёбрами есть жар, какого не давала ни одна лихорадка, притушенный и терпеливый, как горн ночью, — что бы в вас ни влили обратно, когда жрец произнёс слова, сосуд вернулся, вмещая больше прежнего.\n\nИ вместе с этим пришло кое-что ещё — вернее, кое-что не пришло. Вчера во дворе человек попал под телегу, и все вокруг вас вздрогнули от звука.\n\nВы смотрели. Это было любопытно."
 ln_risen.12.a:0 "Тогда пусть горит."
 ln_risen.12.b:0 "Никому не говорить."

 ln_fire_in_the_blood_modifier:0 "Огонь в крови"
 ln_fire_in_the_blood_modifier_desc:0 "Огонь кое-что оставил себе, когда в прошлый раз возвращал его обратно, — и добавил силу, которой прежде не было, и неподвижность там, где раньше было вздрагивание."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_risen.10.desc:0 "Мой мейстер ждал с этим вопросом долго и задаёт его с тем бесящим спокойствием учёного, который всю жизнь задавал неприличные вопросы и ни разу не дрогнул от ответа.\n\n«Что вы видели? — спрашивает он, не поднимая глаз от пергамента. — Когда вы отошли. Я спрашиваю не ради септонов. Я спрашиваю ради себя».\n\nЯ смотрю на него. Я мог бы рассказать ему о холоде или об ужасающем безразличии тьмы. Но жестокая правда та же, которую я скрыл от всех: там не было ничего. Ничего, чего стоило бы бояться, и ничего, на что стоило бы надеяться.\n\nОт чего бы меня ни спасли, меня не спасли ни от чего. И я замечаю с холодной отстранённостью, что оцениваю это отсутствие загробной жизни чисто как дело практическое — цена, выгода, что кому причитается, — а не как то огромное, ломающее мир откровение, каким оно является."
 ln_risen.11.desc:0 "Мой маршал просит поговорить со мной наедине в оружейной.\n\n«Люди перестали вас бояться, — говорит он, опираясь на стойку с оружием. — Сперва они были в ужасе. А теперь? Они видят, как вы принимаете во дворе удар, который раскроил бы человеку череп, и вы даже не мигаете. На этой земле нет человека, который не пошёл бы с вами на север, прямо в самую пасть преисподней».\n\nОн смотрит на меня, и в его глазах теперь тёмный, не знающий сомнений фанатизм. «Потому что они думают, что смерть не может вас коснуться. И думают, что вы знаете дорогу назад»."
 ln_risen.1.d:0 "Там был коридор, малец. Я хожу по нему с твоих лет."
 ln_risen.10.desc.corridor:0 "Я сказал правду девятилетнему мальчишке, потому что спросил только он, и я ни разу от этого не отступился.\n\nТам был коридор. Я хожу по нему с тех пор, как сам был мальчишкой, — так, как ходят зрящие: вбок, не по порядку и никогда тогда, когда хочется. Умереть означало лишь пройти по нему наяву.\n\nТеперь мальчишка септона рассказывает это другим детям, и слегка переврёт, и я ему не мешаю. В его версии есть конец."
