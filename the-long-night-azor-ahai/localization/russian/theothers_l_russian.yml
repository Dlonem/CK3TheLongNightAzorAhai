 # ── THE OTHERS' DRAGON ──────────────────────────────────────────────────────────────────────────────────────
 setting_agot_long_night_dragon_raise:0 "Поднимают убитых ими #EMP (по умолчанию)#!"
 setting_agot_long_night_dragon_raise_desc:0 "#EMP Иным не дают ничего.#! Дракон достаётся им, только если они собьют его сами, — а пока не сумеют, у них его нет.\n\nОн возвращается самим собой: то же имя, то же обличье, неверный цвет. Дракон, который был мёртв уже очень давно, когда его подняли, — один из великих зверей прошлого, — возвращается изменённым, потому что от его обличья не осталось ничего, что можно было бы повторить."
 # ── THE UNDEAD DRAGON ───────────────────────────────────────────────────────────────────────────────────────
 nick_the_undead:0 "Немёртвый"
 trait_ln_undead_dragon:0 "Восставший"
 trait_ln_undead_dragon_desc:0 "Умер однажды, в войне за рассвет, и был поднят снова. Он подчиняется тому, кто его убил."

 # 1.0.8 -- war_for_the_dawn_cb's on_white_peace_desc and on_invalidated_desc pointed at these two keys and
 # NOTHING DEFINED THEM, so either outcome printed the raw key to the player. Pre-existing; found by the
 # loc-key audit. The key NAMES are inherited leftovers from the Great Ranging and are left alone on purpose
 # -- renaming them means editing the CB file to fix a string, and the CB file is not worth the risk.
 great_ranging_white_peace_desc:0 "Война кончается, не кончившись. Условий не заключают, потому что заключать их не с кем — воинство просто перестаёт приходить, и те, кто остался, опускают щиты и ждут, значит ли это хоть что-нибудь.\n\nНе значит. Мёртвые не разбиты. Они просто в другом месте."
 great_ranging_invalidated_desc:0 "Война окончена, потому что исчезла её причина. То, ради чего созвали эти знамёна, больше не стоит, а войне нужно быть о чём-то.\n\nРога трубят отход. Милость это или лишь передышка — здесь никто ответить не может."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_wfd_no_recent_victory:0 "The Others must not be savoring a recent victory — unless the War for the Dawn is already being fought, in which case you may still join it."
 SCOURING_CB:0 "Scouring"
 ln_wfd_already_at_war:0 "You are already at war — though if the War for the Dawn is being fought, you may still march to it."
 ln_wfd_never_been_beaten:0 "No one has yet thrown the dead back. Until an army of the living has beaten them in the field, there is no war to march to — only a winter that has not been argued with."
