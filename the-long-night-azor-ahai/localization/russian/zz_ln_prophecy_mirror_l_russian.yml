l_russian:

 ln_read_the_signs_decision_desc:0 "Сесть с тем, что известно о собственной жизни, и честно это сосчитать."
 ln_read_the_signs_decision_tt:0 "Посмотреть на знаки на своей жизни."
 ln_read_the_signs_decision_confirm:0 "Сосчитать их."

 ln_prophecy.10.t:0 "Знаки на вашей жизни"
 ln_prophecy.10.desc.intro:0 "Отложите на минуту то, чему вам хотелось бы быть правдой.\n"

 ln_prophecy.10.desc.is_chosen:0 "#EMP Вас нарекли обещанным принцем.#! Не тихо и не одним человеком. Верно ли было это наречение — вопрос, на который никто из живых ответить не может.\n"
 ln_prophecy.10.desc.is_favored:0 "#EMP Вас назвали отмеченным.#! Кто-то, кто читает пламя, или деревья, или внутренности, произнёс ваше имя вслух, и другие это слышали.\n"
 ln_prophecy.10.desc.refused:0 "#EMP Вы отвергли это имя#! при свидетелях, и с тех пор никто его не поднимал. Знаки от этого никуда не делись.\n"
 ln_prophecy.10.desc.unnamed:0 "Вам никто ничего не говорил. И всё же в вашей жизни есть то, что трудно отнести к совпадениям.\n"

 ln_prophecy.10.deed.dreams:0 "\n#EMP Сны, приходящие как память.#! Вы знали то, чего знать не могли, и рано выучились об этом не упоминать."
 ln_prophecy.10.deed.green:0 "\n#EMP Вы видите сквозь чардрева.#! В вас течёт старая кровь, что бы ваш мейстер об этой мысли ни думал."
 ln_prophecy.10.deed.salt:0 "\n#EMP Рождён среди соли и дыма.#! Солёная вода в пределах слышимости от родильной комнаты — и драконы, ещё живые в мире тем утром."
 ln_prophecy.10.deed.star:0 "\n#EMP Рождён под кровоточащей звездой.#! Вы пришли в мир, который уже начал портиться, и другого никогда не знали."
 ln_prophecy.10.deed.survived:0 "\n#EMP Вы ушли живым от мёртвых.#! Не все, кто был с вами, ушли."
 ln_prophecy.10.deed.steel:0 "\n#EMP Вы носите сталь, выкованную с чарами.#! Клинок из фригольда, мёртвого четыреста лет, а таких в мире осталось, быть может, две сотни."
 ln_prophecy.10.deed.dragons:0 "\n#EMP Вы пробудили драконов из камня.#! Или это сделало что-то другое, а вы просто там стояли."
 ln_prophecy.10.deed.returned:0 "\n#EMP Вы умерли и мёртвым не остались.#! Вы не вполне готовы думать о том, что именно вернулось."

 ln_prophecy.10.desc.has_priest:0 "\n\nПод вашей крышей есть красный жрец. Если счёт когда-нибудь дойдёт до нужного, произнесёт это именно он."
 ln_prophecy.10.desc.has_seer:0 "\n\nПод вашей крышей есть тот, кто видит. Не красный жрец — на Севере их не водится, — но наречению всё равно, кто из них это сделает."
 ln_prophecy.10.desc.no_seer:0 "\n\n#EMP Рядом с вами нет никого, кто читает пламя, чардрева или что бы то ни было ещё.#! Во что бы ни складывались знаки, некому сосчитать их вслух, а пророчество, которого никто не произносит, — это просто череда совпадений, случающихся с одним человеком."

 ln_prophecy.10.a:0 "Отложить это. Есть дела."
 ln_prophecy.10.deed.blood:0 "\n#EMP Кровь, о которой никто не знает.#! Вы родились не с той стороны брака — и с той стороны чего-то более старого. Может ли это доказать кто-нибудь из живых — вопрос отдельный от того, правда ли это."

 # ── WHAT YOU DID ABOUT IT ───────────────────────────────────────────────────────────────────────────────────
 # One line per choice the mod has been quietly recording. Each is a character flag set by an event option;
 # until these existed nothing read them and CK3 said so, once per launch, per flag.
 ln_prophecy.10.did.quiet:0 "\n#weak Вы жреца не поправили — но и не согласились с ним.#!"
 ln_prophecy.10.did.kept:0 "\n#weak Вам сказали, кто вы. С тех пор вы этого не откладывали.#!"
 ln_prophecy.10.did.glass:0 "\n#weak Где-то в ваших владениях есть подвал, полный чёрного стекла, и люди, считающие вас безумцем.#!"
 ln_prophecy.10.did.sworn:0 "\n#weak Вы отдали свои мечи войне на Севере, в которую половина вашего двора не верит.#!"
 ln_prophecy.10.did.burned:0 "\n#weak Вы сожгли жреца Рглора. Он не кричал. Вы до сих пор об этом думаете.#!"
 ln_prophecy.10.did.wishes:0 "\n#weak Вы вернулись — и бывают утра, когда вы жалеете, что вернулись.#!"
 ln_prophecy.10.did.ended:0 "\n#weak Тьма сломалась — и сломалась, пока вы в ней стояли.#!"
 # ── WHAT READING THE SIGNS ACTUALLY DOES ────────────────────────────────────────────────────────────────────
 ln_read_the_signs_effect_marks:0 "Подвести счёт девяти знакам, о которых спорят старые тексты: #Y драконьи сны, зрение сквозь чардрева, рождение среди соли и дыма, кровоточащая звезда, выживание там, где полагалось погибнуть, валирийский меч, пробуждение драконов из камня, возвращение из мёртвых и кровь дракона, носимая без ведома#!."
 ln_read_the_signs_effect_many:0 "#P Их на вас очень много. Другие уже начали говорить об этом вслух.#!"
 ln_read_the_signs_effect_some:0 "#Y Их на вас несколько. Достаточно, чтобы мейстер это записал.#!"
 ln_read_the_signs_effect_few:0 "#weak Их на вас немного. У большинства людей нет ни одного.#!"
 ln_read_the_signs_effect_costs:0 "Вам покажут, какие знаки на вас есть, каких нет и что ещё зачлось бы. #weak Ничего не стоит и ничего не меняет — это зеркало, а не притязание.#!"
