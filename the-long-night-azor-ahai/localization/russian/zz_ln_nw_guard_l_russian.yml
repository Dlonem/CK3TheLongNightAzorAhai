l_russian:

 # AGOT: The Long Night & Azor Ahai -- 1.0.15, дозорный не наследует.

 ln_nwguard.1.t:0 "Дозор не принимает ничьей стороны"
 ln_nwguard.1.desc:0 "Ворон принёс титулы.\n\nПо всякому закону королевства земли теперь принадлежат [ROOT.Char.GetTitledFirstName|E] — где-то на юге смерть, пресёкшийся род, имя на бумаге, которое случайно оказалось именем того, кто надел чёрное. Мейстер прочёл это дважды, и в зале стало очень тихо.\n\nНо слова были сказаны у чардрева, и наследство их не отменяет: #bold не владеть землями, не носить корон, не искать славы#!. Земли отходят к [ln_nw_receiver.GetTitledFirstName|E], а Дозор стоит — беднее и горделивее прежнего.\n\n#bold Ночь собирается, и Дозор не принимает ничьей стороны.#!"
 ln_nwguard.1.a:0 "Моя вахта не окончена."
