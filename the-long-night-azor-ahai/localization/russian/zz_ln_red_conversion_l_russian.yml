l_russian:

 # Taking the red -- the seed, the deepening, the ask. See zz_ln_red_conversion_events.txt.
 ln_red.1.t:0 "Сомнение похолоднее"
 ln_red.1.desc.named:0 "Теперь по [ROOT.Char.GetHerHis] собственным чертогам за [ROOT.Char.GetHerHim] следует слово, произносимое ровно настолько тихо, чтобы можно было отпереться. Наречённый. Жрец чужого бога посмотрел на [ROOT.Char.GetHerHim] и произнёс имя восьмитысячелетней давности, и с тех пор [ROOT.Char.GetSheHe] делает то, чего [ROOT.Char.GetSheHe] клянётся не делать, — то, за что [ROOT.Char.GetSheHe] себя корит: гадает.\n\nНе о пророчестве. О боге. Если имя настоящее — если настоящ хотя бы его край, — значит, кто-то смотрел. Кто-то выбрал. И это были не те боги, вокруг которых отцы [ROOT.Char.GetHerHis] строили свои септы и молитвы у чардрева, потому что те боги ни разу не произнесли [ROOT.Char.GetHerHis] имени вслух."
 ln_red.1.desc.priest:0 "[ln_red_priest.GetTitledFirstName] служит [ROOT.Char.GetHerHis] достаточно давно, чтобы странность стёрлась. Красные одежды теперь просто одежды. Ночные костры — просто его дело, как мейстер поднимается к своим воронам.\n\nИменно в этом и беда. Где-то за эти годы — за его терпением, его страшной уверенностью, вечерами, когда он говорит об огне так, будто сообщает новости дня, — вопрос перестал быть его и стал [ROOT.Char.GetHerHis] собственным. Не безумен ли он. А прав ли он."
 ln_red.1.desc.dark:0 "[ROOT.Char.GetSheHe|U] теперь знает кое-что. Не слухи — именно знает. [ROOT.Char.GetSheHe] читал письма, слышал, что вернулось с севера, ощутил очертания того, что лежит за краем всякой уютной карты.\n\nИ во всём длинном списке богов, которым молился [ROOT.Char.GetHerHis] народ, ровно один когда-либо заявлял, что он — ИМЕННО ОБ ЭТОМ: о тьме и о том, что ей противостоит. Это чужой бог с горящим сердцем и жрецами, которые тревожат всякого встречного. И это, насколько [ROOT.Char.GetSheHe] может судить, единственный, кто это предвидел."
 ln_red.1.a:0 "Пусть мысль останется."
 ln_red.1.b:0 "Погасить её. Моих богов довольно."
 ln_red.2.t:0 "Ночной костёр"
 ln_red.2.desc:0 "Это случается обычным вечером. Костёр во дворе, разложенный высоко против холода, и [ROOT.Char.GetSheHe] ловит себя на том, что огонь держит [ROOT.Char.GetHerHim] дольше, чем объясняется теплом.\n\nСлова здесь — чужие, но целые: их слышали достаточно часто, от одежд красных или молвой приписанных, чтобы они прочли себя сами. Ночь темна и полна ужасов. [ROOT.Char.GetSheHe|U] их не произносит. Но [ROOT.Char.GetSheHe] стоит, пока они проходят мимо, и когда [ROOT.Char.GetSheHe] наконец отворачивается, тьма за светом костра выглядит — на один вдох — ровно такой глубокой, как говорят жрецы."
 ln_red.2.a:0 "Постоять у огня ещё немного."
 ln_red.2.b:0 "Довольно, это зашло далеко."
 ln_red.3.t:0 "Принять красное"
 ln_red.3.desc:0 "Это перестало быть мыслью и стало дверью. [ROOT.Char.GetSheHe|U] видит обе её стороны с ужасающей ясностью.\n\nЗа ней: огонь, уверенность, бог, который несомненно БОДРСТВУЕТ, пока сгущается тьма, — и цена, уплаченная сполна и прилюдно. Септоны и певцы, вассалы, чьи деды преклоняли колени рядом с [ROOT.Char.GetHerHis] собственными, — все они будут смотреть, как их сюзерен принимает чужое пламя. В лучшем случае это назовут безумием.\n\nПо эту сторону: боги [ROOT.Char.GetHerHis] отцов, которые не сказали ничего. Которым, может статься, ещё причитается всё. И которые за все эти годы ни разу не ответили."
 ln_red.3.a:0 "Зажечь огонь. Рглор, защити меня."
 ln_red.3.b:0 "Нет. Не под взглядом богов моих отцов."
