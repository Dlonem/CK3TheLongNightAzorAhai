l_russian:

 ln_prophecy.20.t:0 "Последний поцелуй"

 ln_prophecy.20.desc.named:0 "#e Вы не помните, как умирали, и не помните, как вернулись. Есть день накануне, есть вот это, а между ними — ничего, сколько ни ищите.\n\n [scope:ln_the_priest.GetTitledFirstName] не скажет вам, что [scope:ln_the_priest.GetSheHe] сделал, — только то, что Владыка Света ещё не закончил, и это звучит как смирение, но смирением не является.\n\n Еда стала преснее. Холод до вас не добирается. Ваш мейстер, который во всё это не верит и не раз о том говорил, дважды осматривал вас и дважды уходил, не сказав ни слова.\n\n #bold Детей у вас теперь не будет. То, что вернулось, — не вполне то, что уходило.#!#!"
 ln_prophecy.20.desc.plain:0 "#e Вы не помните, как умирали, и не помните, как вернулись.\n\n Кто-то молился над вами — в комнате были люди, и огонь, и слова на языке, который вы знаете наполовину, — а потом идёт провал, края которого вам не нащупать, как бы осторожно вы ни искали.\n\n Что-то изменилось, и вы не можете это назвать. Еда стала преснее. Холод до вас не добирается. Вы дважды ловили себя на том, что забываете бояться вещей, которых бояться следует.\n\n #bold Детей у вас теперь не будет. То, что вернулось, — не вполне то, что уходило.#!#!"
 ln_prophecy.20.a:0 "Значит, что-то ещё не сделано. Выяснить что."
 ln_prophecy.20.b:0 "Я об этом не просил. Я ни о чём таком не просил."
