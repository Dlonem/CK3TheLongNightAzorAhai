l_russian:
# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- emptying a dungeon northward.

 ln_send_the_dungeons_to_the_wall_decision:0 "[ROOT.Char.Custom('ln_SendDungeonsTitle')]"
 ln_send_the_dungeons_plain:0 "Отправить узников на Стену"
 ln_send_the_dungeons_raven:0 "Послать ворона: опорожнить клети"
 ln_send_the_dungeons_to_the_wall_decision_desc:0 "Ваш тюремщик держит список на доске у двери, и за год он не стал короче. Люди, взятые в войне, которая кончилась. Люди, чья родня перестала отвечать воронам. Люди, за которыми никто не придёт с выкупом и которых никому особенно не хочется вешать.\n\nСтена не спрашивает, что они сделали. Она не спрашивала никогда. Она спрашивает лишь, могут ли они держать копьё и будут ли они ещё на ногах в конце гати, когда протрубит рог, — и возьмёт каждого из них на этих условиях, не сказав ни слова благодарности.\n\nЭто не милость. Это самый старый уговор в Семи Королевствах: юг сохраняет руки чистыми, а север получает тела."
 ln_send_the_dungeons_to_the_wall_decision_tt:0 "Отправить на север, в Ночной Дозор, каждого узника, способного надеть чёрное, — одним приказом.\n\n#weak Они уходят присягнувшими братьями, а не по предложению, от которого можно отказаться. Тот, кого Стена не возьмёт, остаётся в ваших клетях.#!"
 ln_send_the_dungeons_to_the_wall_decision_confirm:0 "Опорожнить клети. Стена их возьмёт."
 ln_send_the_dungeons_to_the_wall_decision_desc_north:0 "Ваш тюремщик держит список на доске у двери. На юге опорожнить его на север назвали бы милостью или шуткой. Вас растили называть это тем, чем оно есть: Стену нужно держать людьми, Север держал её всегда, и человек, нарушивший королевский мир, всё ещё может держать копьё по правильную её сторону.\n\nОни будут проклинать вас на гати и не поблагодарят никого. Их сыновья будут присягнувшими братьями старейшего ордена в мире. Верно и то и другое, и за Даром ни то ни другое вас уже не касается."
 ln_send_the_dungeons_to_the_wall_effect_tt:0 "#V [ROOT.Char.MakeScope.ScriptValue('ln_prisoners_fit_for_the_wall_value')|0]#! ваших узников наденут чёрное. Их отпускают в Ночной Дозор, и они входят в двор лорда-командующего"

 # ── The four things that can stop you, each said out loud. AGOT hides all of these in is_shown. ──
 ln_wall_you_are_of_the_free_folk:0 "Вы из вольного народа — людей у вас Дозор не возьмёт"
 ln_wall_your_seat_is_not_in_the_seven_kingdoms:0 "Ваш престол лежит вне Семи Королевств — Стена не та, куда вам посылать людей"
 ln_wall_there_is_no_watch_left:0 "Ночного Дозора, который принял бы их, больше нет"
 ln_wall_none_of_them_will_serve:0 "Ни один из ваших узников не может надеть чёрное"

 # ── 1.1.0 (§10): the protections, each named out loud. A correct refusal with no reason reads as a bug. ──
 ln_wall_he_is_not_yours_to_send:0 "Он не ваш, чтобы его посылать, — на север можно увести лишь своих вассалов и их слуг или собственный двор"
 ln_wall_he_is_a_king_in_his_own_right:0 "Он король сам по себе — венчанные головы выкупают или они умирают, на Стену их не отправляют"
 ln_wall_his_house_looks_to_him:0 "На него смотрит его дом — Стена не берёт главу дома"
 ln_wall_his_dynasty_looks_to_him:0 "На него смотрит его династия — Стена не берёт главу династии"
 ln_wall_he_is_the_last_of_his_house:0 "Он последний в своём доме — Стена кончает людей, а не кровные линии"
 ln_wall_he_is_too_great_a_lord:0 "Он слишком большой лорд — выше графского ранга отправлять нельзя"

 # ── 1.1.0 (§10.2): the tier-ceiling game rule ──
 rule_ln_wall_tier_ceiling:0 "#explanation_link_light_background;bold LN:#! #e;bold Отправить узников#! — предел ранга"
 setting_ln_wall_county_ceiling:0 "Графы и ниже #EMP (по умолчанию)#!"
 setting_ln_wall_county_ceiling_desc:0 "Пленных лордов выше графского ранга на Стену отправить нельзя. Королей и герцогов выкупают или казнят, как и подобает людям их величия."
 setting_ln_wall_send_any_tier:0 "Любой ранг"
 setting_ln_wall_send_any_tier_desc:0 "На Стену можно отправить любого подходящего узника, что бы он ни держал. Король Железного Трона может окончить свои дни присягнувшим братом."
