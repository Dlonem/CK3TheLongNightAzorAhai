l_russian:

 ln_intro.1.t:0 "О чём говорят в вашем чертоге"

 # Every branch below is what the PLAYER'S COURT believes, not what is true. None of them names the Long Night.

 ln_intro.1.desc.watch:0 "#e У вас есть учётные книги — это больше, чем есть у любого к югу от вас.\n\n Походы уходят, и с каждым десятилетием возвращается всё меньшая их часть. Братья приходят из-за [wall|E] и не говорят, что заставило их повернуть, а те, кто всё же говорит, противоречат друг другу так полно, что лорд-командующий перестал это записывать.\n\n Позиция Цитадели такова: на севере холодно, и люди там умирают. Это не ложь. Это просто не объяснение, а вы — единственный орден в мире, само основание которого исходило из того, что объяснение однажды понадобится.\n\n У вас восемьсот человек. Вас строили под двадцать тысяч.#!"

 ln_intro.1.desc.free_folk:0 "#e Вашим людям объяснять не нужно.\n\n За одно поколение они трижды снимались с места — всегда на юг, всегда по причинам, которые старики описывают осторожно, а молодые списывают на погоду. Есть долины, где больше никто не зимует. Есть имена, которые ваша бабка не произносила после темноты, а суеверной она не была.\n\n Коленопреклонённые за своим льдом считают вас налётчиками. Вы объяснили бы им иначе, если бы они хоть раз спросили.#!"

 ln_intro.1.desc.north:0 "#e Старая Нэн рассказывала вам это в детстве — и рассказывала плохо, нарочно, потому что именно так рассказывают историю ребёнку, которого хотят потом уложить спать.\n\n Зима длиною в поколение. Холод, внутри которого что-то шло. Мертвецы, встающие ему служить, и последний герой, ушедший на север с мечом, который сломался.\n\n Вы взрослый человек и знаете, зачем нужны сказки. Вы знаете и другое: каждый северный дом, удержавший своё гнездо восемь тысяч лет, клал стены толще с северной стороны, и никто до сих пор не смог объяснить вам почему.#!"

 ln_intro.1.desc.dragon:0 "#e Есть нечто, что знает ваш дом, и вы не уверены, что это знание досталось вам.\n\n Эйегон оставил сон. Его записали, и запись переходит к тому, кто сидит на престоле. Читал ли её нынешний её держатель и верит ли в неё — об этом никто не подумал вам сообщить.\n\n Остальной семье достаются общие очертания. Тьма с севера. Песнь льда и пламени. Нечто, что Таргариену полагается с этим сделать, в столетии, которое никто не потрудился назвать.\n\n Вы задумывались: семья перестала об этом говорить потому, что оно уже исполнилось, — или потому, что ещё не началось?#!"

 ln_intro.1.desc.red:0 "#e Ваш жрец уверен, и в этом-то и беда.\n\n Ночь темна и полна ужасов, Великий Иной шевелится в холоде, а поборник родится среди соли и дыма. Ваш жрец может рассказать вам всё это и назвать точный час.\n\n Ваш жрец уже называл три предыдущих точных часа, назвал двух предыдущих поборников и обоих похоронил.\n\n Пламя не лжёт. Но показывает оно многое, человеку приходится выбирать, куда смотреть, а жрецы — люди. Что-то идёт. Всё, что вера рассказала вам о его облике, стоит считать догадкой того, кто очень хочет оказаться правым.#!"

 ln_intro.1.desc.lord:0 "#e Ваш мейстер упомянул об этом однажды — так, как это делают мейстеры: придаточным предложением, в конце длинного письма о зерне.\n\n Записи о Долгой Ночи. Восемь тысяч лет назад, или шесть, или двенадцать; Цитадель не сошлась во мнениях и считает само разногласие любопытнее события. Поколение зимы. Смертей без счёта. Что-то о ходячих мертвецах — Цитадель уверена, что это была метафора голода.\n\n Вы не дочитали до конца. В письме были дела поважнее, дела поважнее есть и сейчас, и север ни разу не был вашей заботой.#!"

 ln_intro.1.desc.nobody:0 "#e Вам никто ничего не рассказывал, потому что рассказывать нечего.\n\n Лета долги, урожаи хороши, а дороги достаточно безопасны, чтобы купцы жаловались на пошлины, а не на разбойников. Люди вашего возраста ни разу не видели настоящей зимы. Люди возраста вашего отца описывают их так, как моряки описывают шторма, — как нечто пережитое и приукрашенное в пересказе.\n\n Где-то далеко к северу от всех мест, куда вы когда-либо попадёте, стоит стена. У вас не было повода задуматься зачем.#!"
 ln_intro.1.a:0 "Послать в Цитадель. Спросить, что на самом деле говорят записи."
 ln_intro.1.b:0 "Мир полон старых сказок. Эта подождёт."
