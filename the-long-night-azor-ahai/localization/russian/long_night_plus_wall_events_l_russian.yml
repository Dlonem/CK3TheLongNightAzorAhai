l_russian:

 long_night_plus_wall.1.t:0 "Стена пала"
 long_night_plus_wall.1.desc:0 "Восемь тысяч лет она стояла — семьсот футов льда, поднятого против тьмы. Теперь, с рёвом, сотрясающим самые корни мира, Стена рушится у Чёрного Замка. Там, где она ломается, внутрь льётся холод, а за ним идут мёртвые — бесконечный прилив воинства Короля Ночи. Между живыми и Долгой Ночью не осталось ничего."
 long_night_plus_wall.1.a:0 "Дозор окончен."

 long_night_plus_wall.2.t:0 "#F Век Героев окончен#!"
 long_night_plus_wall.2.desc:0 "Брандон Строитель поднял её, когда Первые Люди ещё резали свои слова рунами, и восемь тысяч лет всякий коленопреклонённый и король, всякий одичалый и дозорный, всякий мейстер и повитуха прожили свою жизнь в её тени и ни разу не подумали спросить, устоит ли она. Она стояла. Это было единственное обещание, которое мир сдержал.\n\nБольше нет. Стена пала у Чёрного Замка, и в пролом входит сама зима. Вороны летят в каждый замок Вестероса с теми же тремя словами, что Дозор шептал столетиями, — словами, которые были предупреждением, а стали просто погодой: мёртвые идут.\n\nМежду живыми и Долгой Ночью стоит теперь не лёд. Стоите вы."
 long_night_plus_wall.2.a:0 "И теперь начинается наш дозор."
