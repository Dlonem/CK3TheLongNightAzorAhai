l_russian:

 long_night_plus_wall.1.t:0 "Стена пала"
 long_night_plus_wall.1.desc:0 "Восемь тысяч лет она стояла — семьсот футов льда, поднятого против тьмы. Теперь, с рёвом, сотрясающим самые корни мира, Стена рушится у Чёрного Замка. Там, где она ломается, внутрь льётся холод, а за ним идут мёртвые — бесконечный прилив воинства Короля Ночи. Между живыми и Долгой Ночью не осталось ничего."
 long_night_plus_wall.1.a:0 "Дозор окончен."

 long_night_plus_wall.2.t:0 "#F Век Героев окончен#!"
 long_night_plus_wall.2.desc:0 "Брандон Строитель поднял её, когда Первые Люди ещё резали свои слова рунами, и восемь тысяч лет всякий коленопреклонённый и король, всякий одичалый и дозорный, всякий мейстер и повитуха прожили свою жизнь в её тени и ни разу не подумали спросить, устоит ли она. Она стояла. Это было единственное обещание, которое мир сдержал.\n\nБольше нет. Стена пала у Чёрного Замка, и в пролом входит сама зима. Вороны летят в каждый замок Вестероса с теми же тремя словами, что Дозор шептал столетиями, — словами, которые были предупреждением, а стали просто погодой: мёртвые идут.\n\nМежду живыми и Долгой Ночью стоит теперь не лёд. Стоите вы."
 long_night_plus_wall.2.a:0 "И теперь начинается наш дозор."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 long_night_plus_wall.2.desc.watch:0 "Всякий живой брат слышал, как она пошла, где бы он на Стене ни стоял. Обет называет нас щитом, что охраняет царства людей; щита больше нет, а люди остались.\n\n"
 long_night_plus_wall.2.desc.free_folk:0 "Нам говорили, что лёд коленопреклонённых простоит вечно, и мы прожили свою жизнь не с той его стороны. Теперь никакой «не той» стороны нет вовсе, и то, от чего мы бежали, может идти за нами куда ему угодно.\n\n"
 long_night_plus_wall.2.desc.dragon:0 "Кровь дракона слышала эту повесть ещё до Рока, и всякий её пересказ кончается огнём. Только что наземь пало нечто восьмитысячелетнее, и всякий глаз в державе обращается к тому, что летает.\n\n"
 long_night_plus_wall.2.desc.north:0 "Всякому северному ребёнку говорят, что Стена — это место, где кончается мир. Сегодня он кончился, и Север теперь — то, что стоит к северу от ничего.\n\n"
 long_night_plus_wall.2.desc.red:0 "Пламя показывало стену изо льда и что-то терпеливое за нею, и нынче ночью льда больше нет. Всякая проповедь была ради этого; всякий ночной костёр зажжён ради того, что войдёт в пролом.\n\n"
 long_night_plus_wall.2.desc.lord:0 "Мой мейстер принёс воронье письмо в обеих руках и не смог прочесть его вслух. Сколько бы я ни посылал на север в годы до этого, этого было мало, и знать это я буду до конца своих дней.\n\n"
 long_night_plus_wall.2.desc.nobody:0 "Нет ни крепости, ни знамени, под которым укрыться, и весть пришла так, как до меня доходят все вести: поздно и из чужого рта. Единственная стена, которая имела значение, пала, и всякая дорога теперь ведёт туда, куда достанут мёртвые.\n\n"
