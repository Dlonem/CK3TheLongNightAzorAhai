l_russian:

 # ── The Long Night begins again ─────────────────────────────────────────────────────────────────────────────
 # Only ever seen with the "The Cycle" game rule on. Wave 1 uses the original others.2.desc.

 ln_others.2.desc.wave_again:0 "#e Вороны улетают раньше, чем выезжают всадники, и мейстеры не спорят о том, что означают донесения. Спорить больше не о чем.\n\n Это уже бывало. Не на памяти живых — последний, кто это видел, умер прежде, чем родился хоть кто-то ныне дышащий, — но Цитадель хранит свои записи, а Север хранит свои предания, и на сей раз они сходятся.\n\n Одичалые уже идут на юг. Они не стали дожидаться уверенности.\n\n #bold Иные вернулись. Долгая Ночь пришла снова.#!#!"

 ln_others.2.desc.wave_late:0 "#e Для этого теперь есть слово, на каждом языке от Староместа до Асшая, и дети выучивают его прежде, чем выучиваются считать.\n\n Север хранит свои руины так, как другие земли хранят памятники. Половина великих престолов Вестероса — это имя на карте и груда камня, и каждый из них был потерян в зиму, о которой клялись, что она последняя.\n\n Никто не шлёт воронов с вопросом, правда ли это. Шлют воронов с вопросом, сколько у них времени.\n\n #bold Иные вернулись. По-настоящему они и не уходили.#!#!"

 ln_others.2.desc.wave_last:0 "#e Брать осталось немного.\n\n Карты в Цитадели теперь почти пусты, и мейстеры перестали их перечерчивать. То, что уцелело от государства, уцелело потому, что у мёртвых до него ещё не дошли руки.\n\n Никто больше не спрашивает, кем был Азор Ахай. Спрашивают, был ли он вообще хоть кем-то и не было ли пророчество всего лишь сказкой, которую живые рассказывали друг другу, чтобы уснуть.\n\n #bold Иные вернулись. Очень похоже, что в последний раз, когда это ещё что-то значит.#!#!"

 # ── The dawn, under the cycle ───────────────────────────────────────────────────────────────────────────────
 ln_others.3.desc.cycle:0 "#BER Мёртвые лежат недвижно. Холод отступает. Где-то к югу от Перешейка пробивается первая зелень, и люди, годами толком не спавшие, наконец засыпают.\n\n Это не кончилось. Это не кончалось ни разу.\n\n Мейстеры запишут год, как записали прошлый, и кто-то через столетие прочтёт и подумает, что это было очень давно. У государства есть, быть может, три поколения, чтобы стать чем-то, что умеет больше, чем выживать.\n\n #bold Весна пришла. Не растратьте её.#!"

 # ── DAWN CARD, BRANCHED ON HOW THE DARK ARRIVED (global_var:ln_invasion_opening) ─────────────────────────────
 ln_others.3.desc.wall:0 "#BER Мёртвые лежат недвижно. Холод отступает. Где-то к югу от Перешейка пробивается первая зелень, и люди, годами толком не спавшие, наконец засыпают.\n\nВ Чёрном Замке — пролом в семьсот футов глубиной и в сотню ярдов шириной, и ветер идёт сквозь него ровно так же, как в день, когда он открылся. Никто не представляет, как его закрыть. Честный ответ, которого королю не скажут, таков: те, кто её строил, мертвы восемь тысяч лет и записать не потрудились.\n\nВесна пришла в державу с дырой в её северной стене.\n\n#bold Это кончилось. Это не исправлено.#!"

 ln_others.3.desc.inside:0 "#BER Мёртвые лежат недвижно. Холод отступает. Пробивается первая зелень, и люди, годами толком не спавшие, наконец засыпают.\n\nНикто в этой державе больше не сможет смотреть на чужака как прежде. Оно пришло не через Стену — оно уже было здесь, в чертоге, под лицом, которому доверяли, и было дольше, чем кому-либо удалось установить.\n\nМейстеры хотели бы выяснить, насколько дольше. Лорды предпочли бы, чтобы не выясняли: каждый из них тихо пересчитывает назад собственный двор, и арифметика ему не нравится.\n\n#bold Весна пришла. Спать с открытой дверью больше никто не станет.#!"

 ln_others.3.desc.exodus:0 "#BER Мёртвые лежат недвижно. Холод отступает. Пробивается первая зелень, и люди, годами толком не спавшие, наконец засыпают.\n\n Вольный народ всё ещё здесь. Десятки тысяч — к югу от Стены, через которую они перешли бегом, в державе, что восемь тысяч лет строила эту Стену именно затем, чтобы их не пустить, — и что за эту войну выяснила: они были единственными в мире, кто говорил правду о том, что осталось у них за спиной.\n\n Никто не придумал, что дальше. В Цитадели нет прецедента ни для чего из этого.\n\n #bold Весна пришла, и карту придётся перечертить.#!"

 ln_others.3.desc.ranging:0 "#BER Мёртвые лежат недвижно. Холод отступает. Пробивается первая зелень, и люди, годами толком не спавшие, наконец засыпают.\n\n Началось с похода, вернувшегося неправильным, и есть ещё живые, кто был в Чёрном Замке в ту ночь, когда он вошёл, — и ни один из них так и не сумел описать это так, чтобы понял тот, кого там не было.\n\n У Дозора есть запись. Шесть имён, дата и четыре слова писарской рукой, которые лорд-командующий с тех пор велел переписать в каждый замок вдоль Стены, потому что другого предупреждения не было ни у кого — и по нему никто не поступил.\n\n #bold Весна пришла. В следующий раз читайте книги.#!"

 # ── WHAT THE WORLD REMEMBERS OF THE LAST DAWN ───────────────────────────────────────────────────────────────
 # Written against design-backlog-additions.md LN-021: "ship three excellent branches, not ten serviceable
 # ones." [ln_last_dawn_dragon.GetName] resolves generations later because the dragon is locked unpruneable at
 # the moment of the dawn. The champion's name comes back the same way.
 ln_others.2.desc.dragon_lives:0 "#e Они вернулись — и вместе с ними [ln_last_dawn_dragon.GetSheHe].\n\n [ln_last_dawn_dragon.GetName|E] помнит прошлый раз. Старики, бывшие тогда мальчишками, до сих пор описывают идущую поверху тень и звук, что издавали мёртвые, когда до них доходил огонь, — звук, о котором они говорят, что это был не крик, потому что кричат живые.\n\n [ln_last_dawn_dragon.GetSheHe|U] всё ещё в этом мире. Старше, медленнее — и единственное создание под небом, которое уже делало это однажды.\n\n #bold Иные вернулись. И дракон, который их прикончил, тоже.#!#!"
 ln_others.2.desc.dragon_dead:0 "#e Они вернулись. [ln_last_dawn_dragon.GetName|E] — нет.\n\n Прошлая Долгая Ночь кончилась с драконьей спины, и все свидетельства сходятся на одной картине: лёд, темнеющий под огнём, и то, что стояло посреди, наконец останавливается. От того дракона теперь кости — в чертоге, в кургане или на дне залива, смотря какого мейстера спросить.\n\n Драконы в мире ещё есть. Никто из живых не знает, одно ли это и то же.\n\n #bold Иные вернулись, а тот, кто одолел их прошлый раз, не придёт.#!#!"
 ln_others.2.desc.dragon_gone:0 "#e Они вернулись. В небе пусто.\n\n Прошлую прикончил [ln_last_dawn_dragon.GetName|E]. Теперь нет ни [ln_last_dawn_dragon.GetName|E], ни кого-либо ещё: мир отпустил последних так, как отпускает всё, — медленно и не приняв решения.\n\n Те, кому биться в этот раз, про огонь читали. В этом вся их подготовка.\n\n #bold Иные вернулись, и на сей раз небо пусто.#!#!"
 ln_others.2.desc.champion_lives:0 "#e Они вернулись, и тот, кто остановил их прошлый раз, ещё жив и об этом слышит.\n\n [ln_last_dawn_champion.GetTitledFirstName|E] однажды это сделал. Все годы с тех пор государство решало, чего это стоило, — спаситель, счастливчик, история, вышедшая из берегов, — и сегодня все эти споры кончаются.\n\n [ln_last_dawn_champion.GetSheHe|U] знает то, чего не знает больше никто в мире: какова цена и хватит ли [ln_last_dawn_champion.GetSheHe] на второй раз.\n\n #bold Иные вернулись. И [ln_last_dawn_champion.GetSheHe] тоже.#!#!"

 # -- HOW LONG AGO, AND WHETHER THE PROPHECY WORKED -----------------------------------------------------------
 # Trigger-driven, no interpolation: see the note on the desc block in others_events.txt.
 ln_others.2.desc.living_memory:0 "#e Они вернулись, и на сей раз в чертоге есть люди, которые помнят прошлый раз.\n\n Не по книге. Не по песне. Они были мальчишками, когда тьма отступила, и каждый год с тех пор их расспрашивали, каково это было, люди, которые никак не могли бы понять ответа, — а теперь они единственные в зале, у кого не дрожат руки, потому что они же единственные, кто заранее знает, чем это кончается.\n\n Они знают и ещё одно, о чём никто из них не говорит вслух: считалось, что дважды за одну жизнь такое невозможно.\n\n #bold Иные вернулись — в пределах одной жизни.#!#!"
 ln_others.2.desc.named_true:0 "#e Они вернулись, и жрецы уже говорят.\n\n В прошлый раз они оказались правы. Именно это Цитадель никогда не умела обсуждать спокойно: красные храмы назвали человека, человек ушёл на север, и тьма кончилась. Что бы кто ни думал о Рглоре, запись есть запись.\n\n Так что когда этой зимой жрец встанет на рыночной площади и произнесёт имя, смеяться никто не будет. Имя запишут, человека найдут, и очень многого от него потребуют очень быстро.\n\n #bold Иные вернулись. В прошлый раз пророчество было правдой.#!#!"
 ln_others.2.desc.named_false:0 "#e Они вернулись, и жрецов никто не слушает.\n\n В прошлый раз красные храмы назвали дюжину человек. Они называли принцев, бастардов и девушку в Волантисе и были уверены в каждом — а тьму кончил тот, о ком они не обмолвились ни разу: человек, на котором не было никакого пророчества, просто оказавшийся рядом.\n\n У жрецов есть объяснения. Времени поработать над ними у них было вдоволь.\n\n #bold Иные вернулись. В прошлый раз это был не тот, кого выбрали песни.#!#!"

 ln_others.3.desc.proof:0 "#BER Мёртвые лежат недвижно. Холод отступает. Где-то к югу от Перешейка пробивается первая зелень, и люди, годами толком не спавшие, наконец засыпают.\n\nЭто была та война, которую никто не мог выдать за слух. Она началась в тронном зале, с трупа, который не желал умирать, и двора, смотревшего, как он горит: держава поверила с первого дня — и этого всё равно едва не оказалось мало.\n\nМейстеры запишут год. У государства есть, быть может, три поколения, чтобы стать чем-то, что умеет больше, чем поверить вовремя.\n\nВесна пришла. Не растратьте её.#!"
