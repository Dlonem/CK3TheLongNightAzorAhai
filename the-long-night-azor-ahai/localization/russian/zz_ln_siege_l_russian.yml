 # 1.0.8 -- see common/modifiers/zz_ln_siege_modifiers.txt
 ln_the_dead_do_not_tire_modifier:0 "Мёртвые не устают"
 ln_the_dead_do_not_tire_modifier_desc:0 "Они не спят, не едят и не сменяются на линии. Против воинства, которому не нужен отдых, не сделаешь вылазки и его не пересидишь. Люди на стенах смотрят, как они стоят там всю ночь, и следующую, — и что-то внутри от этого смотрения ломается куда раньше, чем ворота."
