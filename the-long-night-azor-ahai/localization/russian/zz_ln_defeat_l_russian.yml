l_russian:

 # AGOT: The Long Night & Azor Ahai -- the long defeat, and meeting your own dead.

 ln_defeat.1.t:0 "#e Долгое поражение#!"
 ln_defeat.1.desc:0 "#e Никто этого не объявляет. Нет ни ворона, ни последнего боя, достойного имени, — только сезон, который не поворачивается, потом другой, а потом их целое поколение.\n\n Мейстеры несколько лет назад перестали выпускать зимний счёт. Об этом тоже никто не объявлял. Последний, кто помнил урожай, умер в ту весну, которая не была весной, и дети, что рождаются сейчас, вырастут в уверенности, что серое над головой — это просто и есть небо.\n\n Где-то к северу от всего, в ледяном чертоге, который когда-то был замком, король, который не ест, не спит и не стареет, держит державу больше любой, что удавалась Таргариенам, и он не торопится, потому что он уже победил, и только живые ещё это выясняют.\n\n #bold Долгая Ночь не кончилась. Она стала миром.#!#!"
 ln_defeat.1.desc.watch:0 "#e Вы — Ночной Дозор. Вы были щитом, что охраняет царства людей.\n\n Царства, которое надо охранять, не осталось, и людей, о которых стоило бы говорить, тоже, а обет — тот самый, который вас заставили произнести в снегу, с холодными руками на мече, которого вы ещё не заслужили, — оказался описанием работы, которую можно потерять.\n\n Девятнадцать замков. Вы не удержали ни одного. Всё, что осталось от ордена, — несколько десятков человек в разбитой крепости, которые поддерживают огни по привычке и больше не трудятся слать разведчиков на север, потому что север теперь везде.\n\n #bold Пришедшая ночь была той самой, из сказок. Готов не был никто, и она не стала ждать.#!#!"
 ln_defeat.1.desc.named:0 "#e Жрецы вас нарекли. Ошиблись они, или вы, или огонь — и эта разница перестала что-либо значить для всех, кроме вас.\n\n Спорить больше не о чем: пророчества не осталось. Есть замёрзший материк, который держит король, которому никто ничего не обещал и которому это было не нужно, и есть вы, живой, — чего песни не предусматривали.\n\n Где-то в красном храме, который теперь руина, жрец, всю жизнь указывавший на вас, умер, так и оставшись уверенным. Вам хотелось бы на него злиться. Но чаще вы вспоминаете, что он верил в это сильнее, чем когда-либо верили вы.\n\n #bold Вы были обещанным принцем. Вот чего это стоило.#!#!"
 ln_defeat.1.a:0 "Значит, будем жить в этом."

 ln_defeat.2.t:0 "Кто-то, кого вы знали"
 ln_defeat.2.desc.child:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nВы понимаете ещё до того, как подходите. Вы поняли по тому, как он стоял.\n\nЭто ваш ребёнок. Серый теперь, и с неправильными глазами, и всё-таки — безошибочно, несправедливо — узнаваемый. Тому, что с ним сделали, не было нужды менять лицо. Возможно, оно и не могло. Возможно, не увидело смысла.\n\n#bold Он лежит на земле и не двигается, и вам придётся решить, как с этим быть.#!"
 ln_defeat.2.desc.parent:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nЭто лицо вашего отца. Вашей матери. Чьё бы оно ни было, это лицо научило вас, что такое лицо, — серое теперь и растрескавшееся от холода, лежащее в грязи среди прочих.\n\nОни умерли годы назад. Вы были на погребении. Вы помните, что подумали тогда: по крайней мере, эта часть окончена.\n\n#bold Она не была окончена.#!"
 ln_defeat.2.desc.sibling:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nВаш брат. Ваша сестра. Тот, с кем вы двадцать лет ссорились из-за пустяков и за кого умерли бы в любой из этих дней, лежит в инее с открытым ртом, и холод всё ещё идёт от него.\n\nСегодня кто-то пробил его копьём. Возможно, кто-то из ваших. Возможно, вы.\n\n#bold Вам придётся посмотреть на это как следует, а потом решить.#!"
 ln_defeat.2.desc.spouse:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nЭто ваша жена. Ваш муж. Тот, под чьё дыхание вы научились засыпать, лежит в инее, и иней у него в волосах, а того, что раньше было за этими глазами, нет уже давно.\n\nВы это себе представляли. На этой войне это представлял себе каждый. Оказывается, представлять — это не то же самое.\n\n#bold Никто другой не сделает этого за вас.#!"
 ln_defeat.2.desc.friend:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nЭто ваш друг — настоящий, тот, перед кем не надо было объясняться. [ln_known_dead.GetSheHe] пропал при разгроме две зимы назад, и вы сказали [ln_known_dead.GetHerHis] домочадцам, что [ln_known_dead.GetSheHe], вероятно, взят в плен, потому что это было милосерднее другого исхода, а тогда вы ещё не знали, что есть и третий.\n\n[ln_known_dead.GetSheHe] здесь. [ln_known_dead.GetSheHe] не в плену, и [ln_known_dead.GetSheHe] мёртв не тем способом, который хоть чем-то помог бы.\n\n#bold [ln_known_dead.GetHerHim] жизнь стоила большего, чем это, — а больше этого у вас нет.#!"
 ln_defeat.2.desc.lover:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nВы узнаёте очертания раньше, чем лицо. Именно это вы потом и запомните — что узнали за сорок шагов, в темноте, по тому, как он стоял.\n\nСейчас он не стоит.\n\n#bold Что бы там ни осталось, это не он, — и вы всё равно не можете заставить себя поторопиться.#!"
 ln_defeat.2.desc.sworn:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nЭто один из ваших. Тот, кто преклонял перед вами колено, в чьей крепости вы ели, чьих детей вы назвали бы по именам, будь у вас минута. [ln_known_dead.GetSheHe] потерялся где-то в долгом отступлении, и никто этого не записал, потому что к тому времени никто уже ничего не записывал.\n\n[ln_known_dead.GetSheHe] вернулся на юг вместе с ними. [ln_known_dead.GetSheHe] шёл на юг вместе с ними всё это время.\n\n#bold [ln_known_dead.GetSheHe] присягал вам. Это не прекратилось, когда [ln_known_dead.GetSheHe] умер.#!"
 ln_defeat.2.a:0 "Сложить костёр. [ln_known_dead.GetSheHe] уйдёт как должно."
 ln_defeat.2.b:0 "Оставить [ln_known_dead.GetHerHim]. Мы ещё вернёмся этой дорогой."

 # -- WHAT THE DEAD REMEMBER ----------------------------------------------------------------------------------
 ln_defeat.2.desc.again:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nЭто он. Тот, кого вы оставили.\n\nВы знали, что это будет он, — так, как знают то, что отказываются произносить вслух. Надо было двигать колонну, надо было развести огонь, и была сотня добрых причин, и каждая из них была правдой, и ни одна из них здесь сейчас не стоит.\n\nС тех пор он всё время шёл. Он проделал очень долгий путь, чтобы оказаться именно на этом поле, и никакого истолкования, в котором это совпадение, не существует."
 ln_defeat.2.desc.long_after:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nОн молод. Он остановился, потому что никогда не видел такого вблизи и потому что ему не сказали, что они оставляют лица.\n\nА вы видели. Дольше, чем он живёт на свете. Было время, давным-давно, когда это было худшим, что могло случиться с человеком за один день, — а сейчас в вашем чертоге есть дети, которые ни разу не видели, чтобы солнце поднялось достаточно высоко и тень стала короткой, и которые не считают, что во всём этом что-то пошло не так.\n\nКто-то должен сказать, что делают с телом. Уже пятьдесят лет это вы."
 ln_defeat.2.desc.sworn_burned:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nЭто один из ваших. Человек, преклонявший перед вами колено, потерянный где-то в отступлении, которого толком никто не записал, — стоит теперь в инее, и цвет за глазами у него неправильный.\n\nВы это уже делали. Именно об этом никто не предупреждает: не о первом разе, а об открытии, что вы уже знаете порядок действий. Сколько горит огонь. Где встать, чтобы ветер не понёс его на вас. Что сказать людям потом — а это почти ничего.\n\nКто-то подаёт вам факел, не дожидаясь просьбы. Они начали предполагать."
 ln_defeat.2.desc.sworn_left:0 "Поле обходят так, как обходят поля после, и один из ваших людей остановился и дальше не идёт.\n\nЭто один из ваших. Человек, преклонявший перед вами колено, в чьей крепости вы ели, — стоит теперь в инее, и цвет за глазами у него неправильный.\n\nБыл и другой, до этого. Вы оставили его там, где он лежал, и у вас были причины, и с тех пор вы той дорогой не ездили, и вы заметили, что больше не выбираете северную дорогу, если есть дорога, которая не северная.\n\nВаши люди не смотрят на тело. Они смотрят на вас и ждут, чтобы узнать, каким лордом вы окажетесь на этот раз."
 ln_the_dark_won_modifier:0 "Тьма победила"
 ln_the_dark_won_modifier_desc:0 "Была война за рассвет, и она была проиграна. То, что осталось, правит тем, что осталось, и слушаются его из чего-то, что ближе к ужасу, чем к верности."
