l_russian:

 # AGOT: The Long Night & Azor Ahai -- the Wall.

 ln_man_an_empty_castle_decision:0 "Занять пустой замок"
 ln_man_an_empty_castle_decision_desc:0 "Вдоль Стены стоят девятнадцать замков. У Дозора хватает людей на три.\n\nОстальные открыты всем ветрам, и имена их всё ещё на картах. Лорд-командующий не может их занять. Но вы здесь, присягнувший и без дела.\n\n#T Что вы получаете#!\n#P Один из этих замков во владение вассалом лорда-командующего#! — собственное графство, его ополчение и гарнизон. Руину можно отстроить отдельным решением, когда будет чем платить.\n\n#weak Больше у вас ничего не отнимут. Клятва была уплачена, когда вы надели чёрное. Это лишь назначение.#!"
 ln_man_an_empty_castle_decision_tt:0 "Попросить у лорда-командующего один из пустующих замков Стены. Вы держите его как его вассал, и полоса льда теперь ваша забота.\n\n#weak Тот замок, который действительно пустует, а не какой-то определённый. Если Ночной Форт уже держит брат, вам достанется следующий свободный.#!"
 ln_man_an_empty_castle_decision_confirm:0 "Я буду его держать."
 ln_watch.1.t:0 "Теперь ваш"
 ln_watch.1.desc:0 "[ln_lord_commander.GetTitledFirstName] сам ведёт вас к воротам и внутрь не заходит.\n\n«У меня есть одиннадцать человек, которых я могу выделить, и четверо из них старше меня, — говорит он. — Припасы — это то, что в подвале, то есть ничего, а колодец промёрз восемь лет назад». Он поднимает взгляд на громаду стены. «Ему не нужно держать пять сотен. Ему нужно держать столько людей, чтобы вольный народ видел дым и шёл в другую сторону».\n\nА затем — единственное настоящее наставление, какое он вам даст:\n\n«Выберите одно дело и закончите его до зимы. Люди могут жить в руинах. Они не могут жить в одиннадцати недостроенных»."
 ln_watch.1.a:0 "Стены. Всё остальное — украшения."
 ln_watch.1.b:0 "Кухни. Кто ест, тот остаётся."
 ln_watch.1.c:0 "Библиотека. Кто-то ведь всё это записал."

 ln_watch.2.t:0 "Кротовый городок"
 ln_watch.2.desc:0 "Шестерых нет, и все прекрасно знают где.\n\nКротовый городок в миле к югу, по большей части под землёй, и по давней традиции там есть одно заведение, о котором Дозору знать не полагается и о котором Дозор знает восемь тысяч лет.\n\nВаш стюард доложил об этом с ровностью человека, который делал так и раньше и рассчитывает делать снова. Лорд-командующий и слушать не станет, если только кто-нибудь не сделает из этого дело.\n\nЭто ваш замок. И только вам решать, какого он рода."
 ln_watch.2.a:0 "Спуститься и притащить их обратно за шиворот."
 ln_watch.2.b:0 "Подайте плащ. Кто-то должен за ними присмотреть."
 ln_watch.2.c:0 "Пусть вернутся сами. А потом выпороть."

 ln_watch.3.t:0 "Кулак Первых Людей"
 ln_watch.3.desc:0 "Старый разведчик рассказывает это годами, и никто ни разу не пошёл проверить.\n\nК северу от Стены есть холм — кольцевое укрепление, поднятое Первыми Людьми ещё до того, как в Вестеросе появились короли, — и под его камнями будто бы зарыт схрон. Не золото. Кинжалы и наконечники копий из чёрного стекла, сотнями, положенные тем, кто точно знал, для чего они.\n\nОдиннадцать дней на север по хорошей погоде. Хорошей погоды не бывает. Половина ваших разведчиков считает это байкой для мальчишек, а вторая половина тихо принялась чинить сапоги."
 ln_watch.3.a:0 "Вести разведчиков на север. Перекопать весь холм, если понадобится."
 ln_watch.3.b:0 "Это байка о груде камней. У нас стены не чинены."

 ln_watch.4.t:0 "Тот, кто сбежал"
 ln_watch.4.desc:0 "Его взяли в девяти милях к югу — без плаща, без меча и в одном сапоге.\n\nЕму девятнадцать. Он на Стене четыре месяца. Он не оправдывается и не молит, и именно это останется с вами: он просто говорит, всё тем же ровным голосом, что назад туда он не пойдёт.\n\nЗакон несложен. Дезертир Ночного Дозора умирает. Второго приговора не бывает, потому что весь Дозор держится на том, что бежать некуда.\n\nНо он ни разу не попросил милости. Он трижды спросил, выслушает ли кто-нибудь сперва, что он видел."
 ln_watch.4.a:0 "Кто выносит приговор, тот и заносит меч."
 ln_watch.4.b:0 "Перед плахой. Расскажи, что ты видел."
 ln_watch.4.c:0 "Отправить его в Чёрный Замок. Это верёвка лорда-командующего."

 # ── REBUILDING ──────────────────────────────────────────────────────────────────────────────────────────────
 ln_rebuild_the_castle_decision:0 "Открыть ещё один замок"
 ln_rebuild_the_castle_decision_desc:0 "Он лежит в руинах дольше, чем любой из ныне живущих зовётся мужчиной.\n\nКамень по большей части на месте: замки на Стене строили те, кто ожидал, что они понадобятся. Нет крыши, ворот, оголовка колодца и всякой деревяшки — а это, вместе взятое, и есть почти весь замок и все деньги.\n\nКаменщики из Белой Гавани. Лес из Дара. Два сезона людей, которых надо кормить, и кузнец, желающий платы по чести, потому что он прекрасно знает, как сильно он вам нужен."
 ln_rebuild_the_castle_decision_tt:0 "Вернуть один из ваших разрушенных замков в строй: крышу, ворота и людей за ними.\n\nДорого, медленно и повторяемо. Таких девятнадцать, и вы можете держать несколько."
 ln_rebuild_the_castle_decision_confirm:0 "Послать за каменщиками."
 ln_rebuild_needs_the_coin:0 "Чтобы поднять замок из руин, нужно #V 400#! золота"

 ln_watch.5.t:0 "У него есть крыша"
 ln_watch.5.desc:0 "Последние леса сняли нынче утром, и каменщики уехали на юг той же телегой, на которой приехали.\n\nКрасиво не вышло. Новый камень другого цвета и таким останется, а на восточной стороне ряды не сходятся, потому что клали их два разных столетия.\n\nНо ворота закрываются, в колодце есть вода, и прошлой ночью — впервые за восемь поколений — кто-то спал в тепле в [ln_rebuilt_county.GetName]."
 ln_watch.5.a:0 "Послать весть в Чёрный Замок. Сказать, что замок занят."
 ln_watch.5.b:0 "Послать весть на юг. Пусть знают, что я отстроил."
 ln_black_needs_somewhere_for_the_realm_to_go:0 "У вас должен быть наследник или сюзерен, к которому отойдут ваши земли"
 ln_black_needs_a_castle_standing_empty:0 "У лорда-командующего должен быть пустующий замок"
 ln_black_not_at_war_with_the_watch:0 "Вы не можете воевать с Ночным Дозором"
 ln_black_needs_to_be_somebody:0 "Лорд-командующий отдаёт замки тем, кто способен их удержать: известное имя, лордство, которое можно сложить, рыцарские шпоры или люди за спиной"

 # ── BEGGING ─────────────────────────────────────────────────────────────────────────────────────────────────
 ln_petition_the_realm_decision:0 "Обратиться к государству"
 ln_petition_the_realm_decision_desc:0 "Дозор никогда себя не окупал и никогда не притворялся, будто окупает.\n\nС руин налога не собрать, а в замке, где никто не живёт, нет рынка. Что есть — так это восемь тысяч лет, за которые всякий лорд Севера смутно, раз в год и с лёгкой досадой понимал: люди на Стене и есть причина, по которой вольный народ находится по ту её сторону.\n\nИтак, вы пишете письма. Винтерфелл, Белая Гавань, Дредфорт, Последний Очаг, Кархолд и дюжина чертогов помельче, которые пришлют телегу репы и будут ждать письменной благодарности."
 ln_petition_the_realm_decision_tt:0 "Попросить Север вспомнить о Стене.\n\n#weak Чем холоднее, тем больше присылают. Лорду, который сам надел чёрное, должны услугу все, рядом с кем он когда-то сидел.#!"
 ln_petition_the_realm_decision_confirm:0 "Разослать письма."
 ln_petition_the_realm_effect_tt:0 "Попросить у северных домов монет и зерна. #weak Что придёт в ответ, зависит от того, насколько всё плохо.#!"
 ln_watch.6.t:0 "Телеги на Королевском тракте"
 ln_watch.6.desc:0 "Ответили девять домов. Четверо прислали по-настоящему, трое прислали хоть что-то, а двое прислали письмо с подробным объяснением, почему не могут прислать ничего, — на бумагу для этого ушло больше, чем стоит телега зерна.\n\nСтюард всё сосчитал и сложил и стоит, ожидая указаний, а за его спиной те, кто разгружал, делают вид, что не ждут того же самого.\n\nЭтого мало. Этого ни разу не было довольно. Но оно здесь."
 ln_watch.6.a:0 "Принять. Поблагодарить как должно. Через три года попросить снова."
 ln_watch.6.b:0 "Принять. И записать тех, кто не прислал ничего."

 # ── THE WATCH GOES ON ───────────────────────────────────────────────────────────────────────────────────────
 ln_watch.7.t:0 "И начинается мой дозор"
 ln_watch.7.desc:0 "Его сожгли на рассвете — потому что земля слишком твердая для иного и потому что известно, что бывает с теми, кого в ней оставляют.\n\nРечей не говорили. Кто-то произнёс слова — целиком, не тот короткий вариант, что читают новобранцам, — и все повторили их за ним, а потом занялся огонь и все разошлись по делам, потому что дозор нужно держать и ради такого он не останавливается.\n\nЗамок теперь ваш. И всё, что снаружи, тоже, а это хуже.\n\nНочь сгущается."
 ln_watch.7.a:0 "Слова те же самые. Произнесите их снова."

 # ── THE OTHER SIDE OF THE PETITION ──────────────────────────────────────────────────────────────────────────
 ln_send_men_and_grain_decision:0 "Послать людей и зерно на Стену"
 ln_send_men_and_grain_decision_desc:0 "Письмо лежит на столе уже месяц.\n\nЭто не совсем мольба. Это хуже мольбы — это список. Столько-то людей на Стене в этом году, столько-то в прошлом, столько-то замков стоят пустыми, а внизу, другой рукой, итог, который четыреста лет движется в одну сторону.\n\nНикто не заставит вас ответить. На памяти живущих никого не заставляли, — именно поэтому итог стал таким."
 ln_send_men_and_grain_decision_tt:0 "Отправить на север монету, зерно и людей.\n\n#weak Лорд-командующий это запомнит. И, потише, запомнит Стена: у государства, которое кормило Дозор, есть Дозор, которого ещё можно о чём-то просить.#!"
 ln_send_men_and_grain_decision_confirm:0 "Грузить телеги."
 ln_send_men_and_grain_effect_tt:0 "Выберите, сколько отправить на север. #weak Благодарность лорда-командующего соразмерна, а послужной список государства перед Стеной улучшается.#!"
 ln_donate_needs_the_coin:0 "Чтобы отправить что-то стоящее, нужно хотя бы #V 100#! золота"
 ln_watch.8.t:0 "Письмо со Стены"
 ln_watch.8.desc:0 "Ответ приходит быстрее, чем ушли телеги, и это кое-что говорит о том, сколько писем получает [ln_lord_commander.GetTitledFirstName].\n\nВ нём четыре строки. Он благодарит. Он перечисляет ровно то, что прибыло, и то, на что оно будет потрачено, словно ожидает проверки. А затем, без просьбы и слегка неловко, ещё одна строка той же рукой:\n\n«Большинство не отвечает. Я обнаружил, что размышлять о причинах не стоит»."
 ln_watch.8.a:0 "В архив. Кто-то ведь должен отвечать на такие письма."
 ln_watch.8.b:0 "В архив — и проследить, чтобы об этом заговорили."

 # ── A WALL WITH NO VACANCIES ────────────────────────────────────────────────────────────────────────────────
 ln_black_needs_a_castle:0 "Замок должен пустовать — или его должен держать брат, которому держать его не следует"
 ln_black_needs_someone_to_relieve:0 "Должен найтись брат, которого лорд-командующий отставил бы: неспособный, старше семидесяти или не принёсший полных обетов"
 ln_take_the_black_and_wait_decision:0 "Просить о командовании"
 ln_take_the_black_and_wait_decision_desc:0 "Каждый замок на Стене за кем-то числится. Это не то же самое, что каждый замок кем-то держится.\n\nСерый Дозор не присылал донесений четыре года. Хранителю Долгого Кургана восемьдесят один. Лорд-командующий знает об этом годами и не сделал ничего. Он ждал, когда попросите вы.\n\n#T Что вы получаете#!\n#P Тот самый замок, в течение двух недель#! — его графство, ополчение и гарнизон, и ту же дорогу к его восстановлению.\n\n#weak Никогда не замок игрока. Только брат под управлением игры: неспособный, старше семидесяти или не присягнувший полностью.#!"
 ln_take_the_black_and_wait_decision_tt:0 "Попросить лорда-командующего отставить брата, который больше не может держать свой замок. Он станет вашим в течение двух недель.\n\n#weak Только когда ничто не пустует. Замок игрока не отбирают никогда — лишь у брата под управлением игры: неспособного, старше семидесяти или не присягнувшего полностью.#!"
 ln_take_the_black_and_wait_decision_confirm:0 "Отправить всадника."
 ln_watch.9.t:0 "Всадник вернулся"
 ln_watch.9.desc:0 "Он не стал спорить. Именно это и останется с вами.\n\nВсадник привёз приказ, и он прочёл его, и без единого слова отдал ключи, книгу и печать, — а потом попросил, единственное, о чём попросил, позволить ему остаться стюардом, а не уезжать на юг.\n\nОн в том замке тридцать один год. Одиннадцать из них он был там единственным человеком.\n\nКлючи теперь на столе. Они тяжелее, чем вы ожидали, и их больше, чем дверей."
 ln_watch.9.a:0 "Стыдить его за это не станут. Дайте ему постель и должность."
 ln_watch.9.b:0 "У него было четыре года, чтобы прислать донесение. Пусть Стена увидит, чего это стоит."
 ln_watch.9.c:0 "Даром ничего не даётся. Что ж, подожду."

 ln_watch.10.t:0 "Сколько"
 ln_watch.10.desc:0 "Стюард ждёт с раскрытой книгой и имеет достоинство не смотреть на вас, пока вы решаете.\n\nТелеги во дворе. То, что на них ляжет, — это число, и это число зачтёт вслух на Стене человек, который вас никогда не видел, братьям, которые проедят его за зиму, которой вы не увидите.\n\n#weak Дозор ведёт список. Он короток, и его помнят долго.#!"
 ln_watch.10.a:0 "Телегу зерна. Чтобы заметили."
 ln_watch.10.b:0 "Припасов на сезон. Пусть хоть раз поедят по-человечески."
 ln_watch.10.c:0 "Опустошить казну. Каждую монету. Они — единственное, что стоит между нами и этим."
 ln_watch.10.d:0 "Не в этом году. Уберите письмо."

 ln_emptied_the_vaults:0 "Казна опустошена"

 # The Watch cannot secede from itself. See common/casus_belli_types/zz_ln_independence_war_shadow.txt.
 ln_cannot_forsake_the_watch:0 "Ни вы, ни тот, от кого вы хотите отделиться, не присягали Дозору. #weak Обет брата длится до самой смерти; независимости от него не существует, и от лорда-командующего нельзя отложиться.#!"

