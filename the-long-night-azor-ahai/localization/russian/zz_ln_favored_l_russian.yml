l_russian:

 # AGOT: The Long Night & Azor Ahai -- the Favored chain.

 ln_favored.1.t:0 "Первый из них"
 ln_favored.1.desc:0 "Он пришёл пешком из Волантиса.\n\nНе приплыл. Пришёл — пешком до моря, потом отработал переправу, потом снова пешком, и занимается он этим уже два года, и нынче утром он явился к вашим воротам с ногами в тряпье и спросил стражника — учтиво, на скверном общем, — тот ли это замок.\n\nОн не хочет денег. Он не хочет ни земли, ни места, ни письма. Он проделал очень долгий путь, чтобы постоять во дворе и посмотреть на вас, а потом, по всей видимости, пойти обратно.\n\nВаш управляющий ждёт распоряжения. И, менее очевидно, ждут все остальные во дворе."
 ln_favored.1.a:0 "Накормить, выслушать и отправить домой в сапогах."
 ln_favored.1.b:0 "Развернуть его. Это начинается здесь — или уже не остановится."
 ln_favored.1.c:0 "Дать ему постель. Человек, который идёт два года, стоит того, чтобы его оставить."

 ln_favored.2.t:0 "Есть и другой"
 ln_favored.2.desc:0 "В Мире есть человек с тем же притязанием.\n\nТамошний храм говорит это уже восемь месяцев: сын капитана, рождённый в год какой-то кометы, о которой вы никогда не слыхали, вышедший из горящего корабля без единой отметины. У них для него то же слово, какое у ваших жрецов для вас.\n\nПисьмо, сообщающее об этом, — от красного жреца, и оно совершенно деловито, потому что жрецы ни разу не говорили, что он будет только один. Это люди сами предположили.\n\nЭто вы предположили. И не замечали этого до нынешней минуты, читая письмо и обнаруживая, насколько вам это не нравится."
 ln_favored.2.a:0 "Хорошо. Пусть теперь походят поглазеть на него."
 ln_favored.2.b:0 "Написать ему. Что бы это ни было, мы оба внутри."
 ln_favored.2.c:0 "Он не тот. Сказать это — и сказать там, где слышат жрецы."

 ln_favored.3.t:0 "Отложите это"
 ln_favored.3.desc:0 "[ln_asker.GetTitledFirstName] явно это отрепетировал и договорит до конца, что бы вы ни делали с лицом.\n\n«Это чужое слово, милорд, из чужого огня, и его говорят о вас в ваших же чертогах люди, которые вам не подчиняются. Я не прошу вас в это не верить. Я прошу вас сказать один раз, вслух, что вы на это не притязаете. И только. Одна фраза — и оно умрёт».\n\nИ [ln_asker.GetSheHe] прав: умерло бы. Такое притязание держится ровно до тех пор, пока человек в его середине отказывается его опрокинуть, и это знают все в этой комнате, включая вас."
 ln_favored.3.a:0 "Тогда я от этого отрекаюсь. Громко и перед всеми вами."
 ln_favored.3.b:0 "Я на это не притязал. И отрекаться тоже не стану."
 ln_favored.3.c:0 "Я это оставляю себе. Скажите об этом в вашей септе на седьмой день."

 ln_favored.4.t:0 "Его сын смотрит"
 ln_favored.4.desc:0 "Этот человек умрёт нынче ночью, и все в комнате это знают, кроме, возможно, самого человека.\n\nЗа вами прибежал его сын. Бежал всю дорогу, не дал управляющему себя отговорить и стоит теперь в ногах постели с выражением, которое вы запомните: ещё не горе и не вполне надежда. Ожидание.\n\nВы здесь из-за того, что ваши жрецы о вас говорят. Мальчик услышал это в трактире и провёл последний день своего отца в вере, что рука на груди может что-то сделать.\n\nОна ничего не сделает. Вы почти совершенно уверены, что она ничего не сделает."
 ln_favored.4.a:0 "Положить руку ему на грудь. Быть добрым ничего не стоит."
 ln_favored.4.b:0 "Вывести мальчика в коридор и сказать ему правду."

 ln_favored.5.t:0 "Тогда докажите"
 ln_favored.5.desc:0 "Жаровня небольшая, и горит она с полудня.\n\nПредложение было сделано без злобы, и от этого почему-то хуже. Один из жрецов сказал это почти тепло, как способ прекратить спор: избранные Рглором не горят. Половина чертога сочла это отличной мыслью, ещё не дослушав.\n\nЖаровня у вашего локтя. Комната затихла тем самым особым образом. А вы перебираете единственное обстоятельство, которое важно: вы понятия не имеете, правдива ли история о том, что они не горят, и выяснить это можно ровно одним способом."
 ln_favored.5.a:0 "Сунуть в неё руку. Пусть огонь решает, кто я."
 ln_favored.5.b:0 "Нет. А тот, кто это предложил, пусть поищет себе другой чертог."

 ln_favored.6.t:0 "Он хочет огня"
 ln_favored.6.desc:0 "Человека он уже выбрал: налётчик, взятый весной, которого через две недели повесят, и не хватится его ровным счётом никто.\n\n«Вы задаёте не тот вопрос, — говорит жрец. — Через четырнадцать дней он умрёт в любом случае. На верёвке он умрёт ни за что. В огне он умрёт за рассвет, и Владыка отметит того, кто его дал». Всё это он говорит тоном управляющего, предлагающего закупить зерна.\n\nХудшее здесь — арифметика. Жизни это и правда не стоит. Это стоит того, ЧЕМ будет ваш чертог, — однажды, у всех на глазах, и нет такой версии, в которой люди забудут, куда вы шагнули."
 ln_favored.6.a:0 "Нет. Пока я держу этот чертог — нет."
 ln_favored.6.b:0 "Пусть горит. Ему всё равно была верёвка."

 ln_favored.7.t:0 "Перейдёт ли это ко мне?"
 ln_favored.7.desc:0 "[ln_asker.GetTitledFirstName] спрашивает это прямо, за счетами, не поднимая глаз.\n\n«Когда всё это будет моим — престол, люди, всё. Та, другая вещь переходит вместе с этим?»\n\nТревога под вопросом — не жадность. [ln_asker.GetSheHe|U] насмотрелся, что это имя делает с чертогом, и хочет знать, не заденет ли оно и [ln_asker.GetHerHim].\n\nВы понятия не имеете. Пророчество — о человеке. Никто никогда не объяснял, что бывает, когда у этого человека появляются дети."
 ln_favored.7.a:0 "Нет. Это не титул. Его нельзя унаследовать."
 ln_favored.7.b:0 "Я не знаю. Никто не знает. Вот честный ответ."
 ln_favored.7.c:0 "Пусть думают, что переходит. Нам это ничего не стоит."

 ln_favored.8.t:0 "Чудо"
 ln_favored.8.desc:0 "Слепая девочка в деревне в двух днях к югу видит. Это случилось в тот миг, когда вы проезжали мимо, и теперь в той деревне четыреста человек, которых на прошлой неделе там не было.\n\nОна никогда не была слепой. Всё устроил её дядя, и он берёт монету у святилища, которое поставил у себя во дворе. Это даже не хороший обман — трое в той деревне распутали бы его за полдня, и ни один не станет, потому что эти четыреста покупают хлеб и пиво, и такого года у деревни не было никогда.\n\nА ваши жрецы в восторге. Они разносят это до самого Перешейка."
 ln_favored.8.a:0 "Разоблачить всё это на площади, самому."
 ln_favored.8.b:0 "Ничего не говорить. История хорошая, и работу она делает хорошую."
 ln_favored.8.c:0 "Выяснить, кто заплатил дяде. Кто-то заплатил."

 ln_favored.9.t:0 "Вам кое-что построили"
 ln_favored.9.desc:0 "Оно на перекрёстке под замком, и поднялось примерно за месяц.\n\nТе, кто его строил, понятия не имели, что делают. Там есть ночной костёр — а это дело красных жрецов, — и лик чардрева, вырезанный на столбе, и красное полотно того рода, какой узнал бы септон. Это не храм чего бы то ни было. Это святилище ВАМ, собранное из всех вер, о каких строители когда-либо слышали.\n\nОни приходят в сумерках. Немного и негромко. Ваш септон это видел и ничего не сказал, что для него — заявление. Ваш красный жрец это видел и тоже ничего не сказал, а это заявление посильнее."
 ln_favored.9.a:0 "Разобрать его, пока это не сделал кто-нибудь другой."
 ln_favored.9.b:0 "Оставить. Пусть у них что-то будет."

 ln_favored.10.t:0 "Тогда идёмте с нами"
 ln_favored.10.desc.open:0 "Они проделали долгий путь, чтобы спросить, и привезли карту.\n\nРазведчик, красный жрец и рыцарь, чей брат не вернулся из похода, и на троих у них есть замысел, который на самом деле не безумен: люди, припасы, сезон, путь мимо Сумеречной башни. Чего у них нет — так это причины, по которой кто-нибудь за ними пойдёт.\n\nОни хотели бы, чтобы этой причиной были вы.\n\n"
 ln_favored.10.desc.ordeal:0 "«Они видели, как вы сунули руку в ту жаровню, — говорит рыцарь. — Полсевера об этом уже слышало. Вам не надо там наверху ничего делать. Надо, чтобы видели, как вы идёте»."
 ln_favored.10.desc.lie:0 "Вы думаете о деревне в двух днях к югу, о четырёхстах людях и о девочке, которая всегда прекрасно видела. Всё, что вам предлагают, стоит на земле того же сорта."
 ln_favored.10.desc.quiet:0 "Вы ни разу сами не произнесли этого слова. Вы замечаете, что и они вас об этом не просили. Они просто приехали и начали строить планы, будто дело решено, — а оно, судя по всему, решено для всех, кроме вас."
 ln_favored.10.desc.plain:0 "Жрец пока не сказал вообще ничего. Он даёт говорить двум другим, и по этому вам понятно, кто это придумал."
 ln_favored.10.desc.close:0 "\n\nКарта всё ещё на столе. Никто её не свернул."
 ln_favored.10.a:0 "Тогда я иду с вами на север."
 ln_favored.10.b:0 "Вы получите людей и монету. Я остаюсь."
 ln_favored.10.c:0 "Нет. Я лорд, а не знамение."

 # ── THE SHRINE ──────────────────────────────────────────────────────────────────────────────────────────────
 ln_shrine_county_modifier:0 "Святилище на перекрёстке"
 ln_shrine_county_modifier_desc:0 "Ночной костёр, лик чардрева и подкова — в одной маленькой постройке. Те, кто приходит сюда в сумерках, не вполне уверены, чему поклоняются, и, похоже, их это не тревожит."

 # ── THE ORDEAL, ANSWERED ────────────────────────────────────────────────────────────────────────────────────
 ln_favored.11.t:0 "Рука"
 ln_favored.11.desc:0 "Мейстер снимает последний слой повязки и потом какое-то время ничего не говорит, а для него это почти крик.\n\nРука в рубцах и останется такой навсегда. Молчит он не поэтому. А потому, что рука работает — каждый палец, полная сила, никакого гниения, и закрылась она за недели. В ту ночь он велел вам готовиться потерять два пальца, а возможно, и всю руку.\n\n«Я хотел бы это описать, — говорит он наконец. — Я ничего об этом не утверждаю. Я просто хотел бы, чтобы это было где-нибудь записано».\n\nСнаружи кто-то, кто был в тот вечер в чертоге, рассказывает это тому, кого там не было."
 ln_favored.11.a:0 "Он свою часть исполнил. Сказать это — и сказать громко."
 ln_favored.11.b:0 "Это рубец. Люди получают рубцы, и люди заживают."

 ln_the_hand_that_did_not_burn_modifier:0 "Рука, которая не сгорела"
 ln_the_hand_that_did_not_burn_modifier_desc:0 "Держал её в жаровне перед полным чертогом, и она до сих пор смыкается на рукояти меча. Никто из тех, кто был в той комнате, не перестал об этом рассказывать."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_favored.1.d:0 "Мне знакомо его лицо. Знакомо уже два года — просто мне не приходило в голову, что это лицо."
 ln_favored.10.desc.knew:0 "Вы всё возвращаетесь к человеку, который пришёл из Волантиса.\n\nВы знали его лицо прежде, чем он его поднял. Ниоткуда — вы просто два года носили его за глазами и принимали за очертание в огне. Он прошёл через весь мир, чтобы на вас посмотреть, а вы уже смотрели на него.\n\nВсё, что было потом, имело то же свойство. Не откровение. Узнавание, приходящее с небольшим опозданием."
