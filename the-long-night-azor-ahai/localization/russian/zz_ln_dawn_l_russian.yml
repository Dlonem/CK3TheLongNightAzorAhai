l_russian:


 # AGOT: The Long Night & Azor Ahai -- the killing blow.

 ln_dawn.2.t:0 "Поле после"
 ln_dawn.2.a:0 "Покончить с этим."
 ln_dawn.2.b:0 "Трубить отход. Не сегодня и не с этим."

 ln_dawn.2.desc.lightbringer:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас так, как человек смотрит на погоду, и холод, идущий от него, делает с воздухом что-то такое, отчего трудно смотреть прямо.\n\nМеч у вашего бедра тёплый. Он тёплый с той ночи, когда вы его закончили, и ни разу не был тёплым в удобную минуту, — он тёплый сейчас, на поле, где всё живое затихло, и вы понимаете: чем бы вы за него ни заплатили, платили именно за этот час.\n\n#bold Лучшего не будет.#!"
 ln_dawn.2.desc.dragon:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит вверх. Не на вас — на то, что над вами, на жар, идущий от него волнами, что обращают иней в туман на сотню ярдов во все стороны.\n\nВсю вашу жизнь вам говорили, что прошлую кончили драконы. Никто никогда не говорил, пережил ли это дракон.\n\n#bold Он смотрит вверх. Он не отвёл взгляда.#!"
 ln_dawn.2.desc.valyrian:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас с выражением, которое не вполне интерес. За ним поле белое и совершенно неподвижное.\n\nКлинок у вашего бедра сковали в городе, который вот уже четыреста лет пепел, люди, знавшие то, чего с тех пор не знает никто. Он рассекал кольчугу, кость и изрядное количество обычной стали, и вам ни разу не требовалось от него быть чем-то большим, чем очень хороший меч.\n\n#bold Сегодня тот день, когда он либо больше, либо нет.#!"
 ln_dawn.2.desc.glass:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас, а каждый ещё стоящий на ногах у вас за спиной держит колотый чёрный нож, о котором мейстеры сказали, что это перевод хорошего золота.\n\nОн разлетается о кольчугу. Он не держит лезвия. Дети Леса восемь тысяч лет пускали его в ход против того, чего, по твёрдому убеждению Цитадели, никогда не существовало, — и вы поверили детям.\n\n#bold Сейчас вы узнаете, чего это стоило.#!"
 ln_dawn.2.desc.named:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас. Жрецы годами произносили ваше имя — в храмах, на рыночных площадях, всякому, кто постоит смирно, — и то, что перед вами, судя по всему, не слышало из этого ничего.\n\nУ вас нет меча, который узнали бы песни. У вас есть то, чем вас песни назвали.\n\n#bold Будет либо одно, либо другое, и вы вот-вот узнаете, что именно.#!"
 ln_dawn.2.desc.nothing:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас, а вы несёте хороший меч, который не сделает ровным счётом ничего.\n\nВы это знаете. Это знает каждый у вас за спиной. Сталь — для людей. То, что стоит посреди этого поля, человеком не было уже очень давно, и единственное честное, что можно сказать о выходе ему навстречу: кто-то должен быть первым.\n\n#bold Кто-то должен быть первым.#!"

 ln_dawn.3.t:0 "#e Рассвет#!"
 ln_dawn.3.desc:0 "#e Оно падает не так, как падает человек.\n\n Раздаётся звук, как будто весной вскрывается озеро, и очертание перед вами распадается — не на куски, а в погоду, в холод, который проходит через поле, выходит с той стороны и просто исчезает.\n\n А за ним, по всему льду, мёртвые останавливаются.\n\n Десять тысяч, посреди шага, и все разом оседают в то, чем всегда были: чей-то брат, чей-то отец, мальчишка из деревни, которую уже много лет никто не может найти на карте. На поле вдруг делается очень шумно, потому что живые всё ещё дышат, а больше ничто не издаёт ни звука.\n\n Кто-то выкрикивает ваше имя. Кто-то другой начал смеяться и не может перестать.\n\n #bold Долгая Ночь кончилась, и кончили её вы.#!#!"
 ln_dawn.3.a:0 "Привести ко мне каждого, кто ещё стоит на ногах. Я хочу их имена."

 ln_dawn.4.t:0 "Недостаточно"
 ln_dawn.4.desc.shield:0 "Вы делаете три шага.\n\nХолод выбивает из вас дыхание раньше, чем удар, — а удара нет, потому что перед вами [ln_dawn_shield.GetTitledFirstName|E].\n\n[ln_dawn_shield.GetSheHe|U] не говорит ничего складного. [ln_dawn_shield.GetSheHe|U] поднимает [ln_dawn_shield.GetHerHis] щит, и держит, и всё ещё держит, когда тварь пробивает щит и пробивает [ln_dawn_shield.GetHerHim] насквозь, а вас тащат назад люди, выкрикивающие слова, которых вы не слышите.\n\nВы не были готовы. [ln_dawn_shield.GetSheHe|U] понял это раньше вас — и всё равно сделал, и в этот миг в этом вся разница между вами двумя.\n\n#bold Вы живы. Запишите, что сделал [ln_dawn_shield.GetSheHe].#!"
 ln_dawn.4.desc.alone:0 "Вы делаете три шага.\n\nХолод выбивает из вас дыхание раньше, чем удар, а дальше поле — это в основном шум и земля, оказывающаяся не там, где надо. Кто-то держит вашу руку с мечом. Кто-то кричит на трубачей.\n\nВы приходите в себя на волокуше, с собственной кровью, замёрзшей вдоль одной стороны лица, и с изрядным количеством крови не вашей, и первое, что вы понимаете, — оно вас отпустило.\n\nНе пощадило. Отпустило — так, как откладывают вещь, которую закончили разглядывать.\n\n#bold Вы живы и в точности узнали, чего стоит ошибиться на этот счёт.#!"
 ln_dawn.4.a:0 "Тогда мы сделаем это снова, и лучше."

 # -- THE MAN WHO HAS BEEN HERE BEFORE ------------------------------------------------------------------------
 # Both keep the opening line every other ln_dawn.2 branch opens with, on purpose: it is the same field.
 ln_dawn.2.desc.again:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас, а вы уже были к нему ровно так же близко однажды. С того поля вы не столько ушли, сколько вас с него унесли, и чего стоило хотя бы это, вы вслух не говорили никогда.\n\nОн не постарел. Он ничего не залечил. Похоже, он вас вовсе не помнит — счёт из вас двоих ведёте только вы.\n\nВ ваших руках нет ничего, достойного имени. Но вы знаете, как оно движется, и больше из живых этого не знает никто."
 ln_dawn.2.desc.twice:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас. В прошлый раз, когда вы стояли в поле, а эта тварь была на другом его конце, вы отдали приказ отходить — и ваш двор вернулся домой живым, и все годы с тех пор вам говорили, что решение было верным, люди, которых там не было.\n\nВы несёте хороший меч, который не сделает ровным счётом ничего. В прошлый раз вы несли такой же.\n\nРазница в том, что каждый у вас за спиной уже знает, как вы поступили, и ждёт, поступите ли вы так во второй раз."

 # ── 1.0.15 -- воронка развязки ──────────────────────────────────────────────────────────────────────────

 ln_dawn.11.t:0 "Последний час"
 ln_dawn.11.desc.field_lb:0 "Война решена. Воинства мёртвых разбиты, рассеяны и сожжены длинными валами вдоль льда — а их король стоит один посреди этих руин и смотрит только на вас.\n\nЛюди гибли числом, которое ни один мейстер не сочтёт верно, чтобы этот час настал, — и всё сводится в итоге к малому кругу истоптанного снега и к мечу, который был тёплым у вашего бедра с того дня, как вы его закончили.\n\nОстальные держатся позади. Никто им этого не приказывал.\n\n#bold Война выиграна. А это — то, что никогда не было про войну.#!"
 ln_dawn.11.desc.field_plain:0 "Война решена. Воинства мёртвых разбиты, рассеяны и сожжены длинными валами вдоль льда — а их король стоит один посреди этих руин и смотрит только на вас.\n\nИз всех рук, что держали меч в этой войне — названных, помазанных, тех, в ком жрецы были так уверены, — час выбрал вашу. Ни одна песня к этому вас не готовила. Возможно, песни всегда были именно для этого: для человека, которого в них не упоминают.\n\n#bold Война выиграна. А это — то, что никогда не было про войну.#!"
 ln_dawn.11.desc.chains_lb:0 "Его привели в старом железе и драконьем стекле, и холод вошёл вместе с ним.\n\nТри дня он стоит в ваших подземельях, и ничто в нём не делает того, что делает пленник. Он не ест. Он не спит. Стража перестала тянуть жребий, кому нести ему воду, потому что вода становится льдом раньше, чем доходит до двери.\n\nВ этом замке есть одна вещь, у которой есть на него ответ, и она тепла в ножнах с того часа, как его протащили в ваши ворота.\n\n#bold Темница не удержит зиму. Кончайте с этим, пока это ваше право.#!"
 ln_dawn.11.desc.chains_plain:0 "Его привели в старом железе и драконьем стекле, и холод вошёл вместе с ним.\n\nТри дня он стоит в ваших подземельях, и ничто в нём не делает того, что делает пленник. Он не ест. Он не спит. Он смотрит на дверь — не так, как смотрят в ожидании спасения, а так, как море смотрит на стену гавани.\n\nКаждый час, что он там стоит, иней поднимается ещё на один камень, и каждый в вашем замке знает, откуда он идёт.\n\n#bold Темница не удержит зиму. Кончайте с этим, пока это ваше право.#!"
 ln_dawn.11.a:0 "Положить конец Долгой ночи."
 ln_dawn.11.b:0 "Этот час принадлежит другому. Послать за ним."
 ln_dawn.11.c:0 "У нас нет ничего, что могло бы его прикончить. Отходим."
 ln_dawn.11.c_tt:0 "Уничтожить его может только #bold драконье стекло#!, #bold валирийская сталь#! или #bold драконье пламя#!. У вас нет ни одного из трёх.\n\nВойна выиграна в любом случае — но Долгая ночь не кончится, пока не кончится он."

 ln_dawn.20.t:0 "То, что в ваших подземельях"
 ln_dawn.20.desc.other:0 "Ваш тюремщик служит в этом замке тридцать лет, и сегодня утром он не пошёл вниз по лестнице один.\n\nТварь, взятая вами живой, стоит посреди камеры — стоит с той минуты, как закрыли дверь, ровно посередине, так далеко от каждой стены, как только может стоять существо. Иней пополз по камням вокруг неё узорами, на которые никто не соглашается смотреть долго. Она не просила выкупа. Она не просила суда. Она не издала ни звука.\n\nОна ждёт, и каждый в вашем замке чувствует, чего именно.\n\n#bold Холод не сдаётся. Он лишь ждёт.#!"
 ln_dawn.20.desc.wight:0 "Оно мертво уже некоторое время. В этом и беда.\n\nТо, что ваши люди притащили внутрь, не перестаёт двигаться. Оно работало над цепями, пока с костей не сошло мясо, а потом продолжило работать, и звук этого — терпеливый, неутомимый, всю ночь — опустошил камеры по обе стороны. Тюремщик почтительно спрашивает, намерен ли мой лорд оставить его себе, и если да, не пожелает ли мой лорд сперва послушать его в течение часа.\n\n#bold Мясо не останавливается. Останавливает огонь.#!"
 ln_dawn.20.a:0 "Предать мечу. Немедленно."
 ln_dawn.20.b:0 "Держать внизу. Пусть королевство знает, что я держу."

 # ── 1.0.15 -- поединок ──────────────────────────────────────────────────────────────────────────────────
 ln_dawn.2.duel.win:0 "Нанести удар"
 ln_dawn.2.duel.lose:0 "Не дотянуться"
 ln_dawn.2.d:0 "Всё равно выйти. Кто-то должен быть первым."
 ln_dawn.2.d_tt:0 "У вас нет ничего, что могло бы ему повредить, — ни #bold драконьего стекла#!, ни #bold валирийской стали#!, и над вами нет дракона.\n\nСегодня вы его не убьёте. Но люди запомнят, что вы вышли."

# 1.1.1 -- keys added in English so nothing renders raw. Untranslated until replaced.
 ln_dawn.2.desc.dragon_refused:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\n[ln_dawn_dragon.GetTitledFirstName] здесь нет. Дальше Стены [ln_dawn_dragon.GetSheHe|U] не идёт: шипит, отворачивает, не слушается — трижды, а потом и вовсе, — и в конце концов вы оставляете [ln_dawn_dragon.GetHerHim] на южной её стороне и остаток пути на север идёте пешком, как все прочие.\n\nВсё, что вы собирались сделать с тем, что стоит посреди этого поля, вы собирались сделать с четырёхсот футов высоты.\n\n#bold Вы пешком. Он смотрит прямо на вас.#!"
 ln_dawn.2.desc.spear:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас, а где-то к северу отсюда — очертание, которое вы узнали бы на любом расстоянии и при любом свете, и оно летит к нему.\n\nВы были к этой твари ближе, чем кто-либо из живых. Вы в тот миг падали. Вы помните, как поднялась рука, и звук, который вырвался у [ln_spear_dragon.GetFirstName], и как пришла земля.\n\nОн вас знает. Это видно по тому, как он неподвижен."
 ln_dawn.2.desc.spear_unnamed:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас, а где-то к северу отсюда — очертание, которое вы узнали бы на любом расстоянии и при любом свете, и оно летит к нему.\n\nВы были к этой твари ближе, чем кто-либо из живых. Вы в тот миг падали. Вы помните, как поднялась рука, и звук, который издал ваш дракон, и как пришла земля.\n\nОн вас знает. Это видно по тому, как он неподвижен."
 ln_dawn.2.desc.dawn:0 "Его воинство разбито и рассеяно по льду, а сам он не двинулся.\n\nОн стоит там, где был строй, и смотрит на вас, а меч в ваших руках цвета молока и звёздного света и этому веку не принадлежит.\n\nРассвет закалили в падающей звезде раньше, чем появились мейстеры, чтобы это записать. У вас он не попросил ничего, но однажды попросил у кого-то всё, и всё это время он ждал утра в точности такого, как это.\n\nОн не тёплый. Он никогда не был тёплым. Он просто не сломается."
 ln_dawn.2.c:0 "Мне уже известно, как это пойдёт."
 ln_dawn.2.c_tt:0 "Это поле вам снилось. Вы знаете, в какую сторону он двинется первым.\n\n#weak Шансы лучше, чем в том же бою наугад, — но знать не то же, что быть готовым. Нести это вам в любом случае.#!"
 ln_dawn.11.duel.win:0 "Покончить с ним"
 ln_dawn.11.duel.lose:0 "Он быстрее вас"
 ln_dawn.20.desc.knew_spouse:0 "\n\n#EMP Вы были с этим в браке.#!\n\nДвое в вашем доме это знают. Ни один из них не может взглянуть на вас с того часа, как телега прошла в ворота, а вы так и не сошли в клети, и всякий в этой крепости точно знает, почему приказ до сих пор не отдан.\n\n[ln_captured_other.GetHerHim] так никто и не обрядил. [ln_captured_other.GetSheHe|U] до сих пор в том, в чём вы [ln_captured_other.GetHerHim] видели в последний раз."
 ln_dawn.20.desc.knew_lover:0 "\n\n#EMP Вы это знали, и не так, как знают своих знаменосцев.#!\n\nБыл вариант, в котором вам так и не пришлось бы узнать, что было потом. Этот вариант кончился, когда ваши люди провели телегу в ворота и кто-то во дворе произнёс имя вслух, а потом произнёс его снова, тише, потому что в первый раз это не прозвучало вопросом.\n\nОно вас не знает. Вот это вы и сохраните."
 ln_dawn.20.desc.knew_blood:0 "\n\n#EMP Это ваша кровь.#!\n\nУ вашего дома есть склеп, есть каменщик и восемьсот лет навыка погребать своих, и здесь всё это ни к чему, потому что то, что в клети, стоит на ногах. С септоном посоветовались, и септон ушёл советоваться с кем-то ещё.\n\nЧто бы вы ни решили, это запишут и поставят рядом ваше имя, и ваши внуки это прочтут."
 ln_dawn.20.desc.knew_friend:0 "\n\n#EMP Вы это знали. Когда-то знали хорошо.#!\n\nОно пило в вашем чертоге. У него было мнение о вашем стюарде, которое вы повторяете до сих пор. В казармах кто-то рассказывал эту историю в прошлом месяце, а теперь её не рассказывает никто, и у этой тишины есть очертание.\n\nВы уложили десяток таких и не думали об этом вовсе. В том и был смысл десятка."
 ln_dawn.20.desc.knew_nobody:0 ""
 # ── 1.1.3 -- карточка низвержения: он не уничтожен ────────────────────────────────────────────────
 ln_dawn.30.t:0 "Он не уничтожен"
 ln_dawn.30.desc.dragon:0 "Король Ночи пал от пламени [ln_dawn30_killer.GetFirstName] в гуще битвы, и мёртвые не остановились. Через считанные дни он снова стоял среди них — то же лицо, тот же холод.\n\nДракона в гуще битвы мало. С ним нужно сойтись лицом к лицу.\n\n"
 ln_dawn.30.desc.bane:0 "[ln_dawn30_killer.GetTitledFirstName] сразил Короля Ночи тем, что могло бы его прикончить, — не в том месте и не в тот час, — и мёртвые не остановились. Через считанные дни он снова стоял среди них — то же лицо, тот же холод.\n\nВерного оружия мало. С ним нужно сойтись лицом к лицу.\n\n"
 ln_dawn.30.desc.nokiller:0 "Король Ночи мёртв, и ничья рука не берёт это на себя. Мёртвые не остановились. Через считанные дни он снова стоял среди них — то же лицо, тот же холод.\n\nЧто бы ни кончило тело, оно не кончило того, что его носило.\n\n"
 ln_dawn.30.desc:0 "Король Ночи пал, а мёртвые не остановились. Через считанные дни он снова стоял среди них — то же лицо, тот же холод.\n\nСталь кончает тело. Она не кончает то, что его носит.\n\n"
 ln_dawn.30.desc.rule.death:0 "Он уничтожен лишь тогда, когда с ним сходятся лицом к лицу — в поле после разгрома его войска, загнанным после проигранной Войны за Рассвет или в цепях — рукой, держащей драконье стекло, валирийскую сталь или Светозарный, либо под крылом дракона. Любая другая смерть лишь низвергает его."
 ln_dawn.30.desc.rule.war:0 "В этом мире тьма отступает лишь тогда, когда Война за Рассвет выиграна и с ним сходятся в её конце — рукой, держащей драконье стекло, валирийскую сталь или Светозарный, либо под крылом дракона. Любая смерть до того лишь низвергает его."
 ln_dawn.30.desc.beaten:0 "\n\nТеперь можно объявить Войну за Рассвет."
 ln_dawn.30.desc.notbeaten:0 ""
 ln_dawn.30.a:0 "Значит, это не конец."
