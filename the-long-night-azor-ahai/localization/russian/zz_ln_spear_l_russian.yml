l_russian:
# 1.1.1 -- scaffolded from the English file so no key renders raw in Russian. Untranslated; English text until replaced.

 # AGOT: The Long Night & Azor Ahai -- the spear.
 # TOKEN FORM: bare saved-scope names, the form the rest of this mod uses and the one proven live.
 # A dragon is an ordinary character in AGOT, so the person promotes work on it normally.

 ln_spear.1.t:0 "С неба"

 ln_spear.1.desc.lived_champion:0 "Поле решено. Отсюда, сверху, мне не разобрать, в чью сторону, и какое-то мгновение мне почти всё равно.\n\nПотом [ln_spear_dragon.GetFirstName] заваливается на крыло для нового захода, и внизу, на льду, что-то поднимает руку.\n\nКопья я не вижу. Я вижу, как левое крыло [ln_spear_dragon.GetFirstName] перестаёт работать — бьёт, а потом его просто нет, — и слышу, как из [ln_spear_dragon.GetHerHim] выходит звук, который я буду слышать до конца своих дней.\n\nМы падаем вместе. Я помню, как земля приходила очень быстро и была очень белой, и помню, как подумал — с ясностью, которая пугает меня больше, чем пугало падение, — что кончается это не так.\n\nЯ переломан во множестве мест и стою на ногах в пределах часа, и люди, вытащившие меня из обломков [ln_spear_dragon.GetHerHim], не смотрят мне прямо в лицо. Один из них принялся молиться на языке, которого я не знаю. Чего бы красный бог от меня ни хотел, спрашивать он, очевидно, ещё не закончил.\n\n#bold Оно стоит на льду в миле отсюда и смотрит на меня, и, думаю, никто из нас двоих не удивлён.#!"

 ln_spear.1.desc.lived:0 "Поле решено. Отсюда, сверху, мне не разобрать, в чью сторону, и какое-то мгновение мне почти всё равно.\n\nПотом [ln_spear_dragon.GetFirstName] заваливается на крыло для нового захода, и внизу, на льду, что-то поднимает руку.\n\nКопья я не вижу. Думаю, копья не видит никто. Я вижу, как левое крыло [ln_spear_dragon.GetFirstName] перестаёт работать — бьёт, а потом его просто нет, — и слышу, как из [ln_spear_dragon.GetHerHim] выходит звук, который я буду слышать до конца своих дней.\n\nМы падаем вместе. Я помню, как земля приходила очень быстро и была очень белой. Как я в неё ударился, я не помню.\n\nТеперь надо мной стоят люди и кричат что-то, из чего я не слышу ничего. Левая сторона не отвечает, когда я её прошу, и крови очень много, и я почти уверен, что она моя. [ln_spear_dragon.GetFirstName] в двухстах ярдах, из [ln_spear_dragon.GetHerHis] рта идёт пар, и больше ничто в [ln_spear_dragon.GetHerHim] не движется.\n\n#bold Туда, наверх, они дотянуться не могли никогда. В этом было всё. Это было единственное, что у нас было.#!"

 ln_spear.1.desc.died:0 "Поле решено. Отсюда, сверху, мне не разобрать, в чью сторону, и какое-то мгновение мне почти всё равно.\n\nПотом [ln_spear_dragon.GetFirstName] заваливается на крыло для нового захода, и внизу, на льду, что-то поднимает руку.\n\nКопья я не вижу. Я вижу, как левое крыло [ln_spear_dragon.GetFirstName] перестаёт работать — бьёт, а потом его просто нет, — и горизонт заходит туда, куда горизонты не ходят.\n\nМы падаем вместе. Есть в этом отрезок, который длится дольше, чем имеет на то право: земля ещё далеко, держаться решительно не за что, и у меня есть время на одну ясную мысль.\n\n#bold Туда, наверх, они дотянуться не могли никогда.#!"

 ln_spear.1.a:0 "Поднимите меня. Я хочу видеть, что оно сделало с [ln_spear_dragon.GetFirstName]."
 ln_spear.1.a.champion:0 "Поднимите меня. Теперь оно видело моё лицо, и я хочу, чтобы оно видело меня стоящим."
 ln_spear.1.b:0 "Значит, вот как это бывает."

 # ── THE TAKEN DRAGON'S RECORD (1.0.12b) ─────────────────────────────────────────
 ln_dragon_taken_memory:0 "забран копьём Короля Ночи"
 ln_dragon_taken_memory_desc:0 "Сбит с неба копьём Короля Ночи и поднят прежде, чем тело остыло. Крылья всё ещё летают. За глазами не осталось ничего из того, что было."
 ln_dragon_taken_memory_desc_second_perspective:0 "Ваш дракон был сбит с неба копьём Короля Ночи и поднят прежде, чем тело остыло. Он всё ещё летает. Он не ваш, и он больше не он."
 ln_dragon_taken_memory_desc_third_perspective:0 "Этот дракон был сбит с неба копьём Короля Ночи и поднят прежде, чем тело остыло. Теперь он летает за мёртвых."

 # ── THE EMPTY SKY (1.0.12b) ─────────────────────────────────────────────────────
 ln_spear.2.t:0 "Пустое небо"
 ln_spear.2.desc:0 "Лубки с моей руки снимут через месяц, говорят мне. Что снимут с остального, мне не говорит никто.\n\nЯ всё ещё делаю это — прислушиваюсь к [ln_spear_dragon.GetHerHim]. Десять лет знать, где [ln_spear_dragon.GetSheHe], так, как знаешь, где твоя собственная рука, — и это знание всё ещё здесь, только цвет у него стал не тот. [ln_spear_dragon.GetSheHe|U] к северу от меня. [ln_spear_dragon.GetSheHe|U] теперь всегда к северу от меня.\n\nВчера пришёл пастух и клялся, что видел [ln_spear_dragon.GetFirstName] над гребнем, и чертог умолк, потому что все знают, чьим [ln_spear_dragon.GetSheHe] был. Бледный, сказал он. Как иней с крыльями. Всё ещё [ln_spear_dragon.GetHerHim]. Вот чего мой разум не может удержать: это всё ещё [ln_spear_dragon.GetHerHis] облик, всё ещё [ln_spear_dragon.GetHerHis] взмах крыла, всё ещё та самая манера, с какой [ln_spear_dragon.GetSheHe] заваливается влево, прежде чем [ln_spear_dragon.GetSheHe] сядет.\n\nДело лишь в том, что [ln_spear_dragon.GetSheHe] больше не сядет ради меня."
 ln_spear.2.desc.gone:0 "Мне говорят, что [ln_spear_dragon.GetFirstName] мёртв — мёртв по-настоящему, добит где-то к северу от Стены, и на этот раз ничто не поднялось снова.\n\nЯ думал, что будет хуже, чем в первый раз. Нет. В первый раз мёртвые взяли [ln_spear_dragon.GetHerHis] облик и носили его, как украденный плащ, и каждая весть о бледных крыльях над лесом была во мне крючком.\n\nТеперь небо просто пусто. Пустое небо всадник оплакать может."
 ln_spear.2.a:0 "[ln_spear_dragon.GetSheHe|U] мой. Я верну [ln_spear_dragon.GetHerHim] — или сам добью [ln_spear_dragon.GetHerHim]."
 ln_spear.2.b:0 "Дайте мне посидеть с этим. [ln_spear_dragon.GetSheHe|U] этого заслужил."
 ln_spear.2.c:0 "Огонь забрал [ln_spear_dragon.GetHerHim] и оставил меня. Огонь со мной ещё не закончил."

