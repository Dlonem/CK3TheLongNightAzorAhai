l_russian:

 # AGOT: The Long Night & Azor Ahai -- the ranging companies.
 #
 # RU terminology, fixed here and used by every other file: Ночной Дозор, Стена, присягнувший брат,
 # разведчик (ranger), лорд-командующий, надеть чёрное, Иные, Долгая Ночь, упырь (wight).
 # "Ranging" is rendered as "поход" -- the word the Russian ASOIAF translation uses for an expedition
 # beyond the Wall -- so the eight companies are походы and the government is a Походный отряд.

 ln_ranger_government:0 "Походный отряд"
 ln_ranger_government_desc:0 "Присягнувший брат Ночного Дозора в поле: за спиной — отряд, под ногами — лагерь, который снимается и идёт дальше, и ни единой стены вокруг."
 d_ln_ranger_01:0 "Долгий поход"
 d_ln_ranger_01_adj:0 "Долгий поход"
 d_ln_ranger_02:0 "Глубокий поход"
 d_ln_ranger_02_adj:0 "Глубокий поход"
 d_ln_ranger_03:0 "Холодный поход"
 d_ln_ranger_03_adj:0 "Холодный поход"
 d_ln_ranger_04:0 "Безмолвный поход"
 d_ln_ranger_04_adj:0 "Безмолвный поход"
 d_ln_ranger_05:0 "Чёрный поход"
 d_ln_ranger_05_adj:0 "Чёрный поход"
 d_ln_ranger_06:0 "Зимний поход"
 d_ln_ranger_06_adj:0 "Зимний поход"
 d_ln_ranger_07:0 "Дальний поход"
 d_ln_ranger_07_adj:0 "Дальний поход"
 d_ln_ranger_08:0 "Последний поход"
 d_ln_ranger_08_adj:0 "Последний поход"

 # ── RIDING OUT ──────────────────────────────────────────────────────────────────────────────────────────────
 ln_take_the_black_as_a_ranger_decision:0 "Надеть чёрное"
 ln_take_the_black_as_a_ranger_decision_desc:0 "Чёрное надевают в наказание. Это — та дверь, за которой всё иначе.\n\n#T Чего это стоит#!\nВсех ваших титулов, брака и помолвки, всех притязаний и любого дракона, который вам подчиняется. Такова клятва.\n\n#T Что вы получаете взамен#!\n#P Собственный походный отряд#! — присягнувший лорду-командующему, лагерь, который идёт с вами, и разведчики, обходящиеся куда дешевле лордовой дружины.\n\n#T Куда это ведёт#!\nНа север от Стены. Служите хорошо — и за этим могут прийти замок, должность первого разведчика, даже кресло лорда-командующего."
 ln_take_the_black_as_a_ranger_decision_tt:0 "Наденьте чёрное и выступайте: во главе походного отряда, вассалом лорда-командующего, с лагерем вместо замка.\n\n#N Вы отказываетесь от всех титулов, притязаний, брака, помолвки и от связанного с вами дракона.#! Такова клятва.\n\n#P Вы получаете безземельное владение#! — дешёвых присягнувших братьев и разведчиков, а также воинскую доблесть, растущую вместе со славой.\n\n#weak Престиж не требуется. Замок зарабатывают потом и изнутри.#!"
 ln_take_the_black_as_a_ranger_decision_confirm:0 "Ночь сгущается, и начинается мой дозор."
 ln_ranger_needs_a_company:0 "У лорда-командующего должен быть свободный отряд — либо никем не занятый, либо под началом капитана, которого он вправе отставить"

 ln_ranger.1.t:0 "Конь и направление"
 ln_ranger.1.desc:0 "[ln_lord_commander.GetTitledFirstName] управляется со всем этим минуты за четыре, и складывается впечатление, что так здесь заведено всегда.\n\nВам выдают плащ. Вам выдают коня, который явно проделывал это раньше и имеет на сей счёт своё мнение. Вам выдают одиннадцать человек: четверо не смотрят вам в глаза, а один бывал за Стеной чаще, чем сам может сосчитать.\n\nИ вам дают единственное наставление, какое Дозор вообще когда-либо давал разведчику, — брошенное на ходу, по дороге обратно в тепло, не оборачиваясь:\n\n«Иди и смотри. Возвращайся и говори, что видел. Если не сумеешь второго — не берись и за первое»."
 ln_ranger.1.a:0 "На север, стало быть. Вот и весь сказ."
 ln_ranger.1.b:0 "Дайте мне тех, кто уже бывал наверху."
 ln_ranger.1.c:0 "Что там на самом деле? Никто ведь ничего не записывал."

 # ── COMING IN ───────────────────────────────────────────────────────────────────────────────────────────────
 ln_ask_for_a_castle_decision:0 "Попросить замок"
 ln_ask_for_a_castle_decision_desc:0 "Вы занимаетесь этим уже очень давно.\n\nНастолько давно, что люди, пришедшие вместе с вами, по большей части мертвы или по большей части на юге, а холод перестал быть погодой и сделался чем-то, что живёт у вас в руках.\n\nНа Стене девятнадцать замков и людей хватает на три, и лорд-командующий ни разу не отказал разведчику, который пришёл и попросил, — потому что человек, проведший жизнь по ту сторону льда, знает точно, зачем нужна стена."
 ln_ask_for_a_castle_decision_tt:0 "Оставьте походный отряд и займите взамен один из пустующих замков Стены.\n\n#weak Ваш лагерь сворачивают, отряд распускают: нельзя держать замок и ходить в поход разом, а если бы было можно, в поход не пошёл бы никто.#!"
 ln_ask_for_a_castle_decision_confirm:0 "Я бы не отказался от крыши."
 ln_ranger_needs_to_have_served:0 "Вы должны быть присягнувшим братом в полном праве — новобранцу замка не дают"

 ln_ranger.2.t:0 "С холода — внутрь"
 ln_ranger.2.desc:0 "Отряд принял это спокойнее, чем вы ожидали, и это слегка задело.\n\nЛагерь свернули за одно утро. К зиме эти палатки достанутся кому-то другому, и он не будет знать, чьи они были, — и именно так всё и должно работать, и всё равно смотреть на это странно.\n\nЗамок хуже лагеря по любой мерке, какую ни возьми. Внутри холоднее, чем снаружи, колодец промёрз, а на втором этаже есть комната, про которую вам никто не желает объяснять.\n\nНо ворота закрываются. Вы уже забыли, каково это."
 ln_ranger.2.a:0 "Я своё там отслужил. Пусть теперь другие."
 ln_ranger.2.b:0 "Держите моё седло у ворот."
 ln_ranger.3.t:0 "Отставленный"
 ln_ranger.3.desc:0 "На это ушло восемь дней, и приятного в них не было ни для кого.\n\nЛорд-командующий не получает от такого удовольствия и не делает вид, будто получает. Он подписал приказ при вас, потом какое-то время просто смотрел на него и сказал то, что говорят старшие, сделав необходимое: нет такого Ночного Дозора, где девятнадцать замков держат те, кто более всех прочих того заслуживает.\n\nОтряд распущен. Лагерь свёрнут. Конь уходит к тому, кому конь нужнее.\n\nУ вас впервые с того дня, как вы надели плащ, есть крыша над головой, и вы пока не уверены, что она вам нравится."
 ln_ranger.3.a:0 "Я удержу его лучше, чем он."
 ln_ranger.3.b:0 "Даром ничего не даётся. Что ж, снова в седло."
 ln_ranger_government_adjective:0 "Походный"

 # The truth the decision card tells instead of AGOT's ceremony internals -- the raw effect list read
 # "You are Deposed", which never happens at runtime (the tooltip evaluates against pre-click state).
 ln_take_black_tt_vows:0 "С прежней жизнью поступают по обычаю Дозора: брак, помолвка, притязания и долги — всё остаётся у Стены"
 ln_take_black_tt_shell:0 "Любая ватага искателей приключений под вашим началом распускается"

 # Brother allocation -- the Lord Commander posts men out to the companies. See
 # common/scripted_effects/zz_ln_brother_allocation_effects.txt.
 ln_brother_posted_toast:0 "В ваш отряд прибыл брат"
 ln_brother_posted_toast_desc:0 "Лорд-командующий отправил на север присягнувшего брата под ваше начало. Вам решать, выйдет из него разведчик — или могила."
