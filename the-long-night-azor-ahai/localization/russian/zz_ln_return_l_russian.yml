l_russian:

 # AGOT: The Long Night & Azor Ahai -- coming home on a dragon.

 ln_return_with_fire_decision:0 "Вернуться с огнём"
 ln_return_with_fire_decision_title:0 "Вернуться с огнём"
 ln_return_with_fire_decision_desc:0 "Ваш чертог всё ещё стоит.\n\nВы полагали, что не будет. Вы бежали на юг вместе со всеми, когда опустилась тьма, и всё, что вы знали, говорило, что от оставленного позади к нынешнему дню останется выжженный след.\n\nНе остался. Кто-то сохранил на нём крышу, и вставил новые ворота, и нынче вечером сидит в кресле вашего отца, ест зерно вашего отца, и делает это уже годы, и вполне разумно перестал ждать, что кто-нибудь вернётся.\n\nНикто в том чертоге ни разу не видел дракона."
 # NO SCOPE REFERENCE HERE. ln_lost_seat is a VARIABLE on the character, not a saved scope, and a decision
 # selection_tooltip has no scopes saved yet -- the effect block has not run. [ln_lost_seat.GetName] would
 # print as an unresolved key. Plain text.
 ln_return_with_fire_decision_tt:0 "Прилететь к престолу, который вы бросили, и решить вопрос о том, кто им владеет.\n\nЭто может пойти четырьмя путями, и тихий из них только один."
 ln_return_with_fire_decision_confirm:0 "Поднять дракона."

 ln_return.1.t:0 "Над собственным чертогом"
 ln_return.1.desc:0 "Вы заходите низко с севера, со светом за спиной, и первое, что вы замечаете, — восточную стену отстроили скверно.\n\nВторое, что вы замечаете, — крик.\n\nК тому времени, как вы садитесь во двор, во дворе нет никого. Двери заперты на засов, что почти смешно.\n\nПотом они открываются, и [ln_squatter.GetTitledFirstName] выходит один. Без стражи, без меча, руки на виду. [ln_squatter.GetSheHe|U] останавливается на расстоянии, которое [ln_squatter.GetSheHe], очевидно, счёл выживаемым, и ждёт — потому что нет ничего, что [ln_squatter.GetSheHe] мог бы сказать и что хоть что-нибудь изменило бы, и остаётся только выяснить, какой человек вернулся."
 ln_return.1.a:0 "Преклони колено — и держи его дальше. За меня."
 ln_return.1.b:0 "Ничего. Поднять [ln_dragon.GetHerHim] снова и сжечь всё."
 ln_return.1.c:0 "[ln_squatter.GetHerHim|U] — и [ln_squatter.GetHerHis] род. Не оставлять никого, кто заявит права."
 ln_return.1.d:0 "У меня есть права, и я заявлю их по-людски. Не так."
 ln_return.1.e:0 "Тогда решим это по-старому. Вооружить [ln_squatter.GetHerHim] мечом."

 ln_return.2.t:0 "[ln_squatter.GetSheHe|U] сохранил крышу"
 ln_return.2.desc:0 "Книги безупречны.\n\nВот чего вы не ожидали. Вы вернулись, приготовившись к разорению и десятилетию воровства, а вместо этого — учётная книга ровным почерком с того самого года, когда отступила тьма: каждый урожай, каждый набор, каждая починка, каждая смерть. [ln_squatter.GetSheHe|U] похоронил вашу челядь как должно. Есть список, где именно.\n\n[ln_squatter.GetSheHe|U] сидит на другом конце стола и ничего из этого не произносит, потому что произнести это прозвучало бы как мольба, а молить он решил не станет.\n\nВосточная стена, впрочем, и правда сложена скверно. [ln_squatter.GetSheHe|U] остался без камня и взял то, что было под рукой."
 ln_return.2.a:0 "Ты будешь держать престол подо мной. Столько ты заслужил."
 ln_return.2.b:0 "Конь и дорога. Чтобы к темноте тебя здесь не было."

 ln_return.3.t:0 "[ln_squatter.GetSheHe|U] назвал вещи своими именами"
 ln_return.3.desc:0 "«Нет», — говорит [ln_squatter.GetSheHe].\n\nА потом, когда вы не делаете ничего немедленно: «Вы там наверху были долго, милорд. Дракон может сжечь мой чертог. Держать его он не может. Он не может в нём сидеть, принимать присяги и выдавать мою дочь за чьего-то сына. На другой день после того, как вы сожжёте это место, у вас будет дракон и не будет крыши, и каждый лорд отсюда до Перешейка будет это знать».\n\n[ln_squatter.GetSheHe|U] уже даже не боится. Это кончилось где-то посреди фразы.\n\n«Так что жгите или не жгите. Но не стойте у меня во дворе и не говорите мне, будто это выбор, который вы делаете»."
 ln_return.3.a:0 "Тогда сделаем это долгим путём. Поднять знамёна."
 ln_return.3.b:0 "[ln_squatter.GetSheHe|U] прав. Я больше не такой."

 ln_return.4.t:0 "Что оставил огонь"
 ln_return.4.desc.burned:0 "Вы вернулись туда с первым светом, потому что хотели посмотреть.\n\nЧертога нет. Есть чёрное пятно там, где был чертог, и дымоход всё ещё стоит, потому что дымоходы стоят всегда. Деревня внизу ушла тоже — деревню вы не имели в виду, и этого различия никто делать не станет.\n\nТе, кто выбрался, стоят на опушке, и их больше, чем вы думали. Они ничего не делают — просто стоят в холоде и смотрят на то место, где жили, и один за другим, когда ваша тень проходит над ними, поднимают глаза.\n\nЭто было не ваше, чтобы жечь. Зато теперь оно вполне ваше."
 ln_return.4.desc.blood:0 "Это заняло меньше времени, чем вы ожидали, и именно эту подробность вы и сохраните.\n\n[ln_squatter.GetSheHe|U] не побежал, и они тоже. Был во дворе миг, когда [ln_squatter.GetHerHis] младшая подняла голову с выражением простого, незамутнённого изумления, потому что ей было шесть, и она никогда такого не видела, и никто не успел ей сказать, что сейчас будет.\n\nЧертог ваш. Учётные книги в горнице, писаны [ln_squatter.GetHerHis] рукой. Люди, которые [ln_squatter.GetHerHim] обслуживали, всё ещё здесь — куда бы им деться, — и ни один не встретит вашего взгляда.\n\nУ вас есть то, за чем вы прилетели. Здесь какое-то время будет очень тихо."
 ln_return.4.a:0 "Сделано. Объяснений это не требует."
 ln_return.4.b:0 "Найти тех, кто убежал. Проследить, чтобы их накормили."

 ln_dragonfire_scar_modifier:0 "Драконий огонь"
 ln_dragonfire_scar_modifier_desc:0 "Сожжено собственным лордом, с воздуха, на памяти живых. На этом месте ничего не отстроено, и здешним людям до забвения очень далеко."

 ln_the_lord_who_left_modifier:0 "Лорд, который ушёл"
 ln_the_lord_who_left_modifier_desc:0 "Они смотрели, как знамёна уходят на юг, и остались. Кто-то другой годами честно вёл амбар, а потом вы вернулись с неба и взяли всё за полдня. Они это переживут. Уйдёт лет пятнадцать."
