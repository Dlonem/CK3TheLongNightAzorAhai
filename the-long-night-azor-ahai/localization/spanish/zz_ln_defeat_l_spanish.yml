l_spanish:

 # AGOT: The Long Night & Azor Ahai -- the long defeat, and meeting your own dead.

 ln_defeat.1.t:0 "#e La Larga Derrota#!"
 ln_defeat.1.desc:0 "#e Nadie lo declara. No hay cuervo, ni última resistencia digna de ese nombre: solo una estación que no cambia, y luego otra, y luego una generación de ellas.\n\n Los maestres dejaron de publicar el recuento del invierno hace algunos años. Tampoco hubo anuncio de eso. El último hombre que recordaba una cosecha murió en la primavera que no fue primavera, y los niños que nacen ahora crecerán creyendo que el gris de ahí arriba es simplemente lo que es el cielo.\n\n En algún lugar al norte de todo, en un salón de hielo que antes fue un castillo, un rey que no come ni duerme ni envejece gobierna un reino más grande que cuanto logró cualquier Targaryen, y no tiene prisa, porque ya ha ganado y solo los vivos siguen enterándose.\n\n #bold La Larga Noche no terminó. Se convirtió en el mundo.#!#!"
 ln_defeat.1.desc.watch:0 "#e Eres la Guardia de la Noche. Eras el escudo que guarda los reinos de los hombres.\n\n No queda reino que guardar ni hombres de los que hablar, y el juramento —el que te hicieron pronunciar en la nieve con las manos frías sobre una espada que aún no habías ganado— resulta que era la descripción de un oficio que podía perderse.\n\n Diecinueve castillos. No pudiste sostener ni uno. De la orden no queda más que unas docenas de hombres en una fortaleza quebrada que mantienen los fuegos por costumbre, y que ya no se molestan en enviar exploradores al norte, porque el norte está ahora en todas partes.\n\n #bold La noche que vino era la de las historias. Nadie estaba preparado, y no esperó.#!#!"
 ln_defeat.1.desc.named:0 "#e Los sacerdotes te nombraron. Se equivocaron ellos, o te equivocaste tú, o se equivocó el fuego, y la distinción ha dejado de importarle a nadie salvo a ti.\n\n No queda profecía sobre la que discutir. Hay un continente helado en manos de un rey al que nunca se le prometió nada ni hizo falta prometérselo, y estás tú, vivo, lo cual las canciones nunca contemplaron.\n\n En algún lugar, en un templo rojo que ahora es una ruina, un sacerdote que pasó la vida señalándote murió aún seguro. Te gustaría estar enfadado con él. Sobre todo recuerdas que él lo creyó más de lo que tú lo creíste nunca.\n\n #bold Eras el príncipe que fue prometido. Esto es lo que valía.#!#!"
 ln_defeat.1.a:0 "Entonces viviremos en ella."

 ln_defeat.2.t:0 "Alguien a quien conocías"
 ln_defeat.2.desc.child:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nLo sabes antes de llegar. Lo supiste por cómo estaba plantado.\n\nEs tu hijo. Gris ahora, con algo torcido en los ojos, y aun así —inequívoca, injustamente— reconocible. Lo que le hicieron no se molestó en cambiarle la cara. Puede que no pudiera. Puede que no le viera sentido.\n\n#bold Está en el suelo y no se mueve, y tienes que decidir qué hacer al respecto.#!"
 ln_defeat.2.desc.parent:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs la cara de tu padre. O de tu madre. Sea cual sea, es la cara que te enseñó lo que era una cara, gris ahora y agrietada por el frío, tendida en el barro entre los demás.\n\nMurió hace años. Estuviste en el entierro. Recuerdas que pensaste, entonces, que al menos esa parte había terminado.\n\n#bold No había terminado.#!"
 ln_defeat.2.desc.sibling:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nTu hermano. Tu hermana. La persona con la que peleaste por nada durante veinte años y por la que habrías muerto cualquiera de esos días, tendida en la escarcha con la boca abierta y el frío saliendo aún de ella.\n\nHoy alguien le atravesó con una lanza. Pudo ser uno de los tuyos. Pudiste ser tú.\n\n#bold Vas a tener que mirar esto como es debido, y luego decidir.#!"
 ln_defeat.2.desc.spouse:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs tu esposa. Tu esposo. La persona junto a cuya respiración aprendiste a dormir, tendida en la escarcha con escarcha en el pelo, y lo que antes había detrás de sus ojos se fue hace mucho.\n\nTe lo has imaginado. Todos en esta guerra se lo han imaginado. Resulta que imaginarlo no era lo mismo.\n\n#bold Nadie va a hacer esto por ti.#!"
 ln_defeat.2.desc.friend:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs tu amigo: de los de verdad, de esos a quienes no hace falta explicarse. [ln_known_dead.GetSheHe] desapareció en una desbandada hace dos inviernos y dijiste a [ln_known_dead.GetHerHis] casa que probablemente [ln_known_dead.GetSheHe] seguía en manos del enemigo, porque era más piadoso que la alternativa y entonces no sabías que había una tercera cosa.\n\n[ln_known_dead.GetSheHe] está aquí. [ln_known_dead.GetSheHe] no está en manos de nadie y [ln_known_dead.GetSheHe] no murió de ninguna manera que sirviera de algo.\n\n#bold Le debes a [ln_known_dead.GetHerHim] algo mejor que esto, y algo mejor que esto no es mucho.#!"
 ln_defeat.2.desc.lover:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nReconoces la silueta antes de reconocer la cara. Esa es la parte que recordarás después: que reconociste a esa persona a cuarenta pasos, en la oscuridad, por cómo se tenía en pie.\n\nAhora no se tiene en pie.\n\n#bold Lo que queda ahí dentro no es esa persona, y aun así no consigues darte prisa.#!"
 ln_defeat.2.desc.sworn:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs uno de los tuyos. Alguien que se arrodilló ante ti, en cuya fortaleza has comido, cuyos hijos podrías nombrar si te dieran un momento. [ln_known_dead.GetSheHe] se perdió en algún punto de la larga retirada y nadie lo anotó, porque por entonces ya nadie anotaba nada.\n\n[ln_known_dead.GetSheHe] volvió al sur con ellos. [ln_known_dead.GetSheHe] lleva todo este tiempo viniendo al sur con ellos.\n\n#bold [ln_known_dead.GetSheHe] te juró lealtad. Eso no terminó cuando [ln_known_dead.GetSheHe] murió.#!"
 ln_defeat.2.a:0 "Levantad la pira. [ln_known_dead.GetSheHe] se irá como es debido."
 ln_defeat.2.b:0 "Dejad a [ln_known_dead.GetHerHim]. Volveremos a pasar por aquí."

 # -- WHAT THE DEAD REMEMBER ----------------------------------------------------------------------------------
 ln_defeat.2.desc.again:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs él. El que dejaste atrás.\n\nSabías que lo sería, del modo en que se sabe algo que uno se ha negado a decir en voz alta. Había una columna que mover y una luz que encender y cien buenas razones, y todas eran verdad, y ninguna está aquí de pie ahora.\n\nÉl ha caminado desde entonces. Hizo un camino muy largo para estar en este campo en concreto, y no hay versión de esto en la que eso sea una casualidad."
 ln_defeat.2.desc.long_after:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs joven. Se ha detenido porque nunca ha visto uno de cerca, y porque nadie le dijo que conservan las caras.\n\nTú sí. Desde antes de que él naciera. Hubo un año, hace mucho, en que esto era lo peor que podía pasarle a un hombre en una tarde; y ahora hay niños en tu salón que no han visto jamás al sol subir lo bastante para dar una sombra corta, y que no piensan en nada de esto como algo que haya salido mal.\n\nAlguien tiene que decir qué se hace con el cuerpo. Has sido tú durante cincuenta años."
 ln_defeat.2.desc.sworn_burned:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs uno de los tuyos. Un hombre que se arrodilló ante ti, perdido en algún punto de una retirada que nadie anotó como es debido, de pie ahora en la escarcha con el color equivocado detrás de los ojos.\n\nYa has hecho esto antes. Esa es la parte de la que nadie te advierte: no el primero, sino descubrir que ya te sabes el orden. Cuánto tarda el fuego. Dónde ponerte para que el viento no te lo devuelva. Qué decirles a los hombres después, que es casi nada.\n\nAlguien te pasa la antorcha sin que nadie lo pida. Han empezado a darlo por supuesto."
 ln_defeat.2.desc.sworn_left:0 "Se recorre el campo, como se recorren los campos después, y uno de tus hombres se ha detenido y no quiere seguir.\n\nEs uno de los tuyos. Un hombre que se arrodilló ante ti, en cuya fortaleza has comido, de pie en la escarcha con el color equivocado detrás de los ojos.\n\nHubo otro, antes de este. Lo dejaste donde yacía y tenías razones, y no has vuelto a pasar por allí desde entonces, y has notado que ya no tomas el camino del norte si hay un camino que no sea el del norte.\n\nTus hombres no miran el cuerpo. Te miran a ti, y esperan oír qué clase de señor eres esta vez."
 ln_the_dark_won_modifier:0 "La Oscuridad Venció"
 ln_the_dark_won_modifier_desc:0 "Hubo una guerra por el amanecer y se perdió. Lo que queda gobierna lo que queda, y se le obedece por algo más cercano al terror que a la lealtad."
