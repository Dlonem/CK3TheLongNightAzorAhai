l_spanish:

 # AGOT: The Long Night & Azor Ahai -- trigger_localization sentences (1.1.0, §8.1).
 # These render where a requirement is shown passing or failing. Wildlings call the Watch "crows";
 # nobody below does, because none of these lines is spoken by a wildling (crowcheck).

 ln_trigloc_can_take_the_black:0 "El Muro aceptaría a este"
 ln_trigloc_cannot_take_the_black:0 "El Muro no aceptará a este"
 ln_trigloc_can_take_the_black_first:0 "Puedo vestir el negro"
 ln_trigloc_cannot_take_the_black_first:0 "No puedo vestir el negro"
 ln_trigloc_can_take_the_black_third:0 "[CHARACTER.GetTitledFirstName] puede vestir el negro"
 ln_trigloc_cannot_take_the_black_third:0 "[CHARACTER.GetTitledFirstName] no puede vestir el negro"

 ln_trigloc_bears_the_bane:0 "Lleva algo que puede herirlos"
 ln_trigloc_bears_no_bane:0 "No lleva nada que pueda dañarlos: vidriagón, acero valyrio o algo peor para ellos"
 ln_trigloc_bears_the_bane_first:0 "Llevo algo que puede herirlos"
 ln_trigloc_bears_no_bane_first:0 "No llevo nada que pueda dañarlos"
 ln_trigloc_bears_the_bane_third:0 "[CHARACTER.GetTitledFirstName] lleva algo que puede herirlos"
 ln_trigloc_bears_no_bane_third:0 "[CHARACTER.GetTitledFirstName] no lleva nada que pueda dañarlos"

 ln_trigloc_watch_stands:0 "Aún queda en pie una Guardia de la Noche para recibirlos"
 ln_trigloc_watch_fallen:0 "No queda Guardia de la Noche que los reciba"

 ln_trigloc_has_a_forge:0 "Tiene una forja a la altura del trabajo"
 ln_trigloc_no_forge:0 "La forja no está lista para este trabajo"
 ln_trigloc_has_a_forge_first:0 "Mi forja está a la altura del trabajo"
 ln_trigloc_no_forge_first:0 "Mi forja no está lista para este trabajo"
 ln_trigloc_has_a_forge_third:0 "La forja de [CHARACTER.GetTitledFirstName] está a la altura del trabajo"
 ln_trigloc_no_forge_third:0 "La forja de [CHARACTER.GetTitledFirstName] no está lista para este trabajo"

 ln_trigloc_can_stand:0 "Puede estar en pie en la Última Hora"
 ln_trigloc_cannot_stand:0 "No puede estar en pie en la Última Hora: la línea acepta a los vivos, a los crecidos, a los capaces, y nunca a un dragón"
 ln_trigloc_can_stand_first:0 "Puedo estar en pie en la Última Hora"
 ln_trigloc_cannot_stand_first:0 "No puedo estar en pie en la Última Hora"
 ln_trigloc_can_stand_third:0 "[CHARACTER.GetTitledFirstName] puede estar en pie en la Última Hora"
 ln_trigloc_cannot_stand_third:0 "[CHARACTER.GetTitledFirstName] no puede estar en pie en la Última Hora"

 # AGOT's send_to_nightswatch_interaction shows the literal string "release_banish_invalid_send_to_nw"
 # when both send options are somehow on at once -- their trigger_localization entry exists but the key
 # still renders raw in the wild (1.0.16a audit). A same-named LOC key is the additive belt: if the engine
 # falls back to key-as-text, this is what the player reads.
 release_banish_invalid_send_to_nw:0 "No puedes desterrar a un hombre y enviarlo a la Guardia de la Noche al mismo tiempo."

 # 1 Sep: shown only when the character being weighed for a knight's place, a court position, a
 # council seat or a command really is one of the dead. Living candidates never see this line.
 ln_may_serve_trigger_tt:0 "Los muertos no sirven a los vivos"
 # 1.1.0 (A2.1): the mirror -- shown only when a LIVING candidate is weighed for a place under one of the dead.
 ln_may_not_serve_the_dead_tt:0 "Los vivos no sirven a los muertos"
