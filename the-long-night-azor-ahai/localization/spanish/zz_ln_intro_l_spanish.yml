l_spanish:

 ln_intro.1.t:0 "Lo que se dice en tu salón"

 # Every branch below is what the PLAYER'S COURT believes, not what is true. None of them names the Long Night.

 ln_intro.1.desc.watch:0 "#e Me quedo mirando los libros de cuentas. Tenemos menos hombres de los que nadie al sur del Muro puede concebir.\n\nSalen expediciones, y cada década vuelve una fracción menor. Los hermanos regresan tambaleándose de los bosques embrujados con los labios sellados sobre lo que los hizo dar la vuelta, o balbucean contradicciones tan desquiciadas que el Lord Comandante ha dejado de anotarlas.\n\nLa Ciudadela insiste en que el Norte simplemente es frío, y que los hombres mueren en él. No se equivocan, pero eso no explica por qué los cuerpos de los caídos nunca pueden recuperarse.\n\nLa Guardia no es más que unos cientos de hombres. Este Muro se construyó para veinte mil.#!"

 ln_intro.1.desc.free_folk:0 "#e A mi gente no hace falta decírselo.\n\nHemos movido los campamentos tres veces en una generación, siempre hacia el sur. Los ancianos susurran sus razones con cuidado y dejan ofrendas calladas para no enojar a los muertos, mientras los jóvenes lo descartan neciamente como simple clima. Pero hay valles en los que ya no invernamos. Hay nombres que mi abuela no se atrevía a pronunciar después del anochecer, y ella no le temía a nada.\n\nLos arrodillados que se acobardan detrás de su muro de hielo creen que solo somos saqueadores. Les diría la verdad, si alguna vez se molestaran en preguntar.#!"

 ln_intro.1.desc.north:0 "#e A las nodrizas les encanta contar los cuentos viejos, y los cuentan mal a propósito para asustar a un niño hasta que obedezca antes de dormir.\n\nHablan de un invierno que duró una generación. De una oscuridad helada que escondía cadáveres que caminaban, y de un último héroe que se adentró en las tierras muertas con una espada partida.\n\nNos enseñan a descartarlos como simples fábulas. Y sin embargo, también sé que toda casa norteña que ha conservado su solar durante ocho mil años levantó sus muros más gruesos en el lado que mira al norte. Nadie ha sido capaz nunca de decirme por qué.#!"

 ln_intro.1.desc.dragon:0 "#e Hay un secreto en la sangre de la Antigua Valyria, aunque ya no estoy seguro de que sigamos entendiéndolo.\n\nAegon el Conquistador dejó un sueño, pasado de soberano a heredero. Si quien hoy se sienta en el Trono de Hierro lo ha oído, o lo cree, no puedo decirlo.\n\nLos que compartimos la sangre del dragón solo conocemos su forma: una oscuridad que se alza en el Norte más lejano. Una canción de hielo y fuego. Algo a lo que los jinetes de dragón deben hacer frente en un siglo que nadie se molestó en precisar.\n\nA menudo me pregunto si nuestros antepasados dejaron de hablar de ello porque el deber ya estaba cumplido, o porque la pesadilla aún no ha empezado.#!"

 ln_intro.1.desc.red:0 "#e Mi sacerdote rojo está absolutamente seguro, y ahí está precisamente el problema.\n\nLa noche es oscura y alberga horrores, dicen. El Rey de la Noche se agita en el frío amargo, y una antigua profecía anuncia que un campeón renacerá entre sal y humo. Mi sacerdote puede recitar los versos sagrados sin una falta, e incluso predecir la hora exacta de nuestra salvación.\n\nPor supuesto, también predijo tres horas exactas anteriores, nombró a dos campeones anteriores, y a los dos los he enterrado yo.\n\nLas llamas no mienten, pero muestran muchísimo, y los sacerdotes no son más que hombres mortales que eligen lo que quieren ver. Algo se acerca. Pero todo lo que mi fe afirma sobre su forma suena a conjetura desesperada de alguien con unas ganas enormes de tener razón.#!"

 ln_intro.1.desc.lord:0 "#e Mi maestre lo mencionó una vez, de ese modo tedioso en que lo hacen los maestres: enterrado en una oración subordinada al final de un pergamino largo y seco que comparaba nuestras cosechas actuales con anomalías históricas.\n\nCitaba «la Larga Noche» como el ejemplo definitivo de malas cosechas. Hace ocho, seis o doce mil años; la Ciudadela no se pone de acuerdo y encuentra la disputa académica mucho más interesante que el suceso en sí. Una generación de invierno. Muertos incontables. Tonterías sobre los muertos alzándose, que los hombres doctos de Antigua Ciudad me aseguran con toda confianza que no son más que una metáfora histórica burda del hambre.\n\nNo leí el pergamino hasta el final. Había asuntos más urgentes entonces, igual que ahora. Los yermos helados del Norte nunca han sido mi problema.#!"

 ln_intro.1.desc.nobody:0 "#e Nadie me ha advertido de nada, porque no hay nada que contar.\n\nLos veranos son deliciosamente largos, las cosechas desbordan los graneros y los caminos son lo bastante seguros como para que los mercaderes se quejen de los peajes en vez de los degolladores. Los hombres de mi edad no han visto nunca un invierno de verdad. Los barbagrises describen el frío como los marineros describen las tormentas legendarias: como algo que se sobrevivió y se exageró mucho al contarlo.\n\nEn algún lugar muy al norte, me dicen que hay un muro gigante de hielo. Nunca he tenido motivo para preguntarme por qué.#!"

 ln_intro.1.a:0 "Enviar un cuervo a la Ciudadela y preguntar qué dicen los registros."
 ln_intro.1.b:0 "El mundo está lleno de mitos antiguos, y este puede esperar."