l_spanish:

 # AGOT: The Long Night & Azor Ahai -- household administration.
 # Deliberately dull where it can be. Nothing here should read as remarkable to a player who is not
 # looking for it -- an estate in order, a house writing itself down, a ship coming home late.

 ln_household_ledger_decision:0 "Tomar el libro de cuentas de la casa"
 ln_household_ledger_decision_desc:0 "Las cuentas llevan años sin leerse. Rentas sin cobrar, deudas sin reclamar, criados sin una palabra de gracias.\n\nUna tarde con el libro y el mayordomo, y la casa vuelve a estar en orden: aparece la moneda que te debían, y los hombres que guardaron la fe en los años magros quedan anotados como hombres que guardaron la fe. A algunos habrá que recordarles lo que valen. A uno o dos, lo que no valen."
 ln_household_ledger_decision_tt:0 "Poner la casa en orden."
 ln_household_ledger_decision_confirm:0 "Llamar al mayordomo"

 ln_household_charter_decision:0 "Poner por escrito la carta de la casa"
 ln_household_charter_decision_desc:0 "Toda casa que perdura se pone por escrito en algún momento: para qué existe, qué no hará y qué espera de los que vengan después.\n\nLa mayoría no se molesta nunca, y la mayoría queda olvidada en tres generaciones. La tuya no."
 ln_household_charter_decision_tt:0 "Dejar la casa por escrito."
 ln_household_charter_decision_confirm:0 "Ponerlo por escrito"

 ln_household_valyria_decision:0 "Una vela salida del mar Humeante"
 ln_household_valyria_decision_desc:0 "La habían dado por perdida hace años: una coca de alquiler salida de Volantis con un capitán lo bastante necio para aceptar un contrato del Feudo Franco y una tripulación lo bastante necia para firmarlo. Nadie navega al este del mar Humeante y vuelve. Eso no es superstición; es aritmética.\n\nVolvió.\n\nLo que queda de su tripulación no dirá qué vieron más allá de los bancos de ceniza, y el capitán no quiere bajar a tierra de ninguna manera. Pero la bodega se abrió en el muelle delante de testigos: un cofre de moneda antigua, todavía brillante; una hoja de acero ondulado que ningún herrero vivo podría haber plegado; y al fondo, empaquetados en arena, en un nido de paño engrasado, dos huevos, pesados como la piedra, tibios como cosas dormidas.\n\nEl capitán no pide pago. Solo pide que lo saques todo de su barco esta noche, y que su nombre quede borrado del contrato. Algo en la bodega lo ha tenido sin dormir, y ha decidido que buscaba una familia, no una fortuna."
 ln_household_valyria_decision_tt:0 "Recibir lo que el barco trajo a casa."
 ln_household_valyria_decision_confirm:0 "Que lo traigan a tierra"

 # Retained for saves that still carry it. No decision applies or reads this any more.
 ln_household_ledger_cooldown_modifier:0 "Cuentas saldadas"
 ln_household_ledger_cooldown_modifier_desc:0 "Los libros de la casa se cuadraron hace poco. No queda nada que encontrar en ellos por un tiempo."

 # ── THE SHIP'S MANIFEST, IN PLAIN WORDS (1.0.12b) ──────────────────────────────
 ln_valyria_sword_tt:0 "Del barco sale una #bold hoja de acero valyrio#! de factura incierta, y va a tu arcón: la hoja que tienes en la mano sigue en tu mano."
 ln_valyria_eggs_tt:0 "#bold Dos huevos de dragón#!, de color desconocido hasta que se los desenvuelva."
 ln_valyria_dragon_tt:0 "Si tienes un dragón vivo vinculado a ti, se le alimenta y se le hace volar: crece, se aviva y su constitución mejora un paso, y la sangre del dragón queda confirmada en tu linaje."

 # ── THE FOURTH DOOR (1.0.12b) ───────────────────────────────────────────────────
 ln_household_mend_decision:0 "Llamar al físico de la casa"
 ln_household_mend_decision_desc:0 "La casa mantiene a su propio físico, y no hace preguntas que el libro de cuentas no haya respondido ya. Las heridas cierran, las fiebres bajan y al cuerpo se le devuelven los años que le quitó la historia.\n\nLo que no puede remendar es un nombre. Lo que dicen de ti, te lo quedas."
 ln_household_mend_decision_tt:0 "Remendar el cuerpo: heridas, cicatrices, enfermedad y el peso de la mente."
 ln_household_mend_decision_confirm:0 "Dejadle trabajar."
 ln_household_mend_effect_tt:0 "Toda herida, cicatriz, enfermedad y achaque queda curada, y se alivian #V 100#! de estrés. Los apodos, la reputación y la profecía quedan intactos."

