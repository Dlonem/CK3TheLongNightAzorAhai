l_spanish:

 # AGOT: The Long Night & Azor Ahai -- the Lord Commander's war.

 ln_call_the_great_ranging_decision:0 "Convocar la Gran Expedición"
 ln_call_the_great_ranging_decision_desc:0 "Los informes que tienes sobre la mesa no concuerdan entre sí, y los hombres que los escribieron no están disponibles para reconciliarlos.\n\nLa Guardia solo ha tenido una manera de resolver qué hay en realidad en el norte, y siempre ha costado la misma moneda: hermanos, en número, cabalgando más allá del último lugar del que alguien da la vuelta, con órdenes de mirar la cosa misma y volver a casa.\n\nDel último Lord Comandante que convocó una se acuerdan por ello. Eso no es lo mismo que decir que saliera bien."
 ln_call_the_great_ranging_decision_tt:0 "Envía una gran expedición más allá del Muro para averiguar qué se acerca.\n\n#weak Vuelve con noticias, o no vuelve, o —lo peor— vuelve callada. Lo que averigüe, la Guardia lo guarda.#!"
 ln_call_the_great_ranging_decision_confirm:0 "Tocad el cuerno una vez"

 ln_lc.1.t:0 "La Gran Expedición parte"
 ln_lc.1.desc:0 "Salen por la puerta antes de la primera luz, porque tú lo ordenaste y porque ninguno de ellos quería hacerlo con todo el castillo mirando.\n\nDoscientos hermanos, aprovisionados para una estación, sobre los mejores caballos que le quedan a la Guardia. El mayor de ellos ha cruzado once veces y esta mañana no dijo absolutamente nada, cosa que notaste. El más joven tiene diecinueve años y no podía dejar de hablar, cosa que también notaste.\n\nLa puerta baja tras ellos con un sonido de veredicto. Ahora la Guardia hace aquello que la Guardia siempre ha hecho más que luchar.\n\nEsperar."
 ln_lc.1.a:0 "Traedme noticias. Sean cuales sean."
 ln_lc.1.b:0 "La dirigirás en persona. La Guardia sigue a una capa, no a un cuervo."

 ln_lc.2.t:0 "Noticias del Norte"
 ln_lc.2.desc:0 "Volvieron más flacos y más callados y con cuatro caballos menos, y el explorador superviviente de mayor rango se plantó en tu solana y dio su informe como un hombre que va colocando piedras de una en una.\n\nDistancias. Nombres de valles en los que ya no vive nadie. Aquello de lo que huye el pueblo libre, con las palabras del pueblo libre que lo dijo. Dónde el frío se asienta mal, y cuánto ha bajado hacia el sur esa anomalía desde la última vez que la vio el hombre más viejo de la partida.\n\nEs el primer documento en ocho mil años de registros de la Guardia que trata al enemigo como una cuestión de logística. Lo has leído cuatro veces.\n\nLa Ciudadela puede discutir con historias. No puede discutir con distancias."
 ln_lc.2.desc.led:0 "No hay informe que recibir. Estuviste allí en cada milla, y lo único que espera en tu solana es un mapa con las esquinas sujetas con pesos y el explorador superviviente de mayor rango, que lleva escribiendo desde Guardiaoriente y no ha dormido desde el Milkwater.\n\nDistancias. Nombres de valles en los que ya no vive nadie. Aquello de lo que huye el pueblo libre, con las palabras del pueblo libre que lo dijo, y tú estabas lo bastante cerca para olerles el humo encima cuando lo dijeron.\n\nPusiste tu propio nombre al pie, bajo el suyo. Esa es la parte que la Ciudadela no podrá rodear. Es el primer documento en ocho mil años de registros de la Guardia que trata al enemigo como una cuestión de logística, y quien lo firmó fue y contó las millas en persona.\n\nLa Ciudadela puede discutir con historias. No puede discutir con un Lord Comandante que estuvo allí."
 ln_lc.2.a:0 "Copiadlo. Cada castillo recibe uno. También Invernalia."

 ln_lc.3.t:0 "La expedición está perdida"
 ln_lc.3.desc:0 "Son los caballos los que lo zanjan.\n\nLos hermanos pueden retrasarse. Los hermanos pueden invernar, perder el rastro, refugiarse en una aldea de salvajes y volver a casa en primavera con una historia. Pero once de los caballos regresaron solos, a lo largo de semanas, de uno en uno y de dos en dos: sin jinete, medio muertos de hambre y sin dejarse meter en un establo de cara al norte.\n\nDoscientos hombres. Firmaste la orden y los contaste al salir por la puerta.\n\nEl escribano ha dejado el registro abierto sobre tu mesa, porque alguien tiene que anotar la entrada y la costumbre de la Guardia dice que eres tú."
 ln_lc.3.desc.led:0 "Volviste con diecinueve.\n\nNo recuerdas haber dado la orden de dar la vuelta. Recuerdas que la luz se torció al cuarto día más allá del Milkwater, y un caballo chillando en algún lugar a tu espalda en una oscuridad que había llegado cuatro horas antes de tiempo, y después mucho correr que será llamado una retirada en combate para cuando la historia llegue a Invernalia.\n\nOtros once caballos volvieron solos a casa en las semanas siguientes, de uno en uno y de dos en dos: sin jinete, medio muertos de hambre y sin dejarse meter en un establo de cara al norte. Ni uno de ellos trajo consigo a un hombre.\n\nFirmaste la orden. Los contaste al salir por la puerta. Cabalgaste a su cabeza, que es para lo que dijiste a todo el castillo que sirve un Lord Comandante.\n\nEl escribano ha dejado el registro abierto sobre tu mesa, porque alguien tiene que anotar la entrada y la costumbre de la Guardia dice que eres tú. La costumbre no dice qué escribir cuando el nombre que encabeza la lista sigue respirando."
 ln_lc.3.a:0 "Doscientos nombres. Escribiré todos y cada uno."
 ln_lc.3.a.led:0 "Ciento ochenta y un nombres. Los escribiré todos con mi propia mano."

 ln_lc.4.t:0 "Volvieron callados"
 ln_lc.4.desc:0 "El vigía de la puerta los vio al crepúsculo: treinta hermanos, a pie, en buen orden, y estaba a mitad del grito de bienvenida cuando comprendió qué tenía de malo.\n\nNingún aliento. Treinta hombres caminando en el frío, y ni una pluma de vaho sobre ellos.\n\nLa puerta se quedó abajo. Las flechas incendiarias hicieron lo que hace el fuego. Y por la mañana el suelo delante del Muro estaba sembrado de hombres a los que conocías —hombres a los que ENVIASTE—, con capas negras tiesas bajo la escarcha y ojos del color de una estrella vista a través del hielo.\n\nUno de los mozos de cocina no se quedó detrás del muro de escudos, y la Guardia enterró a mediodía lo que quedaba de él. El resto de lo que pasó anoche no se puede enterrar, porque se levantó."
 ln_lc.4.desc.led:0 "Les sacaste tres días de ventaja al volver a casa, y has pasado cada hora desde entonces intentando decidir qué fue lo que viste en realidad sobre el hielo.\n\nLuego el vigía de la puerta grita al crepúsculo: treinta hermanos, a pie, en buen orden. Ya vas hacia la escalera antes de que acabe, porque dejaste a treinta hombres en ese hielo y sabes exactamente cómo estaban tendidos cuando los dejaste.\n\nNingún aliento. Treinta hombres caminando en el frío, y ni una pluma de vaho sobre ellos.\n\nLa puerta se quedó abajo. Las flechas incendiarias hicieron lo que hace el fuego. Y por la mañana el suelo delante del Muro estaba sembrado de hombres a los que conocías —hombres a los que CONDUJISTE—, con capas negras tiesas bajo la escarcha y ojos del color de una estrella vista a través del hielo.\n\nUno de los mozos de cocina no se quedó detrás del muro de escudos. La Guardia enterró a mediodía lo que quedaba de él. El resto de lo que pasó anoche no se puede enterrar, porque se levantó."
 ln_lc.4.a:0 "Quemad las capas. Quemadlo todo."

 ln_opening.10.t:0 "Ya has visto esto antes"
 ln_opening.10.desc:0 "Los jinetes traen las mismas palabras que trajeron la última vez, y a tu alrededor el salón se deshace en el mismo orden en que se deshizo la última vez: primero los que gritan, luego los que rezan, luego los que simplemente se sientan.\n\nY te das cuenta de que no te has movido.\n\nEstuviste allí. Estuviste en la nieve, en la primera fila del mundo, con los muertos avanzando, y viste quebrarse la oscuridad: no en una canción, no en la historia de un maestre con tu nombre mal escrito, sino delante de ti, por encima de los hombros de hombres cuyas caras todavía conoces.\n\nTodos los hombres de este salón lo saben. Por eso, uno a uno, están callando su ruido y volviéndose a mirarte."
 ln_opening.10.a:0 "Sé cómo acaba. Traedme mi espada."

 ln_ranging_still_out:0 "La última expedición aún no ha vuelto. No enviaré más hombres tras ellos hasta que lo sepa."
 ln_ranging_men_need_rest:0 "La expedición está en casa, y los hombres que volvieron necesitan descanso. La Guardia no puede montar otra todavía."
 ln_send_out_the_crows_decision:0 "Enviar a un hermano a reclutar"
 ln_send_out_the_crows_decision_desc:0 "La Guardia tiene un método de reclutamiento que ha funcionado durante ocho mil años, y no son las cartas.\n\nEs un hombre. Un hermano pasados sus mejores años de expedición, con un buen caballo y una capa negra y ninguna prisa, cabalgando desde Last Hearth hasta the Reach, y en cada salón hace al señor la misma pregunta: ¿cuán llenas están vuestras mazmorras, y qué pensabais hacer con ellos?\n\nA nadie le gusta una capa negra en la puerta. Todos le dan de comer. Y la cuenta del Muro sube en todo aquello que el reino iba a ahorcar."
 ln_send_out_the_crows_decision_tt:0 "Envía a un hermano juramentado de tu corte a cabalgar hacia el sur por el reino.\n\n#weak A todo gran señor con las mazmorras llenas se le pedirá que las vacíe en la Guardia. Algunos lo harán. Las visitas llegan a lo largo de meses, según lo permitan los caminos.#!"
 ln_send_out_the_crows_decision_confirm:0 "Dadle un caballo y una lista"
 ln_crows_need_a_brother_to_send:0 "Necesitas en tu corte a un hermano juramentado capaz de cabalgar al sur"
 ln_crows_are_still_on_the_road:0 "El último hermano que envié sigue en el camino. La Guardia no tiene tantos hombres que gastar en mendigar."
 ln_send_out_the_crows_effect_tt:0 "Un hermano de tu corte cabalga al sur. Todo duque o mayor de los Siete Reinos con #V 3#! o más prisioneros lo recibirá en los meses venideros."

 ln_lc.10.t:0 "Un hermano negro en la puerta"
 ln_lc.10.desc:0 "[ln_wandering_crow.GetTitledFirstName] lleva tanto tiempo en los caminos que el negro se le ha vuelto gris en el dobladillo, y no se molesta con ceremonias.\n\nCome lo que le sirve tu salón, da las gracias al sirviente por su nombre y luego te hace la pregunta que ha hecho en cada puerta entre aquí y el Muro: ¿cuán llenas están vuestras mazmorras, mi señor, y qué pensabais hacer con los hombres que hay en ellas?\n\n«La cuerda es rápida», dice, con el tono de un hombre que concede un argumento que aún no has planteado. «El Muro no lo es. Pero el Muro son diecinueve castillos sostenidos por ochocientos hombres, y el invierno no se está alejando. Un hombre que aquí moriría por nada, allí puede helarse por algo».\n\nNo está mendigando. Lleva demasiado tiempo haciendo esto para mendigar. Simplemente espera, y puede esperar más que tú."
 ln_lc.10.desc.north:0 "El hermano errante no tiene que explicarse en este salón. Tu abuelo dio hombres a la Guardia, y el suyo, y todo señor juramentado a los Stark hasta más atrás de donde alcanza la cuenta. Las celdas contienen lo que contienen; el Muro necesita lo que siempre ha necesitado; la aritmética es más vieja que tu nombre.\n\nLo pide en voz baja, como hacen los hombres del norte, y espera. Los dos sabéis ya qué responde un señor del Norte cuando la Guardia pide."
 ln_lc.10.a:0 "Llevaoslos. A todos los hombres sin tierras de mis celdas."
 ln_lc.10.b:0 "Monedas para el Muro. Mis prisioneros son asunto mío."
 ln_lc.10.c:0 "El Muro no recibirá nada mío. Buen camino."
