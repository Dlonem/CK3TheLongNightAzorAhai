l_spanish:

 # AGOT: The Long Night & Azor Ahai -- White Walkers in Winter Is Coming (1.1.0, §5).

 # ── The encounter ──
 ln_encounter.1.t:0 "La nieve se pone en pie"
 ln_encounter.1.desc.men:0 "El viento muere de golpe, como muere una conversación cuando entra en el salón el hombre equivocado. Tu aliento queda colgado delante de ti y no se mueve.\n\nEstá de pie entre dos árboles, y comprendes que lleva ahí un buen rato. Alto, delgado, del color del hielo lechoso. Lleva una hoja que no parece hecha por nadie. La nieve no cruje bajo él, porque no está de pie sobre la nieve.\n\nTus hombres también lo han visto. Todavía nadie ha corrido. Eso aún puede caer de cualquier lado."
 ln_encounter.1.desc.alone:0 "El viento muere de golpe. Tu aliento queda colgado delante de ti y no se mueve.\n\nEstá de pie entre dos árboles, y comprendes que lleva ahí un buen rato. Alto, delgado, del color del hielo lechoso. Lleva una hoja que no parece hecha por nadie. La nieve no cruje bajo él, porque no está de pie sobre la nieve.\n\nNadie te acompaña. Eso también lo sabe."
 ln_encounter.1.a:0 "Formad la línea: lo combatimos aquí"
 ln_encounter.1.b:0 "Retroceded: nada de lo que tenemos puede tocarlo"

 # ── Victory ──
 ln_encounter.20.t:0 "Se deshizo"
 ln_encounter.20.desc:0 "El golpe entra y la cosa no sangra. Se quiebra. Se deshace como el hielo se desprende de un tejado en primavera, todo a la vez y con un sonido de lago partiéndose, y donde estaba no queda más que escarcha cayendo del aire.\n\nEl frío se levanta. El viento vuelve, y los árboles recuerdan cómo moverse.\n\nQuien sigue en pie mira la escarcha asentándose en la nieve, y luego te mira a ti. Los hombres contarán esto de otro modo en cada salón al que llegue. Tú estuviste allí. Tú sabes lo que costó."
 ln_encounter.20.a:0 "Mirad lo que queda de ello"

 # ── The taking ──
 ln_encounter.21.t:0 "El frío se cierra"
 ln_encounter.21.desc:0 "Estás de espaldas en la nieve y no recuerdas haber caído. La pelea ha terminado. Se oye lo terminada que está.\n\nCamina hacia ti sin prisa, porque nada que pudiera herirlo sigue en pie. El frío llega antes que él, primero a tus manos, luego a tus brazos, luego a las partes de ti que siempre habías dado por tuyas.\n\nLo último que comprendes es que no va a matarte. Va a conservarte."
 ln_encounter.21.a:0 "No queda nada que hacer"

 # ── The Sam Tarly outcome ──
 ln_encounter.22.t:0 "Deja vivir a uno"
 ln_encounter.22.desc:0 "Se detiene.\n\nLa hoja está en la garganta de [ln_enc_the_spared.GetTitledFirstName] y se detiene, y la larga cara blanca se vuelve y lo considera como un hombre considera a un perro demasiado pequeño para merecer la bota. Luego pasa de largo junto a él, y los ojos azules van a posarse en ti.\n\nÉl vivirá. Se pasará el resto de su vida en salones contando lo que vio aquí, y los hombres le servirán cerveza y no creerán una palabra. Por eso lo perdonó. Alguien tiene que contar a los vivos lo que se acerca, y ha decidido que será él, y no tú."
 ln_encounter.22.a:0 "Para que alguien lo sepa"

 # ── Break and run ──
 ln_encounter.24.t:0 "No dejas de correr"
 ln_encounter.24.desc:0 "No hay orden en ello y tampoco honor. Hay un momento en que la línea ya no está y tus piernas se mueven, y los árboles pasan azotando, y a tu espalda hay un sonido que oirás el resto de tu vida: los hombres que no pudieron correr, deteniéndose.\n\nCorres hasta que la sangre en tu boca sabe a hierro y el frío en tu pecho se siente como ahogarse. Cuando por fin miras atrás, entre los árboles no hay nada más que nieve.\n\nNo te persiguió. Esa es la parte que no le contarás a nadie."
 ln_encounter.24.a:0 "Seguid moviéndoos hasta que haya fuegos"

 # ── A sighting ──
 ln_encounter.30.t:0 "Algo en la cresta"
 ln_encounter.30.desc:0 "Los cazadores vuelven temprano y con un perro menos. Encontraron huellas en la nieve alta: una zancada de hombre, pero demasiado larga, y sin peso alguno, como si lo que las hizo pisara SOBRE la nieve y no dentro de ella. Las huellas corren media milla a lo largo de la cresta y se detienen a media zancada.\n\nEl más viejo de ellos ha cazado en esa cresta durante treinta años. Es el que no quiere hablar de ello."
 ln_encounter.30.a:0 "Sé qué caminó allí: siempre lo he sabido"
 ln_encounter.30.b:0 "El frío juega malas pasadas a los hombres cansados"

 # ── option tooltips (the effects run hidden; these lines are what the player is told) ──
 ln_encounter.1.a_tt:0 "El combate comienza. Se resolverá hombre a hombre en los días que siguen, y un Caminante Blanco nunca acepta una rendición."
 ln_encounter.1.b_tt:0 "Nadie combate. La cosa te mira marcharte."
 ln_encounter.20.a_tt:0 "El Caminante es destruido. Tu cuenta sube en uno, y cada superviviente se lleva el recuerdo."
 ln_encounter.21.a_tt:0 "Los hombres que aún respiran no salen de la nieve. Tú tampoco, y lo que el frío toma, el frío lo guarda."
 ln_encounter.22.a_tt:0 "Él vive. Todos los demás se quedan en la nieve, tú el último de todos, y un hombre camina al sur a contar una historia que nadie creerá."
 ln_encounter.24.a_tt:0 "Vives, con heridas graves. Los hombres que no pudieron correr, no."

 # ── Memories (§6 -- the type key is the title line, then three perspectives: I / you / [owner]) ──
 ln_slew_a_walker_memory:0 "mató a uno de los Otros"
 ln_slew_a_walker_memory_desc:0 "Me enfrenté a uno de los Otros en la nieve, y fue él el que se quebró."
 ln_slew_a_walker_memory_desc_second_perspective:0 "te enfrentaste a uno de los Otros en la nieve, y fue él el que se quebró."
 ln_slew_a_walker_memory_desc_third_perspective:0 "[owner.GetName] se enfrentó a uno de los Otros en la nieve, y fue él el que se quebró."
 ln_the_walker_spared_me_memory:0 "perdonado por uno de los Otros"
 ln_the_walker_spared_me_memory_desc:0 "Mató a todos los hombres que estaban a mi lado, y luego me miró y me dejó vivir. No sé por qué yo. Lo pregunto en sueños."
 ln_the_walker_spared_me_memory_desc_second_perspective:0 "mató a todos los hombres que estaban a tu lado, y te miró y te dejó vivir."
 ln_the_walker_spared_me_memory_desc_third_perspective:0 "[owner.GetName] fue perdonado por uno de los Otros, y nadie supo decir por qué."
