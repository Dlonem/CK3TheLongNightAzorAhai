l_spanish:

 # ── The Long Night begins again ─────────────────────────────────────────────────────────────────────────────
 # Only ever seen with the "The Cycle" game rule on. Wave 1 uses the original others.2.desc.

 ln_others.2.desc.wave_again:0 "#e Los cuervos salen antes que los jinetes, y los maestres no discuten qué significan los informes. No queda discusión alguna por tener.\n\n Ha ocurrido antes. No en la memoria de los vivos —el último hombre que lo vio murió antes de que naciera nadie que hoy respire—, pero la Ciudadela guarda sus registros, y el Norte guarda sus historias, y por una vez ambos coinciden.\n\n Los salvajes ya se mueven hacia el sur. No esperaron a estar seguros.\n\n #bold Los Otros han regresado. La Larga Noche ha llegado de nuevo.#!#!"

 ln_others.2.desc.wave_late:0 "#e Ahora existe una palabra para ello, en todas las lenguas desde Oldtown hasta Asshai, y los niños la aprenden antes de aprender a contar.\n\n El Norte conserva sus ruinas como otras tierras conservan sus monumentos. La mitad de los grandes solares de Westeros son un nombre en un mapa y un montón de piedra, y todos ellos se perdieron en un invierno que los hombres juraron que sería el último.\n\n Nadie manda cuervos a preguntar si es cierto. Mandan cuervos a preguntar cuánto tiempo les queda.\n\n #bold Los Otros han regresado. Nunca se marcharon del todo.#!#!"

 ln_others.2.desc.wave_last:0 "#e No queda mucho que tomar.\n\n Los mapas de la Ciudadela están casi en blanco, y los maestres han dejado de redibujarlos. Lo que sobrevive del reino sobrevive porque los muertos aún no se han molestado con ello.\n\n Ya nadie pregunta quién fue Azor Ahai. Preguntan si alguna vez fue alguien, y si la profecía no fue nunca más que un cuento que los vivos se contaban unos a otros para poder dormir.\n\n #bold Los Otros han regresado. Es muy probable que sea la última vez que importe.#!#!"

 # ── The dawn, under the cycle ───────────────────────────────────────────────────────────────────────────────
 ln_others.3.desc.cycle:0 "#BER Los muertos yacen quietos. El frío se quiebra. En algún lugar al sur del Neck asoma el primer verde, y hombres que no han dormido bien en años duermen por fin.\n\n No ha terminado. No ha terminado nunca, ni una sola vez.\n\n Los maestres anotarán el año, como anotaron el anterior, y alguien dentro de un siglo lo leerá y pensará que fue hace muchísimo tiempo. Al reino le quedan quizá tres generaciones para convertirse en algo capaz de algo más que sobrevivir.\n\n #bold Ha llegado la primavera. Que sirva de algo.#!#!"

 # ── DAWN CARD, BRANCHED ON HOW THE DARK ARRIVED (global_var:ln_invasion_opening) ─────────────────────────────
 ln_others.3.desc.wall:0 "#BER Los muertos yacen quietos. El frío se quiebra. En algún lugar al sur del Neck asoma el primer verde, y hombres que no han dormido bien en años duermen por fin.\n\nHay una brecha en Castle Black de setecientos pies de profundidad y cien yardas de ancho, y el viento entra por ella exactamente igual que el día en que se abrió. Nadie tiene la menor idea de cómo cerrarla. La respuesta honesta, que nadie le dirá a un rey, es que quienes lo construyeron llevan ocho mil años muertos y no lo dejaron escrito.\n\nLa primavera ha llegado a un reino con un agujero en su muro del norte.\n\n#bold Ha terminado. No está reparado.#!#!"

 ln_others.3.desc.inside:0 "#BER Los muertos yacen quietos. El frío se quiebra. Asoma el primer verde, y hombres que no han dormido bien en años duermen por fin.\n\nNadie en este reino podrá volver a mirar a un desconocido de la misma manera. No vino por encima del Muro: ya estaba aquí, en un salón, con un rostro en el que alguien confiaba, y lo estaba desde más tiempo atrás de lo que nadie ha logrado determinar.\n\nA los maestres les gustaría establecer cuánto. Los señores preferirían que no lo hicieran, porque todos ellos están repasando en silencio su propia casa y no les gusta la cuenta.\n\n#bold Ha llegado la primavera. Nadie va a volver a dormir con la puerta abierta.#!#!"

 ln_others.3.desc.exodus:0 "#BER Los muertos yacen quietos. El frío se quiebra. Asoma el primer verde, y hombres que no han dormido bien en años duermen por fin.\n\n El pueblo libre sigue aquí. Decenas de miles, al sur de un Muro que cruzaron huyendo, en un reino que pasó ocho mil años levantando ese Muro precisamente para dejarlos fuera, y que luego pasó esta guerra descubriendo que eran la única gente del mundo que había dicho la verdad sobre lo que venía tras ellos.\n\n Nadie ha resuelto qué ocurre ahora. No hay en la Ciudadela un precedente para nada de esto.\n\n #bold Ha llegado la primavera, y habrá que volver a dibujar el mapa.#!#!"

 ln_others.3.desc.ranging:0 "#BER Los muertos yacen quietos. El frío se quiebra. Asoma el primer verde, y hombres que no han dormido bien en años duermen por fin.\n\n Empezó con una expedición que volvió mal, y hay hombres vivos que estaban en Castle Black la noche en que aquello entró, y ninguno de ellos ha sido capaz nunca de describirlo de un modo que satisfaga a quien no estuvo allí.\n\n La Guardia tiene el registro. Seis nombres, una fecha y cuatro palabras de la mano de un escribiente que el Lord Comandante ha ordenado copiar desde entonces en cada castillo del Muro, porque es el único aviso que hubo y nadie le hizo caso.\n\n #bold Ha llegado la primavera. La próxima vez, leed los libros.#!#!"

 # ── WHAT THE WORLD REMEMBERS OF THE LAST DAWN ───────────────────────────────────────────────────────────────
 # Written against design-backlog-additions.md LN-021: "ship three excellent branches, not ten serviceable
 # ones." [ln_last_dawn_dragon.GetName] resolves generations later because the dragon is locked unpruneable at
 # the moment of the dawn. The champion's name comes back the same way.
 ln_others.2.desc.dragon_lives:0 "#e Han vuelto, y también [ln_last_dawn_dragon.GetSheHe].\n\n [ln_last_dawn_dragon.GetName|E] estuvo allí la última vez. Ancianos que entonces eran niños aún describen la sombra pasando por encima, y el sonido que hicieron los muertos cuando el fuego los alcanzó: un sonido que, dicen, no era un grito, porque gritar es cosa de los vivos.\n\n [ln_last_dawn_dragon.GetSheHe|U] sigue en el mundo. Con más años encima, con menos brío, y la única criatura bajo el cielo que ya ha hecho esto antes.\n\n #bold Los Otros han regresado. También el dragón que acabó con ellos.#!#!"
 ln_others.2.desc.dragon_dead:0 "#e Han vuelto. [ln_last_dawn_dragon.GetName|E] no.\n\n La última Larga Noche terminó desde el lomo de un dragón, y todos los relatos coinciden en la misma imagen: el hielo oscureciéndose bajo el fuego, y la cosa en el centro de todo deteniéndose al fin. Ese dragón es huesos ahora, en un salón, en un túmulo o en el fondo de una bahía, según a qué maestre preguntes.\n\n Todavía hay dragones en el mundo. Nadie vivo sabe si eso es lo mismo.\n\n #bold Los Otros han regresado, y el que los venció la última vez no vendrá.#!#!"
 ln_others.2.desc.dragon_gone:0 "#e Han vuelto. No hay nada en el cielo.\n\n [ln_last_dawn_dragon.GetName|E] acabó con la anterior. Ahora no hay ningún [ln_last_dawn_dragon.GetName|E], ni ningún otro: el mundo dejó marchar al último como deja marchar todo, despacio y sin decidirlo.\n\n Los hombres que librarán esta han leído sobre el fuego. En eso consiste toda su preparación.\n\n #bold Los Otros han regresado, y esta vez el cielo está vacío.#!#!"
 ln_others.2.desc.champion_lives:0 "#e Han vuelto, y quien los detuvo la última vez vive aún para oírlo.\n\n [ln_last_dawn_champion.GetTitledFirstName|E] lo hizo una vez. El reino ha pasado los años desde entonces decidiendo cuánto valió aquello —una salvación, una casualidad afortunada, una historia que se le fue de las manos— y todas esas discusiones terminan hoy.\n\n [ln_last_dawn_champion.GetSheHe|U] sabe algo que nadie más en el mundo sabe: lo que cuesta, y si [ln_last_dawn_champion.GetSheHe] lo tiene dos veces.\n\n #bold Los Otros han regresado. También [ln_last_dawn_champion.GetSheHe].#!#!"

 # -- HOW LONG AGO, AND WHETHER THE PROPHECY WORKED -----------------------------------------------------------
 # Trigger-driven, no interpolation: see the note on the desc block in others_events.txt.
 ln_others.2.desc.living_memory:0 "#e Han vuelto, y esta vez hay hombres en el salón que recuerdan la anterior.\n\n No por un libro. No por una canción. Eran niños cuando se rompió la oscuridad, y han pasado cada año desde entonces respondiendo a gente incapaz de entender la respuesta cuando les preguntaba cómo fue; y ahora son los únicos en la sala a quienes no les tiemblan las manos, porque son también los únicos que ya saben cómo acaba.\n\n Saben otra cosa más, que ninguno de ellos ha dicho: esto no debería haber podido ocurrir dos veces en una sola vida.\n\n #bold Los Otros han regresado, dentro de una misma vida.#!#!"
 ln_others.2.desc.named_true:0 "#e Han vuelto, y los sacerdotes ya están hablando.\n\n La última vez tenían razón. Eso es lo que la Ciudadela nunca ha podido discutir con comodidad: los templos rojos nombraron a un hombre, el hombre marchó al norte y la oscuridad terminó. Piense lo que piense cada cual de R'hllor, el registro es el registro.\n\n Así que cuando este invierno un sacerdote se levante en la plaza de un mercado y diga un nombre, nadie se va a reír. Se anotará, se encontrará al hombre, y se esperará muchísimo de él muy pronto.\n\n #bold Los Otros han regresado. La última vez, la profecía era cierta.#!#!"
 ln_others.2.desc.named_false:0 "#e Han vuelto, y nadie escucha a los sacerdotes.\n\n La última vez los templos rojos nombraron a una docena de hombres. Nombraron príncipes y bastardos y a una muchacha en Volantis, y estaban seguros de cada uno de ellos; y la oscuridad la terminó alguien a quien no habían mencionado ni una sola vez, un hombre sin ninguna profecía encima, que resultó estar allí.\n\n Los sacerdotes tienen explicaciones. Han tenido mucho tiempo para pulirlas.\n\n #bold Los Otros han regresado. La última vez no fue nadie a quien las canciones hubieran elegido.#!#!"

 ln_others.3.desc.proof:0 "#BER Los muertos yacen quietos. El frío se quiebra. En algún lugar al sur del Neck asoma el primer verde, y hombres que no han dormido bien en años duermen por fin.\n\nEsta fue la guerra que nadie pudo fingir que era un rumor. Empezó en una sala del trono, con un cadáver que no quería morir y una corte que lo vio arder: el reino creyó desde el primer día, y aun así estuvo muy cerca de no bastar.\n\nLos maestres anotarán el año. Al reino le quedan quizá tres generaciones para convertirse en algo capaz de algo más que creer a tiempo.\n\nHa llegado la primavera. Que sirva de algo.#!"
