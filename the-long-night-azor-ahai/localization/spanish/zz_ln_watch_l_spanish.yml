 ln_nw_keeper_marshal_flavor:0 "Maestro de Armas"
 ln_nw_keeper_marshal_flavor_possessive:0 "del Maestro de Armas"
 ln_nw_keeper_castellan_flavor:0 "Mayordomo de la Fortaleza"
 ln_nw_keeper_castellan_flavor_possessive:0 "del Mayordomo de la Fortaleza"
 ln_nw_keeper_steward_flavor:0 "Maestro Constructor"
 ln_nw_keeper_steward_flavor_possessive:0 "del Maestro Constructor"
 ln_nw_keeper_chancellor_flavor:0 "Reclutador"
 ln_nw_keeper_chancellor_flavor_possessive:0 "del Reclutador"
