 # ── THE OTHERS' DRAGON ──────────────────────────────────────────────────────────────────────────────────────
 setting_agot_long_night_dragon_raise:0 "Alzan a sus presas #EMP (predeterminado)#!"
 setting_agot_long_night_dragon_raise_desc:0 "#EMP A los Otros no se les da nada.#! Consiguen un dragón solo derribando uno, y vuelve siendo él mismo: mismo nombre, misma cara, color equivocado."
 # ── THE UNDEAD DRAGON ───────────────────────────────────────────────────────────────────────────────────────
 nick_the_undead:0 "el No Muerto"
 trait_ln_undead_dragon:0 "Alzado"
 trait_ln_undead_dragon_desc:0 "Murió una vez, en la guerra por el amanecer, y lo obligaron a levantarse de nuevo. Obedece a lo que lo mató."

 # 1.0.8 -- war_for_the_dawn_cb's on_white_peace_desc and on_invalidated_desc pointed at these two keys and
 # NOTHING DEFINED THEM, so either outcome printed the raw key to the player. Pre-existing; found by the
 # loc-key audit. The key NAMES are inherited leftovers from the Great Ranging and are left alone on purpose
 # -- renaming them means editing the CB file to fix a string, and the CB file is not worth the risk.
 great_ranging_white_peace_desc:0 "La guerra acaba sin final. No se acuerdan términos, porque no hay nadie al otro lado que los acuerde: la hueste simplemente deja de venir, y los hombres que quedan bajan los escudos y esperan a ver si eso significa algo.\n\nNo significa nada. Los muertos no están vencidos. Solo están en otra parte."
 great_ranging_invalidated_desc:0 "La guerra ha terminado porque el motivo ha desaparecido. La causa que convocó estos estandartes ya no se sostiene, y una guerra necesita tener algo por lo que librarse.\n\nLos cuernos tocan retirada. Si eso es clemencia o solo una pausa, nadie aquí puede responderlo."

 # 1.0.16 -- the CB's third key. SCOURING_CB_NAME and SCOURING_CB_NAME_BASE (:35-36) were defined and used by
 # war_name/war_name_base; `cb_name = SCOURING_CB` at common/casus_belli_types/00_long_night_cbs.txt:1633 had
 # no key at all, so the CB itself rendered raw wherever the engine names the cb rather than the war.
 SCOURING_CB:0 "Arrasamiento"

 # 1.1.0b -- shown when a lord already fighting takes the decision. Joining is still open to him; only
 # opening a second war of his own is not.
 ln_wfd_already_at_war:0 "Ya estás en guerra, aunque si se está librando la Guerra por el Amanecer, todavía puedes marchar a ella."

 # 1.0.16 -- the War for the Dawn's new prerequisite. Written as a statement of the world rather than a
 # rules line: the player should finish reading it knowing what to go and do.
 ln_wfd_never_been_beaten:0 "Nadie ha hecho retroceder aún a los muertos. Hasta que un ejército de los vivos los haya vencido en el campo, no hay guerra a la que marchar, solo un invierno con el que nadie ha discutido."
