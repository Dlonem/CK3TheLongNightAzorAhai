l_spanish:


 # AGOT: The Long Night & Azor Ahai -- the killing blow.

 ln_dawn.2.t:0 "El campo, después"
 ln_dawn.2.a:0 "Acabemos con esto."
 ln_dawn.2.b:0 "Toca retirada. No hoy, y no con esto."

 ln_dawn.2.desc.lightbringer:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote como un hombre observa el tiempo, y el frío que sale de él le hace algo al aire que vuelve difícil mirarlo de frente.\n\nLa espada que llevas al costado está caliente. Lo ha estado desde la noche en que la terminaste, y ni una sola vez ha estado caliente en un momento conveniente: está caliente ahora, en un campo donde todo lo demás que vive ha callado, y comprendes que, fuera lo que fuese lo que pagaste por ella, esta es la hora para la que se pagó el precio.\n\n#bold No habrá otra mejor.#!"
 ln_dawn.2.desc.dragon:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, y está mirando hacia arriba. No a ti: a lo que tienes encima, al calor que baja de ello en oleadas que convierten la escarcha en niebla cien varas a la redonda.\n\nToda tu vida te han dicho que los dragones acabaron con la última. Nadie dijo nunca si el dragón sobrevivió.\n\n#bold Está mirando hacia arriba. No ha apartado la mirada.#!"
 ln_dawn.2.desc.valyrian:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote con una expresión que no llega a ser interés. Detrás de él el campo es blanco y está perfectamente quieto.\n\nLa hoja que llevas al costado fue plegada en una ciudad que es ceniza desde hace cuatrocientos años, por hombres que sabían cosas que nadie ha vuelto a saber. Ha cortado malla y hueso y una buena cantidad de acero corriente, y ni una sola vez has necesitado que fuera más que una espada muy buena.\n\n#bold Hoy es el día en que lo es o no lo es.#!"
 ln_dawn.2.desc.glass:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote, y cada hombre que aún se tiene en pie detrás de ti sostiene un cuchillo negro y mellado que los maestres dijeron que era desperdiciar buen oro.\n\nSe astilla contra la malla. No aguanta el filo. Los niños del bosque lo usaron durante ocho mil años contra algo que la Ciudadela está convencida de que nunca existió, y tú diste crédito a los niños.\n\n#bold Ahora averiguas cuánto valía eso.#!"
 ln_dawn.2.desc.named:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote. Los sacerdotes llevan años diciendo tu nombre —en los templos, en las plazas de mercado, a cualquiera que se quedara quieto— y la cosa que tienes delante no parece haber oído nada de ello.\n\nNo tienes ninguna espada que las canciones reconocerían. Tienes lo que las canciones dijeron que eras.\n\n#bold Será lo uno o lo otro, y estás a punto de averiguar qué.#!"
 ln_dawn.2.desc.dragon_refused:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\n[ln_dawn_dragon.GetTitledFirstName] no está aquí. [ln_dawn_dragon.GetSheHe|U] llegó hasta el Muro y se detuvo. Siseó, se desvió, no hubo manera de hacerlo seguir —tres veces, y luego ya ni eso— y al final dejaste el Muro entre [ln_dawn_dragon.GetHerHim] y ti, e hiciste el resto del camino hacia el norte a pie, como todos los demás.\n\nTodo lo que pensabas hacerle a la cosa que está en medio de ese campo, pensabas hacerlo desde cuatrocientos pies de altura.\n\n#bold Vas a pie. Te está mirando a ti.#!"
 ln_dawn.2.desc.nothing:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote, y tú llevas una buena espada que no servirá de nada.\n\nLo sabes. Lo sabe cada hombre que tienes detrás. El acero es para la gente. Lo que está en medio de ese campo no ha sido una persona en muchísimo tiempo, y lo único honesto que podría decirse de salir a su encuentro es que alguien tiene que ser el primero.\n\n#bold Alguien tiene que ser el primero.#!"

 ln_dawn.3.t:0 "#e El Amanecer#!"
 ln_dawn.3.desc:0 "#e No cae como cae un hombre.\n\n Se oye algo parecido a un lago que se rompe en primavera, y entonces la forma que tienes delante se deshace: no en pedazos, en intemperie, en un frío que cruza el campo y sale por el otro lado y simplemente deja de estar.\n\n Y detrás de ella, por todo el hielo, los muertos se detienen.\n\n Diez mil, a media zancada, y luego todos a la vez cayendo hacia lo que siempre fueron: el hermano de alguien, el padre de alguien, un muchacho de una aldea que nadie ha sido capaz de encontrar en un mapa desde hace años. El campo se vuelve de pronto muy ruidoso, porque los vivos siguen respirando y no hay nada más que haga ningún ruido.\n\n Alguien grita tu nombre. Otro se ha echado a reír y no puede parar.\n\n #bold La Larga Noche ha terminado, y tú le pusiste fin.#!#!"
 ln_dawn.3.a:0 "Traedme a todos los hombres que sigan en pie. Quiero sus nombres."

 ln_dawn.4.t:0 "No bastó"
 ln_dawn.4.desc.shield:0 "Das tres pasos.\n\nEl frío te quita el aliento antes que el golpe —y el golpe no llega, porque [ln_dawn_shield.GetTitledFirstName|E] se ha puesto delante de ti.\n\n[ln_dawn_shield.GetSheHe|U] no dice nada ingenioso. [ln_dawn_shield.GetSheHe|U] levanta [ln_dawn_shield.GetHerHis] escudo, y aguanta, y sigue aguantando cuando la cosa lo atraviesa y atraviesa a [ln_dawn_shield.GetHerHim], y unos hombres te arrastran hacia atrás gritando palabras que no oyes.\n\nNo estabas listo. [ln_dawn_shield.GetSheHe|U] lo sabía antes que tú, y lo hizo de todas formas, y esa es toda la diferencia entre vosotros dos en este momento.\n\n#bold Estás vivo. Que se escriba lo que hizo [ln_dawn_shield.GetSheHe].#!"
 ln_dawn.4.desc.alone:0 "Das tres pasos.\n\nEl frío te quita el aliento antes que el golpe, y después de eso el campo es casi todo ruido y suelo que está donde no debería. Alguien te sujeta el brazo de la espada. Alguien grita a los cuernos.\n\nVuelves en ti sobre un trineo, con tu propia sangre helada por un lado de la cara y mucha más que no es tuya, y lo primero que comprendes es que te dejó ir.\n\nNo te perdonó. Te soltó, como un hombre deja algo que ha terminado de mirar.\n\n#bold Estás vivo, y has aprendido exactamente lo que cuesta equivocarse en esto.#!"
 ln_dawn.4.a:0 "Entonces lo haremos otra vez, y mejor."

 # -- THE MAN WHO HAS BEEN HERE BEFORE ------------------------------------------------------------------------
 # Both keep the opening line every other ln_dawn.2 branch opens with, on purpose: it is the same field.
 ln_dawn.2.desc.again:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote, y ya has estado exactamente así de cerca de él una vez. De aquel campo no saliste por tu propio pie: te sacaron, y lo que costó conseguir incluso eso no es algo que hayas dicho nunca en voz alta.\n\nNo ha envejecido. No ha sanado. No parece recordarte en absoluto: de los dos, eres el único que lleva la cuenta.\n\nNo tienes en las manos nada que merezca el nombre. Pero sabes cómo se mueve, y no queda nadie vivo que lo sepa."
 ln_dawn.2.desc.twice:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote. La última vez que estuviste en un campo con esta cosa en el otro extremo diste la orden de retirada —y tu casa volvió viva a casa, y desde entonces has pasado cada año oyendo a hombres que no estaban allí decirte que fue la decisión correcta.\n\nLlevas una buena espada que no servirá de nada. También la llevabas la última vez.\n\nLa diferencia es que cada hombre que tienes detrás ya sabe lo que hiciste, y espera para ver si lo haces dos veces."

 # ── 1.0.13: WHAT ELSE THE FIELD KNOWS ABOUT YOU ────────────────────────────────
 ln_dawn.2.desc.spear:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote, y en algún punto al norte de aquí hay una silueta que reconocerías a cualquier distancia y con cualquier luz, volando hacia él.\n\nHas estado más cerca de esta cosa que nadie que siga vivo. En ese momento estabas cayendo. Recuerdas el brazo que se levantaba, y el sonido que hizo [ln_spear_dragon.GetFirstName], y el suelo llegando.\n\nTe conoce. Se nota en lo quieto que se está quedando."
 ln_dawn.2.desc.spear_unnamed:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote, y en algún punto al norte de aquí hay una silueta que reconocerías a cualquier distancia y con cualquier luz, volando hacia él.\n\nHas estado más cerca de esta cosa que nadie que siga vivo. En ese momento estabas cayendo. Recuerdas el brazo que se levantaba, y el sonido que hizo tu dragón, y el suelo llegando.\n\nTe conoce. Se nota en lo quieto que se está quedando."
 ln_dawn.2.desc.dawn:0 "Su hueste está quebrada y dispersa sobre el hielo, y él no se ha movido.\n\nSigue de pie donde estaba la línea, observándote, y la espada que tienes en las manos es del color de la leche y de la luz de las estrellas, y no pertenece a este siglo.\n\nAlbor fue templada en una estrella caída antes de que hubiera maestres para escribirlo. A ti no te ha pedido nada; a alguien, una vez, le pidió todo, y todo este tiempo ha estado esperando una mañana exactamente como esta.\n\nNo está caliente. Nunca lo ha estado. Simplemente no va a romperse."
 ln_dawn.2.c:0 "Ya he visto cómo acaba esto."
 ln_dawn.2.c_tt:0 "Has soñado este campo. Sabes hacia dónde se mueve primero.\n\n#weak Mejores probabilidades que la versión ciega de la misma pelea, y saber no es lo mismo que estar preparado. Lo cargarás de una manera o de otra.#!"


 # ── 1.0.15 -- the ending funnel ─────────────────────────────────────────────────────────────────────────

 ln_dawn.11.t:0 "La Última Hora"
 ln_dawn.11.desc.field_lb:0 "La guerra está decidida. Las huestes de los muertos están quebradas, dispersas, quemadas en hileras a lo largo del hielo —y su rey está solo entre sus ruinas, y no mira nada más que a ti.\n\nHan muerto hombres en cifras que ningún maestre contará nunca de verdad para que llegara esta hora, y al final todo se reduce a un pequeño círculo de nieve pisoteada y a una espada que ha estado caliente en tu costado desde el día en que la terminaste.\n\nLos demás se mantienen atrás. Nadie se lo ha ordenado. Lo sienten como el ganado siente el tiempo: que lo que ocurra en el próximo minuto no es para ellos.\n\n#bold La guerra está ganada. Esta es la parte que nunca tuvo que ver con la guerra.#!"
 ln_dawn.11.desc.field_plain:0 "La guerra está decidida. Las huestes de los muertos están quebradas, dispersas, quemadas en hileras a lo largo del hielo —y su rey está solo entre sus ruinas, y no mira nada más que a ti.\n\nDe todas las manos que empuñaron una espada en esta guerra —los nombrados, los ungidos, aquellos de los que los sacerdotes estaban tan seguros—, la hora ha elegido la tuya. Ninguna canción te preparó para ello. Quizá para eso servían siempre las canciones: para el hombre al que nunca mencionan.\n\nLos demás se mantienen atrás. Nadie se lo ordenó.\n\n#bold La guerra está ganada. Esta es la parte que nunca tuvo que ver con la guerra.#!"
 ln_dawn.11.desc.chains_lb:0 "Lo trajeron encadenado en hierro viejo y vidriagón, y el frío entró con él.\n\nLleva tres días de pie en tus celdas, y nada en él ha hecho lo que hace un prisionero. No come. No duerme. Los guardias han dejado de echar suertes para llevarle agua, porque el agua es hielo antes de llegar a la puerta.\n\nHay una sola cosa en este castillo que tiene respuesta para él, y ha estado caliente en su vaina desde la hora en que lo arrastraron por tus puertas.\n\n#bold Una celda no puede encerrar al invierno. Acaba con él mientras acabar con él esté en tu mano.#!"
 ln_dawn.11.desc.chains_plain:0 "Lo trajeron encadenado en hierro viejo y vidriagón, y el frío entró con él.\n\nLleva tres días de pie en tus celdas, y nada en él ha hecho lo que hace un prisionero. No come. No duerme. Mira la puerta: no como un hombre que espera ser rescatado, sino como el mar mira el muro de un puerto.\n\nCada hora que pasa ahí de pie la escarcha sube otra piedra, y todos los hombres de tu fortaleza saben de dónde viene.\n\n#bold Una celda no puede encerrar al invierno. Acaba con él mientras acabar con él esté en tu mano.#!"
 # 1.0.16 -- WAS "End the Long Night." Thomas: "I don't like that one text for the one event about end it.
 # If anything, it should read more attempt to end it or like go in for the kill." The old text PROMISED an
 # outcome, and the old option delivered one with no roll -- which is exactly what MPREG reported as a
 # missing duel. ln_dawn.11.a is a duel now, so the button promises an attempt and nothing more.
 ln_dawn.11.a:0 "Entra a matar."
 # The two duel outcome labels, matching ln_dawn.2.duel.win / .lose in voice: bare, present tense, no drama
 # in the label itself because the card around it is already carrying all of it.
 ln_dawn.11.duel.win:0 "Acabar con él"
 ln_dawn.11.duel.lose:0 "Es más rápido que tú"
 ln_dawn.11.b:0 "Esta hora pertenece a otro. Manda a buscarlo."

 ln_dawn.20.t:0 "La cosa que tienes en las celdas"
 ln_dawn.20.desc.other:0 "Tu carcelero ha servido en esta fortaleza durante treinta años, y esta mañana no ha querido bajar solo la escalera.\n\nLa cosa que capturaste viva está en el centro de su celda —ha estado, desde que cerraron la puerta, en el centro exacto, tan lejos de cada pared como una cosa puede estar. La escarcha ha subido por las piedras a su alrededor en dibujos que nadie ha sido capaz de mirar mucho tiempo. No ha pedido rescate. No ha pedido juicio. No ha hecho un solo ruido.\n\nEstá esperando, y todos en tu fortaleza sienten qué es lo que espera.\n\n#bold El frío no se rinde. Solo espera.#!"
 ln_dawn.20.desc.wight:0 "Lleva muerta un tiempo. Ese es el problema.\n\nLa cosa que tus hombres arrastraron hasta aquí no deja de moverse. Trabajó las cadenas hasta que la carne se le soltó del hueso y luego siguió trabajando, y el sonido —paciente, incansable, toda la noche— ha vaciado las celdas de ambos lados. El carcelero pregunta, con respeto, si mi señor piensa conservarla, y en tal caso si mi señor querría escucharla antes durante una hora.\n\n#bold La carne no se detiene. El fuego la detiene.#!"
 # ── and whether you knew it. Appended under either base card; see the note in ln_dawn.20. ──
 ln_dawn.20.desc.knew_spouse:0 "\n\n#EMP Estuviste casado con ello.#!\n\nDos personas de tu casa lo saben. Ninguna ha sido capaz de mirarte desde que el carro entró por la puerta, y tú no has bajado a las celdas, y todos los hombres de esta fortaleza saben exactamente por qué no se ha dado aún la orden.\n\nNadie amortajó nunca a [ln_captured_other.GetHerHim]. [ln_captured_other.GetSheHe|U] sigue llevando lo que llevaba la última vez que viste a [ln_captured_other.GetHerHim]."
 ln_dawn.20.desc.knew_lover:0 "\n\n#EMP Lo conocías, y no como se conoce a los propios abanderados.#!\n\nHabía una versión de esto en la que nunca tenías que averiguar lo que pasó después. Esa versión terminó cuando tus hombres metieron el carro por la puerta y alguien dijo un nombre en voz alta en el patio, y luego lo dijo otra vez, más bajo, porque la primera vez no había sonado como una pregunta.\n\nNo te conoce. Esa es la parte con la que te quedarás."
 ln_dawn.20.desc.knew_blood:0 "\n\n#EMP Es tu propia sangre.#!\n\nTu casa tiene una cripta, un cantero y ochocientos años de práctica en enterrar a los suyos, y nada de eso sirve aquí, porque la cosa de la celda se está poniendo de pie. Se ha consultado al septón, y el septón se ha ido a consultar a otro.\n\nLo que decidas quedará escrito con tu nombre al lado, y tus nietos lo leerán."
 ln_dawn.20.desc.knew_friend:0 "\n\n#EMP Lo conocías. Llegaste a conocerlo bien.#!\n\nBebió en tu salón. Tenía una opinión sobre tu mayordomo que todavía repites. Alguien en los barracones contaba esa historia el mes pasado, y ahora ya nadie la cuenta, y el silencio tiene una forma.\n\nHas acabado con una docena de estas cosas sin pensarlo dos veces. Para eso servía la docena."
 ln_dawn.20.desc.knew_nobody:0 ""
 ln_dawn.20.a:0 "Pasadla por la espada. Ahora."
 ln_dawn.20.b:0 "Mantenedla abajo. Que el reino sepa lo que tengo."

 # ── 1.0.15b -- the bane rule ────────────────────────────────────────────────────────────────────────────
 ln_dawn.11.c:0 "No tenemos nada que pueda acabar con él. Rompe el combate."
 ln_dawn.11.c_tt:0 "Solo el #bold vidriagón#!, el #bold acero valyrio#! o el #bold fuego de dragón#! pueden destruirlo. No llevas ninguno de los tres.\n\nLa guerra está ganada de todos modos, pero la Larga Noche no termina hasta que él termine."

 # ── 1.0.15 -- the duel, on the engine's own duelling mechanic ───────────────────────────────────────────
 ln_dawn.2.duel.win:0 "Acertar el golpe"
 ln_dawn.2.duel.lose:0 "Quedarse corto"
 ln_dawn.2.d:0 "Sal ahí fuera de todos modos. Alguien tiene que ser el primero."
 ln_dawn.2.d_tt:0 "No llevas nada que pueda hacerle daño: ni #bold vidriagón#!, ni #bold acero valyrio#!, ni un dragón sobre tu cabeza.\n\nHoy no lo matarás. Los hombres recordarán que saliste a su encuentro."
 # ── 1.1.3 -- la carta del derribo: no está destruido ────────────────────────────────────────────────
 ln_dawn.30.t:0 "No está destruido"
 ln_dawn.30.desc.dragon:0 "El Rey de la Noche cayó ante el fuego de [ln_dawn30_killer.GetFirstName] en lo más reñido de una batalla, y los muertos no se detuvieron. En cuestión de días volvía a estar entre ellos, el mismo rostro, el mismo frío.\n\nUn dragón en plena batalla no basta. Hay que enfrentarlo.\n\n"
 ln_dawn.30.desc.bane:0 "[ln_dawn30_killer.GetTitledFirstName] abatió al Rey de la Noche con algo que podría haber acabado con él, en el lugar equivocado y a la hora equivocada, y los muertos no se detuvieron. En cuestión de días volvía a estar entre ellos, el mismo rostro, el mismo frío.\n\nEl arma correcta no basta. Hay que enfrentarlo.\n\n"
 ln_dawn.30.desc.nokiller:0 "El Rey de la Noche está muerto, y ninguna mano lo reclama. Los muertos no se detuvieron. En cuestión de días volvía a estar entre ellos, el mismo rostro, el mismo frío.\n\nLo que acabó con el cuerpo no acabó con lo que lo llevaba.\n\n"
 ln_dawn.30.desc:0 "El Rey de la Noche cayó, y los muertos no se detuvieron. En cuestión de días volvía a estar entre ellos, el mismo rostro, el mismo frío.\n\nEl acero acaba con el cuerpo. No acaba con lo que lo lleva.\n\n"
 ln_dawn.30.desc.rule.death:0 "Solo queda destruido cuando se le enfrenta — en el campo tras romper su hueste, acorralado tras una Guerra por el Amanecer perdida, o encadenado — por una mano que lleve vidriagón, acero valyrio o Dueña de Luz, o con un dragón en el cielo. Cualquier otra muerte solo lo derriba."
 ln_dawn.30.desc.rule.war:0 "En este mundo la oscuridad solo se levanta cuando se gana la Guerra por el Amanecer y se le enfrenta al final de ella, por una mano que lleve vidriagón, acero valyrio o Dueña de Luz, o con un dragón en el cielo. Cualquier muerte antes de eso solo lo derriba."
 ln_dawn.30.desc.beaten:0 "\n\nYa puede convocarse la Guerra por el Amanecer."
 ln_dawn.30.desc.notbeaten:0 ""
 ln_dawn.30.a:0 "Entonces no ha terminado."
