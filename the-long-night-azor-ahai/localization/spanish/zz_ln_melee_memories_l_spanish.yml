l_spanish:

 # AGOT: The Long Night & Azor Ahai -- memories of the Long Night (1.1.0, §6).

 ln_saved_by_kin_memory:0 "salvado por [target0.GetTitledFirstName]"
 ln_saved_by_kin_memory_desc:0 "[target0.GetTitledFirstName] recibió el golpe que iba dirigido a mí. La sangre responde por la sangre; la mía sigue caminando gracias a [target0.GetHerHis]."
 ln_saved_by_kin_memory_desc_second_perspective:0 "[target0.GetTitledFirstName] recibió el golpe que iba dirigido a ti."
 ln_saved_by_kin_memory_desc_third_perspective:0 "[target0.GetTitledFirstName] recibió el golpe que iba dirigido a [owner.GetName]."
 ln_saved_by_a_friend_memory:0 "salvado por [target0.GetTitledFirstName]"
 ln_saved_by_a_friend_memory_desc:0 "[target0.GetTitledFirstName] se interpuso en el golpe que iba dirigido a mí. Ningún juramento lo exigía. Esa es la parte que no consigo soltar."
 ln_saved_by_a_friend_memory_desc_second_perspective:0 "[target0.GetTitledFirstName] se interpuso en el golpe que iba dirigido a ti."
 ln_saved_by_a_friend_memory_desc_third_perspective:0 "[target0.GetTitledFirstName] se interpuso en el golpe que iba dirigido a [owner.GetName]."
 ln_blade_broke_memory:0 "el acero falló contra el Otro"
 ln_blade_broke_memory_desc:0 "Puse buen acero forjado en castillo contra la hoja pálida, y el mío se deshizo como el hielo de un estanque. Recuerdo el sonido que hizo más que nada de lo que vino después."
 ln_blade_broke_memory_desc_second_perspective:0 "tu acero se deshizo contra la hoja pálida."
 ln_blade_broke_memory_desc_third_perspective:0 "el acero de [owner.GetName] se deshizo contra la hoja de un Otro."
 ln_took_the_black_memory:0 "vistió el negro"
 ln_took_the_black_memory_desc:0 "Dije las palabras por voluntad propia. Lo que fuera antes, lo dejé al sur del Muro."
 ln_took_the_black_memory_desc_second_perspective:0 "dijiste las palabras por voluntad propia."
 ln_took_the_black_memory_desc_third_perspective:0 "[owner.GetName] vistió el negro por elección propia."
 ln_the_wall_fell_memory:0 "vivo cuando cayó el Muro"
 ln_the_wall_fell_memory_desc:0 "Estaba vivo el día en que cayó Castle Black, y sé exactamente lo que envié y lo que no envié al norte en los años anteriores."
 ln_the_wall_fell_memory_desc_second_perspective:0 "estabas vivo el día en que cayó Castle Black."
 ln_the_wall_fell_memory_desc_third_perspective:0 "[owner.GetName] estaba vivo el día en que cayó Castle Black."
 ln_learned_the_glass_memory:0 "estudió el vidriagón"
 ln_learned_the_glass_memory_desc:0 "Fui a donde están los registros y aprendí para qué sirve el fuego helado. La mayoría de los hombres que se enfrentan al frío lo aprenden en el último segundo de su vida; yo lo aprendí en una biblioteca."
 ln_learned_the_glass_memory_desc_second_perspective:0 "fuiste a donde están los registros y aprendiste para qué sirve el fuego helado."
 ln_learned_the_glass_memory_desc_third_perspective:0 "[owner.GetName] estudió el vidriagón y aprendió para qué sirve."

 # ── §6's threshold modifier ──
 ln_dread_of_the_walker_slayer_modifier:0 "Matador de Caminantes Blancos"
 ln_dread_of_the_walker_slayer_modifier_desc:0 "Tres de los de la estirpe pálida se han quebrado contra este. Los vivos cuentan la historia en los salones; y lo que pase por conversación entre los muertos, también les ha llegado a ellos."
