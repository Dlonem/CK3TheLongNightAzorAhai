 # AGOT: The Long Night & Azor Ahai -- opinion modifiers.
 # Written to be read in a tooltip at a glance: what you did, from their side, in their words.

 ln_gave_me_everything_opinion:0 "Me lo dio todo y se marchó"
 ln_took_the_black_opinion:0 "Vistió el negro"
 ln_took_my_command_opinion:0 "Me quitó el mando"
 ln_let_me_keep_my_dignity_opinion:0 "Me dejó conservar la dignidad"
 ln_saw_what_you_did_to_him_opinion:0 "Vi lo que le hiciste"
 ln_killed_her_for_a_sword_opinion:0 "La mató por una espada"
 ln_paid_the_price_opinion:0 "Pagó el precio que pedía la historia"
 ln_took_one_of_ours_opinion:0 "Se llevó a uno de los nuestros por el acero"
 ln_asks_the_north_for_help_opinion:0 "No deja de escribirnos sobre el Muro"
 ln_fed_the_wall_opinion:0 "Alimentó el Muro cuando nadie más lo hacía"
 ln_the_priests_say_it_of_him_opinion:0 "Los sacerdotes lo dicen de él"
 ln_believes_his_own_legend_opinion:0 "Se cree su propia leyenda"
 ln_named_favored_modifier:0 "Nombrado Favorecido"
 ln_named_favored_modifier_desc:0 "Un sacerdote lo dijo en voz alta, y la palabra viaja. Los que comparten la fe te miran dos veces; los que no, encuentran todo el asunto vergonzoso."
 ln_named_chosen_modifier:0 "Nombrado el príncipe que fue prometido"
 ln_named_chosen_modifier_desc:0 "Templos desde Asshai hasta Oldtown usan el nombre más antiguo y más peligroso. Esto no te convierte en un héroe. Te convierte en una discusión, y los hombres tomarán partido."
