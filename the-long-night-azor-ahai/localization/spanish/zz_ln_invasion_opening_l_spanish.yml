 ln_the_watch_knows_modifier:0 "La Guardia lo sabe"
 ln_the_watch_knows_modifier_desc:0 "Abrieron la puerta a sus propios hermanos, y lo que entró por ella no eran sus hermanos. Pase lo que pase en este Muro, esa es la parte que se recordará."
