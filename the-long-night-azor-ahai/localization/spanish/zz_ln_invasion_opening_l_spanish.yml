l_spanish:

 # ══════════════════════════════════════════════════════════════════════════════════════════════════
 # THE LONG NIGHT -- opening cards. 
 # ══════════════════════════════════════════════════════════════════════════════════════════════════

 # ── THE WARNING -- Winter Is Coming (fires from ln_struggle_cold_winds_reached_effect) 
 ln_opening.6.t:0 "#e El Invierno Ya Está Aquí#!"
 ln_opening.6.desc:0 "#e No es un único acontecimiento. Eso es lo que hace tan difícil discutirlo.\n\nLos cuervos del Norte hablan de expediciones que han dejado de regresar: no perdidas, no retrasadas, sino desaparecidas por completo. Los salvajes se agolpan contra el Muro en números que ninguna temporada de saqueos puede explicar, y los maestres han empezado a debatir en voz baja cuánto tiempo queda.\n\nAún hay verano en el lejano sur. Aún hay tiempo de hacer algo con él.\n\n#bold Lo que el reino construya ahora es lo que el reino tendrá.#!#!"
 ln_opening.6.desc.watch:0 "#e No necesito que los maestres me lo digan. Yo tengo los registros.\n\nTres expediciones han salido desde el deshielo. Una regresó, y volvió sin los seis hombres que se adelantaron a explorar. Los salvajes han dejado de saquear el Muro y han empezado a suplicar ante él. Cualquier hermano que haya pasado la vida combatiéndolos conoce el pavor en las tripas al verlos huir.\n\nDiecinueve castillos se levantaron para esta hora. Apenas podemos guarnecer tres.\n\n#bold Ocho mil años de votos se escribieron para lo que viene ahora. Somos lo que queda de la Guardia, y la Guardia es lo que queda de la advertencia.#!#!"
 ln_opening.6.desc.free_folk:0 "#e Los arrodillados al sur del Muro siguen discutiendo si es real. Nosotros dejamos de discutir hace mucho.\n\nNo está delante de nosotros, donde una cosa puede combatirse. Está detrás, donde a una cosa solo se le puede huir. Los Thenn se mueven. Los Hornfoot se mueven. Clanes que se han derramado la sangre durante siglos marchan exactamente en la misma dirección, y nadie tuvo que decirles hacia dónde.\n\nLas canciones antiguas dicen que el Muro se alzó para dejar algo fuera. A nuestros antepasados los dejaron del lado equivocado.\n\n#bold El invierno no viene primero por el sur.#!#!"
 ln_opening.6.desc.north:0 "#e Todo niño del Norte oye los relatos de la Larga Noche. Llegan los Otros, el frío llega con ellos, y la oscuridad dura una generación. Todo señor del Norte ha sonreído ante la exageración de las amas de cría.\n\nSe han acabado las sonrisas. Las expediciones no regresan. Los salvajes huyen de terror, y los maestres han empezado a contar en voz baja lo que guardan los graneros frente a los años que quizá deban guardarlo.\n\nEl Norte recuerda. Esa fue siempre la parte de las palabras de nuestra Casa que nadie terminaba: se nos pide recordar ESTO.\n\n#bold Aún hay verano en el sur. Debemos gastarlo como norteños.#!#!"
 ln_opening.6.desc.dragon:0 "#e La sangre de la Antigua Valyria lleva profecías como otras casas llevan espadas que ya han olvidado desenvainar.\n\nEl sueño que expulsó a Aenar de Valyria; la canción de hielo y fuego; el príncipe que fue prometido. Durante siglos ha sido una reliquia de familia: ceremonial, a veces incómoda, pero conservada.\n\nAhora nos llega la noticia de que las expediciones han desaparecido, que los salvajes huyen de algo que se niegan a nombrar, y que los viejos sueños han empezado a llegar puntuales.\n\n#bold La sangre del dragón se puso en el mundo para una sola hora. Empieza a parecer que la hora ha llegado.#!#!"
 ln_opening.6.desc.red:0 "#e Hemos predicado el regreso del Gran Otro en salas que se reían de nosotros. Las salas han dejado de reír.\n\nLas llamas han mostrado la misma visión durante un año: un muro de hielo, y algo paciente que aguarda en la oscuridad helada. Ahora los cuervos del Norte confirman con tinta lo que el Señor de Luz ha venido diciendo con fuego desde el principio.\n\nEsta es la guerra para la que existe nuestra fe. Cada sermón, cada fuego nocturno fue preparación para exactamente esto, y en algún lugar del mundo el Señor de Luz está eligiendo una mano que sostenga la espada.\n\n#bold La verdadera noche está a nuestra puerta. Es lo que les prometimos desde el principio.#!#!"
 ln_opening.6.desc.lord:0 "#e Mi maestre me trae informes reenviados desde la Ciudadela. Son profundamente inquietantes.\n\nVienen enterrados en lenguaje seco sobre expediciones desaparecidas de la Guardia de la Noche y migraciones inusuales de salvajes, pero las implicaciones son claras. Los ríos del Norte se congelan más rápido de lo que deberían, y la Ciudadela está acumulando grano en silencio.\n\nLa mayoría de los señores lo llamará un invierno duro. Pero un invierno duro no aterra a los maestres hasta el silencio.\n\n#bold No sé qué está ocurriendo en el Norte profundo, pero viene hacia el sur.#!#!"
 ln_opening.6.desc.nobody:0 "#e El aire trae un mordisco más frío y antinatural que nunca había sentido.\n\nLos viejos de los campamentos y las tabernas hablan de años malos y heladas duras, pero esto se siente distinto. Los viajeros traen rumores extraños del Norte: hermanos negros desaparecidos, salvajes que abandonan sus tierras, y un frío que mata a un hombre mientras duerme. Nadie quiere decirlo en voz alta, pero los veranos que conocimos se han ido.\n\n#bold Algo terrible cabalga los vientos del norte.#!#!"
 ln_opening.6.desc.dance:0 "#e El reino se ha pasado una generación discutiendo por una silla.\n\nHay pretendientes rivales, cortes rivales, y a cada señor se le ha preguntado de qué lado saltará. La mitad de las cartas de mi solar son sobre la sucesión. La del Muro está abajo del montón, sin abrir, porque el Muro nunca ha importado para quién se sienta en el trono.\n\nPero es un informe de expedición. Tres enviadas al norte, ninguna regresó, y una línea desesperada al final que el maestre ha subrayado dos veces. Ahora mismo hay más dragones en el cielo del reino que en ningún momento desde que ardió Valyria, y sin embargo estamos ocupados matándonos entre nosotros.\n\n#bold A la oscuridad le da igual quién de nosotros debía gobernar.#!#!"
 ln_opening.6.desc.dragons:0 "#e Llegan noticias del Norte de que las expediciones han dejado de regresar, y por una vez el reino cree tener la respuesta.\n\nHay dragones sobre el Blackwater. Los niños los señalan como en otros siglos se señalaban las nubes. Lo que haya detrás del Muro, ha escogido la única era en ocho mil años en que los vivos pueden poner fuego en el cielo por docenas.\n\nLos maestres aconsejan que las crónicas antiguas asustan menos cuando se tiene fuego hecho carne. Pero los maestres nunca han visto una cosa capaz de arrancar un dragón del cielo.\n\n#bold Aún hay verano en el sur, y el cielo está lleno de fuego. Debemos gastar ambos.#!#!"
 ln_opening.6.desc.close:0 "\n\n#EMP Nadie puede decirte cuánto dura esto: ni los maestres, ni los sacerdotes, ni el hombre más viejo de tu salón.#! Lo que es seguro es que este invierno no es como los demás."
 ln_opening.6.a:0 "Entonces será mejor que nos preparemos para el frío. Queda poco tiempo."
 ln_opening.6.b:0 "Que el Norte se congele. Tenemos nuestros propios problemas."
 ln_opening.6.c:0 "Aún hay verano en el sur."

 # ── 1. THE SUN FORGETS TO RISE ───────────────
 ln_opening.1.t:0 "#e El Sol Se Olvida de Salir#!"
 ln_opening.1.desc:0 "#e Han pasado tres días, y el amanecer nunca llegó.\n\nEl cielo es un negro implacable y asfixiante, completamente desprovisto de estrellas. No es una tormenta; es una sombra física que se ha tragado el mundo. El aire huele a polvo antiguo y a hielo quebrado, y trae un frío tan profundo que los pinos gigantes estallan por su savia congelada.\n\nJinetes aterrados revientan a sus caballos trayendo avisos de una marea de hombres muertos que caminan en la negrura absoluta. La Larga Noche ya no es un mito.\n\n#bold Los Otros han regresado. La Larga Noche ha comenzado.#!#!"
 ln_opening.1.desc.watch:0 "#e Estoy en lo alto del Muro, mirando al norte, y no hay horizonte. Solo una oscuridad absoluta y antinatural.\n\nEl sol no ha salido en días. El viento no trae nieve, solo un frío sobrenatural que raja la piedra y congela a los hermanos en sus puestos. Nos advirtieron de que el verdadero enemigo trae la tormenta, pero esto es peor. Traen la noche misma.\n\n#bold La Larga Noche está sobre nosotros. El escudo de los hombres es todo lo que queda.#!#!"
 ln_opening.1.desc.free_folk:0 "#e Miramos al cielo, y solo hay negro. El verdadero frío ha llegado.\n\nEl sol ha dejado de salir. Los ancianos han quedado completamente callados, y los jóvenes entienden por fin por qué huimos. Ya no queda dónde esconderse en la oscuridad.\n\n#bold La Larga Noche ha comenzado. Los muertos vienen.#!#!"
 ln_opening.1.desc.north:0 "#e Los fuegos de los hogares apenas logran atravesar la penumbra. El mediodía es igual que la medianoche.\n\nLos cielos sobre el Norte se han vuelto completamente negros. Se ha asentado un frío que mata a un hombre en su propia cama si su fuego se apaga. La Larga Noche ya no es un cuento para asustar a los niños. Está justo al otro lado de nuestras puertas.\n\n#bold Los Otros han regresado. El Norte debe ser el escudo otra vez.#!#!"
 ln_opening.1.desc.dragon:0 "#e Los pergaminos valyrios hablaban de una oscuridad que barrería el mundo. Mirando el cielo negro, comprendo que la condena no murió en el este.\n\nLleva días oscuro. Un frío mágico se ha asentado sobre el reino que ningún fuego normal puede disipar. La hora largamente prometida de hielo y fuego está literalmente sobre nosotros.\n\n#bold La Larga Noche ha comenzado. Es hora de despertar al dragón.#!#!"
 ln_opening.1.desc.red:0 "#e El Gran Otro ha proyectado su sombra física sobre el mundo. La noche literal que no termina ya está aquí.\n\nNuestros sacerdotes han gritado la profecía de Azor Ahai en las calles durante siglos, y ahora el sol desaparecido prueba la verdad de las advertencias del Señor de Luz. La noche es oscura y alberga horrores.\n\n#bold El enemigo de la luz ha regresado. Solo el fuego puede empujar atrás esta oscuridad.#!#!"
 ln_opening.1.desc.lord:0 "#e Incluso tan al sur, el mediodía es tan oscuro como la medianoche.\n\nLos ríos se congelan por completo en una noche, y las cosechas se vuelven podredumbre negra en los campos. Los maestres no tienen explicación para un cielo sin sol, ni para un frío tan antinatural. Los mitos aterradores del Norte se sienten de pronto muy reales.\n\n#bold La Larga Noche ha comenzado. El reino está completamente ciego.#!#!"
 ln_opening.1.desc.nobody:0 "#e No ha habido amanecer en casi una semana. Los ríos se están convirtiendo en hielo macizo.\n\nLa gente se apiña en torno a cualquier fuego que pueda encender, aterrada del viento helado y del cielo negro como la pez. Nadie sabe qué está pasando, solo que el mundo se siente del todo roto.\n\n#bold La Larga Noche ha llegado. Ruego que la sobrevivamos.#!#!"
 ln_opening.1.a:0 "Levantad bien los fuegos. Esperaremos en la oscuridad."
 ln_opening.1.b:0 "Tened el acero a mano. Empieza la verdadera guerra."

 # ── 2. A RANGING RETURNED ───────────────────────────────────────────────────────
 ln_opening.2.t:0 "#e Una Expedición Ha Regresado#!"
 ln_opening.2.desc:0 "#e La historia espantosa se difunde desde el Norte. Una expedición enorme salió a los bosques profundos, pero solo regresaron once hombres.\n\nVolvieron en completo silencio, medio enloquecidos por la congelación. No cayeron ante salvajes. Informan de una emboscada en la oscuridad helada, donde se vieron obligados a ver cómo sus propios hermanos caídos abrían ojos de un azul penetrante y se alzaban de la nieve para matarlos.\n\nEl mito es real, y está convirtiendo a nuestros muertos en armas.\n\n#bold Los Otros han regresado, y la Larga Noche ha comenzado.#!#!"
 ln_opening.2.desc.watch:0 "#e Enviamos a nuestros mejores hombres a lo profundo del bosque encantado. Solo once se arrastraron de vuelta hasta las puertas.\n\nEstaban medio enloquecidos de terror, llorando mientras confesaban al Lord Comandante lo que habían visto. Los emboscaron en la oscuridad helada, y se vieron forzados a abatir a sus propios hermanos: hermanos que acababan de morir, solo para alzarse de la nieve con ojos azul pálido y descuartizar a los vivos.\n\nEl Muro sigue en pie, pero por fin sabemos exactamente qué nos espera.\n\n#bold Los Otros han regresado. La Larga Noche ya está aquí.#!#!"
 ln_opening.2.desc.free_folk:0 "#e Vimos a cuarenta cuervos adentrarse en el bosque. Solo once salieron cojeando. Los contamos al entrar y al salir.\n\nA los muertos no les importan las capas negras. Los arrodillados están aprendiendo por fin la terrible verdad de lo que ocurre en la nieve.\n\n#bold Los Otros han regresado. No hay seguridad detrás de su hielo.#!#!"
 ln_opening.2.desc.north:0 "#e El cuervo de Castle Black es espantosamente breve. Los maestres adornan los rumores; nadie adorna una masacre.\n\nUna gran expedición fue aniquilada más allá del Muro. La Guardia informa de que los muertos no se quedaron muertos, que se alzaron de la nieve para luchar contra los vivos. Todo señor del Norte ha enviado hijos a ese Muro. Algunos de los hombres que cayeron y se alzaron de nuevo son hombres que conozco.\n\n#bold La Larga Noche ha comenzado. Empieza con un rostro conocido.#!#!"
 ln_opening.2.desc.dragon:0 "#e Llega la noticia de que una enorme expedición ha sido aniquilada más allá del Muro; los supervivientes afirman que los muertos se alzaron de la nieve para descuartizarlos.\n\nAlgunos señores lo llamarán un truco del frío, pero mis antepasados conquistaron este continente para unirlo contra exactamente esta magia antigua. \n\n#bold La Larga Noche ya está aquí. Debemos responder a su hielo con fuego.#!#!"
 ln_opening.2.desc.red:0 "#e Mis sacerdotes difunden las noticias espantosas del Norte. La verdadera guerra ha comenzado oficialmente.\n\nUna partida de exploradores fue aniquilada en los bosques profundos, y los supervivientes informan de que los caídos se alzaron de nuevo como sirvientes de la oscuridad. El Señor de Luz nos ordena quemar la podredumbre antes de que se extienda al resto del mundo.\n\n#bold La Larga Noche ha comenzado. El fuego es la única respuesta.#!#!"
 ln_opening.2.desc.lord:0 "#e La Ciudadela ha reenviado un informe formal y escalofriante del Lord Comandante de la Guardia de la Noche.\n\nUna gran partida de exploradores fue diezmada en lo profundo del bosque encantado. Los supervivientes juraron por su vida que los emboscaron en la oscuridad, y que sus hermanos caídos se alzaron de la nieve con ojos azules antinaturales para atacarlos. La mayoría de los señores lo descartaría como locura o traición de salvajes, pero la Ciudadela no reenvía desvaríos sin motivo.\n\n#bold Si los muertos caminan de veras, ¿qué protege al sur?#!#!"
 ln_opening.2.desc.nobody:0 "#e Oigo susurros aterrados en las tabernas sobre una enorme partida de exploradores descuartizada en el Norte profundo.\n\nDicen que los hermanos negros no lucharon contra salvajes, sino contra cadáveres que se alzaron de la nieve para matarlos. Aun sin tierras ni títulos, conozco el olor de un reino condenado.\n\n#bold La Larga Noche ha comenzado. Ningún lugar es seguro.#!#!"
 ln_opening.2.a:0 "Si los muertos caminan, hay que quemarlos."
 ln_opening.2.b:0 "No confíes en nadie. Vigila bien las sombras."

 # ── 3. THE HORROR BEYOND THE WALL (Hardhome) ──────────────────────────────────────────────────
 ln_opening.3.t:0 "#e El Horror Más Allá del Muro#!"
 ln_opening.3.desc:0 "#e Los cuervos y los rumores traen la misma historia imposible. Los salvajes han llegado al Muro como un río golpea una presa que cede.\n\nNo vienen a saquear. Suplican que les abran una puerta que pasaron siglos intentando derribar. Hablan de una masacre en una península llamada Casa Austera, donde quedaron acorralados contra el mar helado sin lugar al que huir. Los muertos los mataron en las playas, y los caídos abrieron ojos de un azul penetrante.\n\nLa discusión sobre si dejarlos pasar terminó cuando aquello de lo que huían llegó detrás de ellos.\n\n#bold Los Otros han regresado, y la Larga Noche ha comenzado.#!#!"
 ln_opening.3.desc.watch:0 "#e Miro desde el Muro a miles de salvajes suplicando ante nuestras puertas. Están completamente quebrados.\n\nHombres contra los que he luchado en persona tienen los ojos blancos de miedo. Hablan de haber quedado acorralados en una península helada en Casa Austera, atrapados entre una horda inmensa de muertos y el mar helado. Los caídos se alzaron de nuevo para matar a los vivos en las playas.\n\nNuestro juramento dice que somos el escudo que guarda los reinos de los hombres. No especifica qué hombres.\n\n#bold Los muertos se llevan a todos. Esta noche, la Guardia decide qué significan de verdad nuestras palabras.#!#!"
 ln_opening.3.desc.free_folk:0 "#e Casa Austera es un cementerio. Creíamos que podríamos reunirnos allí, encontrar barcos, encontrar algo. En cambio, quedamos acorralados en la península sin lugar al que huir.\n\nTu gente, tus rivales, clanes con los que tu abuelo se mató a sangre: aniquilados juntos contra el mar helado. Ahora estamos ante el Muro, suplicando clemencia a los arrodillados, porque por fin hemos conocido lo único peor que arrodillarse.\n\n#bold Los muertos se llevan a todos. Eso hace que todos sean tuyos.#!#!"
 ln_opening.3.desc.north:0 "#e El volumen de salvajes que suplican ante el Muro no tiene precedentes. Hablan de haber quedado acorralados y masacrados contra el mar en un lugar llamado Casa Austera.\n\nLos salvajes no huyen de los hombres. Todo señor del Norte hace ahora la misma cuenta fea: cada salvaje al que se rechace para que muera congelado es solo una lanza más que volverá marchando por el kingsroad con ojos azules.\n\n#bold Los Otros han regresado. Toda alma al norte de nosotros es o una lanza viva o un espectro.#!#!"
 ln_opening.3.desc.dragon:0 "#e Me llegan susurros de que miles de salvajes marchan hacia el sur, huyendo de una masacre en la costa de Casa Austera. Nadie con la sangre del dragón ha oído nunca que huyan así.\n\nHablan de haber quedado atrapados contra el mar por un enemigo que no se cansa y con el que no se puede razonar. Es un pensamiento aterrador.\n\n#bold Los Otros han regresado. Veremos si arden.#!#!"
 ln_opening.3.desc.red:0 "#e Los salvajes corren hacia el sur, huyendo de una matanza espantosa en la que quedaron acorralados contra el mar en Casa Austera. El ejército del Gran Otro crece con cada alma caída.\n\nCorren hacia un reino que los desprecia, suplicando salvación. Mis sacerdotes lo llaman la conversión definitiva.\n\n#bold Los muertos se llevan a todos. Debemos reunir a los vivos.#!#!"
 ln_opening.3.desc.lord:0 "#e Los cuervos del Norte informan de una crisis sin precedentes en el Muro. Miles de refugiados salvajes suplican que se les deje pasar las puertas.\n\nLos informes dicen que están aterrados, que aseguran haber quedado acorralados en una península helada llamada Casa Austera y masacrados contra el mar helado. La mayor parte del reino ignorará a unos salvajes muriendo más allá del Muro, pero a mí me preocupa el puro pánico que se extiende por el continente.\n\n#bold Algo terrible ha despertado en el norte profundo.#!#!"
 ln_opening.3.desc.nobody:0 "#e Oigo historias disparatadas de mercaderes y septones errantes. Dicen que miles de salvajes suplican ante el Muro, huyendo de una matanza espantosa en lo profundo del norte helado.\n\nLa gente no abandona sus casas y camina tan lejos por un cuento de fantasmas. Si los salvajes están lo bastante aterrados para pedir clemencia a los arrodillados, estamos todos condenados.\n\n#bold La Larga Noche ha comenzado.#!#!"
 ln_opening.3.a:0 "Cada alma salvada es un soldado menos para los muertos."
 ln_opening.3.b:0 "Solo podemos salvarnos a nosotros mismos."

 # ── 4. THE TRUE ENEMY REVEALED (Deep Beyond the Wall) ───────────────
 ln_opening.4.t:0 "#e El Verdadero Enemigo Revelado#!"
 ln_opening.4.desc:0 "#e Llega un cuervo general y frenético del maestre de Castle Black, con una advertencia que resonará durante mil años.\n\nSe envió una gran expedición a los yermos helados de los Frostfangs para averiguar qué empujaba a los salvajes hacia el sur. Lo que encontraron fue una matanza. Un ejército de hombres muertos, extendido hasta donde alcanza la vista, marchando por el bosque encantado en silencio absoluto.\n\nEl mito fue hallado escondido en el norte profundo, y ahora sabe que lo estamos mirando.\n\n#bold Los Otros han regresado. La Larga Noche ha comenzado.#!#!"
 ln_opening.4.desc.watch:0 "#e Enviamos a nuestros mejores hombres a lo profundo de los Frostfangs. Teníamos que saber qué empujaba a los salvajes hacia el sur.\n\nSolo un puñado de jinetes logró regresar al Muro. Estaban medio enloquecidos por la congelación y el terror, balbuceando sobre un océano de cadáveres que marchaba por los bosques profundos. Cien mil hombres muertos, perfectamente quietos, moviéndose como uno solo.\n\nHemos enviado cuervos a cada rincón del reino, rogándoles que comprendan la escala de lo que viene.\n\n#bold El ejército de los muertos marcha. El escudo de los hombres debe aguantar.#!#!"
 ln_opening.4.desc.free_folk:0 "#e Los cuervos por fin se adentraron lo bastante en el bosque para ver de qué huimos.\n\nSu gran expedición fue devorada por el frío en los Frostfangs. Los arrodillados han visto por fin el tamaño de la horda, y ahora saben que su muro de hielo no bastará.\n\n#bold Los muertos marchan. Nadie está a salvo.#!#!"
 ln_opening.4.desc.north:0 "#e Llega del Muro un cuervo con sello negro. La gran expedición de la Guardia ha sido aniquilada en lo profundo de los Frostfangs.\n\nLos supervivientes aseguran haber visto una hueste de espectros de cientos de miles, marchando hacia el sur por el bosque encantado. La pesadilla para la que nos hemos preparado desde los orígenes de nuestra Casa ya no duerme.\n\n#bold Los Otros han regresado. Convocad a los abanderados.#!#!"
 ln_opening.4.desc.dragon:0 "#e Llegan noticias del Norte de que una gran expedición de hermanos negros encontró un ejército colosal de cadáveres andantes en lo profundo de los Frostfangs.\n\nAseguran que son cientos de miles, una pesadilla hecha carne que marcha despacio por la nieve. La hora de hielo y fuego ha llegado por fin.\n\n#bold El Gran Otro ha revelado su hueste. Es hora de llover fuego sobre ellos.#!#!"
 ln_opening.4.desc.red:0 "#e El Enemigo de la Luz ha revelado su hueste. Un cuervo aterrado confirma que una expedición en lo profundo más allá del Muro ha descubierto un océano de muertos.\n\nNuestras profecías hablaban de este momento exacto. La oscuridad se reúne en el confín del mundo, preparándose para extinguir a los vivos.\n\n#bold La Larga Noche ha comenzado. Debemos encontrar al príncipe que fue prometido.#!#!"
 ln_opening.4.desc.lord:0 "#e La Ciudadela reenvía una misiva llena de pánico desde el Muro. Una partida de exploradores enviada a lo profundo del norte inexplorado ha sido casi exterminada.\n\nLos supervivientes aseguran haber visto un ejército de cien mil cadáveres marchando por la nieve. Mi maestre tiembla mientras la lee. Si aunque sea una parte de este informe es cierta, el reino se enfrenta a la extinción.\n\n#bold Los mitos son reales, y marchan hacia el sur.#!#!"
 ln_opening.4.desc.nobody:0 "#e El reino está atrapado por un rumor aterrador. Dicen que los hermanos negros se adentraron en el bosque encantado y despertaron algo antiguo.\n\nLos viajeros lloran en las tabernas, asegurando que una expedición encontró cien mil cadáveres marchando por la nieve profunda. \n\n#bold La Larga Noche ha comenzado. Que los dioses nos amparen a todos.#!#!"
 ln_opening.4.a:0 "Que los dioses se apiaden de nosotros."
 ln_opening.4.b:0 "Acero y fuego. Es el único camino."

 # ── 5. A DEAD MAN IN THE CAPITAL ──────────────────────────────────────────────────────────────
 ln_opening.5.t:0 "#e Un Muerto en la Capital#!"
 ln_opening.5.desc:0 "#e La historia te llega como llegan siempre las verdaderas: no como una canción, sino como un susurro aterrado que se extiende por el reino. \n\nUn hermano de la Guardia de la Noche entró en la sala del Trono de Hierro con un muerto atado a una cadena, y pidió permiso a la corona para ejecutarlo. El trabajo del verdugo no sirvió de nada. El fuego, al final, sí.\n\nVarios cientos de los mejores del reino vieron a un cadáver rechazar la espada. Esta mañana nadie se ríe del Norte. No se ríe nadie en ninguna parte.\n\n#bold Los Otros han regresado, y la Larga Noche ha comenzado.#!#!"
 ln_opening.5.desc.watch:0 "#e Llevamos cien años enviando ese mismo informe al sur. Hizo falta mandar a un hermano a arrastrar un cadáver en movimiento hasta la capital para que por fin escucharan.\n\n#bold El reino ve la verdad. Ahora deben luchar.#!#!"
 ln_opening.5.desc.free_folk:0 "#e Los arrodillados necesitaron que un cuervo llevara un cadáver andante a su elegante salón del rey para creernos por fin.\n\n#bold A los muertos no les importan los tronos.#!#!"
 ln_opening.5.desc.north:0 "#e La Guardia de la Noche ha hecho lo imposible. Arrastraron la prueba al sur ellos mismos.\n\nLa capital vio alzarse a los muertos con sus propios ojos cuando un hermano negro presentó un espectro ante el Trono de Hierro. Las risitas por nuestros «cuentos de viejas amas» han terminado para siempre.\n\n#bold Los Otros han regresado. El Norte tenía razón desde el principio.#!#!"
 ln_opening.5.desc.dragon:0 "#e Llega noticia de la capital de que un hermano de la Guardia de la Noche llevó un muerto a la corte. \n\nEl reino vio cómo el fuego mataba por fin al monstruo cuando el acero del rey falló. Los necios lo llamarán truco de titiriteros, pero nosotros montamos dragones, por todos los dioses. Sé exactamente lo que esto significa. La magia es real, y la magia del Hielo se ha alzado para enfrentarse a la magia del Fuego.\n\n#bold La Larga Noche ya está aquí. Que ardan.#!#!"
 ln_opening.5.desc.red:0 "#e Hemos recibido noticia de los sacerdotes rojos de la capital. Un hermano negro arrastró un cadáver andante ante el Trono de Hierro.\n\nEl acero de la Corona no logró matar al monstruo, y se vieron obligados a usar fuego para limpiar la podredumbre. Mis sacerdotes se sienten del todo reivindicados, aunque no hay alegría en ello. La verdad del Señor de Luz es innegable, y solo Su fuego puede desterrar esta oscuridad.\n\n#bold El Gran Otro es real. La Guerra por el Amanecer se acerca.#!#!"
 ln_opening.5.desc.lord:0 "#e Mi maestre rompió esta mañana el sello de un cuervo llegado de la capital. Le temblaba la voz al leer en alto las palabras imposibles.\n\nUn hermano de la Guardia de la Noche presentó un espectro ante la Corona misma. La carta detalla cómo el verdugo del propio rey golpeó a la criatura, solo para que su mano cortada siguiera moviéndose en el suelo hasta que por fin la quemaron hasta dejarla en cenizas. La Ciudadela no puede descartar un hecho presenciado por toda la corte.\n\n#bold La Larga Noche ha comenzado. Los viejos mitos eran ciertos.#!#!"
 ln_opening.5.desc.nobody:0 "#e La noticia se extiende como una plaga desde la capital. Dicen que los hermanos negros arrastraron un monstruo encadenado ante el rey.\n\nSi los propios guardias del rey tuvieron miedo, ¿qué esperanza nos queda a los demás?\n\n#bold Yo lo creía hace una estación. Ahora lo cree todo el mundo.#!#!"
 ln_opening.5.desc.crown:0 "#e Hoy un hermano de la Guardia de la Noche se presentó ante mi trono, con la ropa hecha harapos por el camino, y pidió permiso para llevar a cabo una ejecución en mi presencia. \n\nLa cosa que arrastraba con una cadena tenía forma de hombre. Llevaba muerta mucho tiempo. Seguía moviéndose.\n\nEl verdugo le quitó la cabeza, y siguió moviéndose. Le quitaron la mano derecha, y la mano siguió moviéndose por su cuenta, lo cual fue peor. Lo que al final la detuvo fue el fuego, y toda mi corte la vio arder en un silencio absoluto y horrorizado.\n\n#bold Los Otros han regresado, y la Larga Noche ha comenzado.#!#!"
 ln_opening.5.a:0 "Entonces es cierto. Los mitos son reales."
 ln_opening.5.b:0 "Preparaos. Debemos luchar."

