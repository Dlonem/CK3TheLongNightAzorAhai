l_spanish:

 ln_reveal.1.t:0 "El Amanecer"

 # 1. NAMED, AND RIGHT. The least interesting of the four, and deliberately not the most common.
 ln_reveal.1.desc.vindicated:0 "#BER Los muertos yacen quietos.\n\n Lo hizo [ln_slayer.GetTitledFirstName], y [ln_slayer.GetHerHis] nombre se había dicho en voz alta en templos desde Asshai hasta Oldtown durante años antes de que cayera el golpe.\n\n Así que los sacerdotes tenían razón. Conviene detenerse en eso, porque ocurre tan pocas veces que nadie tiene un rito para ello. Leyeron las llamas, las llamas no mentían, y el hombre al que señalaron marchó al norte y lo terminó: ocho mil años tarde y exactamente a su hora.\n\n Dentro de cien años los maestres habrán encontrado razones para dudarlo, porque para eso están los maestres. Se equivocarán, y no importará.\n\n #bold Fue profecía. Siempre iba a ser profecía.#!#!"
 # 2. NAMED, AND IT HAD NOTHING TO DO WITH IT.
 ln_reveal.1.desc.named_but_hollow:0 "#BER Los muertos yacen quietos.\n\n Lo hizo [ln_slayer.GetTitledFirstName]. Los templos lo habían dicho durante años, y ahora los templos dicen que lo dijeron, y las dos cosas son ciertas.\n\n Esto también es cierto, y nadie con túnica roja lo dirá nunca en voz alta: no había ningún príncipe. No había ninguna promesa. Había una vida con las marcas adecuadas encima, sacerdotes que deseaban con todas sus fuerzas que las marcas significaran algo, y una guerra que alguien tenía que ganar.\n\n Se ganó: [ln_slayer.GetHerHim] lo hizo, con una espada, en el frío, y lo habría hecho igual si nadie hubiera leído nunca una llama.\n\n #bold La fe recordará esto como la noche en que se le dio la razón. No fue así.#!#!"
 # 3. THERE WAS A PRINCE, AND EVERY PRIEST NAMED THE WRONG MEN. The one worth playing for.
 ln_reveal.1.desc.wrong_men:0 "#BER Los muertos yacen quietos.\n\n Fue [ln_slayer.GetTitledFirstName], y nadie había dicho nunca [ln_slayer.GetHerHis] nombre.\n\n Ni una vez. Ni en un templo, ni en una arboleda, ni en boca de una mujer leyendo un fuego junto a un seto. Todos los sacerdotes del mundo pasaron un siglo contando marcas en las vidas de otros y estando seguros, y enterrando a aquellos de quienes habían estado seguros; y todo ese tiempo la respuesta estuvo en un lugar al que ninguno miraba.\n\n Había un príncipe. Esa es la parte que los quebrará. La profecía era real, la promesa se cumplió, y todo el aparato levantado para encontrar al hombre se equivocó tan por completo que igual podría no haber existido.\n\n #bold Las llamas nunca mintieron. Nadie aprendió nunca a leerlas.#!#!"
 # 4. NOTHING. A man with a sword.
 ln_reveal.1.desc.just_a_man:0 "#BER Los muertos yacen quietos.\n\n Fue [ln_slayer.GetTitledFirstName]. No hay nada más que decir al respecto, y eso es todo.\n\n Ninguna profecía. Ningún príncipe prometido, ningún campeón nacido entre sal y humo, ninguna espada ardiente: no hubo nada de eso, en ningún momento, en nada de ello. Ocho mil años de templos y recuentos y nombramientos y certezas, levantados encima de un cuento que alguien contó una vez sobre un invierno que terminó.\n\n El invierno terminó también esta vez. Alguien fue al norte e hizo lo que había que hacer, y la razón por la que [ln_slayer.GetSheHe] lo hizo no fue que [ln_slayer.GetSheHe] fuera el elegido. Fue que [ln_slayer.GetSheHe] estaba allí.\n\n #bold Tendrá que bastar. De hecho, es más.#!#!"

 # 5. NOBODY KNOWS WHO DID IT.
 ln_reveal.1.desc.nameless:0 "#BER Los muertos yacen quietos.\n\n Nadie puede decir quién lo hizo.\n\n No es un hueco en el registro: el registro es el hueco. Hubo una batalla en la oscuridad, en un invierno que se había alargado tanto que ya nadie contaba las estaciones, y en algún momento de ella la cosa que los movía se detuvo, y todos los cadáveres del campo cayeron a la vez y no volvieron a levantarse.\n\n Alguien estaba más cerca que nadie. Alguien descargó el golpe. Los maestres pasarán cuatrocientos años construyendo una respuesta y la respuesta será errónea, porque los hombres que podrían habérsela dado estaban en la primera fila, y la primera fila es donde se fue la cuenta.\n\n #bold Terminó. Es lo único que alguien puede demostrar.#!#!"

 ln_reveal.1.a:0 "Pues que salga el sol."

 ln_reveal.10.t:0 "Los hombres que estuvieron allí"
 ln_reveal.10.desc_open:0 "Los cantores lo contarán mal antes de que acabe el año. Pondrán en la primera fila a reyes que estaban cuatrocientas leguas al sur, y un amanecer donde solo hubo nieve volviéndose gris, y con el tiempo su versión será la que todo el mundo conozca.\n\nQue quede escrito una vez, con claridad, mientras los hombres que lo vieron aún puedan objetar:\n\nFue [ln_slayer.GetTitledFirstName].\n\n"
 ln_reveal.10.desc_knight_1:0 "Y [ln_slayer.GetSheHe] no estuvo allí solo. [ln_dawn_knight_1.GetTitledFirstName] sostuvo el terreno en [ln_slayer.GetHerHis] flanco."
 ln_reveal.10.desc_knight_2:0 " [ln_dawn_knight_2.GetTitledFirstName] impidió que la línea cediera cuando quería ceder."
 ln_reveal.10.desc_knight_3:0 " [ln_dawn_knight_3.GetTitledFirstName] estuvo allí en la oscuridad y el frío, con los muertos avanzando y sin razón alguna para creer que la hora siguiente llegaría jamás.\n\nNinguno de ellos estará en las canciones. Todos ellos estuvieron en la nieve."
 ln_reveal.10.desc_alone:0 "Los hombres que deberían ser nombrados junto a [ln_slayer.GetHerHim] no pueden serlo, porque la nieve se los quedó. Quienquiera que sostuviera el flanco, quienquiera que impidiera que la línea cediera en la oscuridad: la primera fila es donde se fue la cuenta, y el registro tiene un silencio allí donde deberían estar sus nombres."
 ln_reveal.10.desc_close:0 "\n\nRecordadlo de la manera llana, como ocurrió. Alguien descargó un golpe, y alguien estuvo a su lado, y salió el sol."
 ln_reveal.10.a:0 "Escribid sus nombres. Todos ellos."

 ln_stood_at_the_dawn_memory_desc:0 "estuvo en la primera fila la noche en que cayó el Rey de la Noche"
