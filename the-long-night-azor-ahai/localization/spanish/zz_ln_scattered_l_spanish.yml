l_spanish:

 # ── THE SCATTERED WATCH (Session 10) ────────────────────────────────────────────────────────────────────────
 ln_scatter.2.t:0 "Capas negras a tus puertas"
 ln_scatter.2.desc:0 "Hay tres a las puertas, y tus guardias no saben qué hacer con ellos, porque nada en ellos tiene sentido tan al sur.\n\nCapas negras, o lo que queda de capas negras. A uno le faltan dedos por la congelación. Han caminado, a juzgar por sus botas, un camino muy largo, y todos dicen lo mismo con la voz plana de los hombres que han dejado de esperar que les crean:\n\nEl Muro ha caído. La Guardia está destrozada. Los muertos vienen caminando al sur detrás de ellos, y no caminan rápido, porque no les hace falta.\n\nHabías oído rumores. Los rumores son clima. Estos hombres son los supervivientes de la tormenta misma, de pie en tu patio."
 ln_scatter.2.desc.north:0 "Todo norteño sabe la única cosa que la Guardia de la Noche nunca hace: no abandona el Muro.\n\nAsí que cuando tus guardias informan de tres hermanos negros a las puertas -- harapientos, mordidos por el hielo, a uno le falta media mano -- ya te has puesto en pie antes de que terminen, porque unas capas negras tan lejos del Muro no son desertores ni mendigos. Son aritmética. La Guardia ha desaparecido, y estos son el resto.\n\nLo dicen sin adornos, como dicen las cosas los norteños: el Muro ha caído. Los muertos bajan por el Kingsroad, y no tienen ninguna prisa.\n\nOld Nan te contó cómo sigue esta historia. Nunca te dijo que llegaría a tu propia puerta con una capa negra."
 ln_scatter.2.desc.red:0 "El Señor de Luz no envía cuervos. Envía testigos.\n\nTres hermanos de la Guardia caída a tus puertas, quemados de oscuro por el frío como otros hombres se queman por el fuego, y cada palabra que sale de ellos es un sermón que ya has predicado: el Muro ha caído, la oscuridad anda suelta, los muertos caminan. Tu fuego nocturno los atrajo desde medio reino de distancia -- la única luz del camino, dijeron, que no resultó ser un fuego fatuo.\n\nR'hllor ha entregado la prueba en tu puerta, y aún respira.\n\nLo que se hace con la prueba es la medida del fiel."
 ln_scatter.2.a:0 "Hay sitio en mi salón para hombres que lo han visto."
 ln_scatter.2.b:0 "Dadles de comer. Armadlos. Y enviadlos a todas las fortalezas al sur de aquí."
 ln_scatter.2.c:0 "El castigo por abandonar el Muro es la muerte."
 ln_scatter_brothers_join_tt:0 "Los hermanos entran a servir en tu corte. La Guardia a la que juraron ya no existe y quedan liberados de sus votos: ya no visten de negro, pero son duros, experimentados y de más valor en una línea de batalla de lo que sugieren sus años."
 ln_scatter.3.t:0 "Lo que la Guardia te dejó"
 ln_scatter.3.desc:0 "[ln_scattered_brother.GetTitledFirstName] lleva ya una estación en tu salón, y no ha pedido nada ni una sola vez.\n\nCome con la guardia. Se levanta antes que ellos. Hace tres días llegó aviso de los barracones, con cierta incomodidad, de que ese hombre ha olvidado más sobre defender un muro en invierno de lo que nadie en este castillo ha aprendido jamás — y que la guarnición ha empezado a erguirse cuando él pasa, que no es algo que se pueda ordenar a los hombres.\n\nAún se despierta a oscuras algunas noches. Nadie le pregunta por eso."
 ln_scatter.3.a:0 "Ponedlo en las murallas. Para eso está."
 ln_scatter.3.b:0 "Sentadlo con mis comandantes. Necesitan oírlo."
 ln_black_cloaks_in_the_garrison_modifier:0 "Capas negras en las murallas"
 ln_black_cloaks_in_the_garrison_modifier_desc:0 "Hombres de una Guardia que ya no existe forman parte de la guarnición de este castillo. Han defendido murallas peores que esta."
